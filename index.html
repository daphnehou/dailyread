with Tepper (2000) and Mackey et al. (2017); a rich source of measurement-development and design-improvement dissertation topics.","cluster":"Abusive supervision and destructive leadership - the foundational construct and consequences study, the review that defined the field, the psychometric meta-analytic anchor, the 2021 fundamental-rethink critique, the JD-R meta-analytic integration, and 2026 daily-diary work on both the target and the perpetrator side (new cluster; leader mistreatment had zero prior coverage in this digest despite being adjacent to the incivility and well-being clusters)","themes":["Other"]},{"date":"2026-09-01","topic":"Destructive Leadership - JD-R Meta-Analysis","authors":"Pletzer, J. L.; Breevaart, K.; Bakker, A. B.","year":"2024","title":"Constructive and destructive leadership in job demands-resources theory: A meta-analytic test of the motivational and health-impairment pathways","journal":"Organizational Psychology Review","cite":"14(1), 131-165","doi":"https://doi.org/10.1177/20413866231197519","summary":"This pre-registered meta-analysis integrates the leadership literature with Job Demands-Resources theory, testing whether constructive and destructive leadership operate through motivational and health-impairment pathways. Constructive leadership related positively to work engagement (k = 588, rho = .467) and negatively to burnout (k = 346, rho = -.327); destructive leadership related negatively to engagement (k = 72, rho = -.220) and positively to burnout (k = 122, rho = .381). Engagement and burnout partially mediated leadership's relations with job performance, with the constructive-leadership-through-engagement path clearly strongest. The k values reveal how much thinner the destructive leadership evidence base is.","relevance":"Places destructive leadership inside JD-R theory, the dominant framework in occupational health psychology, making the burnout and engagement pathways explicit and comparable.","contribution":"A pre-registered, theory-driven meta-analysis showing that constructive and destructive leadership are not simple mirror images: they load differently onto the motivational versus health-impairment pathways.","uses":"Teaching example of pre-registered meta-analysis and of theory-driven synthesis; provides directly citable effect sizes for burnout and engagement grant framing.","cluster":"Abusive supervision and destructive leadership - the foundational construct and consequences study, the review that defined the field, the psychometric meta-analytic anchor, the 2021 fundamental-rethink critique, the JD-R meta-analytic integration, and 2026 daily-diary work on both the target and the perpetrator side (new cluster; leader mistreatment had zero prior coverage in this digest despite being adjacent to the incivility and well-being clusters)","themes":["Leadership","Job Design, Crafting \u0026 Motivation"]},{"date":"2026-09-01","topic":"Abusive Supervision - Recovery \u0026 Social Support (Recent Daily Diary)","authors":"Schyns, B.; Lagowska, U.; Kim, D.","year":"2026","title":"A blessing or a curse? The paradoxical effect of colleagues' social support on the relationship between daily abusive supervision, rumination, and exhaustion","journal":"European Journal of Work and Organizational Psychology","cite":"35(1), 79-93","doi":"https://doi.org/10.1080/1359432X.2025.2571738","summary":"Using a daily diary design, the authors trace how day-level abusive supervision carries into the evening and the next workday. Daily abusive supervision was indirectly related to higher next-day emotional exhaustion through affective rumination at bedtime. Colleagues' social support, usually treated as a straightforward buffer, showed a paradoxical pattern: support can prolong rumination by keeping the abusive episode cognitively active rather than closing it off. The study connects leader mistreatment to the recovery literature at the within-person level.","relevance":"Bridges two occupational health literatures already tracked in this digest - leader mistreatment and off-job recovery/psychological detachment - and complicates the assumption that coworker support always helps.","contribution":"Identifies a boundary condition on the social support buffering hypothesis by specifying rumination as the mechanism that support can inadvertently sustain.","uses":"Recent required or discussion reading pairing leader mistreatment with recovery; a clean teaching example of within-person diary design and evening-to-next-day spillover modeling.","cluster":"Abusive supervision and destructive leadership - the foundational construct and consequences study, the review that defined the field, the psychometric meta-analytic anchor, the 2021 fundamental-rethink critique, the JD-R meta-analytic integration, and 2026 daily-diary work on both the target and the perpetrator side (new cluster; leader mistreatment had zero prior coverage in this digest despite being adjacent to the incivility and well-being clusters)","themes":["Well-Being \u0026 Occupational Health"]},{"date":"2026-09-01","topic":"Abusive Supervision - Perpetrator-Side Antecedents (Recent Daily Diary)","authors":"Gan, X.; Topakas, A.","year":"2026","title":"After-work unhealthy eating, work-induced ego depletion and abusive supervision: The moderating role of narcissistic admiration and rivalry","journal":"Journal of Occupational and Organizational Psychology","cite":"99(3), Article e70140","doi":"https://doi.org/10.1111/joop.70140","summary":"This daily diary study collected data from 112 leaders and 225 followers across five Chinese organizations over 10 working days, examining abusive supervision from the perpetrator's side. Leaders' work-induced ego depletion predicted after-work unhealthy eating, which in turn predicted next-day abusive supervision toward followers. Leaders' narcissistic admiration and rivalry moderated the eating-to-abuse link, identifying which leaders are most vulnerable to this nonwork-to-work carryover. The design treats abusive supervision as a fluctuating daily state with both work and nonwork antecedents rather than a stable leader trait.","relevance":"Shifts the occupational health frame from victim outcomes to leader self-regulation, implying that leader well-being and recovery are themselves interventions against subordinate mistreatment.","contribution":"Demonstrates a nonwork-domain (eating behavior) antecedent of next-day workplace abuse, extending self-regulation and work-home resources models into the perpetrator side of mistreatment research.","uses":"Recent empirical reading that reframes seminar discussion from blaming bad leaders to designing for leader resource depletion; strong multilevel daily-diary design worth teaching.","cluster":"Abusive supervision and destructive leadership - the foundational construct and consequences study, the review that defined the field, the psychometric meta-analytic anchor, the 2021 fundamental-rethink critique, the JD-R meta-analytic integration, and 2026 daily-diary work on both the target and the perpetrator side (new cluster; leader mistreatment had zero prior coverage in this digest despite being adjacent to the incivility and well-being clusters)","themes":["Other"]},{"date":"2026-08-31","topic":"Selection Validity — Foundational Reanalysis","authors":"Sackett, P. R.; Zhang, C.; Berry, C. M.; Lievens, F.","year":"2022","title":"Revisiting meta-analytic estimates of validity in personnel selection: Addressing systematic overcorrection for restriction of range","journal":"Journal of Applied Psychology","cite":"107(11), 2040–2068","doi":"https://doi.org/10.1037/apl0000994","summary":"This paper re-examines the meta-analytic validity estimates that have anchored personnel selection practice for decades. The authors outline and critique five common approaches to building and applying range-restriction artifact distributions, concluding that each tends to produce substantial overcorrection. Re-deriving estimates without that overcorrection lowers mean validities for most predictors by roughly .10-.20. The rank ordering largely holds, but structured interviews rather than general mental ability tests emerge as the top-ranked procedure, and the authors pair each validity estimate with Black-White subgroup differences to inform validity-diversity trade-offs.","relevance":"This is the single most consequential recent article in personnel selection and a required anchor for any assessment or selection course. It resets the effect sizes I-O psychologists cite when defending hiring tools, and directly reframes how AI-based and technology-mediated assessments should be benchmarked.","contribution":"Methodologically, it shows that a widely accepted psychometric correction was systematically misapplied across an entire cumulative literature, and it supplies a revised validity-plus-subgroup-difference matrix as the new reference point.","uses":"Required reading for selection/assessment seminars; benchmark effect sizes for grant proposals and validation studies; a case study in how meta-analytic artifact corrections shape a field's received wisdom.","cluster":"Predictor validity in personnel selection reconsidered: the range-restriction overcorrection debate, the validity-diversity trade-off, and the live disagreement over cognitive ability testing (new cluster)","themes":["Assessment \u0026 Selection"]},{"date":"2026-08-31","topic":"Selection Validity — Prior Benchmark (Foundational)","authors":"Schmidt, F. L.; Hunter, J. E.","year":"1998","title":"The validity and utility of selection methods in personnel psychology: Practical and theoretical implications of 85 years of research findings","journal":"Psychological Bulletin","cite":"124(2), 262–274","doi":"https://doi.org/10.1037/0033-2909.124.2.262","summary":"Drawing on 85 years of accumulated validation research, this article summarizes meta-analytic validity estimates for 19 selection procedures predicting job performance and training performance, plus paired combinations of general mental ability with each other predictor. The highest multivariate validities reported were GMA combined with a work sample test (.63), an integrity test (.65), or a structured interview (.63). The authors translate these coefficients into utility terms, arguing for substantial economic value from higher-validity hiring methods. GMA is positioned as the single best predictor for inexperienced hires.","relevance":"This is the benchmark that Sackett et al. (2022) overturned, and it remains the most-cited statement of selection validity in the field. Reading the two side by side is the clearest way to show students how cumulative knowledge in I-O psychology is built and revised.","contribution":"Established validity generalization and utility analysis as the organizing framework for personnel selection practice, and set the predictor hierarchy that dominated textbooks and practice for over two decades.","uses":"Required paired reading with Sackett et al. (2022); teaching the logic of validity generalization and utility analysis; historical context for lectures on evidence-based hiring.","cluster":"Predictor validity in personnel selection reconsidered: the range-restriction overcorrection debate, the validity-diversity trade-off, and the live disagreement over cognitive ability testing (new cluster)","themes":["Assessment \u0026 Selection","Big Data \u0026 Methods"]},{"date":"2026-08-31","topic":"Selection Validity — Critique / Debate","authors":"Oh, I.-S.; Le, H.; Roth, P. L.","year":"2023","title":"Revisiting Sackett et al.'s (2022) rationale behind their recommendation against correcting for range restriction in concurrent validation studies","journal":"Journal of Applied Psychology","cite":"108(8), 1300–1310","doi":"https://doi.org/10.1037/apl0001078","summary":"The authors interrogate the three conditions underpinning Sackett et al.'s recommendation against range-restriction correction in concurrent validation studies: that the true-score correlation between the actual selection variable and the predictor is unlikely to reach .90, that selection ratios of .30 or lower are extreme, and that range restriction is therefore negligible. Reanalyzing Sackett et al.'s own tables, they argue the first two conditions are more plausible than assumed and that the third is undermined by the choice of a Case IV correction. They conclude the severity of range restriction in concurrent designs was substantially underestimated.","relevance":"A model of technical peer critique in a top I-O journal, and essential for seminars that want students to see meta-analytic conclusions as contestable rather than settled. It also teaches the substantive stakes of psychometric correction choices.","contribution":"Demonstrates how sensitive headline validity estimates are to specific artifact-distribution and correction-case assumptions, and reopens the question of how much validity was really overestimated.","uses":"Debate/critique reading paired with Sackett et al. (2022) and their reply; advanced methods seminar on range restriction; training doctoral students to audit meta-analytic decisions.","cluster":"Predictor validity in personnel selection reconsidered: the range-restriction overcorrection debate, the validity-diversity trade-off, and the live disagreement over cognitive ability testing (new cluster)","themes":["Assessment \u0026 Selection"]},{"date":"2026-08-31","topic":"Selection Validity — Reply / Debate","authors":"Sackett, P. R.; Berry, C. M.; Lievens, F.; Zhang, C.","year":"2023","title":"Correcting for range restriction in meta-analysis: A reply to Oh et al. (2023)","journal":"Journal of Applied Psychology","cite":"108(8), 1311–1315","doi":"https://doi.org/10.1037/apl0001116","summary":"Responding to Oh et al. (2023), the authors clarify that they do not oppose range-restriction correction in general and endorse it whenever the required applicant-pool information is available. Their argument was scoped to meta-analysis, where primary concurrent studies are typically silent about the basis on which incumbents were originally selected, leaving the needed information unavailable. They restate their position that in many settings range restriction is small enough that failing to correct produces only a modest underestimate, and explain why they view the high-restriction scenarios Oh et al. emphasize as uncommon rather than typical of the studies feeding meta-analyses.","relevance":"Completing the exchange gives students a full view of how methodological disagreements are actually adjudicated in I-O psychology, including where the two camps agree. It is short enough to assign alongside both the original and the critique.","contribution":"Narrows the dispute to an empirical question about the prevalence of severe range restriction in the primary-study base, rather than a disagreement about correction in principle.","uses":"Debate/critique reading completing the Sackett-Oh exchange; a compact example of scholarly reply writing for doctoral professional-development sessions.","cluster":"Predictor validity in personnel selection reconsidered: the range-restriction overcorrection debate, the validity-diversity trade-off, and the live disagreement over cognitive ability testing (new cluster)","themes":["Assessment \u0026 Selection"]},{"date":"2026-08-31","topic":"Validity–Diversity Trade-Off — Meta-Analytic (Recent)","authors":"Berry, C. M.; Lievens, F.; Zhang, C.; Sackett, P. R.","year":"2024","title":"Insights from an updated personnel selection meta-analytic matrix: Revisiting general mental ability tests' role in the validity–diversity trade-off","journal":"Journal of Applied Psychology","cite":"109(10), 1611–1634","doi":"https://doi.org/10.1037/apl0001203","summary":"Using an updated meta-analytic correlation matrix covering biodata, GMA tests, conscientiousness tests, structured interviews, integrity tests, and situational judgment tests, along with their Black-White mean differences, this study revisits GMA's role in the validity-diversity trade-off. Contrary to conventional wisdom, dropping GMA tests from a selection composite has little to no effect on validity while substantially reducing adverse impact. The trade-off is not fully dissolved: some validity reduction is still required to reach an adverse impact ratio of .80, but less than previously believed. The authors argue the trade-off conversation should shift toward other selection methods.","relevance":"Directly connects the revised validity estimates to equity outcomes in hiring, which is where the practical and legal stakes of the Sackett et al. correction land. Highly assignable for seminars covering adverse impact, DEI, or algorithmic fairness in selection.","contribution":"Overturns the long-standing premise that GMA testing is the engine of the validity-diversity trade-off, and supplies an updated meta-analytic matrix usable for composite-design research.","uses":"Required reading on adverse impact and selection system design; input matrix for Pareto-optimal weighting studies; evidence base for practitioner-facing writing on fair hiring.","cluster":"Predictor validity in personnel selection reconsidered: the range-restriction overcorrection debate, the validity-diversity trade-off, and the live disagreement over cognitive ability testing (new cluster)","themes":["Assessment \u0026 Selection","Diversity, Equity \u0026 Inclusion"]},{"date":"2026-08-31","topic":"Cognitive Ability Testing — Debate / Rejoinder (Recent)","authors":"Kulikowski, K.; Cucina, J. M.; Hayes, T. L.; Oh, I.-S.; Ones, D. S.; Viswesvaran, C. — full author order needs verification","year":"2025","title":"In defence of cognitive ability testing: Affirming the evidence for its continued use in personnel selection and admission decisions","journal":"Journal of Occupational and Organizational Psychology","cite":"98(3), Article e70048","doi":"https://doi.org/10.1111/joop.70048","summary":"This rejoinder engages Woods and Patterson's (2023) critical review of cognitive ability testing for graduate and higher professional selection. The authors advance five counterarguments: that the critique leans too heavily on the contested Sackett et al. (2022) estimates; that a test showing adverse impact may still be used when job-related and unbiased; that non-cognitive alternatives are not obviously more objective or fair; that employment findings are overgeneralized to educational admissions; and that the costs and side effects of proposed alternatives go unexamined. They advocate responsible cognitive testing combined with valid non-cognitive predictors.","relevance":"Shows the Sackett et al. debate spilling into applied policy questions about who gets access to professions and graduate education, which makes it unusually generative for seminar discussion on ethics and equity in assessment.","contribution":"Reframes the validity dispute as an argument about the comparative costs of alternatives rather than about cognitive ability's absolute validity, and links validity evidence to fairness and bias standards.","uses":"Debate/critique reading on cognitive ability testing; ethics-and-equity discussion pairing with Woods and Patterson (2023); practitioner guidance on defensible test use.","cluster":"Predictor validity in personnel selection reconsidered: the range-restriction overcorrection debate, the validity-diversity trade-off, and the live disagreement over cognitive ability testing (new cluster)","themes":["Assessment \u0026 Selection"]},{"date":"2026-08-31","topic":"Selection Methods — Diversity Optimization (Recent Methods)","authors":"Tang, C.; and colleagues — full author list and order need verification","year":"2026","title":"Reducing shrinkage in diversity tradeoff curves for personnel selection: Comparing local validity studies, meta-analysis, and Bayes analysis","journal":"Journal of Applied Psychology","cite":"Advance online publication — volume/issue/pages need verification","doi":"DOI needs verification (indexed in PsycINFO, 2026 record)","summary":"Diversity-validity tradeoff curves supply predictor weights that can raise adverse impact ratios and minority job offers without sacrificing performance, but the curves shrink badly on cross-validation. This article uses simulation to compare tradeoff-curve shrinkage, in both validity and diversity, across three sources of calibration evidence: a local validity study, a meta-analysis, and a Bayes analysis with empirical priors that weights a local study against meta-analytic information. The authors identify the conditions favoring each approach and offer recommendations for maximizing cross-validity and diversity outcomes in local selection settings.","relevance":"Extends the validity-diversity conversation from what the population estimates are to whether locally derived weights actually hold up, which is the practical question organizations face when implementing diversity-enhancing selection composites.","contribution":"Integrates Bayesian empirical priors with Pareto-optimal weighting to reduce shrinkage, giving practitioners a principled way to combine local and meta-analytic validity evidence.","uses":"Methods reading on Pareto-optimal weighting and shrinkage; template for simulation-based selection research; grant methodology for validation study design.","cluster":"Predictor validity in personnel selection reconsidered: the range-restriction overcorrection debate, the validity-diversity trade-off, and the live disagreement over cognitive ability testing (new cluster)","themes":["Assessment \u0026 Selection","Diversity, Equity \u0026 Inclusion","Big Data \u0026 Methods"]},{"date":"2026-08-29","topic":"Organizational Justice — Foundational Measurement","authors":"Colquitt, J. A.","year":"2001","title":"On the dimensionality of organizational justice: A construct validation of a measure","journal":"Journal of Applied Psychology","cite":"86(3), 386–400","doi":"https://doi.org/10.1037/0021-9010.86.3.386","summary":"This paper developed and validated the measure that has anchored organizational justice research for two decades. Across a university sample and a field sample, confirmatory factor analyses supported a four-factor structure — distributive, procedural, interpersonal, and informational justice — rather than the two- or three-factor structures dominant at the time. The four dimensions showed differentiated predictive validity for outcomes including leader evaluation, rule compliance, organizational commitment, and helping behavior. The article established both that justice is multidimensional and that the dimensions matter differently for different outcomes.","relevance":"Justice perceptions sit underneath much of what this digest already tracks — selection and assessment reactions, algorithmic management, performance appraisal, pay transparency, and turnover — and this is the measure nearly all of that work uses.","contribution":"Provides the construct-validated four-factor operationalization of organizational justice and the empirical case for separating informational from interpersonal justice.","uses":"Measurement anchor for any study collecting justice perceptions; required background reading before assigning contemporary algorithmic-fairness work; useful methods exemplar of construct validation for a graduate measurement seminar.","cluster":"Organizational justice and fairness at work — the foundational four-factor measurement and meta-analytic anchors, the critique/reassessment debate, and 2026 work extending justice theory to algorithmic managers and non-Western samples (new cluster; justice had zero prior coverage in this digest despite being adjacent to many themes already tracked)","themes":["Big Data \u0026 Methods"]},{"date":"2026-08-29","topic":"Organizational Justice — Meta-Analysis (Foundational)","authors":"Colquitt, J. A.; Scott, B. A.; Rodell, J. B.; Long, D. M.; Zapata, C. P.; Conlon, D. E.; Wesson, M. J.","year":"2013","title":"Justice at the millennium, a decade later: A meta-analytic test of social exchange and affect-based perspectives","journal":"Journal of Applied Psychology","cite":"98(2), 199–236","doi":"https://doi.org/10.1037/a0031757","summary":"This meta-analysis synthesized 493 independent samples to test competing explanations for why justice perceptions predict employee attitudes and behavior. The authors pitted a social exchange account (justice builds trust and exchange quality, which drive outcomes) against an affect-based account (justice generates positive and negative affect, which drives outcomes). Both mediating mechanisms received support, with social exchange variables and affect each carrying unique indirect effects, and the four justice dimensions differing in which mechanism dominated. It remains the definitive quantitative summary of the justice–outcome literature.","relevance":"Supplies the effect-size benchmarks against which newer justice findings — including justice reactions to AI and algorithmic decision makers — should be calibrated, and clarifies the mediating mechanisms researchers should be modeling.","contribution":"Meta-analytically adjudicates between social exchange and affect-based theoretical accounts rather than simply cataloguing justice correlates, moving the field from 'does justice matter' to 'why does justice matter'.","uses":"Effect-size reference for grant writing and power analysis; core required reading on justice mechanisms; template for meta-analytic tests of competing mediational theories.","cluster":"Organizational justice and fairness at work — the foundational four-factor measurement and meta-analytic anchors, the critique/reassessment debate, and 2026 work extending justice theory to algorithmic managers and non-Western samples (new cluster; justice had zero prior coverage in this digest despite being adjacent to many themes already tracked)","themes":["Other"]},{"date":"2026-08-29","topic":"Organizational Justice — Integrative Review","authors":"Colquitt, J. A.; Zipay, K. P.","year":"2015","title":"Justice, fairness, and employee reactions","journal":"Annual Review of Organizational Psychology and Organizational Behavior","cite":"2, 75–99","doi":"https://doi.org/10.1146/annurev-orgpsych-032414-111457","summary":"This review draws a conceptual distinction the field had long blurred: justice as perceived adherence to specific rules (equity, consistency, respect, truthfulness) versus fairness as a more global, downstream appraisal of appropriateness. The authors organize the literature around three questions — why employees attend to justice, how they form fairness perceptions, and how they react to them — integrating fairness heuristic theory, the relational and group engagement models, fairness theory, deonance theory, and uncertainty management theory alongside social exchange and affective events theory. It is the most teachable single overview of the domain.","relevance":"The justice–fairness distinction is directly useful for interpreting reactions to algorithmic and AI-based decisions, where employees may judge rule adherence and global appropriateness quite differently.","contribution":"Separates justice from fairness as distinct constructs and maps the mid-range theories explaining each, giving the literature a coherent organizing architecture.","uses":"Best single required reading to open a justice seminar session; a conceptual scaffold for framing lit reviews; a source of testable propositions about fairness appraisal processes.","cluster":"Organizational justice and fairness at work — the foundational four-factor measurement and meta-analytic anchors, the critique/reassessment debate, and 2026 work extending justice theory to algorithmic managers and non-Western samples (new cluster; justice had zero prior coverage in this digest despite being adjacent to many themes already tracked)","themes":["Diversity, Equity \u0026 Inclusion"]},{"date":"2026-08-29","topic":"Organizational Justice — Critique / Debate","authors":"Rupp, D. E.; Shapiro, D. L.; Folger, R.; Skarlicki, D. P.; Shao, R.","year":"2017","title":"A critical analysis of the conceptualization and measurement of organizational justice: Is it time for reassessment?","journal":"Academy of Management Annals","cite":"11(2), 919–959","doi":"https://doi.org/10.5465/annals.2014.0051","summary":"The authors trace how a single dominant approach to conceptualizing and measuring justice came to define the field, and argue that this consensus has costs as well as benefits. While shared operationalization enables cumulative knowledge, they contend the dominant approach is incomplete and risks construct reification — treating the measured dimensions as the phenomenon itself. The paper revisits the deontic, moral, and event-versus-entity aspects of justice that standard scales do not capture, and proposes directions for reassessment.","relevance":"A pointed reminder that when researchers ask whether an algorithm is 'fair', the answer depends heavily on a measurement convention that this paper argues is too narrow — highly relevant as justice constructs migrate into AI contexts.","contribution":"Turns a critical, historiographic lens on the field's own measurement orthodoxy and articulates what standard justice scales systematically omit.","uses":"Excellent debate/critique reading paired with Colquitt (2001) to stage a measurement argument in seminar; useful for framing the limitations section of a justice-based paper.","cluster":"Organizational justice and fairness at work — the foundational four-factor measurement and meta-analytic anchors, the critique/reassessment debate, and 2026 work extending justice theory to algorithmic managers and non-Western samples (new cluster; justice had zero prior coverage in this digest despite being adjacent to many themes already tracked)","themes":["Assessment \u0026 Selection","Big Data \u0026 Methods"]},{"date":"2026-08-29","topic":"Organizational Justice — Overall Justice (Foundational Empirical)","authors":"Ambrose, M. L.; Schminke, M.","year":"2009","title":"The role of overall justice judgments in organizational justice research: A test of mediation","journal":"Journal of Applied Psychology","cite":"94(2), 491–500","doi":"https://doi.org/10.1037/a0013203","summary":"Ambrose and Schminke argue that employees form a global, overall justice judgment that mediates the effects of specific justice dimensions on outcomes, rather than each dimension acting independently. Two field studies test this: Study 1 shows overall justice mediates the relationship between distributive, procedural, and interactional justice and employee attitudes; Study 2 replicates the mediation for supervisor-rated employee behavior. The findings support fairness heuristic theory's claim that people rely on a summary fairness impression when navigating uncertainty.","relevance":"Directly relevant to how workers evaluate opaque algorithmic systems, where dimension-specific information is often unavailable and a global fairness heuristic is likely to drive reactions.","contribution":"Establishes overall justice as a distinct, measurable construct that mediates specific-dimension effects, shifting theory from additive dimension models to a heuristic summary-judgment model.","uses":"Required reading on fairness heuristic theory; a strong empirical model for teaching mediation with multi-source data; theoretical grounding for studies of fairness under informational opacity.","cluster":"Organizational justice and fairness at work — the foundational four-factor measurement and meta-analytic anchors, the critique/reassessment debate, and 2026 work extending justice theory to algorithmic managers and non-Western samples (new cluster; justice had zero prior coverage in this digest despite being adjacent to many themes already tracked)","themes":["Other"]},{"date":"2026-08-29","topic":"Algorithmic Fairness \u0026 Procedural Justice — Foundational Experimental","authors":"Newman, D. T.; Fast, N. J.; Harmon, D. J.","year":"2020","title":"When eliminating bias isn’t fair: Algorithmic reductionism and procedural justice in human resource decisions","journal":"Organizational Behavior and Human Decision Processes","cite":"160, 149–167","doi":"https://doi.org/10.1016/j.obhdp.2020.03.008","summary":"Across a series of experiments, the authors show that people judge algorithmic HR decisions as less procedurally just than human decisions even when the algorithm is explicitly less biased. The mechanism they identify is algorithmic reductionism: algorithms are seen as reducing people to numerical inputs, ignoring qualitative and contextual information that participants believe a fair process should weigh. The effect held across hiring, promotion, and termination scenarios, and reduced trust in the deciding organization.","relevance":"The single most-cited bridge between the classical organizational justice literature and contemporary algorithmic management, and essential background for the digest’s ongoing AI-selection and algorithmic-management threads.","contribution":"Names and experimentally isolates algorithmic reductionism as the mechanism behind fairness resistance to algorithmic decisions, explaining why debiasing alone does not produce perceived fairness.","uses":"Pairs naturally with AVI and AI-selection readings already in this digest; a clean vignette-experiment design to teach; motivating citation for research on explanation and transparency interventions.","cluster":"Organizational justice and fairness at work — the foundational four-factor measurement and meta-analytic anchors, the critique/reassessment debate, and 2026 work extending justice theory to algorithmic managers and non-Western samples (new cluster; justice had zero prior coverage in this digest despite being adjacent to many themes already tracked)","themes":["Algorithmic Management \u0026 Surveillance","Diversity, Equity \u0026 Inclusion"]},{"date":"2026-08-29","topic":"Algorithmic Management \u0026 Distributive Justice — Recent Experimental","authors":"Fousiani, K.; Cremer, L. R.; Çetin, M.; Raeder, S.","year":"2026","title":"When algorithmic managers fail to fulfill their promises: The role of anthropomorphism in shaping justice perceptions","journal":"PLOS ONE","cite":"21(2), e0340860","doi":"https://doi.org/10.1371/journal.pone.0340860","summary":"Two vignette experiments (N = 258; N = 248 employees, Study 2 preregistered) examined distributive justice perceptions when an algorithmic manager breaks a promise, crossing promise type (relational vs. transactional) with the manager’s anthropomorphism (high vs. low). Employees perceived lower distributive justice when algorithmic managers failed on transactional rather than relational promises, particularly when the manager was not anthropomorphized. Study 2 showed this operates through perceived rigidity of the algorithmic manager. The authors flag an ethical tension: human-like design features buffer negative reactions but may blur accountability.","relevance":"Extends psychological contract breach and distributive justice theory into algorithmic management, one of this digest’s most active threads, and raises a design-ethics question relevant to organizations deploying AI managers.","contribution":"Integrates psychological contract, anthropomorphism, and justice theory to specify an expectation–appraisal–justice process, with perceived rigidity as the appraisal mechanism.","uses":"Recent empirical reading for an algorithmic management or AI-ethics session; a preregistered 2x2 vignette design worth teaching; open access, so easy to assign.","cluster":"Organizational justice and fairness at work — the foundational four-factor measurement and meta-analytic anchors, the critique/reassessment debate, and 2026 work extending justice theory to algorithmic managers and non-Western samples (new cluster; justice had zero prior coverage in this digest despite being adjacent to many themes already tracked)","themes":["Algorithmic Management \u0026 Surveillance"]},{"date":"2026-08-29","topic":"Organizational Justice — Cross-Cultural Meta-Analysis (Recent)","authors":"Alkhadher, O. H.; Gadelrab, H. F.; Abbas, Z. M.; Ghanim, D. A.; Aldousari, S. S.","year":"2026","title":"Organizational justice in the Arab world: A comparative meta-analytical review of constructs and related outcomes","journal":"Cross-Cultural Research","cite":"60(1), page range needs verification (first published online November 12, 2025)","doi":"https://doi.org/10.1177/10693971251383653","summary":"This is the first meta-analytic synthesis of organizational justice research conducted in Arab cultural contexts, drawing on 61 studies (49 published in Arabic, 12 in English) from 20 Arab countries. All four justice dimensions correlated positively with job outcomes, with trust showing the strongest association and OCB and performance the weakest. Notably, interpersonal justice emerged as the strongest predictor across outcomes, in contrast to the primacy of procedural justice typically reported in Western samples. Procedural justice moderated the distributive justice–job satisfaction relationship, replicating a classic Western finding.","relevance":"Directly addresses the WEIRD-sample problem in a literature that this digest otherwise draws almost entirely from North American and European sources, and identifies a substantive cross-cultural difference in which justice dimension matters most.","contribution":"Establishes culturally specific versus universal patterns in justice–outcome relationships and recovers a large Arabic-language literature that English-language meta-analyses have excluded.","uses":"Generalizability caveat for any justice-based lit review or grant narrative; a strong prompt for seminar discussion of construct equivalence and sampling bias; a model for including non-English-language studies in meta-analysis.","cluster":"Organizational justice and fairness at work — the foundational four-factor measurement and meta-analytic anchors, the critique/reassessment debate, and 2026 work extending justice theory to algorithmic managers and non-Western samples (new cluster; justice had zero prior coverage in this digest despite being adjacent to many themes already tracked)","themes":["Other"]},{"date":"2026-08-28","topic":"Occupational Safety — Foundational Meta-Analysis","authors":"Christian, M. S.; Bradley, J. C.; Wallace, J. C.; Burke, M. J.","year":"2009","title":"Workplace safety: A meta-analysis of the roles of person and situation factors","journal":"Journal of Applied Psychology","cite":"94(5), 1103–1127","doi":"https://doi.org/10.1037/a0016172","summary":"Meta-analytically integrates person-based (e.g., conscientiousness, safety knowledge, safety motivation) and situation-based (e.g., psychological and group safety climate, leadership) antecedents of safety performance behaviors and of accidents and injuries. Safety knowledge and safety motivation showed the strongest relations with safety performance behaviors, followed closely by psychological and group safety climate. Group safety climate had the strongest association with accidents and injuries. The authors position safety performance (compliance and participation) as the proximal mediator between distal antecedents and objective safety outcomes.","relevance":"This is the reference meta-analysis for occupational safety as an I-O topic; it establishes safety climate as a situational determinant with incremental value over individual differences and gives effect-size benchmarks the field still cites.","contribution":"Provides the integrative person-situation model of workplace safety and the meta-analytic effect sizes anchoring safety climate research; separates safety performance behaviors from safety outcomes.","uses":"Anchor reading for a seminar week on occupational safety; effect-size source for power analyses and grant justifications; template for person-versus-situation meta-analytic framing.","cluster":"Occupational safety, safety climate \u0026 psychosocial safety climate — foundational meta-analyses, the multilevel/centennial view, and recent cross-national, big-data, and measurement work (new cluster)","themes":["Well-Being \u0026 Occupational Health"]},{"date":"2026-08-28","topic":"Safety \u0026 JD-R — Meta-Analysis","authors":"Nahrgang, J. D.; Morgeson, F. P.; Hofmann, D. A.","year":"2011","title":"Safety at work: A meta-analytic investigation of the link between job demands, job resources, burnout, engagement, and safety outcomes","journal":"Journal of Applied Psychology","cite":"96(1), 71–94","doi":"https://doi.org/10.1037/a0021484","summary":"Meta-analysis of 203 independent samples (N = 186,440) testing a Job Demands–Resources model of safety. Job demands (risks and hazards, physical demands, complexity) related positively to burnout, which in turn related to worse safety outcomes — a health-impairment pathway. Job resources (knowledge, autonomy, supportive environment) related positively to engagement, which related to safer working — a motivational pathway. Both pathways predicted adverse events, accidents, injuries, and unsafe behavior across occupational contexts.","relevance":"Connects the occupational-health-psychology workhorse model (JD-R) to hard safety outcomes, making it directly useful for well-being researchers who want objective criteria beyond self-reported strain.","contribution":"Establishes dual health-impairment and motivational pathways from work design to safety, positioning burnout and engagement as mediators rather than end-state outcomes.","uses":"Pairs with JD-R readings to show a criterion extension; useful for grant narratives linking well-being interventions to safety ROI; strong exemplar of dual-process meta-analytic modeling.","cluster":"Occupational safety, safety climate \u0026 psychosocial safety climate — foundational meta-analyses, the multilevel/centennial view, and recent cross-national, big-data, and measurement work (new cluster)","themes":["Well-Being \u0026 Occupational Health","Job Design, Crafting \u0026 Motivation"]},{"date":"2026-08-28","topic":"Psychosocial Safety Climate — Foundational","authors":"Dollard, M. F.; Bakker, A. B.","year":"2010","title":"Psychosocial safety climate as a precursor to conducive work environments, psychological health problems, and employee engagement","journal":"Journal of Occupational and Organizational Psychology","cite":"83(3), 579–599","doi":"https://doi.org/10.1348/096317909X470690","summary":"Introduces psychosocial safety climate (PSC) — shared perceptions of organizational policies, practices, and procedures for protecting worker psychological health — as an upstream 'cause of the causes' in the JD-R framework. Using multilevel longitudinal data from Australian education workers, PSC predicted subsequent job demands and resources, which in turn predicted psychological health problems and engagement. PSC also moderated the demand–health relationship. The paper argues that PSC originates largely in senior management priorities and therefore is an organizational-level lever.","relevance":"PSC is the main construct extending physical safety climate logic to psychological health, and it underpins a large occupational-health-psychology literature on primary (organizational) prevention.","contribution":"Theoretically positions climate as an antecedent of work design itself, extending JD-R upstream and giving organizational-level intervention targets rather than individual coping.","uses":"Core theory reading for occupational health psychology; basis for organizational-level intervention studies; framing for policy-facing work on psychosocial risk regulation.","cluster":"Occupational safety, safety climate \u0026 psychosocial safety climate — foundational meta-analyses, the multilevel/centennial view, and recent cross-national, big-data, and measurement work (new cluster)","themes":["Well-Being \u0026 Occupational Health","Job Design, Crafting \u0026 Motivation"]},{"date":"2026-08-28","topic":"Occupational Safety — Centennial Review","authors":"Hofmann, D. A.; Burke, M. J.; Zohar, D.","year":"2017","title":"100 years of occupational safety research: From basic protections and work analysis to a multilevel view of workplace safety and risk","journal":"Journal of Applied Psychology","cite":"102(3), 375–388","doi":"https://doi.org/10.1037/apl0000114","summary":"Centennial review tracing applied psychology's contribution to occupational safety from mid-1800s factory laws and accident-proneness research, through mid-century safety training and behavior-based safety, to contemporary multilevel models of climate, leadership, and risk. The authors document a shift from individual-worker explanations toward organizational and systemic accounts of safety. They highlight enduring debates (e.g., accident proneness, behavior-based safety) and identify high-reliability organizing and cross-level climate transmission as growth areas. The piece closes with an agenda for the next century of safety research.","relevance":"A compact historical and conceptual map of the field, ideal for orienting students and for situating newer technology-mediated risks within a century of accumulated theory.","contribution":"Synthesizes a century of safety scholarship into a multilevel framework and shows how the field's level of analysis migrated from person to organization.","uses":"Excellent opening seminar reading; introduction framing for safety papers; source of historical context in grant background sections.","cluster":"Occupational safety, safety climate \u0026 psychosocial safety climate — foundational meta-analyses, the multilevel/centennial view, and recent cross-national, big-data, and measurement work (new cluster)","themes":["Well-Being \u0026 Occupational Health"]},{"date":"2026-08-28","topic":"Safety Outcomes — Big Data / O*NET Methods","authors":"Kumar, L. S.; Burns, G. N.","year":"2024","title":"Determinants of safety outcomes in organizations: Exploring O*NET data to predict occupational accident rates","journal":"Personnel Psychology","cite":"77, 555–594","doi":"https://doi.org/10.1111/peps.12560","summary":"Links O*NET occupational descriptors to archival occupational accident and injury rates to identify which work characteristics predict safety outcomes at the occupation level. The approach couples large-scale secondary occupational data with national injury statistics rather than relying on employee self-reports. Results identify physical, contextual, and work-activity characteristics associated with elevated accident rates. The study demonstrates occupation-level prediction as a complement to person- and unit-level safety research.","relevance":"Shows how existing occupational databases can serve as a digital-trace resource for occupational health research, bridging the big-data and safety literatures without new data collection.","contribution":"Methodological contribution: establishes O*NET-linked archival modeling as a viable route to objective safety criteria and occupation-level risk profiling.","uses":"Methods reading for a big-data/digital-traces session; model for secondary-data study designs; useful for research proposals with limited primary data collection budgets. Issue number not confirmed; volume and page range verified across two sources.","cluster":"Occupational safety, safety climate \u0026 psychosocial safety climate — foundational meta-analyses, the multilevel/centennial view, and recent cross-national, big-data, and measurement work (new cluster)","themes":["Well-Being \u0026 Occupational Health","Big Data \u0026 Methods"]},{"date":"2026-08-28","topic":"Psychosocial Safety Climate — Cross-National (Recent)","authors":"Loh, M. Y.; Lee, M. C. C.; Dollard, M.; Gardner, D.; Kikunaga, K.; Tondokoro, T.; Nakata, A.; Idris, M. A.; Bentley, T.; Afsharian, A.; Tappin, D.; Forsyth, D.","year":"2025","title":"The generality of psychosocial safety climate theory—A fundamental element for global worker well-being: Evidence from four nations","journal":"Stress and Health","cite":"41(4), Article e70070","doi":"https://doi.org/10.1002/smi.70070","summary":"Tests whether psychosocial safety climate theory is etic (universal) or emic (nation-specific) using worker samples from Australia, New Zealand, Japan, and Malaysia. The authors examine measurement invariance of PSC across nations and then test PSC → co-worker support → work engagement and PSC → co-worker support → psychological distress pathways. PSC showed sufficient invariance for cross-national comparison, and the structural relations largely replicated across the four countries. High PSC partly compensated for low co-worker support in predicting psychological distress.","relevance":"Directly addresses the generalizability problem in occupational health psychology, where most theory is built and tested in single high-income Western samples.","contribution":"Provides cross-national measurement-invariance evidence for PSC and a compensatory-resource finding, strengthening claims for PSC as a globally applicable policy target.","uses":"Model for cross-cultural measurement-invariance work; supports internationally framed grant applications; good discussion piece on WEIRD-sample limits in I-O theory.","cluster":"Occupational safety, safety climate \u0026 psychosocial safety climate — foundational meta-analyses, the multilevel/centennial view, and recent cross-national, big-data, and measurement work (new cluster)","themes":["Well-Being \u0026 Occupational Health"]},{"date":"2026-08-28","topic":"Safety Climate — Measurement \u0026 Validation (Recent)","authors":"Bazzoli, A.; French, B. F.","year":"2025","title":"A multilevel argument-based approach to validation and interpretation of safety climate scores","journal":"Journal of Occupational and Organizational Psychology","cite":"98, Article e70008","doi":"https://doi.org/10.1111/joop.70008","summary":"Applies an argument-based validity framework to safety climate measurement, treating validation as the accumulation of evidence supporting specific score interpretations and uses rather than as a property of a scale. The authors work through the multilevel complications of safety climate — scores are typically collected from individuals but interpreted at the group or organizational level — and specify the inferences that must be defended at each level. They illustrate how common practice often leaves key inferential links unexamined. Recommendations are offered for reporting and for interpreting aggregated climate scores.","relevance":"Climate constructs are ubiquitous in I-O and occupational health research, and this paper supplies the validity logic that aggregation-heavy climate work usually skips.","contribution":"Extends argument-based validity theory to multilevel organizational constructs, giving an explicit warrant structure for aggregated climate scores.","uses":"Strong measurement/methods seminar reading; checklist for reviewers evaluating climate papers; directly applicable when justifying aggregation in one's own multilevel studies.","cluster":"Occupational safety, safety climate \u0026 psychosocial safety climate — foundational meta-analyses, the multilevel/centennial view, and recent cross-national, big-data, and measurement work (new cluster)","themes":["Well-Being \u0026 Occupational Health","Big Data \u0026 Methods"]},{"date":"2026-08-27","topic":"Sleep \u0026 Self-Regulation — Foundational Theory","authors":"Barnes, C. M.","year":"2012","title":"Working in Our Sleep: Sleep and Self-Regulation in Organizations","journal":"Organizational Psychology Review","cite":"2(3), 234-257","doi":"https://doi.org/10.1177/2041386612450181","summary":"Conceptual review arguing that sleep should be treated as a core organizational variable rather than a purely private, non-work behavior. Barnes builds the case around self-regulation: sleep deprivation depletes the regulatory resources employees need for effortful, controlled behavior, so short or poor sleep cascades into deficits in performance, ethical conduct, affect regulation, and safety. The article organizes scattered sleep findings into a self-regulatory framework and specifies where organizations themselves cause sleep loss (schedules, workload, connectivity norms). It closes with an agenda for organizational scholars to study sleep as both an outcome of work design and a predictor of work behavior.","relevance":"This is the article that pulled sleep into mainstream I-O and OB, and it supplies the self-regulation logic that nearly every later organizational sleep paper builds on.","contribution":"Reframes sleep from a health-behavior footnote to an organizationally determined, self-regulatory resource, giving OB a theoretical mechanism (resource depletion) linking nightly sleep to next-day work behavior.","uses":"Anchor reading for a well-being or self-regulation seminar session; theoretical framing for grant narratives on work design and recovery; template for arguing that a 'personal' behavior is an organizational responsibility.","cluster":"Sleep, fatigue, and 24/7 work as an occupational health issue — foundational theory and meta-analytic anchors plus 2025-2026 work on leader sleep, dark-side states, and actigraphy in the aging workforce (new cluster; sleep had zero prior coverage in this digest)","themes":["Well-Being \u0026 Occupational Health"]},{"date":"2026-08-27","topic":"Sleep \u0026 Work — Meta-Analysis","authors":"Litwiller, B.; Snyder, L. A.; Taylor, W. D.; Steele, L. M.","year":"2017","title":"The Relationship Between Sleep and Work: A Meta-Analysis","journal":"Journal of Applied Psychology","cite":"102(4), 682-699","doi":"https://doi.org/10.1037/apl0000169","summary":"Meta-analysis of 152 primary studies of sleep among working adults, estimating associations of sleep quality and sleep quantity with work-related antecedents and outcomes. Both sleep quality and quantity related negatively to workload and to a range of health, attitudinal, and affective outcomes. Critically, sleep quality showed stronger relations with perceptual and affective outcomes than sleep quantity did, indicating the two are not interchangeable indicators. The authors argue this asymmetry has conceptual implications for how sleep is theorized and measured in organizational research.","relevance":"Provides the quantitative benchmark for effect sizes in the sleep-work literature and settles a recurring measurement question about quality versus quantity.","contribution":"Establishes empirically that sleep quality and sleep quantity are distinct constructs with different nomological networks, which reshapes measurement decisions in organizational sleep studies.","uses":"Effect-size source for power analyses and grant justification; required reading when teaching measurement of sleep; useful for critiquing studies that use sleep duration as the sole indicator.","cluster":"Sleep, fatigue, and 24/7 work as an occupational health issue — foundational theory and meta-analytic anchors plus 2025-2026 work on leader sleep, dark-side states, and actigraphy in the aging workforce (new cluster; sleep had zero prior coverage in this digest)","themes":["Well-Being \u0026 Occupational Health"]},{"date":"2026-08-27","topic":"Sleep \u0026 Technology / Connectivity — Foundational Empirical","authors":"Lanaj, K.; Johnson, R. E.; Barnes, C. M.","year":"2014","title":"Beginning the Workday Yet Already Depleted? Consequences of Late-Night Smartphone Use and Sleep","journal":"Organizational Behavior and Human Decision Processes","cite":"124(1), 11-23","doi":"https://doi.org/10.1016/j.obhdp.2014.01.001","summary":"Two experience-sampling studies test whether using a smartphone for work late at night harms next-day functioning. Late-night smartphone use predicted poorer sleep quantity, which in turn predicted greater morning depletion and lower daily work engagement. The effect held controlling for other nighttime media (television, laptop, tablet), suggesting something specific about the smartphone as an always-available work device. The authors interpret the pattern through ego depletion and sleep-based resource recovery.","relevance":"The canonical demonstration that always-on connectivity harms work outcomes through sleep, making it the empirical backbone for research on telepressure, boundary management, and after-hours availability norms.","contribution":"Identifies sleep as the mediating pathway between after-hours technology use and next-day work engagement, giving a concrete mechanism to the 'always-on' literature rather than a diffuse stress claim.","uses":"Pairs naturally with existing telepressure and recovery rows in this digest for a session on connectivity; strong methods exemplar for teaching experience-sampling designs; practical hook for organizational policy discussions.","cluster":"Sleep, fatigue, and 24/7 work as an occupational health issue — foundational theory and meta-analytic anchors plus 2025-2026 work on leader sleep, dark-side states, and actigraphy in the aging workforce (new cluster; sleep had zero prior coverage in this digest)","themes":["Well-Being \u0026 Occupational Health"]},{"date":"2026-08-27","topic":"Sleep \u0026 Employee Voice — Daily Empirical","authors":"Heydarifard, Z.; Krasikova, D. V.","year":"2023","title":"Losing Sleep Over Speaking Up at Work: A Daily Study of Voice and Insomnia","journal":"Journal of Applied Psychology","cite":"108(9), 1559-1572","doi":"https://doi.org/10.1037/apl0001087","summary":"A daily diary study examining voice behavior as a psychologically costly act with downstream consequences for sleep. Speaking up at work predicted greater same-night insomnia symptoms, and insomnia in turn predicted reduced voice on the following workday, describing a self-reinforcing dampening loop. The authors position voice not only as a prosocial contribution but as an effortful, rumination-inducing behavior. Findings identify boundary conditions that shape when speaking up becomes costly for the speaker.","relevance":"Connects the voice and psychological-safety literature (already represented in this digest) to occupational health outcomes, showing that the personal cost of voice is measurable in nightly sleep.","contribution":"Reverses the usual causal arrow by treating sleep as an outcome of discretionary work behavior, and documents a reciprocal within-person loop between voice and insomnia.","uses":"Excellent discussion piece for a voice or speaking-up seminar; illustrates reciprocal within-person modeling; useful for arguing that voice interventions need a recovery component.","cluster":"Sleep, fatigue, and 24/7 work as an occupational health issue — foundational theory and meta-analytic anchors plus 2025-2026 work on leader sleep, dark-side states, and actigraphy in the aging workforce (new cluster; sleep had zero prior coverage in this digest)","themes":["Well-Being \u0026 Occupational Health","Job Design, Crafting \u0026 Motivation"]},{"date":"2026-08-27","topic":"Sleep \u0026 Dark-Side Personality States — Recent Empirical","authors":"Kuijpers, E.; Vergauwe, J.; Vanderperre, S.; Mairesse, O.; Hofmans, J.","year":"2025","title":"Rise of the Dark Side: How Sleep Perception Triggers Dark Triad States at Work","journal":"Journal of Organizational Behavior","cite":"46(8), 1120-1138","doi":"https://doi.org/10.1002/job.2885","summary":"Ten-day experience-sampling study of 103 employees (786 repeated observations) testing whether perceived sleep quality and quantity trigger momentary dark triad states (narcissism, Machiavellianism, psychopathy) at work. The authors argue that expressing dark-side tendencies is partly a self-regulatory failure, so nights of poorer perceived sleep should increase dark-state expression the next day. Results support within-person links between sleep perception and dark triad states, shifting attention from stable traits to fluctuating states. The design distinguishes perceived sleep from objective sleep, which matters for interpreting the mechanism.","relevance":"Extends the sleep and self-regulation account into personality dynamics and counterproductive behavior, a link that is theoretically obvious but rarely tested within persons.","contribution":"Establishes dark triad expression as a state-level phenomenon with a modifiable nightly antecedent, rather than a fixed trait, which reframes how organizations might address dark-side behavior.","uses":"Strong seminar debate piece on traits versus states; methods exemplar for ESM personality research; useful bridge between well-being and counterproductive work behavior literatures.","cluster":"Sleep, fatigue, and 24/7 work as an occupational health issue — foundational theory and meta-analytic anchors plus 2025-2026 work on leader sleep, dark-side states, and actigraphy in the aging workforce (new cluster; sleep had zero prior coverage in this digest)","themes":["Well-Being \u0026 Occupational Health"]},{"date":"2026-08-27","topic":"Leader Sleep \u0026 Support Behaviors — Recent Empirical","authors":"Leslie, J. J.; Crain, T. L.; Brossoit, R. M.; Hammer, L. B.; Bodner, T. E.; Mohr, C. D.","year":"2025","title":"Sleeping To Support? The Interactive Effects of Leader Sleep Quantity and Quality on Leader- and Employee-Reported Support Behaviors","journal":"Occupational Health Science","cite":"Advance online publication (published 10 October 2025)","doi":"https://doi.org/10.1007/s41542-025-00242-1","summary":"Multisource study of 178 leaders and 393 direct reports examining how leader sleep, measured by both self-report and actigraphy, relates to supportive leadership. Outcomes are family-supportive supervisor behaviors and sleep leadership supportive behaviors, rated by leaders and separately by their subordinates. The design tests interactive effects of sleep quantity and quality rather than treating them as independent main effects, addressing the quality-versus-quantity distinction meta-analytically flagged by Litwiller et al. Using both actigraphy and subordinate ratings reduces common-method concerns that limit much of this literature.","relevance":"Shows that leader sleep is not just a leader-level well-being issue but a determinant of whether leaders enact the supportive behaviors that protect subordinate health.","contribution":"Combines actigraphic and self-reported sleep with multisource behavioral ratings, and models quantity and quality interactively, raising the methodological bar for organizational sleep research.","uses":"Model design to cite when justifying objective sleep measurement in a grant; teaching example of multisource multimethod design; connects leadership and occupational health syllabus units.","cluster":"Sleep, fatigue, and 24/7 work as an occupational health issue — foundational theory and meta-analytic anchors plus 2025-2026 work on leader sleep, dark-side states, and actigraphy in the aging workforce (new cluster; sleep had zero prior coverage in this digest)","themes":["Well-Being \u0026 Occupational Health","Leadership"]},{"date":"2026-08-27","topic":"Sleep, Wellbeing \u0026 the Aging Workforce — Recent Longitudinal","authors":"Tsanas, A.; Steffan, B.; Dixon, B.; Hay, K.; Pschetz, L.; Jandric, J.; ... Loretto, W. [full author list truncated on publisher page: needs verification]","year":"2026","title":"Interrelations of Work with Health and Wellbeing on a 50+ Year Old Workforce Assessed Using Longitudinal Self-Reports and Actigraphy","journal":"Scientific Reports","cite":"16, Article 23215","doi":"https://doi.org/10.1038/s41598-026-58229-z","summary":"Year-long study of 45 workers aged 50-66 across sectors, combining 1,901 participant-reported outcome entries with 5,258 days of wrist-worn actigraphy. Nearly 70% showed persistent, clinically significant sleep problems despite no prior sleep-disorder history, and roughly 92% crossed a clinical threshold at least once. Machine-learning feature selection identified workplace experiences as among the strongest correlates of both sleep disruption and wellbeing, and wellbeing tracked work-life balance and job satisfaction. Notably, disturbance and awakenings, not short duration, best explained feeling unrested, since most participants averaged 6.5-8 hours.","relevance":"Directly links the aging-workforce and occupational-health strands of this digest, and speaks to policy debates about keeping older workers healthy and economically active.","contribution":"Demonstrates that continuous wearable data reveals a large burden of subclinical sleep disruption invisible to duration-based self-report measures, and applies computational feature selection to rank work-related predictors.","uses":"Methods exemplar for wearables plus intensive longitudinal designs; evidence base for grant work on healthy ageing at work; discussion piece on what objective measurement adds over self-report.","cluster":"Sleep, fatigue, and 24/7 work as an occupational health issue — foundational theory and meta-analytic anchors plus 2025-2026 work on leader sleep, dark-side states, and actigraphy in the aging workforce (new cluster; sleep had zero prior coverage in this digest)","themes":["Well-Being \u0026 Occupational Health","Aging \u0026 Generations"]},{"date":"2026-08-26","topic":"Turnover \u0026 Retention — Theory","authors":"Hom, P. W.; Kiazad, K.","year":"2025","title":"New Directions for Theories for Why Employees Stay or Leave","journal":"Annual Review of Organizational Psychology and Organizational Behavior","cite":"12, 185–213","doi":"https://doi.org/10.1146/annurev-orgpsych-110622-033733","summary":"A critical narrative review of classic and contemporary theory on employee turnover and retention. The authors trace the field's shift from purely 'why people leave' models (met expectations, attitude-behavior chains, the unfolding model) toward 'why people stay' accounts centered on embeddedness and proximal withdrawal states. They evaluate where existing theory is redundant, where it is underspecified, and identify new directions including dynamic/within-person turnover processes, collective turnover, and contextual labor-market influences. The piece concludes with a research agenda emphasizing temporal dynamics and boundary conditions.","relevance":"This is the current authoritative theoretical map of the turnover literature and the natural anchor reading for any I-O course or lit review on retention. It connects turnover theory to careers, embeddedness, and job attitudes literatures.","contribution":"Consolidates a fragmented century of turnover theory into a coherent framework and specifies which theoretical mechanisms remain empirically untested, giving clear direction for new theory building.","uses":"Teaching: core theory reading for a graduate seminar session on retention. Lit review: primary framing citation. Grant writing: source of stated gaps to motivate a proposal.","cluster":"Turnover, retention, and withdrawal in a changing labor market — classic theory, meta-analytic anchors, and 2025-2026 work on quiet quitting and AI-driven exit (new cluster)","themes":["Turnover \u0026 Retention"]},{"date":"2026-08-26","topic":"Turnover \u0026 Retention — Quiet Quitting","authors":"Dilchert, S.; Stanek, K. C.; Ones, D. S.","year":"2026","title":"Expanding Our Understanding of Quiet Quitting: Antecedents, Correlates, and Consequences","journal":"Human Resource Management","cite":"Advance online publication","doi":"https://doi.org/10.1002/hrm.70038","summary":"Addresses the fact that 'quiet quitting' has been popularized without a clear construct definition or nomological net. The authors develop a unifying conceptual framework and empirically map quiet quitting against adjacent constructs, identifying components including weakening social connections at work, declining job engagement, generalized disinclination toward work, and a desire for stronger work–nonwork boundaries. They then examine antecedents, correlates, and consequences to establish where quiet quitting is distinct from withdrawal, disengagement, and low OCB. Supplementary data and results are posted on the Open Science Framework.","relevance":"Directly relevant to occupational health and engagement research: it disciplines a widely used popular-press term into a research-usable construct and links it to burnout, engagement, and withdrawal literatures.","contribution":"Provides construct clarification and a nomological network for quiet quitting, reducing jingle-jangle risk and enabling cumulative research on partial withdrawal rather than only full turnover.","uses":"Teaching: excellent debate/critique reading on construct proliferation. Lit review: definitional citation for quiet quitting. Future research: basis for measurement and intervention studies.","cluster":"Turnover, retention, and withdrawal in a changing labor market — classic theory, meta-analytic anchors, and 2025-2026 work on quiet quitting and AI-driven exit (new cluster)","themes":["Turnover \u0026 Retention"]},{"date":"2026-08-26","topic":"Turnover \u0026 AI Adoption","authors":"Moon, [full author list needs verification]","year":"2026","title":"Predicting and Preventing Turnover in Industry 4.0: Understanding the Impact of Artificial Intelligence Adoption on Employee Turnover","journal":"Human Resource Development Quarterly","cite":"Advance online publication, 1–11","doi":"https://doi.org/10.1002/hrdq.70018","summary":"A conceptual paper examining how organizational AI adoption reshapes employee withdrawal. Drawing on proximal withdrawal states theory, it argues that AI adoption alters both the motives for leaving (perceived obsolescence, altered career paths) and the psychological states preceding exit (preference to stay vs. leave, perceived control over the decision). The authors propose an HRD-based intervention framework centered on employee education, reskilling, and career development to prevent undesirable turnover. The paper positions AI-driven turnover as distinct from conventional turnover in its antecedents.","relevance":"Sits at the intersection of the future-of-work and turnover literatures, offering a mechanism-level account of how technological change translates into exit decisions — a gap in most AI-and-work research, which stops at job insecurity.","contribution":"Extends proximal withdrawal states theory to the technological-change context and links it to actionable HRD/reskilling levers, bridging turnover theory and workforce development.","uses":"Teaching: pairs well with AI job-insecurity readings. Grant writing: framing for reskilling/retention intervention proposals. Future research: testable propositions on AI adoption and withdrawal states.","cluster":"Turnover, retention, and withdrawal in a changing labor market — classic theory, meta-analytic anchors, and 2025-2026 work on quiet quitting and AI-driven exit (new cluster)","themes":["AI \u0026 Future of Work","Turnover \u0026 Retention"]},{"date":"2026-08-26","topic":"Collective Turnover \u0026 HR Practices","authors":"Li, Y.; Huang, Z.; Dineen, B. R.; Wang, M.; van Jaarsveld, D.","year":"2025","title":"Voluntary Turnover Rate Fluctuations, Human Resource Practices, and Innovation: A Within-Organization Investigation","journal":"Personnel Psychology","cite":"78(1), 103–122","doi":"https://doi.org/10.1111/peps.12661","summary":"Tests a U-shaped threshold model of how within-organization fluctuations in voluntary turnover rates relate to innovation. The relationship is negative when turnover fluctuations stay within an organization's normal range, but turns positive once fluctuations exceed a critical threshold reflecting far-from-equilibrium conditions. Interaction-facilitating HR practices (employee participation, group-based pay) lower that threshold, while interaction-inhibiting practices (individual-based pay) raise it. Analyses use longitudinal within-organization data.","relevance":"Moves turnover research from the individual to the unit level and links it to a valued organizational outcome (innovation), which is where most practical retention decisions actually get made.","contribution":"Introduces a nonlinear threshold logic to collective turnover research, challenging the assumption that turnover is monotonically harmful, and identifies HR practices as threshold-shifting moderators.","uses":"Teaching: strong methods/theory reading on nonlinear effects and multilevel turnover. Lit review: key citation for collective turnover. Future research: template for threshold modeling.","cluster":"Turnover, retention, and withdrawal in a changing labor market — classic theory, meta-analytic anchors, and 2025-2026 work on quiet quitting and AI-driven exit (new cluster)","themes":["Turnover \u0026 Retention"]},{"date":"2026-08-26","topic":"Turnover \u0026 Retention — Meta-Analysis","authors":"Rubenstein, A. L.; Eberly, M. B.; Lee, T. W.; Mitchell, T. R.","year":"2018","title":"Surveying the forest: A meta-analysis, moderator investigation, and future-oriented discussion of the antecedents of voluntary employee turnover","journal":"Personnel Psychology","cite":"71(1), 23–65","doi":"https://doi.org/10.1111/peps.12226","summary":"A comprehensive meta-analysis of the antecedents of voluntary employee turnover using a three-step approach: cumulating effect sizes across the full predictor space, developing and testing substantive moderators, and then reading the holistic pattern of results to identify what turnover research still needs. Findings show that many long-studied attitudinal predictors have modest effects and that the field's predictive ceiling has not moved much despite decades of work. The authors argue for greater attention to context, shocks, and dynamic processes.","relevance":"The standard quantitative benchmark for effect sizes in turnover research and the reference point against which new predictors (including AI-related ones) should be evaluated.","contribution":"Provides the most complete meta-analytic effect-size map of voluntary turnover antecedents to date, plus an evidence-based critique of the field's incremental progress.","uses":"Teaching: required empirical/meta-analytic reading. Lit review: effect-size benchmarks. Grant writing: evidence that conventional predictors leave substantial variance unexplained.","cluster":"Turnover, retention, and withdrawal in a changing labor market — classic theory, meta-analytic anchors, and 2025-2026 work on quiet quitting and AI-driven exit (new cluster)","themes":["Turnover \u0026 Retention"]},{"date":"2026-08-26","topic":"Turnover \u0026 Retention — Historical Review","authors":"Hom, P. W.; Lee, T. W.; Shaw, J. D.; Hausknecht, J. P.","year":"2017","title":"One hundred years of employee turnover theory and research","journal":"Journal of Applied Psychology","cite":"102(3), 530–545","doi":"https://doi.org/10.1037/apl0000103","summary":"A centennial review tracing employee turnover scholarship across the 100-year history of the Journal of Applied Psychology and the broader literature. The earliest work was atheoretical and practical (how to control turnover); mid-20th-century scholarship shifted to theory development and testing, which dominated until roughly 2000. The 21st century brought a reorientation toward the psychology of staying rather than leaving, attitudinal trajectories, and collective turnover. The review closes with methodological and theoretical priorities.","relevance":"Gives students and reviewers the historical arc of a core I-O topic, showing how a literature matures from practice to theory and back to context — useful modeling for how AI-and-work research may evolve.","contribution":"Organizes a century of turnover work into distinct theoretical eras and identifies the paradigm shift from leaving to staying, including the rise of embeddedness and trajectory-based methods.","uses":"Teaching: foundational background reading to open a turnover session. Lit review: historical framing. Comprehensive exams: canonical review.","cluster":"Turnover, retention, and withdrawal in a changing labor market — classic theory, meta-analytic anchors, and 2025-2026 work on quiet quitting and AI-driven exit (new cluster)","themes":["Turnover \u0026 Retention"]},{"date":"2026-08-26","topic":"Job Embeddedness — Meta-Analysis","authors":"Jiang, K.; Liu, D.; McKay, P. F.; Lee, T. W.; Mitchell, T. R.","year":"2012","title":"When and how is job embeddedness predictive of turnover? A meta-analytic investigation","journal":"Journal of Applied Psychology","cite":"97(5), 1077–1096","doi":"https://doi.org/10.1037/a0028610","summary":"Meta-analyzes 65 independent samples (N = 42,907) to test an overall model of job embeddedness and turnover. Both on-the-job and off-the-job embeddedness negatively predicted turnover intentions and actual turnover after controlling for job satisfaction, affective commitment, and perceived job alternatives, demonstrating incremental validity. Moderator analyses showed on-the-job embeddedness effects were stronger in female-dominated samples and public organizations, while off-the-job embeddedness effects were stronger in collectivistic countries. Results support embeddedness as a distinct retention construct rather than a proxy for attitudes.","relevance":"Establishes the empirical credibility of the 'why people stay' perspective and shows that non-work ties matter for retention — increasingly relevant given remote and hybrid work reshaping community and organizational embeddedness.","contribution":"Demonstrates incremental validity of embeddedness over classic attitudinal predictors and identifies cultural and sector-level boundary conditions on its effects.","uses":"Teaching: required empirical reading on embeddedness. Lit review: validity evidence. Future research: basis for re-examining embeddedness under remote/hybrid work arrangements.","cluster":"Turnover, retention, and withdrawal in a changing labor market — classic theory, meta-analytic anchors, and 2025-2026 work on quiet quitting and AI-driven exit (new cluster)","themes":["Turnover \u0026 Retention"]},{"date":"2026-08-14","topic":"Game-Based Assessment — Foundational Empirical (JAP)","authors":"Landers, R. N.; Armstrong, M. B.; Collmus, A. B.; Mujcic, S.; Blaik, J.","year":"2022","title":"Theory-Driven Game-Based Assessment of General Cognitive Ability: Design Theory, Measurement, Prediction of Performance, and Test Fairness","journal":"Journal of Applied Psychology","cite":"107(10), 1655–1677","doi":"https://doi.org/10.1037/apl0000954","summary":"Develops and validates a theory-driven game-based assessment (GBA) of general cognitive ability grounded in game design theory and the Cattell–Horn–Carroll model. Multiple minigames targeting specific abilities loaded strongly on a latent GMA factor (β = .97) and predicted performance criteria. Adverse impact was similar to a traditional test battery, but without differential prediction, and applicant reactions were more positive for the GBA across all measures.","relevance":"The flagship I-O demonstration that rigorous, construct-driven GBAs can match traditional cognitive testing on validity while improving candidate experience.","contribution":"Provides a formal design theory for building GBAs from psychometric first principles rather than gamifying existing tests post hoc.","uses":"Anchor reading for assessment seminars; template for GBA validation studies; useful in grant proposals on technology-enhanced selection.","cluster":"Game-based \u0026 gamified assessment in personnel selection","themes":["Assessment \u0026 Selection","Diversity, Equity \u0026 Inclusion","Big Data \u0026 Methods"]},{"date":"2026-08-14","topic":"Game-Based Assessment — Definitions \u0026 Design (Review)","authors":"Landers, R. N.; Sanchez, D. R.","year":"2022","title":"Game-Based, Gami
