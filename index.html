<style>
:root{
  --bg:#fdf5f7; --card:#ffffff; --ink:#17241d; --muted:#5a6f63; --faint:#6f8177;
  --line:#eddde3; --header-bg:#1f4634; --header-ink:#fbe9ef;
  --accent:#1f4634; --accent-ink:#ffffff; --chip:#fae3ea; --chip-ink:#2c5844;
  --shadow:0 1px 2px rgba(31,70,52,.06),0 1px 3px rgba(31,70,52,.06);
  --hl:#f9c8d9; --hl-ink:#4a1f2f;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0d1a14; --card:#15241b; --ink:#eadfe3; --muted:#9db0a5; --faint:#6d8175;
    --line:#213328; --header-bg:#16291f; --header-ink:#f5d9e2;
    --accent:#f2b6c9; --accent-ink:#14261c; --chip:#20342a; --chip-ink:#f0bfd0;
    --shadow:none; --hl:#7a3b52; --hl-ink:#ffdfe9;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.55 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  padding-bottom:env(safe-area-inset-bottom);
  overflow-wrap:break-word;
}
.wrap{max-width:820px;margin:0 auto;padding:0 14px}

/* ---------- header ---------- */
header{background:var(--header-bg);color:var(--header-ink);padding:22px 0 18px;padding-top:calc(22px + env(safe-area-inset-top))}
header h1{margin:0;font-size:1.45rem;letter-spacing:-.02em;font-weight:650}
header p{margin:5px 0 0;font-size:.86rem;opacity:.82}
.stats{margin-top:12px;display:flex;gap:16px;flex-wrap:wrap;font-size:.78rem;opacity:.9}
.stats b{font-size:1.02rem;font-weight:650;display:block;line-height:1.2}

/* ---------- controls ---------- */
.controls{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding:9px 0 8px}
.controls .wrap{display:flex;gap:7px;flex-wrap:wrap}
input[type=search],select{
  font:inherit;font-size:16px;color:var(--ink);background:var(--card);
  border:1px solid var(--line);border-radius:10px;padding:11px 12px;min-height:44px;
  -webkit-appearance:none;appearance:none;width:100%
}
input[type=search]{flex:1 1 100%}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 17px) 20px,calc(100% - 12px) 20px;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:34px;text-overflow:ellipsis}
/* Journal names run to 78 chars, so that one gets its own row. */
#jr{flex:1 1 100%}
#topic{flex:1 1 calc(58% - 4px)}
#yr{flex:1 1 calc(42% - 4px)}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.count{font-size:.8rem;color:var(--muted);padding:2px 0 0;flex:1 1 100%}
.count button{background:none;border:none;color:var(--accent);font:inherit;font-size:.8rem;padding:0 0 0 8px;cursor:pointer;text-decoration:underline}

/* ---------- feed ---------- */
main{padding:6px 0 48px}
.daygroup{margin-top:22px}
.dayhead{
  position:sticky;top:var(--ctrl-h,150px);z-index:10;display:flex;align-items:baseline;gap:9px;
  padding:7px 0 7px;margin-bottom:9px;background:var(--bg);border-bottom:1px solid var(--line)
}
.dayhead h2{margin:0;font-size:.95rem;font-weight:650;letter-spacing:-.01em}
.dayhead span{font-size:.75rem;color:var(--faint)}
.cluster{font-size:.79rem;color:var(--muted);margin:-2px 0 12px;font-style:italic;line-height:1.45}

article{
  background:var(--card);border:1px solid var(--line);border-radius:13px;
  margin-bottom:9px;box-shadow:var(--shadow);overflow:hidden
}
.head{padding:13px 14px;cursor:pointer;display:block;user-select:none}
.chip{
  display:inline-block;background:var(--chip);color:var(--chip-ink);font-size:.685rem;
  font-weight:600;letter-spacing:.02em;padding:3px 8px;border-radius:99px;margin-bottom:7px
}
.t{font-size:.985rem;font-weight:600;line-height:1.34;letter-spacing:-.01em;margin:0 0 5px}
.m{font-size:.795rem;color:var(--muted);line-height:1.45}
.m .j{font-style:italic}
.more{font-size:.735rem;color:var(--accent);margin-top:7px;font-weight:600}
.more::after{content:" ▾"}
article.open .more::after{content:" ▴"}
.body{display:none;padding:0 14px 14px;border-top:1px solid var(--line);margin-top:2px;padding-top:12px}
article.open .body{display:block}
.body h3{margin:0 0 3px;font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);font-weight:700}
.body p{margin:0 0 13px;font-size:.875rem;line-height:1.6}
.body p:last-of-type{margin-bottom:11px}
.doi{
  display:inline-block;background:var(--accent);color:var(--accent-ink);text-decoration:none;
  font-size:.79rem;font-weight:600;padding:10px 15px;border-radius:9px;min-height:40px;line-height:20px
}
mark{background:var(--hl);color:var(--hl-ink);border-radius:2px;padding:0 1px}
.empty{text-align:center;color:var(--muted);padding:52px 16px;font-size:.9rem}
footer{border-top:1px solid var(--line);padding:20px 0 34px;font-size:.75rem;color:var(--faint);text-align:center}
#sentinel{height:1px}
@media (prefers-reduced-motion:no-preference){article{transition:border-color .15s}}

<script type="application/json" id="data">[{"date":"2026-09-05","topic":"JD-R Theory - Foundational Empirical","authors":"Demerouti, E.; Nachreiner, F.; Bakker, A. B.; Schaufeli, W. B.","year":"2001","title":"The job demands-resources model of burnout","journal":"Journal of Applied Psychology","cite":"86(3), 499-512","doi":"https://doi.org/10.1037/0021-9010.86.3.499","summary":"The paper introduces the job demands-resources (JD-R) model, proposing that working conditions sort into two broad categories - job demands and job resources - that drive distinct outcomes through separate processes. Using LISREL analyses of self-reports plus independent observer ratings of working conditions across three occupational groups (human services, industry, transport; total N = 374), the authors tested the dual-process claim. Job demands were primarily related to the exhaustion component of burnout, whereas a lack of job resources was primarily related to disengagement, and the pattern replicated across all three occupational groups. The study also validated the two-factor structure of a new burnout instrument, the Oldenburg Burnout Inventory, and showed it to be essentially invariant across occupations.","relevance":"This is the origin point for what has become the most widely used framework in occupational health psychology, and it underpins the burnout, recovery, engagement, technostress, and safety-climate literatures already tracked in this digest. Its flexible demands/resources taxonomy is precisely what lets researchers slot in new demands such as algorithmic monitoring or AI-related job insecurity.","contribution":"Establishes the dual-process architecture (health-impairment vs. motivational) that distinguishes JD-R from earlier fixed-variable stress models such as demand-control, and introduces a burnout measure not tied to the Maslach Burnout Inventory's item wording.","uses":"Required foundational reading for any occupational health or work design seminar; anchor citation for a lit review on burnout antecedents; useful for teaching how a taxonomy-based framework differs from a variable-specific model, and for critiquing the breadth that makes JD-R easy to apply but hard to falsify.","cluster":"Job Demands-Resources theory and Conservation of Resources theory - the two dominant resource-based stress theories in occupational health psychology: the foundational JD-R empirical paper, the challenge/hindrance meta-analytic extension, the COR resource-definition critique, the canonical COR organizational review, the authors' own FAQ addressing falsifiability and the COR/JD-R distinction, and 2026 work on resource spirals and cognitive demands under AI (new cluster; JD-R and COR appeared only as borrowed framing inside the burnout, recovery, technostress, safety-climate, and engagement clusters already tracked, never as the parent theory in their own right)","themes":["Well-Being \u0026 Occupational Health","Job Design, Crafting \u0026 Motivation"]},{"date":"2026-09-05","topic":"JD-R Theory - Meta-Analysis (Challenge/Hindrance)","authors":"Crawford, E. R.; LePine, J. A.; Rich, B. L.","year":"2010","title":"Linking job demands and resources to employee engagement and burnout: A theoretical extension and meta-analytic test","journal":"Journal of Applied Psychology","cite":"95(5), 834-848","doi":"https://doi.org/10.1037/a0019364","summary":"The authors refine the JD-R model by importing transactional stress theory's distinction between demands appraised as challenges and demands appraised as hindrances, in order to explain why published demand-engagement relationships had been inconsistent. They tested the revised theory using meta-analytic structural equation modeling. Demands were positively associated with burnout and resources negatively associated with it, consistent with the original dual-process claim. But engagement behaved asymmetrically: resources were consistently positively related to engagement, whereas hindrance demands were negatively related and challenge demands positively related to it.","relevance":"The challenge/hindrance distinction is now standard vocabulary in I-O and occupational health research, and it is directly relevant to classifying newer technology-related demands - whether AI adoption, monitoring, or connectivity functions as a stimulating challenge or an obstructive hindrance is an open empirical question in the algorithmic-management literature.","contribution":"Shows that a demand's effect depends on how it is appraised rather than on its objective level, integrating Lazarus-style appraisal theory into JD-R and resolving an empirical inconsistency through meta-analytic path modeling rather than narrative argument.","uses":"Required reading paired with Demerouti et al. (2001) to show theory refinement in action; methods teaching example of meta-analytic SEM; a template for students designing studies that classify emerging job demands.","cluster":"Job Demands-Resources theory and Conservation of Resources theory - the two dominant resource-based stress theories in occupational health psychology: the foundational JD-R empirical paper, the challenge/hindrance meta-analytic extension, the COR resource-definition critique, the canonical COR organizational review, the authors' own FAQ addressing falsifiability and the COR/JD-R distinction, and 2026 work on resource spirals and cognitive demands under AI (new cluster; JD-R and COR appeared only as borrowed framing inside the burnout, recovery, technostress, safety-climate, and engagement clusters already tracked, never as the parent theory in their own right)","themes":["Well-Being \u0026 Occupational Health","Job Design, Crafting \u0026 Motivation"]},{"date":"2026-09-05","topic":"Conservation of Resources - Conceptual Critique","authors":"Halbesleben, J. R. B.; Neveu, J.-P.; Paustian-Underdahl, S. C.; Westman, M.","year":"2014","title":"Getting to the \"COR\": Understanding the role of resources in conservation of resources theory","journal":"Journal of Management","cite":"40(5), 1334-1364","doi":"https://doi.org/10.1177/0149206314527130","summary":"This conceptual review confronts the criticisms that had accumulated against conservation of resources (COR) theory, nearly all of which center on the theory's core construct: the resource. The authors work through concerns about how resources are conceptualized, conserved, acquired, and measured, and how they fluctuate over time. The most damaging criticism they address is that resources have never been clearly defined, so that nearly anything desirable can be labeled a resource, leaving the category broad and heterogeneous. They propose a tighter treatment of resources aimed at making COR predictions more specific and testable.","relevance":"COR is the parent theory behind much of the well-being, recovery, and depletion research in this digest, and this article is the field's most direct reckoning with the construct-validity problem at its center. It is essential for students who need to use resource language rigorously rather than as post hoc labeling.","contribution":"Reframes the central weakness of a heavily cited theory as a construct-definition problem and offers criteria for what should count as a resource, shifting COR from an all-purpose explanatory vocabulary toward a falsifiable account.","uses":"Debate/critique reading; strong seminar pairing with Hobfoll et al. (2018); useful for teaching construct validity and for students who reflexively invoke COR in their own proposals without defining the resource.","cluster":"Job Demands-Resources theory and Conservation of Resources theory - the two dominant resource-based stress theories in occupational health psychology: the foundational JD-R empirical paper, the challenge/hindrance meta-analytic extension, the COR resource-definition critique, the canonical COR organizational review, the authors' own FAQ addressing falsifiability and the COR/JD-R distinction, and 2026 work on resource spirals and cognitive demands under AI (new cluster; JD-R and COR appeared only as borrowed framing inside the burnout, recovery, technostress, safety-climate, and engagement clusters already tracked, never as the parent theory in their own right)","themes":["Other"]},{"date":"2026-09-05","topic":"Conservation of Resources - Foundational Review","authors":"Hobfoll, S. E.; Halbesleben, J.; Neveu, J.-P.; Westman, M.","year":"2018","title":"Conservation of resources in the organizational context: The reality of resources and their consequences","journal":"Annual Review of Organizational Psychology and Organizational Behavior","cite":"5, 103-128","doi":"https://doi.org/10.1146/annurev-orgpsych-032117-104640","summary":"Written by COR's originator with three collaborators, this review takes stock of the theory roughly thirty years after its introduction and situates it within organizational psychology and organizational behavior. It restates the core principles - that people strive to obtain, retain, and protect resources; that resource loss is disproportionately more salient than resource gain; and that loss and gain spirals accelerate over time. The authors trace how COR has been applied across the stress spectrum from everyday burnout to traumatic stress, and note that COR is largely the basis for the more work-specific JD-R model. They also respond to the definitional criticisms and set out directions for organizational applications.","relevance":"This is the canonical citation for COR in organizational research and the reference point for any argument about resource loss spirals, crossover, or recovery. It is also the clearest statement of how COR and JD-R relate, which students routinely conflate.","contribution":"Consolidates three decades of theory development into a set of stated principles and corollaries, and explicitly positions COR as the broader parent framework from which the work-specific JD-R model descends.","uses":"Required reading as the COR anchor; lit-review citation for resource-based arguments; grant-writing background when justifying resource-loss mechanisms; teaching the difference between a general stress theory and a job-specific model.","cluster":"Job Demands-Resources theory and Conservation of Resources theory - the two dominant resource-based stress theories in occupational health psychology: the foundational JD-R empirical paper, the challenge/hindrance meta-analytic extension, the COR resource-definition critique, the canonical COR organizational review, the authors' own FAQ addressing falsifiability and the COR/JD-R distinction, and 2026 work on resource spirals and cognitive demands under AI (new cluster; JD-R and COR appeared only as borrowed framing inside the burnout, recovery, technostress, safety-climate, and engagement clusters already tracked, never as the parent theory in their own right)","themes":["Other"]},{"date":"2026-09-05","topic":"JD-R Theory - FAQ / Falsifiability Debate","authors":"Bakker, A. B.; Demerouti, E.","year":"2024","title":"Job demands-resources theory: Frequently asked questions","journal":"Journal of Occupational Health Psychology","cite":"29(3), 188-200","doi":"https://doi.org/10.1037/ocp0000376","summary":"The theory's two principal architects respond directly to the criticisms and recurring questions that JD-R has attracted. They address how COR theory differs from JD-R, whether a single job characteristic can be both a resource and a demand, whether work engagement is redundant with existing constructs, and how hindrance and challenge demands fit the framework. Notably, they take up head-on whether JD-R theory can be falsified, along with the role of personality, the distinction between within- and between-person effects, whether a standard JD-R questionnaire exists, and the evidence for loss and gain spirals. They close by considering whether the theory applies outside the work domain and whether it is universally applicable.","relevance":"Rare and pedagogically valuable: theory originators answering their critics in print, in a target occupational health journal. The falsifiability section in particular gives a seminar a concrete case for discussing what makes an organizational theory scientific rather than merely useful.","contribution":"Provides authoritative clarification of long-contested boundary conditions and, unusually, engages the falsifiability objection rather than deflecting it, converting scattered informal criticism into an explicit theoretical agenda.","uses":"Debate/critique reading, ideally assigned alongside Demerouti et al. (2001) and Halbesleben et al. (2014); excellent prompt for a seminar discussion on theory falsifiability and construct proliferation; practical reference for students choosing JD-R measures.","cluster":"Job Demands-Resources theory and Conservation of Resources theory - the two dominant resource-based stress theories in occupational health psychology: the foundational JD-R empirical paper, the challenge/hindrance meta-analytic extension, the COR resource-definition critique, the canonical COR organizational review, the authors' own FAQ addressing falsifiability and the COR/JD-R distinction, and 2026 work on resource spirals and cognitive demands under AI (new cluster; JD-R and COR appeared only as borrowed framing inside the burnout, recovery, technostress, safety-climate, and engagement clusters already tracked, never as the parent theory in their own right)","themes":["Job Design, Crafting \u0026 Motivation"]},{"date":"2026-09-05","topic":"Resource Spirals - Longitudinal ESM (Recent)","authors":"Zeng, W.; Ma, S.; Wang, R.; Xu, Y. (co-first authorship shared by Zeng and Ma; author list beyond the first two authors compiled from indexed records and needs verification against the published version)","year":"2026","title":"Spiraling resources and emotional well-being: Longitudinal evidence for resource gain and loss spirals in COR and JD-R theories","journal":"Applied Psychology","cite":"75(2), Article e70075","doi":"https://doi.org/10.1111/apps.70075","summary":"Gain and loss spirals are among the most-cited propositions in COR and JD-R theory but among the least directly tested, since detecting a spiral requires repeated within-person measurement rather than cross-sectional or two-wave data. The authors use longitudinal experience-sampling data from two studies to examine how resource losses and gains shape emotional well-being trajectories, focusing specifically on the momentum and magnitude of those trajectories. They report evidence for both gain and loss spirals, with the predicted momentum and magnitude effects. Work-related social support functioning as a job resource interacted with time to amplify positive effects, with better-supported individuals showing a steeper rise in positive emotion and a faster decline in negative emotion.","relevance":"Supplies the direct within-person evidence that the spiral proposition has largely lacked, and demonstrates the experience-sampling design that recovery, technostress, and daily-diary research in this digest increasingly depends on.","contribution":"Operationalizes spirals in terms of momentum and magnitude rather than treating them as a loose metaphor, giving both theories a testable dynamic specification and showing that resources shape the shape of a trajectory, not just its level.","uses":"Recent empirical reading demonstrating ESM design; methods teaching for modeling within-person trajectories; a model for students designing longitudinal well-being studies; citable evidence when a proposal invokes resource spirals.","cluster":"Job Demands-Resources theory and Conservation of Resources theory - the two dominant resource-based stress theories in occupational health psychology: the foundational JD-R empirical paper, the challenge/hindrance meta-analytic extension, the COR resource-definition critique, the canonical COR organizational review, the authors' own FAQ addressing falsifiability and the COR/JD-R distinction, and 2026 work on resource spirals and cognitive demands under AI (new cluster; JD-R and COR appeared only as borrowed framing inside the burnout, recovery, technostress, safety-climate, and engagement clusters already tracked, never as the parent theory in their own right)","themes":["Well-Being \u0026 Occupational Health"]},{"date":"2026-09-05","topic":"Cognitive Job Demands \u0026 AI - Conceptual (Recent)","authors":"Kulikowski, K.","year":"2026","title":"Exploring the role of cognitive job demands in job demands-resources theory","journal":"Journal of Occupational and Organizational Psychology","cite":"99, Article e70095","doi":"https://doi.org/10.1111/joop.70095","summary":"Despite the volume of JD-R research, cognitive job demands remain surprisingly underexplored and lack a widely accepted definition, even as rising job complexity and technologies such as AI make them a defining feature of twenty-first-century work. Drawing on cognitive psychology alongside work psychology, this conceptual paper addresses three questions: how cognitive job demands should be defined, whether they are best classified as a challenge demand, a hindrance demand, or in fact a job resource, and what roles personal and job resources play in managing them. The author proposes a typology of cognitive job demands within the JD-R framework.","relevance":"Directly connects the JD-R tradition to the digest's AI-and-work coverage: whether AI reduces cognitive load or displaces it into new forms of monitoring, verification, and integration work is a live question, and this paper supplies the conceptual apparatus for asking it.","contribution":"Argues that a construct central to modern work has been left theoretically vague within JD-R, and offers a typology plus an explicit challenge/hindrance/resource classification question rather than assuming cognitive demands are simply another hindrance.","uses":"Recommended recent reading bridging the JD-R and AI-at-work clusters; useful for generating dissertation questions on cognitive load under AI augmentation; a teaching example of conceptual-paper craft, since the contribution is definitional rather than empirical.","cluster":"Job Demands-Resources theory and Conservation of Resources theory - the two dominant resource-based stress theories in occupational health psychology: the foundational JD-R empirical paper, the challenge/hindrance meta-analytic extension, the COR resource-definition critique, the canonical COR organizational review, the authors' own FAQ addressing falsifiability and the COR/JD-R distinction, and 2026 work on resource spirals and cognitive demands under AI (new cluster; JD-R and COR appeared only as borrowed framing inside the burnout, recovery, technostress, safety-climate, and engagement clusters already tracked, never as the parent theory in their own right)","themes":["AI \u0026 Future of Work","Job Design, Crafting \u0026 Motivation"]},{"date":"2026-09-04","topic":"Work Identity - Foundational Theory","authors":"Ashforth, B. E.; Mael, F.","year":"1989","title":"Social Identity Theory and the Organization","journal":"Academy of Management Review","cite":"14(1), 20-39","doi":"https://doi.org/10.5465/amr.1989.4278999","summary":"This conceptual article imports social identity theory (SIT) from social psychology into organizational scholarship. The authors define social identification as a perception of oneness with a group, distinguish it from internalization of group values, and specify antecedents (group distinctiveness, prestige, salience of outgroups, and the classic factors of interpersonal interaction, similarity, liking, and shared goals). They argue identification produces support for and loyalty to the group and activities congruent with the identity. The framework is then applied to organizational socialization, role conflict, and intergroup relations.","relevance":"This is the source article for organizational identification, the construct underlying almost every subsequent treatment of who employees think they are at work. It supplies the theoretical vocabulary (categorization, distinctiveness, salience) that later identity-threat and identity-work research assumes.","contribution":"Establishes social identification as a cognitive, perceptual construct distinct from commitment and internalization, and specifies the conditions under which employees define themselves in terms of an organizational or occupational category.","uses":"Required opening reading for an identity week; the definitional anchor for lit reviews distinguishing identification, commitment, and identity work; useful for teaching students why identity constructs are not interchangeable.","cluster":"Work identity, occupational identity \u0026 identity threat — the social-identity foundation, the identity-threat framework, the meta-analytic anchor for organizational identification, the identity-work review, the classic study of occupational identity under technological change, and 2025-2026 work extending identity threat to temporary workers and human-AI workplaces (new cluster; identity had only scattered coverage in this digest despite being the parent literature for the careers, gig-work, and human-AI collaboration clusters already tracked)","themes":["Other"]},{"date":"2026-09-04","topic":"Work Identity - Identity Threat Theory","authors":"Petriglieri, J. L.","year":"2011","title":"Under Threat: Responses to and the Consequences of Threats to Individuals' Identities","journal":"Academy of Management Review","cite":"36(4), 641-662","doi":"https://doi.org/10.5465/amr.2009.0087","summary":"This theory article builds an integrative model of identity threat, defined as an experience appraised as potentially harming the value, meanings, or enactment of an identity. Petriglieri distinguishes identity-protection responses (which preserve the threatened identity) from identity-restructuring responses (which change it), and further splits each into responses aimed at the threat itself versus at the individual's appraisal of it. The model specifies when each response type is likely and traces consequences for the individual and for the collectives whose identities are implicated.","relevance":"Identity threat is the mechanism through which technological change, automation, non-standard employment, and AI adoption are theorized to affect workers. This article supplies the response taxonomy that nearly all applied identity-threat studies in the digest's AI and gig-work clusters borrow.","contribution":"Provides the field's canonical typology of identity-threat responses and clarifies that threat is an appraisal, not an objective event, which makes moderators (resources, identity centrality, context) theoretically necessary rather than optional.","uses":"Required theory reading before any AI-and-identity empirical paper; a scaffold for grant framing on worker responses to automation; a template for teaching how to build a typology-based theory paper.","cluster":"Work identity, occupational identity \u0026 identity threat — the social-identity foundation, the identity-threat framework, the meta-analytic anchor for organizational identification, the identity-work review, the classic study of occupational identity under technological change, and 2025-2026 work extending identity threat to temporary workers and human-AI workplaces (new cluster; identity had only scattered coverage in this digest despite being the parent literature for the careers, gig-work, and human-AI collaboration clusters already tracked)","themes":["Other"]},{"date":"2026-09-04","topic":"Work Identity - Meta-Analysis","authors":"Lee, E.-S.; Park, T.-Y.; Koo, B.","year":"2015","title":"Identifying organizational identification as a basis for attitudes and behaviors: A meta-analytic review","journal":"Psychological Bulletin","cite":"141(5), 1049-1080","doi":"https://doi.org/10.1037/bul0000012","summary":"This meta-analysis tests whether organizational identification has explanatory value beyond overlapping attitudinal constructs. The authors accumulate correlations between identification and job involvement, job satisfaction, affective commitment, in-role performance, and extra-role performance, and examine identity-relevant moderators. Identification is substantially associated with all five criteria, and the authors show its relationships are patterned in ways consistent with an identity-based (rather than purely attitudinal) account. They also address the long-running discriminant-validity dispute between identification and affective commitment.","relevance":"Supplies the quantitative anchor for the identity cluster and settles, meta-analytically, whether identification is worth measuring separately from commitment — a question graduate students raise immediately.","contribution":"Demonstrates the incremental and distinctive predictive contribution of organizational identification and organizes the moderator evidence into an identity-theoretic framework rather than a list of correlates.","uses":"Required methods/evidence reading paired with Ashforth \u0026 Mael; effect-size source for power analysis and for lit-review claims about identification-performance links; a good class example of construct-redundancy adjudication via meta-analysis.","cluster":"Work identity, occupational identity \u0026 identity threat — the social-identity foundation, the identity-threat framework, the meta-analytic anchor for organizational identification, the identity-work review, the classic study of occupational identity under technological change, and 2025-2026 work extending identity threat to temporary workers and human-AI workplaces (new cluster; identity had only scattered coverage in this digest despite being the parent literature for the careers, gig-work, and human-AI collaboration clusters already tracked)","themes":["Other"]},{"date":"2026-09-04","topic":"Work Identity - Occupational Identity \u0026 Technological Change (Foundational Empirical)","authors":"Nelson, A. J.; Irwin, J.","year":"2014","title":"\"Defining what we do—all over again\": Occupational identity, technological change, and the librarian/Internet-search relationship","journal":"Academy of Management Journal","cite":"57(3), 892-928","doi":"https://doi.org/10.5465/amj.2012.0201","summary":"Using a qualitative analysis of 22 years of library-profession journal articles, the authors trace how librarians interpreted and responded to the rise of Internet search. Librarians initially discounted the technology and differentiated their expertise from it, then progressively redefined 'what we do' as search became ubiquitous. The authors show that occupational identity both shaped and was reshaped by the technology relationship, and identify a paradox of expertise in which deep domain knowledge blinded the occupation to the innovation's significance.","relevance":"This is the closest historical analogue in the literature to what generative AI is now doing to knowledge occupations, and it is drawn from a target journal. It gives seminar discussion a non-AI case that students can reason from without hype.","contribution":"Theorizes the recursive, longitudinal relationship between occupational identity and technological change, and introduces the paradox of expertise as a mechanism explaining why skilled occupations misread disruptive technologies.","uses":"Strong debate/discussion reading for an AI-and-work seminar; a model for archival qualitative design in dissertation proposals; pairs naturally with contemporary generative-AI identity papers.","cluster":"Work identity, occupational identity \u0026 identity threat — the social-identity foundation, the identity-threat framework, the meta-analytic anchor for organizational identification, the identity-work review, the classic study of occupational identity under technological change, and 2025-2026 work extending identity threat to temporary workers and human-AI workplaces (new cluster; identity had only scattered coverage in this digest despite being the parent literature for the careers, gig-work, and human-AI collaboration clusters already tracked)","themes":["Other"]},{"date":"2026-09-04","topic":"Work Identity - Review","authors":"Caza, B. B.; Vough, H.; Puranik, H.","year":"2018","title":"Identity work in organizations and occupations: Definitions, theories, and pathways forward","journal":"Journal of Organizational Behavior","cite":"39(7), 889-910","doi":"https://doi.org/10.1002/job.2318","summary":"This review synthesizes the fragmented empirical literature on identity work — the processes by which people form, repair, maintain, strengthen, or revise self-meanings at work. The authors catalog how the construct has been defined and operationalized, identify the distinct theoretical traditions researchers have drawn on, and organize studies by the triggers, forms, and outcomes of identity work. They close with an integrative framework and a research agenda addressing definitional inconsistency and the near-total reliance on qualitative designs.","relevance":"Identity work is the process construct that connects identity threat to what workers actually do, and this review is the standard entry point. It also documents the field's methodological monoculture, which is useful for students looking for a quantitative or experimental contribution.","contribution":"Consolidates a definitionally inconsistent literature into a single framework and makes the field's construct-clarity and methods gaps explicit and actionable.","uses":"Required review reading for the cluster; a source of dissertation-sized gaps (measurement, longitudinal design, quantitative identity work); useful for teaching how to write a review that identifies rather than papers over inconsistency.","cluster":"Work identity, occupational identity \u0026 identity threat — the social-identity foundation, the identity-threat framework, the meta-analytic anchor for organizational identification, the identity-work review, the classic study of occupational identity under technological change, and 2025-2026 work extending identity threat to temporary workers and human-AI workplaces (new cluster; identity had only scattered coverage in this digest despite being the parent literature for the careers, gig-work, and human-AI collaboration clusters already tracked)","themes":["Other"]},{"date":"2026-09-04","topic":"Work Identity - Non-Standard Employment \u0026 Identity Threat (Recent Empirical)","authors":"Lu, W.; Liu, S.; Ma, C.; Pei, J.","year":"2025","title":"\"Who am I?\" Exploring temporary workers' integration in multi-employment-type organizations from the identity threat perspective","journal":"Human Resource Management","cite":"64, 307-329","doi":"https://doi.org/10.1002/hrm.22264","summary":"Drawing on social identity threat theory, this two-study paper examines what happens when temporary and regular employees work side by side and the regular employees' job conditions visibly exceed the temporaries'. Study 1 used a two-wave time-lagged design with 480 temporary workers; Study 2 used a three-wave, multi-source design matching 371 temporary workers with 64 supervisors, analyzed with polynomial regression and response surface modeling. The condition gap predicted identity threat, which in turn raised turnover intention and lowered job performance. Perceived organizational social integration practices attenuated these effects.","relevance":"Extends identity threat from technology to employment-status heterogeneity, which is directly relevant to the digest's gig-work, psychological-contract, and non-standard-work clusters. It also offers an actionable HR moderator rather than only documenting harm.","contribution":"Identifies a situational, comparison-based trigger of identity threat specific to blended workforces, and uses polynomial regression/response surface methods to model the condition gap rather than treating it as a difference score.","uses":"Required or recommended recent empirical reading for a future-of-employment week; a methods exemplar for congruence-based hypotheses; practical implications section is usable for applied HR teaching. Issue number not confirmed; volume and page range verified across two sources.","cluster":"Work identity, occupational identity \u0026 identity threat — the social-identity foundation, the identity-threat framework, the meta-analytic anchor for organizational identification, the identity-work review, the classic study of occupational identity under technological change, and 2025-2026 work extending identity threat to temporary workers and human-AI workplaces (new cluster; identity had only scattered coverage in this digest despite being the parent literature for the careers, gig-work, and human-AI collaboration clusters already tracked)","themes":["Employment Relationships \u0026 Gig Work"]},{"date":"2026-09-04","topic":"Work Identity - Human-AI Workplaces (Recent Empirical)","authors":"Zhao, R.; Chen, Z.; Niu, L.; Wang, S. (author order needs verification)","year":"2026","title":"Who am I with AI? Occupational identity crafting in human-AI workplaces","journal":"International Journal of Information Management","cite":"86, 102990","doi":"https://www.sciencedirect.com/science/article/pii/S0268401225001227","summary":"This study introduces occupational identity crafting — a proactive, agentic form of identity work through which employees reshape their self-perceptions and desired recognition inside AI-integrated work systems — and specifies role, task, and skill crafting as its dimensions. The authors examine how employees' construals of AI identity (assistant, partner, or leader) relate to occupational identity crafting, and test augmentation cognition as a moderator. Results indicate that augmentation cognition strengthens the positive effect of each AI identity construal on occupational identity crafting.","relevance":"Moves the AI-and-identity conversation past threat and aversion toward proactive adaptation, connecting the identity cluster to the job-crafting and human-AI collaboration clusters already in the digest. Provides a construct and dimensional structure other researchers can measure.","contribution":"Proposes and operationalizes occupational identity crafting as an AI-specific form of identity work, and shows that how workers cast AI's role (not just how much AI they use) shapes their identity response.","uses":"Recommended recent reading for a generative-AI week; a construct to critique or replicate in an I-O sample; candidate for a measurement-development project. Published in an information-systems rather than I-O journal, so treat as adjacent literature. Author order needs verification — sources disagree on first author; DOI not confirmed, stable publisher URL used instead.","cluster":"Work identity, occupational identity \u0026 identity threat — the social-identity foundation, the identity-threat framework, the meta-analytic anchor for organizational identification, the identity-work review, the classic study of occupational identity under technological change, and 2025-2026 work extending identity threat to temporary workers and human-AI workplaces (new cluster; identity had only scattered coverage in this digest despite being the parent literature for the careers, gig-work, and human-AI collaboration clusters already tracked)","themes":["AI \u0026 Future of Work"]},{"date":"2026-09-03","topic":"Counterproductive Work Behavior \u0026 Deviance","authors":"Bennett, R. J.; Robinson, S. L.","year":"2000","title":"Development of a measure of workplace deviance","journal":"Journal of Applied Psychology","cite":"85(3), 349-360","doi":"https://doi.org/10.1037/0021-9010.85.3.349","summary":"The scale-development paper that operationalized workplace deviance for the field. Across a multi-study program the authors built and validated two scales: a 12-item organizational deviance scale (behaviors harming the organization, e.g., theft, withdrawal, sabotage) and a 7-item interpersonal deviance scale (behaviors harming coworkers, e.g., ridicule, gossip). Internal consistencies were .81 and .78 respectively, and confirmatory factor analysis supported the two-factor structure over a single-factor alternative. The instrument became the default measure in the deviance literature.","relevance":"This is the measurement anchor beneath nearly every quantitative CWB study in I-O and OB, and it defines the interpersonal/organizational target distinction that structures the whole nomological network.","contribution":"Established a parsimonious, empirically derived two-target taxonomy of deviance and a companion instrument, converting a loose set of 'bad behavior' constructs into a measurable domain.","uses":"Core measurement reading for a CWB or dark-side-of-OB seminar; a worked example for teaching scale development; the baseline instrument for anyone designing new CWB studies.","cluster":"Counterproductive work behavior \u0026 workplace deviance - the foundational measure, the meta-analytic anchors, the originators' own revisionist critique, and 2026 work on daily justice dynamics, personality profiles of misconduct, and AI-induced moral relativism (new cluster; CWB/deviance had zero prior coverage in this digest despite being the parent literature for the incivility, abusive supervision, and organizational justice clusters already tracked)","themes":["Other"]},{"date":"2026-09-03","topic":"Counterproductive Work Behavior \u0026 Deviance","authors":"Berry, C. M.; Ones, D. S.; Sackett, P. R.","year":"2007","title":"Interpersonal deviance, organizational deviance, and their common correlates: A review and meta-analysis","journal":"Journal of Applied Psychology","cite":"92(2), 410-424","doi":"https://doi.org/10.1037/0021-9010.92.2.410","summary":"A review and meta-analysis testing whether interpersonal deviance (ID) and organizational deviance (OD) are genuinely separable constructs, given prior evidence that they are very highly correlated. ID and OD correlated at rho = .62 but showed differential relations with Big Five traits and organizational citizenship behavior, supporting separability. Both forms related most strongly (and negatively) to OCB, Agreeableness, Conscientiousness, and Emotional Stability; justice correlations were small to moderate and demographic correlations negligible. Whether the Bennett and Robinson (2000) instrument was used moderated some relationships.","relevance":"The canonical meta-analytic anchor for the personality and attitudinal correlates of deviance, and a key source for selection researchers weighing integrity and Big Five predictors of counterproductive behavior.","contribution":"Provided the first rigorous meta-analytic defense of the ID/OD distinction and documented that measurement choice itself moderates observed effects - an early signal of the construct problems later papers press on.","uses":"Required reading for a CWB seminar week; effect-size source for lit reviews, power analyses, and grant proposals; pairs directly with Bennett and Robinson (2000).","cluster":"Counterproductive work behavior \u0026 workplace deviance - the foundational measure, the meta-analytic anchors, the originators' own revisionist critique, and 2026 work on daily justice dynamics, personality profiles of misconduct, and AI-induced moral relativism (new cluster; CWB/deviance had zero prior coverage in this digest despite being the parent literature for the incivility, abusive supervision, and organizational justice clusters already tracked)","themes":["Other"]},{"date":"2026-09-03","topic":"Counterproductive Work Behavior \u0026 Deviance","authors":"Mackey, J. D.; McAllister, C. P.; Ellen, B. P.; Carson, J. E.","year":"2021","title":"A meta-analysis of interpersonal and organizational workplace deviance research","journal":"Journal of Management","cite":"47(3), 597-622","doi":"https://doi.org/10.1177/0149206319862612","summary":"A large-scale random-effects meta-analysis of the workplace deviance literature drawing on 235 samples (N = 66,990), with separate analyses for interpersonal (k = 156, N = 42,239) and organizational (k = 206, N = 60,008) deviance. Using an exploratory meta-analytic approach and horizontal contrasting for theory elaboration, the authors estimate the ID-OD relationship at rho = .67 and map the magnitude and generalizability of relationships across the nomological network. They document meaningful heterogeneity in both measurement and effect magnitude across contexts.","relevance":"The most current comprehensive quantitative synthesis of the deviance nomological network, and the natural update to Berry et al. (2007) for anyone citing meta-analytic CWB estimates today.","contribution":"Applies contemporary random-effects and theory-elaboration methods to a fragmented literature, and makes the measurement-heterogeneity problem in deviance research explicit rather than incidental.","uses":"Primary effect-size source for lit reviews and grant writing; methods teaching example of exploratory meta-analysis; sets up the construct-validity debate with the Robinson and Bennett (2024) critique.","cluster":"Counterproductive work behavior \u0026 workplace deviance - the foundational measure, the meta-analytic anchors, the originators' own revisionist critique, and 2026 work on daily justice dynamics, personality profiles of misconduct, and AI-induced moral relativism (new cluster; CWB/deviance had zero prior coverage in this digest despite being the parent literature for the incivility, abusive supervision, and organizational justice clusters already tracked)","themes":["Other"]},{"date":"2026-09-03","topic":"Counterproductive Work Behavior \u0026 Deviance","authors":"Robinson, S. L.; Bennett, R. J.","year":"2024","title":"Revisionist history of workplace deviance","journal":"Journal of Management Inquiry","cite":"33(4), 336-339","doi":"https://doi.org/10.1177/10564926241261927","summary":"A short reflective essay in which the originators of the workplace deviance construct revisit their own mid-1990s program and name what they would do differently. They question whether 'deviance' was the right label, argue they should have derived their typology theoretically rather than empirically from multidimensional scaling data, and conclude that building a formative rather than reflective scale has hindered subsequent progress. On the latter two points they judge their own choices to have constrained the field. Published in JMI's special collection on revisionist history in management research.","relevance":"A rare first-person construct-validity critique from the scholars who created the construct, directly relevant to how I-O researchers should interpret and use the dominant deviance measure today.","contribution":"Reframes a canonical measurement decision as a live theoretical problem, and models a form of scholarly self-correction that is uncommon in management research.","uses":"Ideal debate/critique reading paired with Bennett and Robinson (2000); excellent prompt for seminar discussion of formative vs. reflective measurement and construct proliferation.","cluster":"Counterproductive work behavior \u0026 workplace deviance - the foundational measure, the meta-analytic anchors, the originators' own revisionist critique, and 2026 work on daily justice dynamics, personality profiles of misconduct, and AI-induced moral relativism (new cluster; CWB/deviance had zero prior coverage in this digest despite being the parent literature for the incivility, abusive supervision, and organizational justice clusters already tracked)","themes":["Other"]},{"date":"2026-09-03","topic":"Counterproductive Work Behavior \u0026 Deviance","authors":"Cole, M. S.; Dimotakis, N.; Bernerth, J. B.","year":"2026","title":"Expected and experienced daily justice, emotions, and counterproductive work behavior","journal":"Journal of Applied Psychology","cite":"111(5), 565-585","doi":"https://doi.org/10.1037/apl0001336","summary":"A two-study investigation arguing that the justice literature has assumed a linear response to experienced treatment while ignoring what employees expected that day. The authors cast expected-experienced interpersonal justice (in)congruence as a previously unexamined phenomenon and test how the fit or mismatch between the two shapes daily emotions and counterproductive work behavior. Findings indicate counterproductive outcomes that current linear justice models would not predict. First published online December 8, 2025; issue publication May 2026.","relevance":"Connects two literatures the digest already tracks separately - organizational justice and CWB - at the within-person daily level, which is where most contemporary occupational health and OB research operates.","contribution":"Introduces expectation-experience congruence as a theoretical mechanism in justice research, and applies polynomial/congruence logic to a daily-diary design rather than a between-person one.","uses":"Recent required reading for a justice or CWB week; methods exemplar for experience-sampling plus congruence modeling; a ready hypothesis source for new within-person studies.","cluster":"Counterproductive work behavior \u0026 workplace deviance - the foundational measure, the meta-analytic anchors, the originators' own revisionist critique, and 2026 work on daily justice dynamics, personality profiles of misconduct, and AI-induced moral relativism (new cluster; CWB/deviance had zero prior coverage in this digest despite being the parent literature for the incivility, abusive supervision, and organizational justice clusters already tracked)","themes":["Other"]},{"date":"2026-09-03","topic":"Counterproductive Work Behavior \u0026 Deviance","authors":"Wilmot, M. P.; Ones, D. S.; Wiernik, B. M.","year":"2026","title":"Clusters of general counterproductive behavior and associated personality profiles","journal":"Journal of Applied Psychology","cite":"111(8), 955-986","doi":"https://doi.org/10.1037/apl0001344","summary":"A quantitative review and synthesis of existing meta-analyses linking Big Five traits to indicators of general counterproductive behavior across work and nonwork settings. The authors located 46 articles reporting associations with 62 variables, representing over 1,200 primary studies and more than 850,000 participants. Drawing on cybernetic theories of personality, they argue that 'personality malfunction' - an imbalance between homeostasis-maintaining and change-facilitating processes - underlies counterproductive behavior. Four profiles emerge: impulsive disinhibition, avoidant disinhibition, institutional antagonism, and interpersonal antagonism.","relevance":"Shifts the dispositional prediction of misconduct from single-trait screening to trait-combination profiles, with direct implications for selection, integrity testing, and risk management in I-O practice.","contribution":"A second-order (meta-analysis of meta-analyses) synthesis anchored in cybernetic personality theory, producing a person-centered typology rather than another variable-centered correlate table.","uses":"Strong recent reading for personality-at-work or selection weeks; a template for teaching second-order meta-analysis; practitioner-facing implications for profile-based screening.","cluster":"Counterproductive work behavior \u0026 workplace deviance - the foundational measure, the meta-analytic anchors, the originators' own revisionist critique, and 2026 work on daily justice dynamics, personality profiles of misconduct, and AI-induced moral relativism (new cluster; CWB/deviance had zero prior coverage in this digest despite being the parent literature for the incivility, abusive supervision, and organizational justice clusters already tracked)","themes":["Other"]},{"date":"2026-09-03","topic":"Counterproductive Work Behavior \u0026 Deviance","authors":"Zhao, P.; He, G.; Guan, J.","year":"2026","title":"The ethical costs of artificial intelligence: Investigating how and when workplace artificial intelligence usage promotes employee unethical outcomes","journal":"Journal of Business Ethics","cite":"203, 531-547","doi":"https://doi.org/10.1007/s10551-025-06060-3","summary":"This paper challenges the prevailing view that workplace AI usage is uniformly beneficial by theorizing its ethical costs. Drawing on theories of moral relativism, the authors propose that employees' AI usage activates a metaethical belief in moral relativism, which in turn increases their own workplace deviance and produces more lenient moral judgment of others' transgressions. The model specifies boundary conditions on when these effects are strongest. First published online June 30, 2025; issue publication 2026 (Volume 203).","relevance":"Bridges the AI-at-work and CWB literatures - the digest tracks both heavily but has not previously carried a study proposing AI use as an antecedent of deviance rather than a well-being or job-insecurity outcome.","contribution":"Introduces moral relativism as the mediating mechanism linking technology use to unethical behavior, opening an ethics pathway distinct from the workload, autonomy, and insecurity pathways already dominant.","uses":"Debate/critique reading for a generative-AI-at-work week; a counterpoint to productivity-focused GenAI studies; a hypothesis source for research on AI use and moral disengagement.","cluster":"Counterproductive work behavior \u0026 workplace deviance - the foundational measure, the meta-analytic anchors, the originators' own revisionist critique, and 2026 work on daily justice dynamics, personality profiles of misconduct, and AI-induced moral relativism (new cluster; CWB/deviance had zero prior coverage in this digest despite being the parent literature for the incivility, abusive supervision, and organizational justice clusters already tracked)","themes":["AI \u0026 Future of Work"]},{"date":"2026-09-02","topic":"Employment Relationships \u0026 I-Deals (Theory)","authors":"Rousseau, D. M.; Ho, V. T.; Greenberg, J.","year":"2006","title":"I-deals: Idiosyncratic terms in employment relationships","journal":"Academy of Management Review","cite":"31(4), 977–994","doi":"https://doi.org/10.5465/amr.2006.22527470","summary":"This theory article introduced idiosyncratic deals (i-deals) as a distinct construct: personalized, non-standard employment terms negotiated between an individual worker and employer that are intended to benefit both parties. The authors distinguish i-deals from favoritism and unauthorized preferential treatment by specifying conditions of authorization, mutual benefit, and heterogeneity of terms. They map the antecedents (worker market value, timing of negotiation ex ante vs. ex post) and develop propositions about coworker reactions, arguing that third-party responses hinge on perceived fairness, the visibility of the deal, and the coworker's own access to negotiation. The article sets out an agenda linking i-deals to social exchange, distributive/procedural justice, and the individualization of the employment relationship.","relevance":"This is the canonical theoretical statement behind the individualized employment arrangements now central to flexible, hybrid, and remote work debates in I-O and HRM.","contribution":"Defines and bounds the i-deals construct, separating legitimate personalized arrangements from favoritism, and specifies the third-party (coworker) mechanism that most later empirical i-deals work tests.","uses":"Required theory reading for a seminar session on employment relationships or flexible work; anchor citation for lit reviews on individualization of HR practice; source of testable propositions for student research designs.","cluster":"Psychological contracts, i-deals \u0026 the changing employment deal — the foundational theory and meta-analytic anchors on breach/violation, the dynamic-process reframing, and 2025-2026 work extending the employment deal to algorithms, gig platforms, and team-level i-deals differentiation (new cluster; the psychological contract had essentially zero prior coverage in this digest despite being the core theory behind the careers, gig-work, and algorithmic-management clusters already tracked)","themes":["Employment Relationships \u0026 Gig Work"]},{"date":"2026-09-02","topic":"Psychological Contract Breach (Foundational Empirical)","authors":"Robinson, S. L.; Morrison, E. W.","year":"2000","title":"The development of psychological contract breach and violation: A longitudinal study","journal":"Journal of Organizational Behavior","cite":"21(5), 525–546","doi":"https://doi.org/10.1002/1099-1379(200008)21:5\u003c525::AID-JOB40\u003e3.0.CO;2-T","summary":"Robinson and Morrison surveyed 147 managers just before they began a new job and again 18 months later to model why employees come to perceive that their psychological contract has been breached, and when that perception escalates into felt violation. Perceived breach at Time 2 was more likely when organizational performance and self-rated employee performance were low, when the employee had not gone through a formal socialization process, when there had been little pre-hire interaction with organizational agents, when the employee had a history of breach with prior employers, and when the employee had many employment alternatives at hire. The move from breach to violation was shaped by attributions and by perceived fairness of the process. The design separates the cognitive perception of unmet obligations from the affective reaction to it.","relevance":"Provides the empirical foundation for a construct that recurs across the careers, turnover, socialization, and gig-work literatures, and shows how onboarding and prior employment history shape later exchange perceptions.","contribution":"Establishes the breach-versus-violation distinction empirically and demonstrates that breach perceptions are predictable from pre-hire and socialization conditions rather than being purely reactive.","uses":"Required empirical reading paired with the Zhao et al. meta-analysis; a strong teaching example of longitudinal design with a pre-entry baseline; useful template for student studies of newcomer expectations.","cluster":"Psychological contracts, i-deals \u0026 the changing employment deal — the foundational theory and meta-analytic anchors on breach/violation, the dynamic-process reframing, and 2025-2026 work extending the employment deal to algorithms, gig platforms, and team-level i-deals differentiation (new cluster; the psychological contract had essentially zero prior coverage in this digest despite being the core theory behind the careers, gig-work, and algorithmic-management clusters already tracked)","themes":["Employment Relationships \u0026 Gig Work"]},{"date":"2026-09-02","topic":"Psychological Contract Breach (Meta-Analysis)","authors":"Zhao, H.; Wayne, S. J.; Glibkowski, B. C.; Bravo, J.","year":"2007","title":"The impact of psychological contract breach on work-related outcomes: A meta-analysis","journal":"Personnel Psychology","cite":"60(3), 647–680","doi":"https://doi.org/10.1111/j.1744-6570.2007.00087.x","summary":"This meta-analysis estimates the association between psychological contract breach and eight work-related outcomes, finding significant relationships with all outcomes except actual turnover. Drawing on affective events theory, the authors build and test a causal model in which breach operates on attitudes (job satisfaction, organizational commitment, turnover intentions) and individual effectiveness (OCB, in-role performance, actual turnover) largely through affect — specifically felt violation and mistrust. Two moderators were examined: the type of breach measure (global vs. composite) and the content of the contract breached (transactional vs. relational). Results support affect as the primary transmission mechanism rather than a direct cognitive path.","relevance":"Supplies the effect-size anchors researchers need when positioning new breach studies, and is directly relevant to well-being, turnover, and citizenship outcomes tracked elsewhere in this digest.","contribution":"Integrates affective events theory with psychological contract theory and shows meta-analytically that affect, not cognition alone, carries the breach-to-outcome relationship; also documents how measurement choice moderates observed effects.","uses":"Required meta-analytic reading; effect-size benchmark for grant applications and power analyses; teaching case for how construct measurement decisions shape meta-analytic conclusions.","cluster":"Psychological contracts, i-deals \u0026 the changing employment deal — the foundational theory and meta-analytic anchors on breach/violation, the dynamic-process reframing, and 2025-2026 work extending the employment deal to algorithms, gig platforms, and team-level i-deals differentiation (new cluster; the psychological contract had essentially zero prior coverage in this digest despite being the core theory behind the careers, gig-work, and algorithmic-management clusters already tracked)","themes":["Employment Relationships \u0026 Gig Work"]},{"date":"2026-09-02","topic":"Psychological Contract Dynamics (Theory)","authors":"Rousseau, D. M.; Hansen, S. D.; Tomprou, M.","year":"2018","title":"A dynamic phase model of psychological contract processes","journal":"Journal of Organizational Behavior","cite":"39(9), 1081–1098","doi":"https://doi.org/10.1002/job.2284","summary":"This article reframes the psychological contract as an ongoing, self-regulatory process rather than a static perception measured at one point in time. The authors specify phases — contract creation, maintenance, disruption, repair, and renegotiation or dissolution — and describe the goal-directed processes and thresholds that move a worker from one phase to the next. The model treats breach not as a terminal event but as a disruption that can be followed by repair, thriving, or a permanently degraded contract depending on the responses of both parties. It also identifies within-person variability as the appropriate level of analysis for many psychological contract questions.","relevance":"Supports the shift toward experience-sampling and longitudinal designs across I-O research, and gives a process vocabulary for studying how employment expectations change under continuous technological and organizational change.","contribution":"Recasts a historically cross-sectional construct as a dynamic, phase-based self-regulation process, generating within-person hypotheses that the earlier breach literature could not address.","uses":"Required theory reading for a session on process and time in organizational research; methods bridge to diary and ESM designs; useful framing for dissertation proposals on contract repair.","cluster":"Psychological contracts, i-deals \u0026 the changing employment deal — the foundational theory and meta-analytic anchors on breach/violation, the dynamic-process reframing, and 2025-2026 work extending the employment deal to algorithms, gig platforms, and team-level i-deals differentiation (new cluster; the psychological contract had essentially zero prior coverage in this digest despite being the core theory behind the careers, gig-work, and algorithmic-management clusters already tracked)","themes":["Employment Relationships \u0026 Gig Work"]},{"date":"2026-09-02","topic":"Algorithmic Management \u0026 the Employment Deal","authors":"Sherman, U.; Rousseau, D. M.; Carbery, R.; McDonnell, A.; Duggan, J.; Morley, M. J.","year":"2025","title":"Anthropomorphising the algorithm: A 'theory of mind' perspective on psychological contract creation in gig work arrangements","journal":"Human Resource Management Journal","cite":"Advance online publication","doi":"https://doi.org/10.1111/1748-8583.12599","summary":"This conceptual review asks whether app-based gig workers can form a psychological contract with a non-human party — the algorithm that mediates their relationship with a digital labor platform. Drawing on theory of mind research, the authors argue that workers' general tendency to anthropomorphize interactive entities leads them to attribute beliefs, motives, and intentions to the algorithm governing their assignments and pay. Once that attribution occurs, the exchange can expand beyond narrowly transactional terms to include socioemotional resources such as respect and loyalty, with corresponding expectations of reciprocity. The article revisits the assumptions of psychological contract theory that presuppose a human organizational agent and proposes revisions for algorithmically mediated work.","relevance":"Directly connects the psychological contract literature to algorithmic management and platform work, two clusters already tracked in this digest, and offers testable propositions for AI-mediated employment relationships.","contribution":"Extends psychological contract theory to non-human organizational agents by importing theory of mind as the mechanism, addressing a scope condition the original theory left implicit.","uses":"Strong debate/critique reading for a seminar on algorithmic management or the future of employment relationships; generative source of research questions on human-AI exchange; useful for grant framing on AI and worker expectations.","cluster":"Psychological contracts, i-deals \u0026 the changing employment deal — the foundational theory and meta-analytic anchors on breach/violation, the dynamic-process reframing, and 2025-2026 work extending the employment deal to algorithms, gig platforms, and team-level i-deals differentiation (new cluster; the psychological contract had essentially zero prior coverage in this digest despite being the core theory behind the careers, gig-work, and algorithmic-management clusters already tracked)","themes":["Algorithmic Management \u0026 Surveillance","Employment Relationships \u0026 Gig Work"]},{"date":"2026-09-02","topic":"I-Deals (Review \u0026 Meta-Analysis)","authors":"Wang, S.; Guo, Y.; Pan, Y.; Las Heras, M.; Gao, X.","year":"2026","title":"Rethinking idiosyncratic deals: An integrative review, meta-analysis and research agenda","journal":"Human Relations","cite":"Advance online publication","doi":"https://doi.org/10.1177/00187267261463042","summary":"This integrative review consolidates roughly two decades of i-deals research and pairs the narrative synthesis with a meta-analysis of antecedents and consequences of task, career, and flexibility i-deals. The authors critically evaluate how the construct has been operationalized across studies, note inconsistencies in measurement and in the treatment of i-deal type, and assess the evidence for the mutual-benefit assumption built into the original theory. They set out a research agenda covering multilevel effects, coworker and team-level consequences, and the changing meaning of flexibility i-deals in remote and hybrid work. Published ahead of print in July 2026.","relevance":"Gives an up-to-date quantitative summary of a literature central to flexible work arrangements, and identifies where evidence is thin enough to justify new empirical work.","contribution":"Provides current meta-analytic estimates for i-deals and, more importantly, an explicit critique of construct proliferation and measurement inconsistency in this literature.","uses":"Required review reading for a flexible-work or employment-relationships session; a ready-made source of dissertation gaps; benchmark estimates for study planning.","cluster":"Psychological contracts, i-deals \u0026 the changing employment deal — the foundational theory and meta-analytic anchors on breach/violation, the dynamic-process reframing, and 2025-2026 work extending the employment deal to algorithms, gig platforms, and team-level i-deals differentiation (new cluster; the psychological contract had essentially zero prior coverage in this digest despite being the core theory behind the careers, gig-work, and algorithmic-management clusters already tracked)","themes":["Employment Relationships \u0026 Gig Work"]},{"date":"2026-09-02","topic":"I-Deals \u0026 Team-Level Effects (Empirical)","authors":"Xu, H.; Wayne, S. J.; Michel, E. M.; Pan, J.","year":"2025","title":"I-deals for some employees may (not) be ideal for the team: Positive and negative relationships between i-deals differentiation and team effectiveness","journal":"Human Resource Management","cite":"Advance online publication","doi":"https://doi.org/10.1002/hrm.70022","summary":"Xu and colleagues shift the level of analysis from the individual i-deal recipient to the team, asking how within-team differentiation in i-deals affects team functioning and customer service. Using survey data from an American delicatessen chain and three Chinese organizations (two retailers and an HR consultancy), they find that flexibility i-deals differentiation heightens relationship conflict within teams, which in turn degrades customer service, while task i-deals differentiation has beneficial effects by producing a better fit between members' strengths and their assigned duties. Contrary to expectations, career i-deals differentiation showed no team-level effects. The authors argue that the negative flexibility effects should be strongest in settings where physical co-presence is essential to coordination.","relevance":"Addresses the coworker-reaction problem that Rousseau et al. (2006) theorized but that individual-level i-deals research has largely left untested, and speaks directly to how hybrid and flexible arrangements play out for teams.","contribution":"Moves i-deals research to the team level by theorizing differentiation as the operative construct, and shows that the sign of the effect depends on i-deal type rather than being uniformly positive or negative.","uses":"Recommended empirical reading paired with Rousseau et al. (2006) to close the theory-to-test loop; a good multilevel design example for a methods session; practically relevant for discussions of hybrid work policy.","cluster":"Psychological contracts, i-deals \u0026 the changing employment deal — the foundational theory and meta-analytic anchors on breach/violation, the dynamic-process reframing, and 2025-2026 work extending the employment deal to algorithms, gig platforms, and team-level i-deals differentiation (new cluster; the psychological contract had essentially zero prior coverage in this digest despite being the core theory behind the careers, gig-work, and algorithmic-management clusters already tracked)","themes":["Teams \u0026 Collaboration","Employment Relationships \u0026 Gig Work"]},{"date":"2026-09-01","topic":"Abusive Supervision - Foundational Empirical","authors":"Tepper, B. J.","year":"2000","title":"Consequences of abusive supervision","journal":"Academy of Management Journal","cite":"43(2), 178-190","doi":"https://doi.org/10.5465/1556375","summary":"This study introduced abusive supervision as a distinct construct - sustained nonphysical hostility from supervisors toward subordinates - and tested its consequences in a longitudinal survey of employed adults. Subordinates who perceived more abusive supervision were more likely to quit; among those who stayed, abuse predicted lower job and life satisfaction, lower affective and normative commitment, higher continuance commitment, greater work-family conflict, and higher psychological distress. Organizational justice perceptions mediated several of these relationships. The paper also introduced the 15-item abusive supervision measure that dominates the literature.","relevance":"The origin point for a large occupational health and OB literature on leader mistreatment, linking supervisor behavior directly to worker distress, withdrawal, and work-family spillover.","contribution":"Defined and operationalized abusive supervision as a construct separable from general leadership quality, and supplied the measure that made cumulative research possible.","uses":"Required foundational reading for a seminar week on leader mistreatment; the measure itself is a good teaching case in construct operationalization and its downstream consequences.","cluster":"Abusive supervision and destructive leadership - the foundational construct and consequences study, the review that defined the field, the psychometric meta-analytic anchor, the 2021 fundamental-rethink critique, the JD-R meta-analytic integration, and 2026 daily-diary work on both the target and the perpetrator side (new cluster; leader mistreatment had zero prior coverage in this digest despite being adjacent to the incivility and well-being clusters)","themes":["Other"]},{"date":"2026-09-01","topic":"Abusive Supervision - Foundational Review","authors":"Tepper, B. J.","year":"2007","title":"Abusive supervision in work organizations: Review, synthesis, and research agenda","journal":"Journal of Management","cite":"33(3), 261-289","doi":"https://doi.org/10.1177/0149206307300812","summary":"Tepper reviews the first wave of abusive supervision research and confronts a terminological problem: multiple overlapping labels (petty tyranny, supervisor undermining, bullying) were being used for closely related phenomena without a unifying framework. He synthesizes what was known about antecedents and consequences, proposes an integrative model organizing the evidence, and maps directions for future work. The review explicitly warns that construct proliferation threatens knowledge accumulation in the domain.","relevance":"Provides the conceptual scaffolding students need to distinguish abusive supervision from bullying, incivility, and other mistreatment constructs already covered in this digest.","contribution":"Organized a fragmented literature into a single antecedent-process-outcome model and set the field's research agenda for the following decade.","uses":"Strong lit-review anchor and a useful teaching example of how review articles discipline construct proliferation.","cluster":"Abusive supervision and destructive leadership - the foundational construct and consequences study, the review that defined the field, the psychometric meta-analytic anchor, the 2021 fundamental-rethink critique, the JD-R meta-analytic integration, and 2026 daily-diary work on both the target and the perpetrator side (new cluster; leader mistreatment had zero prior coverage in this digest despite being adjacent to the incivility and well-being clusters)","themes":["Other"]},{"date":"2026-09-01","topic":"Abusive Supervision - Meta-Analysis","authors":"Mackey, J. D.; Frieder, R. E.; Brees, J. R.; Martinko, M. J.","year":"2017","title":"Abusive supervision: A meta-analysis and empirical review","journal":"Journal of Management","cite":"43(6), 1940-1965","doi":"https://doi.org/10.1177/0149206315573997","summary":"This meta-analysis derives population estimates for relationships between perceived abusive supervision and demographic, justice, individual-difference, leadership, and outcome variables, using psychometric corrections for measurement error and sampling error variance. Sensitivity analyses removed large-sample effects, and US-only subgroup analyses added corrections for indirect range restriction. The authors also examine measurement artifacts arising from the many abbreviated adaptations of Tepper's original scale. Associations with outcomes are uniformly negative, but effect magnitudes vary substantially with study design features.","relevance":"The quantitative anchor for effect sizes in this literature, and directly relevant to occupational health psychology claims about how harmful leader hostility is.","contribution":"Shows that design features and scale adaptations - not just substantive moderators - drive heterogeneity in reported abusive supervision effects, a methodological caution with wide application.","uses":"Effect-size source for lit reviews and grant writing; excellent methods reading on psychometric correction and on how measure adaptation degrades comparability.","cluster":"Abusive supervision and destructive leadership - the foundational construct and consequences study, the review that defined the field, the psychometric meta-analytic anchor, the 2021 fundamental-rethink critique, the JD-R meta-analytic integration, and 2026 daily-diary work on both the target and the perpetrator side (new cluster; leader mistreatment had zero prior coverage in this digest despite being adjacent to the incivility and well-being clusters)","themes":["Other"]},{"date":"2026-09-01","topic":"Abusive Supervision - Critique / Fundamental Rethink","authors":"Fischer, T.; Tian, A. W.; Lee, A.; Hughes, D. J.","year":"2021","title":"Abusive supervision: A systematic review and fundamental rethink","journal":"The Leadership Quarterly","cite":"32(6), Article 101540","doi":"https://doi.org/10.1016/j.leaqua.2021.101540","summary":"This systematic review catalogues antecedents, outcomes, mediators, and moderators of abusive supervision and then argues the field faces four fundamental problems. First, the construct conflates followers' subjective evaluations with leaders' actual behaviors. Second, that confusion is embedded in and reinforced by the dominant measures. Third, the evidence base relies heavily on cross-sectional surveys and vignette experiments with limited causal warrant. Fourth, abusive supervision is a low-base-rate phenomenon, which distorts sampling and inference. The authors propose a reconceptualization and a different measurement approach.","relevance":"A model of rigorous internal critique in leadership and occupational health research, and essential context for anyone treating the Mackey et al. effect sizes as settled.","contribution":"Reframes abusive supervision as a perception-behavior conflation problem, challenging the validity of two decades of accumulated findings rather than merely extending them.","uses":"Ideal debate/critique seminar reading paired
