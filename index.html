fied, and Gamefully Designed Assessments for Employee Selection: Definitions, Distinctions, Design, and Validation","journal":"International Journal of Selection and Assessment","cite":"30(1), 1–13","doi":"https://doi.org/10.1111/ijsa.12376","summary":"Conceptual piece distinguishing game-based, gamified, and gamefully designed assessments — terms often conflated in research and practice. Lays out how each category differs in design process, measurement logic, and validation demands, and sets a research agenda for the special issue it introduces. Argues that clear construct definitions are prerequisite to cumulative science in this space.","relevance":"Supplies the shared vocabulary needed to organize a fragmented literature; essential framing before reading empirical GBA studies.","contribution":"Taxonomy that disambiguates three distinct assessment technologies and links each to appropriate validation strategy.","uses":"Ideal first reading in a GBA unit; definitional anchor for lit reviews and dissertations on gamified selection.","cluster":"Game-based \u0026 gamified assessment in personnel selection","themes":["Assessment \u0026 Selection"]},{"date":"2026-08-14","topic":"Gamified Assessment — Development \u0026 Applicant Reactions","authors":"Georgiou, K.; Gouras, A.; Nikolaou, I.","year":"2019","title":"Gamification in Employee Selection: The Development of a Gamified Assessment","journal":"International Journal of Selection and Assessment","cite":"27(2), 91–103","doi":"https://doi.org/10.1111/ijsa.12240","summary":"Describes the development of a gamified situational-judgment-style assessment for selection, applying game elements (storyline, feedback, avatars, visuals) to measure soft skills. Reports preliminary evidence of construct and criterion-related validity plus favorable applicant reactions, including organizational attractiveness and recommendation intentions.","relevance":"One of the most cited early demonstrations that gamified assessment can be both attractive and psychometrically defensible; European counterpoint to the US-based Landers program.","contribution":"Documents an end-to-end gamified assessment development process, from game-element selection through validation.","uses":"Case study for assessment-development courses; comparison point for newer GBA validity evidence.","cluster":"Game-based \u0026 gamified assessment in personnel selection","themes":["Assessment \u0026 Selection"]},{"date":"2026-08-14","topic":"Game-Related Assessment \u0026 Cognitive Ability — Meta-Analysis","authors":"Bipp, T.; Wee, S.; Walczok, M.; Hansal, L.","year":"2024","title":"The Relationship Between Game-Related Assessment and Traditional Measures of Cognitive Ability—A Meta-Analysis","journal":"Journal of Intelligence","cite":"12(12), 129","doi":"https://doi.org/10.3390/jintelligence12120129","summary":"Meta-analyzes 52 samples from 44 papers (N \u003e 6,100 adults) on the correlation between game-related assessment indicators and traditional cognitive ability measures. Finds an overall observed r = .30 (corrected r = .45) with substantial heterogeneity; relationships were stronger when ability was measured with multiple indicators, and measurement medium (computer vs. paper-pencil) made no difference.","relevance":"The quantitative answer to whether GBAs actually measure cognitive ability — convergence is moderate, not equivalent, which tempers vendor claims.","contribution":"First comprehensive meta-analytic estimate of GBA–cognitive ability convergence, with moderator tests of measurement scope and medium.","uses":"Key evidence for debates on construct validity of game-based tools; benchmark effect sizes for power analyses in future GBA studies.","cluster":"Game-based \u0026 gamified assessment in personnel selection","themes":["Assessment \u0026 Selection"]},{"date":"2026-08-14","topic":"GBA Validity \u0026 Fairness — Recent Empirical","authors":"Ohlms, M. L.; Melchers, K. G.","year":"2025","title":"Is Test Takers' Video Game Usage a Game Changer? Criterion-Related Validity and Potential Bias of a Cognitive Game-Based Assessment","journal":"Applied Psychology: An International Review","cite":"Advance online publication","doi":"https://doi.org/10.1111/apps.70038","summary":"Examines criterion-related validity of a cognitive GBA and tests for differential validity and test bias as a function of test takers' video game usage, using a working sample (N = 156) and a potential applicant sample (N = 92). Addresses the persistent fairness concern that gamers hold an advantage on game-formatted tests.","relevance":"Directly tests the most common fairness objection to GBAs — whether gaming experience biases scores — with criterion data, which remains scarce in this literature.","contribution":"Extends GBA research from construct validity to criterion-related validity and formal bias analysis by gaming experience.","uses":"Debate reading on GBA fairness; methods example of differential validity/bias testing for technology-based predictors.","cluster":"Game-based \u0026 gamified assessment in personnel selection","themes":["Assessment \u0026 Selection","Diversity, Equity \u0026 Inclusion"]},{"date":"2026-08-14","topic":"GBA Applicant Perceptions — Recent Empirical","authors":"Ohlms, M. L.; Melchers, K. G.; Lievens, F.","year":"2026","title":"Perceptions of Game-Based Assessments: The Role of Test Takers' Occupational Background","journal":"International Journal of Selection and Assessment","cite":"34, e70040","doi":"https://doi.org/10.1111/ijsa.70040","summary":"Surveys 179 individuals from technical versus social occupational backgrounds on perceptions of GBAs relative to non-gamified tests. GBAs were rated more positively overall on organizational attractiveness, behavioral intentions, enjoyment, and modernity; those from technical backgrounds rated attractiveness and behavioral intentions more positively than those from social-skill occupations, but fairness perceptions (procedural fairness, job relatedness, opportunity to perform) did not differ by background.","relevance":"Moves applicant-reactions research beyond student samples to occupational subgroups, informing whether GBAs advantage some applicant pools in perception terms.","contribution":"Identifies occupational background as a boundary condition for GBA attraction effects while showing fairness perceptions are robust across groups.","uses":"Recent empirical reading for selection courses; relevant to recruitment strategy and applicant-pool diversity discussions.","cluster":"Game-based \u0026 gamified assessment in personnel selection","themes":["Assessment \u0026 Selection"]},{"date":"2026-08-14","topic":"GBA Applicant Reactions — High-Stakes Field Data (Recent)","authors":"Naryniecki, T. J.","year":"2026","title":"Who Most Enjoys Game-Based Assessment? Predicting Applicant Reactions by Performance, Gaming Experience and Demographic Factors","journal":"International Journal of Selection and Assessment","cite":"34(1)","doi":"https://doi.org/10.1111/ijsa.70047","summary":"Uses real high-stakes recruitment samples (N = 376 and N = 284) across two distinct GBAs to predict applicant affect and recommendation intentions from performance, demographics, gaming experience, and in-game behaviors. Performance and gaming experience consistently predicted reactions; age and gender effects disappeared once these were modeled. Moderate gamers reacted most positively.","relevance":"Rare field evidence from actual applicants (not simulations) on who responds well to GBAs — directly relevant to adverse-reaction and self-selection concerns.","contribution":"Shows demographic differences in GBA reactions are largely explained by performance and gaming experience rather than age/gender per se.","uses":"Pairs well with Ohlms et al. (2026) for a reactions unit; useful for practitioner discussions on candidate experience analytics.","cluster":"Game-based \u0026 gamified assessment in personnel selection","themes":["Assessment \u0026 Selection"]},{"date":"2026-08-13","topic":"Career Shocks — Foundational Theory","authors":"Akkermans, J.; Seibert, S. E.; Mol, S. T.","year":"2018","title":"Tales of the unexpected: Integrating career shocks in the contemporary careers literature","journal":"SA Journal of Industrial Psychology","cite":"44, a1503","doi":"https://doi.org/10.4102/sajip.v44i0.1503","summary":"Conceptual article that formally defines career shocks—disruptive, extraordinary events triggered by factors outside the individual's control that prompt deliberate career reflection. The authors critique the agency-heavy focus of contemporary career theories (protean, boundaryless, sustainable careers) and integrate chance events and shocks into these frameworks. They propose a research agenda around shock attributes (valence, predictability, controllability, frequency, duration) and their interplay with individual differences.","relevance":"The anchor citation for career shocks research in vocational psychology; nearly all subsequent work builds on this definition.","contribution":"Provides the field's working definition and attribute taxonomy of career shocks, restoring context and chance to career theory dominated by individual agency.","uses":"Required first reading for any career shocks seminar week; framework for lit reviews and hypothesis development on career transitions.","cluster":"Career shocks \u0026 chance events in career development — foundational framework, key empirical tests, and new 2025–2026 work on non-standard workers","themes":["Careers \u0026 Vocational Behavior"]},{"date":"2026-08-13","topic":"Career Shocks — Foundational Empirical","authors":"Seibert, S. E.; Kraimer, M. L.; Holtom, B. C.; Pierotti, A. J.","year":"2013","title":"Even the best laid plans sometimes go askew: Career self-management processes, career shocks, and the decision to pursue graduate education","journal":"Journal of Applied Psychology","cite":"98(1), 169–182","doi":"https://doi.org/10.1037/a0030882","summary":"Empirical study of 337 university alumni examining how career self-management processes and career shocks jointly predict decisions to pursue graduate education. Early-career individuals with intrinsic career goals, career planning, lower career satisfaction, or impactful positive shocks were more likely to intend to attend graduate school. Notably, some shocks (e.g., a mentor leaving) increased applications while others (a sooner-than-expected promotion, negative organizational change) decreased them, showing shocks operate alongside—and sometimes against—planned self-management.","relevance":"The empirical study that introduced career shocks to the I-O literature; demonstrates that major career decisions are not fully explained by agentic planning models.","contribution":"First rigorous test showing career shocks add predictive validity beyond career self-management variables, using image theory and careership logic.","uses":"Classic reading for graduate seminars on careers; exemplar for designing studies that combine planned and unplanned predictors of career decisions.","cluster":"Career shocks \u0026 chance events in career development — foundational framework, key empirical tests, and new 2025–2026 work on non-standard workers","themes":["Careers \u0026 Vocational Behavior"]},{"date":"2026-08-13","topic":"Career Shocks \u0026 Employability","authors":"Blokker, R.; Akkermans, J.; Tims, M.; Jansen, P.; Khapova, S.","year":"2019","title":"Building a sustainable start: The role of career competencies, career success, and career shocks in young professionals' employability","journal":"Journal of Vocational Behavior","cite":"112, 172–184","doi":"https://doi.org/10.1016/j.jvb.2019.02.013","summary":"Survey study of young professionals testing how career competencies relate to perceived employability, with career success as a mediator and career shocks as moderators. Career competencies were positively related to employability, partly via career success. Positive career shocks strengthened, and negative career shocks weakened, the indirect relationship between career resources and employability, supporting a resource-based view of early-career sustainability.","relevance":"Bridges career shocks with employability and sustainable careers research—two core vocational behavior literatures—in an early-career sample.","contribution":"Shows shocks function as boundary conditions on agentic career resources, empirically integrating the shock construct into a career resources framework.","uses":"Useful for lit reviews on employability and early careers; good methods discussion piece on measuring shock valence and impact.","cluster":"Career shocks \u0026 chance events in career development — foundational framework, key empirical tests, and new 2025–2026 work on non-standard workers","themes":["Careers \u0026 Vocational Behavior","Job Design, Crafting \u0026 Motivation"]},{"date":"2026-08-13","topic":"Career Shocks \u0026 COVID-19 (Commentary)","authors":"Akkermans, J.; Richardson, J.; Kraimer, M. L.","year":"2020","title":"The Covid-19 crisis as a career shock: Implications for careers and vocational behavior","journal":"Journal of Vocational Behavior","cite":"119, 103434","doi":"https://doi.org/10.1016/j.jvb.2020.103434","summary":"Widely cited commentary analyzing the COVID-19 pandemic through the career shocks lens. The authors argue the pandemic operates as a career shock whose consequences vary across individuals and time: the same event can be negative short-term yet positive long-term, and its impact depends on shock attributes, individual differences, and context. They articulate implications for careers research, including interactions between shock characteristics and psychological resources.","relevance":"Demonstrates the explanatory power of the career shocks framework applied to a macro-level disruption affecting virtually all workers; highly relevant to future-of-work disruptions such as AI.","contribution":"Extends shock theory to collective, society-wide shocks and formalizes the dynamic, temporally contingent nature of shock consequences.","uses":"Excellent seminar discussion piece pairing macro disruption with micro career theory; template for theorizing AI-driven disruptions as career shocks.","cluster":"Career shocks \u0026 chance events in career development — foundational framework, key empirical tests, and new 2025–2026 work on non-standard workers","themes":["Careers \u0026 Vocational Behavior"]},{"date":"2026-08-13","topic":"Career Shocks — Review \u0026 Research Agenda","authors":"Akkermans, J.; Rodrigues, R.; Mol, S. T.; Seibert, S. E.; Khapova, S. N.","year":"2021","title":"The role of career shocks in contemporary career development: Key challenges and ways forward","journal":"Career Development International","cite":"26(4), 453–466","doi":"https://doi.org/10.1108/CDI-07-2021-0172","summary":"State-of-the-art review introducing the Career Development International special issue on career shocks. Synthesizes lessons across seven articles around four challenges: conceptual clarity of the shock construct, career outcomes of shocks, mediating mechanisms, and interdisciplinary connections (job search, HRM, entrepreneurship, diversity). Sets a structured agenda for the next wave of shocks research.","relevance":"The most current comprehensive agenda-setting review of the career shocks literature; orients readers to open questions and measurement debates.","contribution":"Consolidates a fragmented emerging literature and specifies mechanisms (resources, identity) through which shocks affect outcomes.","uses":"Ideal orienting review for a seminar week; source of thesis and dissertation topic ideas on career transitions and disruption.","cluster":"Career shocks \u0026 chance events in career development — foundational framework, key empirical tests, and new 2025–2026 work on non-standard workers","themes":["Careers \u0026 Vocational Behavior"]},{"date":"2026-08-13","topic":"Career Shocks \u0026 Non-Standard Work (Recent)","authors":"Drencheva, A.; Au, W. C.","year":"2025","title":"Navigating crisis in non-standard work: Social entrepreneurs' sensemaking and purpose protection during career shocks","journal":"Journal of Vocational Behavior","cite":"162, 104178","doi":"https://doi.org/10.1016/j.jvb.2025.104178","summary":"Qualitative study based on in-depth interviews with 39 Bangladeshi social entrepreneurs experiencing a crisis-driven career shock. Inductive analysis reveals three sensemaking patterns—mission-neglected preservation, mission-protective collaboration, and mission-validating continuity—shaped by identity structure and the valence of the disruption. Shows how workers without organizational safety nets protect purpose and identity when shocks hit.","relevance":"Recent JVB work extending career shocks to non-standard workers (entrepreneurs) and to a Global South context, addressing two acknowledged gaps in the literature.","contribution":"Introduces sensemaking and purpose protection as mechanisms linking shocks to career continuity, moving beyond variable-centered survey designs.","uses":"Strong qualitative-methods exemplar for seminars; useful for research on gig/entrepreneurial careers and crisis navigation.","cluster":"Career shocks \u0026 chance events in career development — foundational framework, key empirical tests, and new 2025–2026 work on non-standard workers","themes":["Careers \u0026 Vocational Behavior","Employment Relationships \u0026 Gig Work"]},{"date":"2026-08-13","topic":"Career Shocks \u0026 Career Sustainability (Recent)","authors":"Guo, Y.; Jiang, Q.; Bian, W.","year":"2026","title":"Career shocks and career sustainability: The role of career crafting and perceived organizational support","journal":"International Journal of Contemporary Hospitality Management","cite":"38(3), 1131–1149","doi":"https://doi.org/10.1108/IJCHM-08-2025-1228","summary":"Two-wave survey of 493 hotel employees in China drawing on conservation of resources theory. Career shocks exert divergent (valence-dependent) effects on career sustainability, mediated by career crafting; perceived organizational support moderates these effects, buffering negative shocks and amplifying positive ones. Conceptualizes career sustainability as a resource-adjustment process in response to shocks.","relevance":"Very recent empirical test connecting shocks, proactive career behavior, and organizational support—showing how organizations can shape workers' recovery from disruption.","contribution":"Integrates COR theory with the shocks literature and positions career crafting as the behavioral mechanism translating shocks into sustainability outcomes.","uses":"Useful for lit reviews linking shocks to sustainable careers; practical implications section supports teaching on organizational career support.","cluster":"Career shocks \u0026 chance events in career development — foundational framework, key empirical tests, and new 2025–2026 work on non-standard workers","themes":["Careers \u0026 Vocational Behavior","Job Design, Crafting \u0026 Motivation"]},{"date":"2026-08-12","topic":"Structured Interviews — Foundational Review","authors":"Levashina, J.; Hartwell, C. J.; Morgeson, F. P.; Campion, M. A.","year":"2014","title":"The structured employment interview: Narrative and quantitative review of the research literature","journal":"Personnel Psychology","cite":"67(1), 241-293","doi":"https://doi.org/10.1111/peps.12052","summary":"Comprehensive narrative and quantitative review of structured interview research organized around 8 questions (e.g., what structure is, its validity, applicant/interviewer reactions, impression management, coaching). Synthesizes decades of evidence showing structure improves reliability and criterion-related validity and reduces subgroup differences. Identifies open questions that still frame the field.","relevance":"The baseline against which all digital and AI-mediated interview formats are evaluated; essential grounding for any research on AVIs or automated scoring.","contribution":"The definitive review of interview structure; the conceptual anchor for modern interview research.","uses":"Required foundational reading for selection seminars; framing citation for AVI/AI interview studies; comprehensive reference for lit reviews.","cluster":"Employment interviews in the digital age: asynchronous video interviews (AVIs) and AI-based interview scoring","themes":["Assessment \u0026 Selection"]},{"date":"2026-08-12","topic":"AVIs — Conceptual Model \u0026 Research Agenda","authors":"Lukacik, E.-R.; Bourdage, J. S.; Roulin, N.","year":"2022","title":"Into the void: A conceptual model and research agenda for the design and use of asynchronous video interviews","journal":"Human Resource Management Review","cite":"32(1), 100789","doi":"https://doi.org/10.1016/j.hrmr.2020.100789","summary":"Conceptual paper mapping how AVI design features (e.g., preparation time, response time limits, re-recording attempts, question presentation) affect applicant behavior, reactions, and evaluation outcomes. Builds a model distinguishing AVIs from synchronous interviews and lays out a structured research agenda. Has become the organizing framework for the rapidly growing AVI literature.","relevance":"The central theoretical framework for AVI research; nearly all subsequent empirical AVI work (including several articles in this digest) tests propositions from this model.","contribution":"First integrative conceptual model of AVIs; converts scattered practitioner-driven design choices into testable theory.","uses":"Theory framing for AVI studies; graduate teaching on technology-mediated selection; source of dissertation-ready research questions.","cluster":"Employment interviews in the digital age: asynchronous video interviews (AVIs) and AI-based interview scoring","themes":["Assessment \u0026 Selection"]},{"date":"2026-08-12","topic":"Automated Video Interviews — AI Scoring Validity","authors":"Hickman, L.; Bosch, N.; Ng, V.; Saef, R.; Tay, L.; Woo, S. E.","year":"2022","title":"Automated video interview personality assessments: Reliability, validity, and generalizability investigations","journal":"Journal of Applied Psychology","cite":"107(8), 1323-1351","doi":"https://doi.org/10.1037/apl0000695","summary":"Develops and evaluates machine-learning models that score personality from automated video interviews using verbal, paraverbal, and nonverbal cues. Across multiple samples, models trained to reproduce interviewer ratings showed markedly better reliability, convergent/discriminant validity, and generalizability than models trained on self-reports. Provides a rigorous psychometric template for evaluating AI-based assessments.","relevance":"The flagship JAP demonstration of how classic psychometric standards apply to AI interview scoring; directly relevant to AI-based assessment and selection research.","contribution":"Shows that the choice of ground truth (interviewer- vs. self-report) fundamentally shapes AI assessment validity - a key design principle for algorithmic selection tools.","uses":"Methods exemplar for AI assessment research; core reading for seminars on AI in selection; benchmark citation in grant proposals on algorithmic hiring.","cluster":"Employment interviews in the digital age: asynchronous video interviews (AVIs) and AI-based interview scoring","themes":["AI \u0026 Future of Work","Assessment \u0026 Selection"]},{"date":"2026-08-12","topic":"AVIs — Applicant Reactions, Age \u0026 Gender","authors":"Tilston, O.; Krings, F.; Roulin, N.; Bourdage, J. S.; Fetzer, M.","year":"2024","title":"Reactions to asynchronous video interviews: The role of design decisions and applicant age and gender","journal":"Human Resource Management","cite":"63(2), 313-332","doi":"https://doi.org/10.1002/hrm.22202","summary":"Empirically tests how AVI design decisions (e.g., preparation time, re-recording options) shape applicant reactions, and whether reactions differ by applicant age and gender. Finds design choices meaningfully affect fairness perceptions and anxiety, with implications for older applicants' experiences. Connects AVI design to diversity and applicant-experience concerns.","relevance":"Bridges technology-mediated selection with individual differences and fairness - relevant to both AI assessment and workforce aging/diversity research streams.","contribution":"One of the first field-relevant tests of the Lukacik et al. AVI design model, adding demographic moderators often ignored in AVI research.","uses":"Empirical example for seminars on applicant reactions; evidence base for practitioner guidance on AVI configuration; supports research on age bias in digital hiring.","cluster":"Employment interviews in the digital age: asynchronous video interviews (AVIs) and AI-based interview scoring","themes":["Assessment \u0026 Selection","Diversity, Equity \u0026 Inclusion"]},{"date":"2026-08-12","topic":"Automated AVIs — Explanations \u0026 Applicant Reactions (Recent)","authors":"Falls, B.; Willis, C.; Liff, J. [author initials: needs verification]","year":"2025","title":"The impact of explanations on applicant reactions to automated asynchronous video interviews","journal":"International Journal of Selection and Assessment","cite":"33, e70009 [issue/pages: needs verification]","doi":"https://doi.org/10.1111/ijsa.70009","summary":"Experimental study testing whether providing explanations about how automated AVIs work and how they are scored improves applicant reactions. Finds applicants react less favorably to automated AVIs than to synchronous interviews, but well-designed explanations can partially repair fairness perceptions. Speaks directly to transparency obligations emerging under AI hiring regulation.","relevance":"Directly actionable evidence on procedural justice in AI-mediated selection; connects applicant reactions theory to AI explainability and emerging legal transparency requirements.","contribution":"Extends organizational justice theory to automated interview contexts, showing explanation design is a practical lever for improving candidate experience.","uses":"Debate reading on AI transparency in hiring; useful for teaching applicant reactions; relevant to policy discussions of AI hiring laws.","cluster":"Employment interviews in the digital age: asynchronous video interviews (AVIs) and AI-based interview scoring","themes":["AI \u0026 Future of Work","Assessment \u0026 Selection"]},{"date":"2026-08-12","topic":"AVIs — Time Limits, Anxiety \u0026 Performance (Recent)","authors":"Orji, K.; Bangerter, A. [author list: needs verification]","year":"2025","title":"Tick tock, tick tock, time's up! How response time limits in asynchronous video interviews influence interview anxiety, impression management, and performance","journal":"International Journal of Selection and Assessment","cite":"33, e70031 [issue/pages: needs verification]","doi":"https://doi.org/10.1111/ijsa.70031","summary":"Experiment (N = 185 mock AVI participants) manipulating response time limits (1, 3, or 5 minutes) to test effects on interview anxiety, impression management, and rated performance. Shows that a seemingly minor design parameter shifts applicants' affective experience and behavior. Published October 2025 in IJSA's AVI research stream.","relevance":"Ties AVI design directly to occupational-health-relevant constructs (anxiety) and to assessment accuracy - a clean example of design-feature experimentation called for by the Lukacik et al. model.","contribution":"Isolates causal effects of a single AVI design feature, giving evidence-based guidance for configuring time limits in digital interviews.","uses":"Teaching example of tight experimental design in selection research; practitioner guidance on AVI settings; springboard for studies of other design features.","cluster":"Employment interviews in the digital age: asynchronous video interviews (AVIs) and AI-based interview scoring","themes":["Assessment \u0026 Selection"]},{"date":"2026-08-12","topic":"AI-Based Scores — Reliability (Methods, Recent)","authors":"Speer, A. B.; Oswald, F. L.; Putka, D. J.","year":"2026","title":"Reliability evidence for AI-based scores in organizational contexts: Applying lessons learned from psychometrics","journal":"Organizational Research Methods","cite":"29(3), 412-440","doi":"https://doi.org/10.1177/10944281251346404","summary":"Methods article (online June 2025; in the July 2026 issue) translating classical psychometric reliability concepts to AI-generated scores such as automated interview and text-based assessments. Clarifies what reliability means when scores come from algorithms, identifies unique error sources (e.g., model retraining, prompt variation), and offers concrete estimation strategies. Written by three leading selection/measurement methodologists.","relevance":"Provides the methodological vocabulary I-O researchers need to evaluate any AI-based assessment, including the automated interview scores covered elsewhere in this digest.","contribution":"Systematically maps psychometric reliability theory onto AI scoring pipelines - a methods contribution likely to become a standard citation in algorithmic assessment research.","uses":"Methods reading for measurement seminars; QC framework for applied AI assessment projects; citation for grant methods sections on AI scoring.","cluster":"Employment interviews in the digital age: asynchronous video interviews (AVIs) and AI-based interview scoring","themes":["AI \u0026 Future of Work","Big Data \u0026 Methods"]},{"date":"2026-08-11","topic":"Sustainable Careers — Foundational Theory","authors":"De Vos, A.; Van der Heijden, B. I. J. M.; Akkermans, J.","year":"2020","title":"Sustainable careers: Towards a conceptual model","journal":"Journal of Vocational Behavior","cite":"117, 103196","doi":"https://doi.org/10.1016/j.jvb.2018.06.011","summary":"This conceptual article develops the now-dominant model of sustainable careers, defined by three indicators — health, happiness, and productivity — unfolding over time across person, context, and time dimensions. The authors integrate careers, HRM, and occupational health perspectives and propose a dynamic person-career fit process in which individuals and organizations share agency for career sustainability. It sets out a research agenda that has since anchored a large empirical literature.","relevance":"The core theoretical anchor for studying careers under technological and labor-market disruption; directly relevant to vocational behavior, career development, and occupational health research.","contribution":"Provides the field's shared definition and three-indicator framework (health, happiness, productivity) for career sustainability, plus a systems view of person-context-time dynamics.","uses":"Essential required reading for any careers seminar week; framework paper for lit reviews and grant proposals on career sustainability; theoretical scaffold for empirical designs.","cluster":"Sustainable careers \u0026 employability — foundations, measurement, meta-analytic evidence \u0026 person-career fit (new cluster)","themes":["Careers \u0026 Vocational Behavior","Job Design, Crafting \u0026 Motivation"]},{"date":"2026-08-11","topic":"Employability — Foundational Theory","authors":"Fugate, M.; Kinicki, A. J.; Ashforth, B. E.","year":"2004","title":"Employability: A psycho-social construct, its dimensions, and applications","journal":"Journal of Vocational Behavior","cite":"65(1), 14–38","doi":"https://doi.org/10.1016/j.jvb.2003.10.005","summary":"This foundational conceptual article defines employability as a psycho-social construct comprising career identity, personal adaptability, and social and human capital. The authors argue employability is a form of proactive adaptability that enables workers to identify and realize career opportunities, particularly amid boundaryless careers and employment insecurity. It remains the most-cited conceptualization of individual employability in the organizational literature.","relevance":"Foundational for research on how workers stay employable amid automation and restructuring; the construct underpins much of the modern careers and job-loss literature.","contribution":"Established the tripartite psycho-social model of employability that most subsequent measurement and empirical work builds on or contests.","uses":"Required foundational reading; construct-definition source for lit reviews; useful contrast case for teaching construct evolution (vs. later competence- and perception-based models).","cluster":"Sustainable careers \u0026 employability — foundations, measurement, meta-analytic evidence \u0026 person-career fit (new cluster)","themes":["Careers \u0026 Vocational Behavior"]},{"date":"2026-08-11","topic":"Employability \u0026 Well-Being — Meta-Analysis","authors":"Harari, M. B.; McCombs, K.; Thams, Y.","year":"2023","title":"Perceived employability and employee strain: A meta-analysis","journal":"Journal of Occupational and Organizational Psychology","cite":"96(1), 109–118","doi":"https://doi.org/10.1111/joop.12412","summary":"Drawing on conservation of resources theory, this meta-analysis (k = 34) tests the association between perceived employability and employee strain. Perceived employability was negatively related to strain (rho = -.12), with stronger effects in studies conducted after the 2008 financial crisis and in high uncertainty-avoidance cultures. The moderator results suggest employability functions as a more valuable personal resource under economic and cultural uncertainty.","relevance":"Connects the employability literature to occupational health psychology, quantifying employability's role as a resource protecting worker well-being in insecure labor markets.","contribution":"First meta-analytic estimate of the employability-strain relationship, with theoretically derived temporal and cultural moderators supporting a resource-based account.","uses":"Evidence base for lit reviews and grants linking career resources to well-being; teaching example of meta-analysis with context moderators; supports hypotheses about AI-era job insecurity.","cluster":"Sustainable careers \u0026 employability — foundations, measurement, meta-analytic evidence \u0026 person-career fit (new cluster)","themes":["Careers \u0026 Vocational Behavior","Well-Being \u0026 Occupational Health"]},{"date":"2026-08-11","topic":"Sustainable Careers — Person-Career Fit Theory","authors":"Talluri, S. B.; Van der Heijden, B. I. J. M.; Baruch, Y.; Donald, W. E.","year":"2025","title":"Navigating sustainable careers: A conceptual framework on subjective person-career fit dynamics","journal":"Journal of Vocational Behavior","cite":"162, 104157","doi":"https://doi.org/10.1016/j.jvb.2025.104157","summary":"This recent conceptual article positions subjective person-career fit as the central mechanism of sustainable careers. The authors model how personal and contextual inputs shape fit perceptions that evolve over time and connect to the health, happiness, and productivity outcomes of the sustainable careers framework. The paper extends De Vos et al. (2020) by specifying the temporal dynamics through which fit is appraised and recalibrated across career stages.","relevance":"Represents the current theoretical frontier of the sustainable careers literature; useful for framing studies of career adaptation to changing work and AI-driven job transformation.","contribution":"Specifies subjective person-career fit as the linking mechanism in sustainable career models, adding temporal dynamics missing from earlier frameworks.","uses":"Recent theory reading to pair with De Vos et al. (2020) in seminars; source of testable propositions for dissertations and future research on fit dynamics.","cluster":"Sustainable careers \u0026 employability — foundations, measurement, meta-analytic evidence \u0026 person-career fit (new cluster)","themes":["Careers \u0026 Vocational Behavior","Job Design, Crafting \u0026 Motivation"]},{"date":"2026-08-11","topic":"Sustainable Careers — Measurement/Methods","authors":"Paredes-Aguirre, M.; Ayala, Y.; Karaeminogullari, A.; Peñalver, J.","year":"2026","title":"Measuring Sustainable Career: Validation and Predictive Value of the Spanish Career Sustainability Scale","journal":"Journal of Career Assessment","cite":"Advance online publication (April 2026)","doi":"https://doi.org/10.1177/10690727261440543","summary":"This multi-study validation develops a Spanish-language version of the Career Sustainability Scale in the Mexican context. Study 1 supports the four-factor structure via EFA/CFA, internal consistency, and measurement invariance across gender, with concurrent associations with job autonomy, work engagement, and intention to quit. The work extends sustainable career measurement beyond WEIRD samples and provides predictive validity evidence.","relevance":"Gives researchers a validated instrument for career sustainability and addresses the literature's neglect of Latin American and Spanish-speaking working populations.","contribution":"Psychometric contribution: cross-cultural adaptation, invariance testing, and predictive validity for a career sustainability measure in an under-represented labor market.","uses":"Methods reading on scale adaptation/invariance; instrument source for cross-cultural career research; supports grant aims on generalizability beyond WEIRD samples.","cluster":"Sustainable careers \u0026 employability — foundations, measurement, meta-analytic evidence \u0026 person-career fit (new cluster)","themes":["Careers \u0026 Vocational Behavior","Job Design, Crafting \u0026 Motivation","Big Data \u0026 Methods"]},{"date":"2026-08-11","topic":"Employability — Umbrella Review","authors":"Rothwell, A.; Domagała-Zyśk, E.; Mamcarz, P.; Parra, A.; Sánchez-Queija, M. I.; De Rosa, A.; Lo Presti, A.","year":"2025","title":"Employability: An Umbrella Review","journal":"Australian Journal of Career Development","cite":"34(3), 236–248","doi":"https://doi.org/10.1177/10384162251366428","summary":"Using PRISMA methodology, this umbrella review synthesizes 23 systematic literature reviews on employability. It identifies three broad areas: the complex multidimensional nature of the construct; competencies, capitals, and individual development; and contextual factors, inequalities, and shared responsibility for employability. The paper maps two decades of review evidence and highlights fragmentation in definitions and measurement.","relevance":"Efficient entry point into a sprawling literature; the shared-responsibility and inequality themes connect employability to debates about workforce development and labor-market equity.","contribution":"A review-of-reviews that organizes the employability field into three thematic domains and exposes definitional and measurement fragmentation needing integration.","uses":"Orientation reading for students entering the employability literature; scoping tool for lit reviews; identifies research gaps useful for framing new studies.","cluster":"Sustainable careers \u0026 employability — foundations, measurement, meta-analytic evidence \u0026 person-career fit (new cluster)","themes":["Careers \u0026 Vocational Behavior"]},{"date":"2026-08-10","topic":"Stress Management Interventions (Foundations)","authors":"Tetrick, L. E.; Winslow, C. J.","year":"2015","title":"Workplace Stress Management Interventions and Health Promotion","journal":"Annual Review of Organizational Psychology and Organizational Behavior","cite":"2, 583–603","doi":"https://doi.org/10.1146/annurev-orgpsych-032414-111341","summary":"Foundational review organizing workplace stress management interventions and health promotion/wellness programs through primary, secondary, and tertiary prevention lenses and the job demands-resources framework. Concludes that stress management interventions tend to be ameliorative (restoring depleted resources), while health promotion programs are more preventive (building job and personal resources). Notes that organization-level interventions remain rare but show growing evidence of effectiveness, especially when combined with individual-level approaches.","relevance":"The anchor review for occupational health psychology's intervention literature; frames the individual-vs-organizational intervention distinction that structures the rest of this cluster.","contribution":"Provides the primary/secondary/tertiary prevention taxonomy and JD-R framing that subsequent intervention research builds on.","uses":"Teaching (OHP intervention taxonomy); framing chapter for lit reviews and grant proposals on workplace mental health.","cluster":"Workplace mental health \u0026 stress management interventions — individual vs. organizational approaches (new cluster)","themes":["Well-Being \u0026 Occupational Health"]},{"date":"2026-08-10","topic":"Organizational Intervention Evaluation (Theory/Methods)","authors":"Nielsen, K.; Randall, R.","year":"2013","title":"Opening the Black Box: Presenting a Model for Evaluating Organizational-Level Interventions","journal":"European Journal of Work and Organizational Psychology","cite":"22(5), 601–617","doi":"https://doi.org/10.1080/1359432X.2012.690556","summary":"Theoretical/methods paper addressing why organizational-level occupational health interventions produce inconsistent effects despite sound theoretical grounding. Presents a process evaluation framework with three components: intervention design and implementation, intervention context, and participants' mental models. Argues that evaluation must examine the psychological and organizational mechanisms that hinder or facilitate intervention outcomes, not just effect sizes.","relevance":"The most-cited process evaluation framework for organizational interventions; explains null and mixed findings that outcome-only evaluations cannot.","contribution":"Shifts intervention research from 'does it work?' to 'what works for whom under what circumstances?' — a methodological turn now standard in the field.","uses":"Methods teaching; designing process evaluations for intervention studies; interpreting mixed intervention findings in lit reviews.","cluster":"Workplace mental health \u0026 stress management interventions — individual vs. organizational approaches (new cluster)","themes":["Big Data \u0026 Methods"]},{"date":"2026-08-10","topic":"Mindfulness Training at Work (Meta-Analysis)","authors":"Bartlett, L.; Martin, A.; Neil, A. L.; Memish, K.; Otahal, P.; Kilpatrick, M.; Sanderson, K.","year":"2019","title":"A Systematic Review and Meta-Analysis of Workplace Mindfulness Training Randomized Controlled Trials","journal":"Journal of Occupational Health Psychology","cite":"24(1), 108–126","doi":"https://doi.org/10.1037/ocp0000146","summary":"Meta-analysis of RCTs of workplace-delivered mindfulness training examining mindfulness, stress, mental health, well-being, and performance outcomes. Found beneficial effects for mindfulness (g = .45), stress (g = .56), anxiety (g = .62), psychological distress (g = .69), well-being (g = .46), and sleep (g = .26). No conclusions could be drawn for burnout (ambivalent results), depression (publication bias), or work performance (insufficient data).","relevance":"The benchmark meta-analytic estimate for the most widely deployed individual-level workplace intervention, in a flagship OHP journal.","contribution":"Quantifies which outcomes mindfulness training does and does not move, and documents evidence-quality gaps (publication bias, missing performance data).","uses":"Teaching effect-size interpretation; benchmark for grant power analyses; counterpoint to Fleming (2024) in seminar debate on individual-level interventions.","cluster":"Workplace mental health \u0026 stress management interventions — individual vs. organizational approaches (new cluster)","themes":["Well-Being \u0026 Occupational Health","Training \u0026 Development"]},{"date":"2026-08-10","topic":"Organizational \u0026 Group-Level Interventions (Review)","authors":"Fox, K. E.; Johnson, S. T.; Berkman, L. F.; Sianoja, M.; Soh, Y.; Kubzansky, L. D.; Kelly, E. L.","year":"2022","title":"Organisational- and Group-Level Workplace Interventions and Their Effect on Multiple Domains of Worker Well-Being: A Systematic Review","journal":"Work \u0026 Stress","cite":"36(1), 30–59","doi":"https://doi.org/10.1080/02678373.2021.1969476","summary":"Systematic review of 83 experimental and quasi-experimental studies of organizational- and group-level interventions, categorized into four types: flexible work/scheduling changes, job and task modifications, relational/team initiatives, and participatory processes. Outcomes span the mental health continuum from ill-being to positive well-being, including work-specific and work-family well-being. Interventions increasing worker control, voice, and participation most reliably improved well-being.","relevance":"The leading synthesis of 'work redesign' interventions — the organizational-level alternative to individual stress management — from the Harvard/MIT Work and Well-Being Initiative team.","contribution":"Provides a four-type taxonomy of organizational interventions and identifies control/voice/participation as the critical active ingredients.","uses":"Core reading for the individual-vs-organizational intervention debate; framework for designing work redesign studies; policy-relevant lit reviews.","cluster":"Workplace mental health \u0026 stress management interventions — individual vs. organizational approaches (new cluster)","themes":["Well-Being \u0026 Occupational Health"]},{"date":"2026-08-10","topic":"Individual-Level Interventions (Critique/Debate)","authors":"Fleming, W. J.","year":"2024","title":"Employee Well-Being Outcomes From Individual-Level Mental Health Interventions: Cross-Sectional Evidence From the United Kingdom","journal":"Industrial Relations Journal","cite":"55(2), 162–182","doi":"https://doi.org/10.1111/irj.12418","summary":"High-profile study analyzing survey data from 46,336 workers in 233 UK organizations to evaluate individual-level well-being interventions (mindfulness apps, resilience and stress management training, relaxation classes, well-being apps). Found no significant differences in well-being between participants and non-participants for nearly all intervention types; volunteering was the lone exception. Concludes that organizational interventions targeting working conditions may be more promising than individual-level programs.","relevance":"Sparked a major public and academic debate about the multi-billion-dollar workplace wellness industry; directly challenges the evidence base behind common employer offerings.","contribution":"Large-sample field evidence contradicting RCT meta-analyses (e.g., Bartlett et al., 2019), raising questions about selection, implementation quality, and ecological validity of workplace wellness at scale.","uses":"Debate/critique reading paired with Bartlett et al.; teaching causal inference limits of cross-sectional designs; framing for organizational-level intervention grants.","cluster":"Workplace mental health \u0026 stress management interventions — individual vs. organizational approaches (new cluster)","themes":["Well-Being \u0026 Occupational Health"]},{"date":"2026-08-10","topic":"Digital Mental Health Interventions (Meta-Analysis)","authors":"Stratton, E.; Morris, R. W.; Milton, A.; Deady, M.; Choi, I.; Glozier, N.","year":"2025","title":"Optimizing Workplace Digital Mental Health Interventions: Systematic Review and Meta-Analysis","journal":"Journal of Medical Internet Research","cite":"27, e71253","doi":"https://doi.org/10.2196/71253","summary":"Systematic review and Bayesian multilevel meta-regression of RCTs (2004–April 2024) of digital mental health interventions for depression, anxiety, and stress in employed adults. Found substantial heterogeneity in efficacy across intervention content and design. Mindfulness and stress management approaches, expert involvement in design, and blending digital delivery with human support showed evidence of greater therapeutic benefit.","relevance":"Directly relevant to the rapid shift toward app- and web-based delivery of workplace mental health support; identifies design features that moderate effectiveness.","contribution":"Moves beyond 'do digital interventions work?' to meta-regression on which design characteristics drive effects — actionable for intervention developers.","uses":"Guidance for designing/selecting digital well-being tools; methods example of Bayesian meta-regression; future research on human-AI blended support.","cluster":"Workplace mental health \u0026 stress management interventions — individual vs. organizational approaches (new cluster)","themes":["Well-Being \u0026 Occupational Health"]},{"date":"2026-08-10","topic":"Participatory Organizational Interventions (Meta-Analysis)","authors":"Iida, M.; Sakuraya, A.; Imamura, K.; Kawakami, N.; et al.","year":"2026","title":"Effects of Participatory Organizational Interventions on Mental Health and Work Performance: A Systematic Review and Meta-Analysis","journal":"Journal of Occupational Health","cite":"68(1), uiag024","doi":"https://doi.org/10.1093/joccuh/uiag024","summary":"First systematic review and meta-analysis of participatory organizational interventions — programs in which workers actively participate in diagnosing and improving psychosocial working conditions — on both mental health and work performance. Found beneficial effects on minor psychiatric morbidity and depersonalization, and improvements in the psychosocial work environment, sickness absence, and job performance. Compared against treatment-as-usual or no-intervention controls across multiple databases.","relevance":"Published this year; provides the quantitative evidence base for the participatory approach that Fox et al. (2022) and Fleming (2024) point toward as the more promising alternative to individual-level programs.","contribution":"Integrates mental health AND performance outcomes for participatory interventions in a single meta-analysis, supporting the business case for work redesign. (Author order needs verification — team confirmed as Iida, Sakuraya, Imamura, Kawakami and colleagues.)","uses":"Capstone reading for the intervention-level debate; evidence for grant proposals on participatory work redesign; teaching intervention meta-analysis.","cluster":"Workplace mental health \u0026 stress management interventions — individual vs. organizational approaches (new cluster)","themes":["Well-Being \u0026 Occupational Health"]},{"date":"2026-08-08","topic":"Overqualification — Meta-Analysis","authors":"Liao, M.; Zhang, M. J.; Carnevale, J. B.; Huang, C.; Wang, L.","year":"2025","title":"Capable Fish or Deficient Ponds? A Meta-Analysis of Consequences, Mechanisms, and Moderators of Perceived Overqualification","journal":"Journal of Management","cite":"51(7), 2729–2771","doi":"https://doi.org/10.1177/01492063241239298","summary":"Comprehensive meta-analysis of the consequences of perceived overqualification (POQ). Synthesizes effects on attitudes, well-being, and behaviors, tests competing theoretical mechanisms (person-job fit deficits vs. self-concept/status processes), and examines moderators that determine when POQ is harmful versus energizing. Findings clarify why prior results on performance and proactivity outcomes have been mixed.","relevance":"The definitive quantitative summary of the POQ literature — the anchor reading for any I-O treatment of overqualification and skills mismatch.","contribution":"Adjudicates between 'capable fish' (asset) and 'deficient pond' (misfit) framings with meta-analytic evidence on mechanisms, not just bivariate effects.","uses":"Required reading for a seminar week on overqualification; effect-size source for lit reviews and grant proposals on talent underutilization.","cluster":"Overqualification, underemployment \u0026 skills mismatch — talent deployed below capacity in the changing labor market (new cluster)","themes":["Employment Relationships \u0026 Gig Work"]},{"date":"2026-08-08","topic":"Overqualification — Prosocial Behavior","authors":"Song (first author); full co-author list needs verification","year":"2026","title":"The Paradoxical Effects of Overqualification on Helping: An Exchange-Based Framework","journal":"Journal of Organizational Behavior","cite":"47(1), 145–163","doi":"https://doi.org/10.1002/job.70024","summary":"Draws on social exchange theory to model POQ as a double-edged sword for helping behavior. A pre-registered experiment plus a multi-wave, multisource field study show POQ increases helping via perceived status (feeling respected for superior capabilities) but decreases it via depersonalization of coworkers (perceiving poor treatment by the employer). Task and goal interdependence moderate which pathway dominates.","relevance":"Brand-new (2026) empirical example of the dual-pathway approach now dominant in POQ research; directly relevant to citizenship behavior and team design.","contribution":"Extends POQ research beyond performance/withdrawal to interpersonal prosocial behavior, with strong causal identification (pre-registered experiment + field constructive replication).","uses":"Recent empirical exemplar for teaching; template for pre-registered experiment + field study designs. Note: only first author (Song) confirmed from journal listing; verify full author order before citing.","cluster":"Overqualification, underemployment \u0026 skills mismatch — talent deployed below capacity in the changing labor market (new cluster)","themes":["Employment Relationships \u0026 Gig Work"]},{"date":"2026-08-08","topic":"Overqualification — Narrative Review","authors":"Erdogan, B.; Bauer, T. N.","year":"2021","title":"Overqualification at Work: A Review and Synthesis of the Literature","journal":"Annual Review of Organizational Psychology and Organizational Behavior","cite":"8, 259–283","doi":"https://doi.org/10.1146/annurev-orgpsych-012420-055831","summary":"Authoritative narrative review of the overqualification literature by its two most prolific contributors. Synthesizes research on measurement (objective vs. perceived), theoretical lenses (person-job fit, relative deprivation, equity), antecedents, outcomes for employees and organizations, and moderating conditions such as empowerment and support. Sets a research agenda that much of the 2021–2026 literature has pursued.","relevance":"The best single entry point to the topic — assign before empirical readings to give students the conceptual map and measurement debates.","contribution":"Organizes a fragmented literature and distinguishes when overqualified hires are an asset versus a retention risk, a framing with direct staffing implications.","uses":"Ideal seminar overview reading; framing source for talent management practice discussions and dissertation proposals.","cluster":"Overqualification, underemployment \u0026 skills mismatch — talent deployed below capacity in the changing labor market (new cluster)","themes":["Employment Relationships \u0026 Gig Work"]},{"date":"2026-08-08","topic":"Underemployment — Foundational Review","authors":"McKee-Ryan, F. M.; Harvey, J.","year":"2011","title":"“I Have a Job, But . . .”: A Review of Underemployment","journal":"Journal of Management","cite":"37(4), 962–996","doi":"https://doi.org/10.1177/0149206311398134","summary":"Foundational review that organizes the multidisciplinary underemployment literature around a person-job fit framework. Maps the construct's dimensions — overqualification, involuntary part-time/temporary work, underpayment, and status underemployment — and reviews antecedents, outcomes, and measurement inconsistencies across psychology, sociology, and economics. Proposes an integrative research agenda that shaped the subsequent decade of work.","relevance":"The classic citation defining underemployment for organizational research; situates overqualification within the broader construct space.","contribution":"Provides the dimensional taxonomy of underemployment still used today and diagnoses the objective-versus-subjective measurement divide.","uses":"Foundational/required reading; construct-definition source for any study of underemployment, gig work, or post-recession career scarring.","cluster":"Overqualification, underemployment \u0026 skills mismatch — talent deployed below capacity in the changing labor market (new cluster)","themes":["Employment Relationships \u0026 Gig Work"]},{"date":"2026-08-08","topic":"Overqualification — Leadership \u0026 Performance","authors":"Liu, Z.; Huang, Y.; Kim, T.-Y.; Yang, J.","year":"2024","title":"Perceived Overqualification and Employee Outcomes: The Dual Pathways and the Moderating Effects of Dual-Focused Transformational Leadership","journal":"Human Resource Management","cite":"63(4), 653–671","doi":"https://doi.org/10.1002/hrm.22221","summary":"Drawing on person-environment fit theory, proposes cynicism toward the job (negative) and constructive deviance (positive) as dual pathways linking POQ to task performance and creativity. A two-wave survey of 469 employees and 135 supervisors plus one field study and two online experiments show individual-focused transformational leadership weakens the POQ-cynicism link while team-focused transformational leadership strengthens the POQ-constructive deviance link.","relevance":"Shows leadership as a practical lever for converting overqualified employees' surplus capability into performance rather than cynicism — a clear managerial implication for I-O audiences.","contribution":"Reconciles mixed POQ-performance findings via contrasting mediating mechanisms and demonstrates multi-method evidence (surveys + experiments).","uses":"Empirical seminar reading; useful for teaching moderated mediation and multi-study designs; practice implications for managing overqualified hires.","cluster":"Overqualification, underemployment \u0026 skills mismatch — talent deployed below capacity in the changing labor market (new cluster)","themes":["Leadership","Employment Relationships \u0026 Gig Work"]},{"date":"2026-08-08","topic":"Overqualification — Interpersonal/Dyadic","authors":"Li, C. S.; Liao, H.; Han, Y.","year":"2022","title":"I Despise But Also Envy You: A Dyadic Investigation of Perceived Overqualification, Perceived Relative Qualification, and Knowledge Hiding","journal":"Personnel Psychology","cite":"75(1), 91–118","doi":"https://doi.org/10.1111/peps.12444","summary":"Moves POQ research from the individual to the dyad: examines how an employee's perceived overqualification combines with perceived qualification relative to specific coworkers to predict knowledge hiding. Finds that feeling overqualified fosters both contempt and envy toward comparison targets depending on relative standing, and these discrete emotions differentially drive hiding knowledge from those coworkers.","relevance":"Connects overqualification to social comparison and counterproductive knowledge behavior — topics central to knowledge-intensive future-of-work settings.","contribution":"First dyadic treatment of POQ; introduces perceived relative qualification as a construct and links it to discrete emotions (contempt, envy).","uses":"Recommended reading; strong exemplar of dyadic designs and social comparison theory for methods-oriented discussion.","cluster":"Overqualification, underemployment \u0026 skills mismatch — talent deployed below capacity in the changing labor market (new cluster)","themes":["Employment Relationships \u0026 Gig Work"]},{"date":"2026-08-08","topic":"Overqualification — Theory/Debate","authors":"Erdogan, B.; Bauer, T. N.; Peiró, J. M.; Truxillo, D. M.","year":"2011","title":"Overqualified Employees: Making the Best of a Potentially Bad Situation for Individuals and Organizations","journal":"Industrial and Organizational Psychology: Perspectives on Science and Practice","cite":"4(2), 215–232","doi":"https://doi.org/10.1111/j.1754-9434.2011.01330.x","summary":"Provocative focal article arguing that the reflexive view of overqualified workers as poor hires is empirically unwarranted. Reviews evidence that overqualified employees often perform better, and argues outcomes depend on how organizations deploy them (empowerment, job crafting, development). Published with peer commentaries, making it a natural debate piece on hiring discrimination against the overqualified.","relevance":"Launched the modern 'overqualification as opportunity' perspective; the focal-article-plus-commentaries format is ideal for structured seminar debate.","contribution":"Reframed overqualification from a screening red flag to a talent management question, spawning the empirical literature of the following decade.","uses":"Debate/critique reading; pair with the Liao et al. (2025) meta-analysis to assess which 2011 claims survived quantitative scrutiny.","cluster":"Overqualification, underemployment \u0026 skills mismatch — talent deployed below capacity in the changing labor market (new cluster)","themes":["Employment Relationships \u0026 Gig Work"]},{"date":"2026-08-06","topic":"Meeting Science / Future of Work","authors":"Rogelberg, S. G.; Kreamer, L. M.; Gray, J.","year":"2026","title":"Thirty Years of Meeting Science: Lessons Learned and the Road Ahead","journal":"Annual Review of Organizational Psychology and Organizational Behavior","cite":"13, 415-442","doi":"https://doi.org/10.1146/annurev-orgpsych-031925-091223","summary":"Comprehensive review synthesizing three decades of meeting science across organizational psychology, communication, and computer science. Organizes the literature into five lenses: meetings as stressors/affective events, as communication technology driving performance, as a platform for voice and inclusion, as a stage for leadership and power, and as expressions of culture and identity. Charts a research agenda covering remote/hybrid meetings, AI meeting tools, and meeting recovery.","relevance":"Definitive state-of-the-science on workplace meetings, a core but understudied context where much of modern knowledge work (and its technostress) unfolds.","contribution":"Provides an integrative five-lens framework that organizes a fragmented literature and legitimizes meeting science as an I-O subfield.","uses":"Anchor reading for a seminar week on meetings/collaboration technology; lit review scaffolding; source of dissertation-ready research questions.","cluster":"Meeting science, virtual meetings \u0026 videoconference fatigue (new cluster)","themes":["AI \u0026 Future of Work"]},{"date":"2026-08-06","topic":"Videoconference Fatigue / Well-Being","authors":"Shockley, K. M.; Gabriel, A. S.; Robertson, D.; Rosen, C. C.; Chawla, N.; Ganster, M. L.; Ezerins, M. E.","year":"2021","title":"The Fatiguing Effects of Camera Use in Virtual Meetings: A Within-Person Field Experiment","journal":"Journal of Applied Psychology","cite":"106(8), 1137-1155","doi":"https://doi.org/10.1037/apl0000948","summary":"Four-week within-person field experiment (103 employees, 1,400+ observations) randomly assigning camera-on vs. camera-off weeks during virtual meetings. Camera use — not meeting time itself — predicted daily fatigue, which in turn reduced meeting voice and engagement. Effects were stronger for women and newer employees, consistent with self-presentation demands.","relevance":"Directly informs occupational health and remote-work policy: a rigorous causal test of a ubiquitous technology practice affecting employee energy and participation.","contribution":"One of the first true field experiments on virtual meeting design; identifies self-presentation cost as the mechanism and demographic moderators of fatigue.","uses":"Exemplar of within-person experimental design for methods teaching; evidence base for camera-optional policies; grant framing on digital work demands.","cluster":"Meeting science, virtual meetings \u0026 videoconference fatigue (new cluster)","themes":["Well-Being \u0026 Occupational Health","Technostress \u0026 Digital Demands"]},{"date":"2026-08-06","topic":"Videoconference Fatigue / Well-Being","authors":"Bennett, A. A.; Campion, E. D.; Keeler, K. R.; Keener, S. K.","year":"2021","title":"Videoconference Fatigue? Exploring Changes in Fatigue After Videoconference Meetings During COVID-19","journal":"Journal of Applied Psychology","cite":"106(3), 330-344","doi":"https://doi.org/10.1037/apl0000906","summary":"Mixed-method study combining qualitative accounts with experience-sampling data from employees during COVID-19 to test whether and when videoconference meetings deplete energy. Fatigue increased following videoconferences, but effects depended on meeting characteristics and personal resources: group belongingness buffered fatigue, and mid/late-afternoon meetings were more depleting. Turning the camera off and mute options helped conserve resources.","relevance":"Foundational empirical demonstration of the videoconference fatigue phenomenon within an I-O flagship journal, framed in conservation of resources theory.","contribution":"Moves 'Zoom fatigue' from popular claim to theory-grounded, within-person evidence, identifying boundary conditions (belongingness, timing, camera/mute use).","uses":"Pairs with Shockley et al. for a seminar debate on causes of videoconference fatigue; experience-sampling methods illustration; practical meeting-design guidance.","cluster":"Meeting science, virtual meetings \u0026 videoconference fatigue (new cluster)","themes":["Well-Being \u0026 Occupational Health","Technostress \u0026 Digital Demands"]},{"date":"2026-08-06","topic":"Virtual Meetings / Cognitive Fatigue","authors":"Nurmi, N.; Pakarinen, S.","year":"2023","title":"Virtual Meeting Fatigue: Exploring the Impact of Virtual Meetings on Cognitive Performance and Active Versus Passive Fatigue","journal":"Journal of Occupational Health Psychology","cite":"28(6), 343-362","doi":"https://doi.org/10.1037/ocp0000362","summary":"Field study of 44 knowledge workers across 382 real meetings using both self-reports and cardiac (heart rate variability) measures. Contrary to the overload narrative, virtual meetings were linked to passive fatigue (drowsiness from understimulation) rather than active fatigue, and passive fatigue impaired cognitive performance. Highly work-engaged employees were protected from these effects.","relevance":"Reframes videoconference fatigue as an underload problem, with direct implications for occupational health psychology and the design of stimulating virtual work.","contribution":"Methodologically distinctive combination of psychophysiological and experience-sampling data; introduces the active/passive fatigue distinction to virtual work research.","uses":"Methods reading on ambulatory psychophysiology; theory-building on work engagement as a resource; counterpoint for seminar discussion of fatigue mechanisms.","cluster":"Meeting science, virtual meetings \u0026 videoconference fatigue (new cluster)","themes":["Well-Being \u0026 Occupational Health","Technostress \u0026 Digital Demands"]},{"date":"2026-08-06","topic":"Virtual Meetings / Motivation \u0026 Flow","authors":"Rivkin, W.; Moser, K. S.; Diestel, S.; Alshaikh, I.","year":"2024","title":"Getting Into Flow During Virtual Meetings: How Virtual Meetings Can Benefit Employee Functioning in the Work- and Home Domain","journal":"Journal of Vocational Behavior","cite":"150, 103984","doi":"https://doi.org/10.1016/j.jvb.2024.103984","summary":"Two daily-diary studies (179 employees, 1,071 workdays) during and after the pandemic examining positive effects of virtual meetings. On days with more time in virtual meetings, employees experienced more flow, which reduced end-of-day fatigue and improved functioning at work and home. Challenges the uniformly negative portrayal of virtual meetings.","relevance":"Provides the 'bright side' counterweight to the videoconference fatigue literature, relevant to vocational behavior, work design, and work-home spillover.","contribution":"Applies flow theory and within-person methodology to show virtual meetings can be motivational resources rather than only demands.","uses":"Debate reading against fatigue studies; daily-diary design exemplar; basis for hypotheses on when virtual collaboration energizes rather than depletes.","cluster":"Meeting science, virtual meetings \u0026 videoconference fatigue (new cluster)","themes":["Technostress \u0026 Digital Demands","Job Design, Crafting \u0026 Motivation"]},{"date":"2026-08-06","topic":"Videoconference Fatigue / Theory","authors":"Bailenson, J. N.","year":"2021","title":"Nonverbal Overload: A Theoretical Argument for the Causes of Zoom Fatigue","journal":"Technology, Mind, and Behavior","cite":"2(1)","doi":"https://doi.org/10.1037/tmb0000030","summary":"Influential theoretical article proposing four mechanisms by which videoconferencing produces fatigue: excessive close-up eye gaze, constant self-view (mirror anxiety), reduced physical mobility, and elevated cognitive load from producing and interpreting nonverbal cues. Generated the Zoom Exhaustion and Fatigue (ZEF) scale research program and much of the subsequent empirical literature.","relevance":"The most-cited theoretical account of videoconference fatigue; nearly all subsequent I-O and HCI empirical work tests or extends these four mechanisms.","contribution":"Provides a parsimonious, testable mechanism-based theory linking media characteristics to strain, bridging communication theory and occupational health.","uses":"Theory reading to open a seminar unit; hypothesis source for student projects; useful for teaching how theory papers seed empirical programs.","cluster":"Meeting science, virtual meetings \u0026 videoconference fatigue (new cluster)","themes":["Well-Being \u0026 Occupational Health","Technostress \u0026 Digital Demands"]},{"date":"2026-08-06","topic":"Meeting Design / Scheduling \u0026 Well-Being","authors":"Kreamer, L. M.; Rogelberg, S. G.","year":"2026","title":"Starting Your Day With Dread or Excitement? The Effects of Meeting Scheduling Cadences on Anticipated Daily Outcomes","journal":"Group \u0026 Organization Management","cite":"51(1) (online first 2024)","doi":"https://doi.org/10.1177/10596011231223263","summary":"Two experimental vignette studies presenting full-time employees with hypothetical daily schedules varying in meeting load and dispersion (back-to-back vs. spread out). Scheduling cadence shaped anticipated affect, fatigue, and productivity for the workday, showing that how meetings are arranged - not just how many - matters for employee experience.","relevance":"Speaks directly to calendar management, meeting load, and micro-work-design decisions that define hybrid knowledge work; complements fatigue research with a scheduling lens.","contribution":"Introduces meeting scheduling cadence as a construct and demonstrates experimental vignette methodology for studying workday design.","uses":"Practical reading on meeting/calendar policy; EVM methods illustration; springboard for field research on no-meeting blocks and focus time.","cluster":"Meeting science, virtual meetings \u0026 videoconference fatigue (new cluster)","themes":["Well-Being \u0026 Occupational Health"]},{"date":"2026-08-05","topic":"Workplace Incivility (Foundational Theory)","authors":"Andersson, L. M.; Pearson, C. M.","year":"1999","title":"Tit for Tat? The Spiraling Effect of Incivility in the Workplace","journal":"Academy of Management Review","cite":"24(3), 452-471","doi":"https://doi.org/10.5465/amr.1999.2202131","summary":"The foundational theory paper that defined workplace incivility as low-intensity deviant behavior with ambiguous intent to harm, violating workplace norms of mutual respect. Introduces the influential 'incivility spiral' model, in which minor uncivil exchanges escalate through reciprocation into increasingly intense aggression, potentially reaching a 'tipping point' of overt aggression. Distinguishes incivility from related constructs (aggression, antisocial behavior, deviance) and specifies conditions that facilitate or interrupt spirals.","relevance":"The conceptual anchor for the entire incivility literature in I-O psychology and OB; virtually all subsequent empirical work builds on this definition and the spiral model.","contribution":"Defined the incivility construct and provided the escalation-spiral theoretical model that has organized 25+ years of mistreatment research.","uses":"Essential foundational reading for any seminar week on workplace mistreatment; useful for theory-building exercises and as the definitional citation in literature reviews and grants.","cluster":"Workplace incivility, mistreatment \u0026 cyberincivility — victims, observers, customers \u0026 digital spillover (new cluster)","themes":["Well-Being \u0026 Occupational Health"]},{"date":"2026-08-05","topic":"Workplace Incivility (Review)","authors":"Schilpzand, P.; De Pater, I. E.; Erez, A.","year":"2016","title":"Workplace Incivility: A Review of the Literature and Agenda for Future Research","journal":"Journal of Organizational Behavior","cite":"37(S1), S57-S88","doi":"https://doi.org/10.1002/job.1976","summary":"A comprehensive narrative review of the incivility literature organized by the three perspectives from which incivility has been studied: targets/experienced incivility, witnessed incivility, and instigated incivility. Synthesizes antecedents, outcomes, mediators, and moderators across each stream and catalogs measurement approaches. Concludes with a detailed agenda for future research, including calls for more work on witnessed and instigated incivility, dynamic within-person designs, and selective incivility toward marginalized groups.","relevance":"The standard review for orienting students to the incivility literature; its target/witness/instigator taxonomy structures most subsequent research and maps directly onto occupational health and DEI concerns.","contribution":"Provided the organizing tripartite framework (experienced, witnessed, instigated incivility) and identified the research gaps that much of the last decade of incivility research has pursued.","uses":"Ideal orienting/required reading for a seminar week; strong scaffold for comprehensive exam preparation and literature review sections.","cluster":"Workplace incivility, mistreatment \u0026 cyberincivility — victims, observers, customers \u0026 digital spillover (new cluster)","themes":["Well-Being \u0026 Occupational Health"]},{"date":"2026-08-05","topic":"Cyber Incivility \u0026 ICT-Mediated Mistreatment","authors":"Park, Y.; Fritz, C.; Jex, S. M.","year":"2018","title":"Daily Cyber Incivility and Distress: The Moderating Roles of Resources at Work and Home","journal":"Journal of Management","cite":"44(7), 2535-2557","doi":"https://doi.org/10.1177/0149206315576796","summary":"A daily diary study examining how incivility experienced through work email (cyber incivility) relates to employees' end-of-day distress and next-morning states. Drawing on conservation of resources theory, the authors show daily cyber incivility predicts affective distress, with job control buffering and psychological detachment from work in the evening shaping recovery. Demonstrates that mistreatment delivered through technology has meaningful daily well-being consequences that spill over into the home domain.","relevance":"Bridges the mistreatment and technostress/recovery literatures — directly relevant to remote/hybrid work, where a growing share of interpersonal treatment is technology-mediated.","contribution":"Established cyber incivility as a daily stressor with within-person well-being effects and identified work and home resources as boundary conditions, extending COR theory to ICT-mediated mistreatment.","uses":"Excellent methods exemplar for teaching experience-sampling/diary designs; useful for research on digital communication norms and right-to-disconnect policies.","cluster":"Workplace incivility, mistreatment \u0026 cyberincivility — victims, observers, customers \u0026 digital spillover (new cluster)","themes":["Well-Being \u0026 Occupational Health","Technostress \u0026 Digital Demands"]},{"date":"2026-08-05","topic":"Workplace Incivility (Meta-Analysis / Construct Validity)","authors":"Yao, J.; Lim, S.; Guo, C. Y.; Ou, A. Y.; Ng, J. W. X.","year":"2022","title":"Experienced Incivility in the Workplace: A Meta-Analytical Review of Its Construct Validity and Nomological Network","journal":"Journal of Applied Psychology","cite":"107(2), 193-220","doi":"https://doi.org/10.1037/apl0000870","summary":"A large-scale meta-analysis (105 independent samples; N = 51,008) using Schmidt-Hunter methods to test the construct validity of experienced workplace incivility. Examines reliability, convergent and discriminant validity against related mistreatment constructs (e.g., abusive supervision, ostracism, bullying), and incremental predictive validity for attitudes, well-being, and behavior. Finds incivility is empirically distinguishable from other mistreatment forms and predicts outcomes beyond them, while flagging substantial construct overlap issues in the mistreatment literature.","relevance":"Addresses the construct-proliferation problem in mistreatment research head-on — a core methodological concern for I-O psychology — while providing definitive effect-size estimates for incivility's outcomes.","contribution":"Provides the authoritative quantitative test of whether incivility is a distinct construct, directly informing how researchers should measure and position mistreatment variables.","uses":"Strong methods/required reading pairing construct validation logic with meta-analysis; useful for teaching about jangle fallacies and construct redundancy debates.","cluster":"Workplace incivility, mistreatment \u0026 cyberincivility — victims, observers, customers \u0026 digital spillover (new cluster)","themes":["Well-Being \u0026 Occupational Health"]},{"date":"2026-08-05","topic":"Witnessed / Third-Party Mistreatment","authors":"Lyubykh, Z.; Zhong, R.; Vuong, T. T.; Robinson, S. L.; Hershcovis, M. S.","year":"2025","title":"Understanding the Impact of Witnessed Workplace Mistreatment: A Meta-Analysis of Observer Deontic Reactions and Employee Outcomes","journal":"Journal of Applied Psychology","cite":"110(3), 381-403","doi":"https://doi.org/10.1037/apl0001239","summary":"A meta-analysis of the witnessed-mistreatment literature examining observers' deontic (moral) reactions and the incremental effects of witnessing mistreatment beyond experiencing it. Finds observer reactions are not straightforward: observers react negatively toward perpetrators yet frequently fail to intervene and show mixed reactions toward targets. Moderator analyses show perpetrator rank, mistreatment severity, and study context shape observer responses, and witnessed mistreatment explains unique variance in employee outcomes.","relevance":"Extends mistreatment research beyond the victim-perpetrator dyad to the broader social ecology of work — highly relevant to bystander-intervention training and organizational climate interventions.","contribution":"First comprehensive meta-analytic integration of observer/third-party reactions to mistreatment, quantifying when and why bystanders punish, support, or stay silent.","uses":"Great debate-generating reading on why bystander interventions often fail; informs research on mistreatment climates and intervention design.","cluster":"Workplace incivility, mistreatment \u0026 cyberincivility — victims, observers, customers \u0026 digital spillover (new cluster)","themes":["Well-Being \u0026 Occupational Health"]},{"date":"2026-08-05","topic":"Cyber Incivility \u0026 Work-Home Spillover","author
