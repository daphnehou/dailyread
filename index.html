ge work and AI-driven worker control.","contribution":"First systematic integration of the human-AI collaboration and algorithmic management literatures into one framework, clarifying conceptual boundaries and enabling cross-pollination between decision-making and worker-control research streams.","uses":"Ideal review/theory reading to open or close a unit on AI at work; useful for structuring literature reviews that span both managerial decision-making and worker-monitoring research; strong discussion-generating piece for seminar.","cluster":"Career Development, Skill Formation \u0026 Human-AI Collaboration in Management","themes":["AI \u0026 Future of Work","Algorithmic Management \u0026 Surveillance","Aging \u0026 Generations","Teams \u0026 Collaboration"]},{"date":"2026-07-07","topic":"Human-AI Collaboration / Hybrid Problem-Solving","authors":"Raisch, S., \u0026 Fomina, K.","year":"2024","title":"Combining Human and Artificial Intelligence: Hybrid Problem-Solving in Organizations","journal":"Academy of Management Review","cite":"50, 441-464","doi":"https://doi.org/10.5465/amr.2021.0421","summary":"This theoretical article develops a framework for understanding how organizations combine human and AI problem-solving capabilities, characterizing hybrid problem-solving arrangements along dimensions such as task decomposition, sequencing, and the relative agency afforded to humans versus AI systems. The authors theorize conditions under which hybrid arrangements outperform either humans or AI alone, and identify organizational design implications for structuring effective human-AI collaboration in knowledge work. The piece has generated notable follow-up commentary and debate within the Academy of Management Review.","relevance":"Central to organizational behavior and knowledge-work research on human-AI collaboration; provides a theoretical lens for understanding how generative AI and agentic systems are integrated into complex organizational problem-solving.","contribution":"Offers a novel typology of hybrid human-AI problem-solving configurations and theorizes boundary conditions for their effectiveness, generating an active debate (with published commentaries/extensions) in top management theory.","uses":"Strong theory/debate reading for seminar discussion on generative AI and agentic systems at work; useful for framing research questions on human-AI task allocation; pairs well with empirical human-AI teaming studies.","cluster":"Career Development, Skill Formation \u0026 Human-AI Collaboration in Management","themes":["AI \u0026 Future of Work","Remote \u0026 Hybrid Work","Teams \u0026 Collaboration"]},{"date":"2026-07-05","topic":"AI-Based Selection \u0026 Assessment — Review","authors":"Sackett, P. R., Lievens, F., \u0026 Landers, R. N.","year":"2026","title":"Hiring People in Organizations: The State and Future of the Science","journal":"Annual Review of Organizational Psychology and Organizational Behavior","cite":"13, 49–75","doi":"https://doi.org/10.1146/annurev-orgpsych-020924-072127","summary":"This review synthesizes recent advances in personnel selection research, covering meta-analytic validity evidence for established predictors and emerging measurement approaches. It traces shifts from holistic to modular predictor models, face-to-face to asynchronous video interviews, resumes to social media-based assessments, and multiple-choice to constructed-response formats. The review also addresses the growing use of artificial intelligence to develop, administer, and score selection instruments, and identifies open questions for the next generation of hiring science.","relevance":"Provides a comprehensive, up-to-date map of the personnel selection field for I-O scholars, directly addressing how AI is reshaping assessment development and scoring.","contribution":"Integrates disparate streams (validity generalization, new measurement modalities, AI-based tools) into a single forward-looking research agenda.","uses":"Excellent anchor reading for a selection/assessment unit; useful for literature reviews and framing dissertation research questions on AI-augmented hiring.","cluster":"AI in Personnel Selection, Assessment \u0026 Trust + Vocational Interest Measurement Methods","themes":["AI \u0026 Future of Work","Assessment \u0026 Selection"]},{"date":"2026-07-05","topic":"AI-Based Selection \u0026 Assessment — Empirical","authors":"Hickman, L., Dunlop, P. D., \u0026 Wolf, J. L.","year":"2024","title":"The Performance of Large Language Models on Quantitative and Verbal Ability Tests: Initial Evidence and Implications for Unproctored High-Stakes Testing","journal":"International Journal of Selection and Assessment","cite":"Advance online publication","doi":"https://doi.org/10.1111/ijsa.12479","summary":"The authors administered standard quantitative and verbal reasoning test items to large language models to benchmark performance against human test-taker norms. They found substantial variability across models, with more capable models approaching or exceeding average human performance on some item types. The study raises direct concerns for unproctored internet-based testing, since applicants could use LLMs to answer items in real time. The authors discuss implications for test security, proctoring policy, and psychometric validity.","relevance":"Central empirical evidence for how generative AI threatens the integrity of unproctored cognitive ability testing, a core I-O assessment method.","contribution":"First systematic benchmarking of LLM performance against human test-taker norms on validated ability measures used in personnel selection.","uses":"Strong empirical pairing with theoretical/review pieces on AI and assessment validity; useful for methods discussions on test security and unproctored testing policy.","cluster":"AI in Personnel Selection, Assessment \u0026 Trust + Vocational Interest Measurement Methods","themes":["AI \u0026 Future of Work","Assessment \u0026 Selection"]},{"date":"2026-07-05","topic":"Algorithmic Management \u0026 Trust","authors":"Li, M., \u0026 Bitterly, T. B.","year":"2024","title":"How Perceived Lack of Benevolence Harms Trust of Artificial Intelligence Management","journal":"Journal of Applied Psychology","cite":"109(11), 1794–1816","doi":"https://doi.org/10.1037/apl0001200","summary":"Across multiple studies, the authors show that AI managers are perceived as lower in benevolence than human managers, even when perceived ability and integrity are held constant. This benevolence deficit reduces employees' trust in AI management and willingness to accept its decisions. The paper draws on the ability-benevolence-integrity trust framework to explain acceptance barriers distinct from competence or fairness concerns. Practical interventions that signal AI benevolence are discussed as potential remedies.","relevance":"Speaks directly to algorithmic management and worker trust, a growing concern as organizations deploy AI in supervisory and decision-making roles.","contribution":"Extends classic trust-in-leadership theory (ABI model) to human-AI management contexts, isolating benevolence as the key deficit driving distrust.","uses":"Pairs well with algorithmic management readings; useful for discussing trust-repair interventions and theory-extension exercises in seminar.","cluster":"AI in Personnel Selection, Assessment \u0026 Trust + Vocational Interest Measurement Methods","themes":["AI \u0026 Future of Work","Algorithmic Management \u0026 Surveillance"]},{"date":"2026-07-05","topic":"Generative AI \u0026 Knowledge Work Creativity","authors":"Sun, S., Li, Z. A., Foo, M.-D., Zhou, J., \u0026 Lu, J. G.","year":"2025","title":"How and for Whom Using Generative AI Affects Creativity: A Field Experiment","journal":"Journal of Applied Psychology","cite":"110(12), 1561–1573","doi":"https://doi.org/10.1037/apl0001296","summary":"In a field experiment at a technology consulting firm, 250 employees were randomly assigned to use ChatGPT for work tasks or not. Employees with LLM access were rated as more creative by supervisors and external evaluators, but this effect was moderated by individual differences in metacognitive strategies. The authors argue that generative AI functions as a cognitive job resource whose benefits depend on how deliberately employees deploy their own thinking alongside the tool. The study is among the first field-experimental tests of generative AI's creativity effects in real organizational work.","relevance":"Provides rigorous field-experimental evidence on generative AI's effects on knowledge-worker creativity, directly relevant to human-AI collaboration and augmented knowledge work.","contribution":"Identifies metacognition as a boundary condition explaining heterogeneous returns to generative AI use, moving beyond simple productivity-effect framing.","uses":"Strong empirical anchor for a generative AI/knowledge work session; useful for discussing individual-differences moderators and field-experimental design.","cluster":"AI in Personnel Selection, Assessment \u0026 Trust + Vocational Interest Measurement Methods","themes":["AI \u0026 Future of Work"]},{"date":"2026-07-05","topic":"Vocational Interest Measurement — Methods","authors":"Hou, D. X., Su, R., \u0026 Tay, L.","year":"2024","title":"Measuring SETPOINT Vocational Interest Dimensions: The Development and Validation of Three Short Scales","journal":"Journal of Vocational Behavior","cite":"149, Article 103959","doi":"https://doi.org/10.1016/j.jvb.2023.103959","summary":"Building on the SETPOINT dimensional model of vocational interests (an alternative/extension to RIASEC), the authors develop and validate three short-form scales (8, 24, and 41 items) capturing eight interest dimensions: Health Science, Creative Expression, Technology, People, Organization, Influence, Nature, and Things. Using a two-wave sample of 972 working adults, they demonstrate strong reliability, convergent validity, and temporal stability. The scales close the operational gap between the SETPOINT model's theoretical promise and its practical use in research and applied settings.","relevance":"Offers a modern, empirically validated alternative to RIASEC for measuring vocational interests, relevant to career assessment and person-environment fit research.","contribution":"Provides psychometrically sound, brief measurement tools that make the SETPOINT model usable for large-scale organizational and career research.","uses":"Methods reading for a vocational interests/careers unit; useful for students designing interest-based studies or comparing RIASEC vs. SETPOINT frameworks.","cluster":"AI in Personnel Selection, Assessment \u0026 Trust + Vocational Interest Measurement Methods","themes":["Careers \u0026 Vocational Behavior","Big Data \u0026 Methods"]},{"date":"2026-07-05","topic":"Computational Methods — Machine Learning \u0026 Explainability","authors":"Zhang, Y., Zheng, Y., Wang, D., Gu, X., Zyphur, M. J., Xiao, L., Liao, S., \u0026 Deng, Y.","year":"2025","title":"Shedding Light on the Black Box: Integrating Prediction Models and Explainability Using Explainable Machine Learning","journal":"Organizational Research Methods","cite":"29(2), 202–237","doi":"https://doi.org/10.1177/10944281251323248","summary":"The authors present a methodological framework for combining machine learning prediction models with explainable AI (XAI) techniques in organizational research, addressing the common critique that ML models function as uninterpretable 'black boxes.' They demonstrate how explainability tools can be integrated with predictive modeling to generate both accurate predictions and theoretically interpretable insights. Worked examples illustrate how organizational scholars can adopt this approach without sacrificing rigor or interpretability. The piece bridges computational prediction and traditional explanatory organizational science.","relevance":"Directly addresses the methodological challenge of using machine learning responsibly in I-O/OB research, a core need as computational methods become more common.","contribution":"Offers a practical, replicable framework for pairing predictive machine learning with explainability techniques tailored to organizational science questions.","uses":"Ideal methods reading for a computational methods or data science session; useful for students planning to incorporate ML into thesis/dissertation work.","cluster":"AI in Personnel Selection, Assessment \u0026 Trust + Vocational Interest Measurement Methods","themes":["AI \u0026 Future of Work","Training \u0026 Development","Big Data \u0026 Methods"]},{"date":"2026-07-04","topic":"Work Engagement — Theory/Review","authors":"Hakanen, J. J., \u0026 Kaltiainen, J.","year":"2026","title":"Work Engagement: Feeling Happy, Motivated, and Resilient at Work","journal":"Annual Review of Organizational Psychology and Organizational Behavior","cite":"13, (article in press/early view)","doi":"https://doi.org/10.1146/annurev-orgpsych-020924-064233","summary":"This review synthesizes over two decades of work engagement research, defining engagement as an affective-motivational state of vigor, dedication, and absorption. The authors summarize key antecedents (job and personal resources) and consequences (performance, well-being, resilience) drawn from the Job Demands-Resources tradition. The review also extends engagement research into newer contexts, including remote work, teams, and organizational change. It closes with an agenda highlighting measurement and boundary-condition questions for future study.","relevance":"Provides an up-to-date, authoritative overview of the engagement construct that anchors seminar discussion of worker motivation and well-being in changing work contexts.","contribution":"Consolidates two decades of engagement scholarship into a single current review, updating the JD-R-based engagement narrative for hybrid/remote work realities.","uses":"Excellent as an anchor/overview reading for a seminar session on engagement and motivation; useful for grant background sections and as a citation hub for further reading.","cluster":"Work Engagement \u0026 Work Motivation: foundational theory (SDT, engagement construct), meta-analytic evidence, and recent daily-diary dynamics linking job crafting and engagement","themes":["Job Design, Crafting \u0026 Motivation"]},{"date":"2026-07-04","topic":"Work Engagement — Meta-Analysis","authors":"Christian, M. S., Garza, A. S., \u0026 Slaughter, J. E.","year":"2011","title":"Work Engagement: A Quantitative Review and Test of Its Relations With Task and Contextual Performance","journal":"Personnel Psychology","cite":"64(1), 89–136","doi":"https://doi.org/10.1111/j.1744-6570.2010.01203.x","summary":"This foundational meta-analysis (71 samples) tests whether engagement is empirically distinct from related job attitudes such as job satisfaction and involvement. Using meta-analytic path modeling, the authors show engagement has discriminant and incremental validity in predicting task and contextual performance beyond existing attitude constructs. The study also tests a nomological network linking distal antecedents (e.g., job characteristics, leadership) to engagement to performance. Results support engagement as a distinct, motivationally meaningful construct with a clear performance payoff.","relevance":"A cornerstone empirical validation of the engagement construct that graduate students need before evaluating newer applied-AI-era engagement research.","contribution":"First large-scale meta-analytic test establishing engagement's discriminant validity and its mediating role between antecedents and job performance.","uses":"Core required reading for construct-validity discussions; useful as a methods exemplar of meta-analytic path modeling.","cluster":"Work Engagement \u0026 Work Motivation: foundational theory (SDT, engagement construct), meta-analytic evidence, and recent daily-diary dynamics linking job crafting and engagement","themes":["Job Design, Crafting \u0026 Motivation"]},{"date":"2026-07-04","topic":"Job Engagement — Foundational Empirical","authors":"Rich, B. L., LePine, J. A., \u0026 Crawford, E. R.","year":"2010","title":"Job Engagement: Antecedents and Effects on Job Performance","journal":"Academy of Management Journal","cite":"53(3), 617–635","doi":"https://doi.org/10.5465/amj.2010.51468988","summary":"Using a field sample of 245 firefighters and their supervisors, this study conceptualizes job engagement as investment of the 'whole self' (physical, cognitive, emotional) into a work role. The authors show engagement mediates the relationships between value congruence, perceived organizational support, core self-evaluations, and two performance outcomes: task performance and organizational citizenship behavior. Critically, engagement outperforms job satisfaction, job involvement, and intrinsic motivation as an explanatory mechanism. The paper remains among the most cited empirical demonstrations that engagement adds unique explanatory power for performance.","relevance":"Offers a rigorous field test of engagement theory with objective performance data, complementing the Christian et al. meta-analysis with a single well-designed empirical study.","contribution":"Introduces and tests a multidimensional, whole-self conceptualization of engagement and demonstrates its incremental validity over competing motivational constructs.","uses":"Strong empirical companion reading to pair with theoretical/meta-analytic pieces; useful example of mediation analysis in seminar discussion of research design.","cluster":"Work Engagement \u0026 Work Motivation: foundational theory (SDT, engagement construct), meta-analytic evidence, and recent daily-diary dynamics linking job crafting and engagement","themes":["Job Design, Crafting \u0026 Motivation"]},{"date":"2026-07-04","topic":"Work Motivation — Self-Determination Theory","authors":"Gagné, M., \u0026 Deci, E. L.","year":"2005","title":"Self-Determination Theory and Work Motivation","journal":"Journal of Organizational Behavior","cite":"26(4), 331–362","doi":"https://doi.org/10.1002/job.322","summary":"This widely cited theoretical article extends self-determination theory (SDT) to organizational settings, differentiating types of extrinsic motivation by their degree of internalization/autonomy rather than treating intrinsic and extrinsic motivation as a simple dichotomy. The authors argue that autonomous forms of motivation (even when extrinsically originated) predict better performance, persistence, and well-being than controlled motivation. The paper reviews organizational applications including compensation, goal-setting, and leadership, and lays groundwork for decades of subsequent SDT-based work motivation research. It was later recognized as one of the most influential articles in the Journal of Organizational Behavior's history.","relevance":"Provides the core theoretical foundation (SDT) underlying most contemporary work motivation and engagement research covered elsewhere in the seminar.","contribution":"Reframes the intrinsic/extrinsic motivation dichotomy into a continuum of autonomous vs. controlled motivation, reshaping how organizational scholars study motivation.","uses":"Essential theory reading to precede empirical/meta-analytic motivation pieces; useful for framing discussion questions about autonomy in AI-mediated or algorithmically managed work.","cluster":"Work Engagement \u0026 Work Motivation: foundational theory (SDT, engagement construct), meta-analytic evidence, and recent daily-diary dynamics linking job crafting and engagement","themes":["Job Design, Crafting \u0026 Motivation"]},{"date":"2026-07-04","topic":"Work Motivation — SDT Meta-Analysis","authors":"Van den Broeck, A., Howard, J. L., Van Vaerenbergh, Y., Leroy, H., \u0026 Gagné, M.","year":"2021","title":"Beyond Intrinsic and Extrinsic Motivation: A Meta-Analysis on Self-Determination Theory's Multidimensional Conceptualization of Work Motivation","journal":"Organizational Psychology Review","cite":"11(3), 240–273","doi":"https://doi.org/10.1177/20413866211006173","summary":"This meta-analysis quantitatively tests SDT's multidimensional motivation continuum (from amotivation to intrinsic motivation) against a wide range of organizational outcomes. Aggregating dozens of studies, the authors find that more autonomous forms of motivation show increasingly positive relationships with performance, well-being, and attitudinal outcomes, supporting SDT's simplex pattern. The study also demonstrates that intrinsic and identified motivation add unique predictive value beyond a simple autonomous/controlled dichotomy. This is the most comprehensive quantitative test to date of SDT's multidimensional conceptualization in work settings.","relevance":"Provides current meta-analytic evidence for the SDT framework introduced by Gagné and Deci, letting students see how foundational theory has since been empirically validated at scale.","contribution":"First meta-analysis to test SDT's full multidimensional motivation taxonomy (rather than a binary intrinsic/extrinsic split) against organizational outcomes.","uses":"Pairs directly with the Gagné \u0026 Deci (2005) theory piece for a theory-then-evidence teaching sequence; useful methods example of testing a theorized continuum meta-analytically.","cluster":"Work Engagement \u0026 Work Motivation: foundational theory (SDT, engagement construct), meta-analytic evidence, and recent daily-diary dynamics linking job crafting and engagement","themes":["Job Design, Crafting \u0026 Motivation"]},{"date":"2026-07-04","topic":"Work Engagement \u0026 Job Crafting — Daily Diary Study","authors":"Apenbrink, K. S., \u0026 Kuhlmann, R.","year":"2025","title":"Daily Gain Cycles in Hybrid Work Environments: A Multilevel Study on the Reciprocal Interplay of Job Crafting, Psychological Capital, and Work Engagement","journal":"Journal of Business and Psychology","cite":"41(3), 673–695","doi":"https://doi.org/10.1007/s10869-025-10070-3","summary":"Grounded in multilevel Job Demands-Resources theory, this daily diary study (192 employees, 1,433 daily observations) tests reciprocal 'gain cycle' relationships among job crafting, psychological capital, and work engagement. Results show positive reciprocal links for seeking resources and seeking challenges, but a negative reciprocal relationship for reducing demands, with effects differing between office and remote workdays. Personality traits moderated the gain cycle, while general well-being showed direct but not moderating effects. The study offers fine-grained evidence on how proactive daily behaviors sustain (or fail to sustain) engagement in hybrid work arrangements.","relevance":"Brings the engagement/motivation literature into the present-day hybrid work context, directly relevant to the seminar's future-of-work framing.","contribution":"Demonstrates day-level reciprocal (rather than static) dynamics between job crafting, personal resources, and engagement, and shows these dynamics depend on work location.","uses":"Recent empirical example (last 12 months) for discussing diary/experience-sampling methods and hybrid work implications; good discussion piece on boundary conditions of engagement interventions.","cluster":"Work Engagement \u0026 Work Motivation: foundational theory (SDT, engagement construct), meta-analytic evidence, and recent daily-diary dynamics linking job crafting and engagement","themes":["Remote \u0026 Hybrid Work","Job Design, Crafting \u0026 Motivation"]},{"date":"2026-07-03","topic":"Human-AI Teaming — Trust \u0026 Design","authors":"Mirowska, A., \u0026 Arsenyan, J.","year":"2025","title":"The A(I) Team: Effects of Human-Likeness and Conformity to Gender Stereotypes on Initial Trust and Willingness to Work With an AI Teammate","journal":"Journal of Organizational Behavior","cite":"Advance online publication","doi":"https://doi.org/10.1002/job.70009","summary":"This experimental study examines how an AI teammate's visual human-likeness and conformity to gender stereotypes shape uncanny valley reactions, initial trust, and employees' willingness to work with the AI agent on a team. Drawing on uncanny valley theory and social role theory, the authors manipulate the AI agent's appearance and gendered presentation to test effects on eeriness, trust, and team-inclusion preferences. Results show human-likeness and stereotype conformity interact to shape trust judgments, with implications for how organizations design and introduce AI teammates. The study extends uncanny valley and gender-stereotype research from human-robot interaction into organizational team contexts.","relevance":"Directly relevant to I-O research on team composition, trust formation, and the social psychology of introducing AI agents as teammates rather than tools.","contribution":"Extends uncanny valley theory and gender-stereotype research to organizational human-AI teaming, showing how AI design choices shape initial trust and team acceptance.","uses":"Useful for seminar discussion on AI teammate design and bias; informs research on AI agent presentation and workforce trust; relevant to HR/IT decisions about AI avatar design.","cluster":"Human-AI Teaming, Trust \u0026 Team-Level Organizational Behavior","themes":["AI \u0026 Future of Work","Diversity, Equity \u0026 Inclusion","Teams \u0026 Collaboration"]},{"date":"2026-07-03","topic":"Human-AI Teaming — Cooperation \u0026 Stereotypes","authors":"Tu, Y., Li, J., Chen, J., Li, C.-J., \u0026 He, W.","year":"2025","title":"When AI Becomes My Teammate: Unpacking How Employees Perceive and Collaborate With Gendered AI Teammates","journal":"Journal of Organizational Behavior","cite":"Advance online publication","doi":"https://doi.org/10.1002/job.70038","summary":"Across three studies (a vignette experiment, N=163; an interactive experiment, N=465; and a preregistered field survey, N=155), this paper integrates social perception theory (warmth/competence) and social role theory to examine how employees perceive and cooperate with AI teammates relative to human teammates, and how gendering the AI shifts these perceptions. Employees perceived AI teammates as more competent but less warm than human teammates; competence advantages boosted cooperation while warmth deficits undermined it. Female-presenting AI compensated for warmth deficits but reduced perceived competence, while male-presenting AI amplified competence perceptions but worsened warmth deficits, revealing a gendered design trade-off.","relevance":"Provides rigorous multi-study empirical evidence on warmth-competence dynamics shaping employee cooperation with AI teammates, directly relevant to team-level OB and human-AI collaboration research.","contribution":"First to empirically demonstrate a warmth-competence trade-off tied to AI gendering in workplace teams, extending the stereotype content model to human-AI teaming.","uses":"Strong candidate for required reading on human-AI teaming; useful as a multi-study design exemplar for methods teaching; informs practitioner guidance on AI agent design.","cluster":"Human-AI Teaming, Trust \u0026 Team-Level Organizational Behavior","themes":["AI \u0026 Future of Work","Diversity, Equity \u0026 Inclusion","Teams \u0026 Collaboration"]},{"date":"2026-07-03","topic":"Human-AI Collaboration — Theory","authors":"Stelmaszak, M., Joshi, M., \u0026 Constantiou, I.","year":"2026","title":"Artificial Intelligence as an Organizing Capability Arising from Human-Algorithm Relations","journal":"Journal of Management Studies","cite":"63(2), 335-365","doi":"https://doi.org/10.1111/joms.70003","summary":"This conceptual article proposes an ontological shift in how organizational scholars theorize AI, moving away from viewing it as an independent entity acting upon organizations and toward understanding AI as an organizing capability that emerges from relations among human and algorithmic actors. The authors characterize this capability through the properties of connectivity, codependence, and emergence, explaining how it contributes to organizational analyzing, learning, and acting. Published as part of a JMS special issue on AI's organizational possibilities and pitfalls, the paper offers a relational, sociomaterial framework for future empirical research.","relevance":"Offers a theoretical lens for I-O and OB scholars seeking to move beyond simplistic 'AI as tool' or 'AI as agent' framings toward a relational understanding of AI in organizations.","contribution":"Introduces an organizing-capability framework grounded in relational/sociomaterial theory, providing new theoretical vocabulary (connectivity, codependence, emergence) for studying AI-organization relations.","uses":"Suitable for theory-focused seminar discussion; useful for framing dissertation or grant proposals theorizing AI's organizational role; complements empirical human-AI teaming readings.","cluster":"Human-AI Teaming, Trust \u0026 Team-Level Organizational Behavior","themes":["AI \u0026 Future of Work","Algorithmic Management \u0026 Surveillance","Teams \u0026 Collaboration"]},{"date":"2026-07-03","topic":"Human-AI Teaming — Conceptual Model","authors":"Georganta, E., \u0026 Ulfert, A.-S.","year":"2024","title":"Would You Trust an AI Team Member? Team Trust in Human-AI Teams","journal":"Journal of Occupational and Organizational Psychology","cite":"97(3), 1212-1241","doi":"https://doi.org/10.1111/joop.12504","summary":"This paper develops a conceptual model of team trust in human-AI teams (HATs), integrating team-trust literature with human-AI interaction research to identify antecedents (e.g., AI transparency, reliability, anthropomorphism) and dynamics of trust formation when AI is treated as a team member rather than a tool. The co-first authors distinguish HAT trust from both interpersonal trust and human-automation trust, proposing that trust in HATs develops multi-directionally among human and AI members. The model has implications for team design, onboarding of AI teammates, and measurement of trust in mixed human-AI teams.","relevance":"Central to I-O/occupational psychology research on trust, team dynamics, and the changing nature of 'team membership' as AI agents are integrated into work teams.","contribution":"Provides one of the first integrative conceptual models of team-level (rather than dyadic) trust specific to human-AI teams, bridging team dynamics and human-AI interaction literatures.","uses":"Strong theoretical foundation for course units on trust and human-AI teaming; useful for developing trust measures in future empirical work; supports lit reviews bridging OB and human factors research.","cluster":"Human-AI Teaming, Trust \u0026 Team-Level Organizational Behavior","themes":["AI \u0026 Future of Work","Teams \u0026 Collaboration"]},{"date":"2026-07-03","topic":"Human-AI Collaboration — Meta-Analysis","authors":"Vaccaro, M., Almaatouq, A., \u0026 Malone, T. W.","year":"2024","title":"When Combinations of Humans and AI Are Useful: A Systematic Review and Meta-Analysis","journal":"Nature Human Behaviour","cite":"8(12), 2293-2303","doi":"https://doi.org/10.1038/s41562-024-02024-1","summary":"This preregistered systematic review and meta-analysis synthesizes 106 experimental studies (370 effect sizes, published January 2020-June 2023) comparing the performance of human-AI combinations against the best of humans or AI working alone. On average, human-AI combinations performed significantly worse than the best-performing counterpart (human or AI alone), contradicting the common assumption that combining humans and AI necessarily improves performance. Task type moderated results: human-AI teams showed performance losses on decision-making tasks but gains on content-creation tasks, suggesting complementarity is task-contingent rather than universal.","relevance":"Provides rigorous meta-analytic evidence directly relevant to debates about human-AI collaboration effectiveness in the workplace, a foundational reference for any I-O course unit on human-AI teaming.","contribution":"First large-scale meta-analysis quantifying when human-AI combinations help versus hurt performance, identifying task type as a key moderating boundary condition.","uses":"Ideal as a methods/meta-analysis reading for teaching evidence synthesis; essential citation for grant proposals or lit reviews on human-AI collaboration; useful debate/critique reading challenging techno-optimist assumptions.","cluster":"Human-AI Teaming, Trust \u0026 Team-Level Organizational Behavior","themes":["AI \u0026 Future of Work","Teams \u0026 Collaboration"]},{"date":"2026-07-02","topic":"AI-Based Assessment \u0026 Algorithmic Fairness","authors":"van den Broek, E.; Sergeeva, A. V.; Huysman, M.","year":"2025","title":"Is There Fairness in AI?","journal":"Journal of Management Studies","cite":"Advance online publication","doi":"https://doi.org/10.1111/joms.13276","summary":"An ethnographic study of an HR department at a large multinational that introduced AI into hiring. The authors trace how HR professionals and hiring managers enacted competing definitions of fairness (e.g., consistency vs. individualized judgment) as they worked with the AI system day to day. Findings show fairness is not a fixed property engineered into an algorithm but an ongoing accomplishment negotiated through practice. The study challenges purely technical or procedural conceptions of algorithmic fairness common in computer science.","relevance":"Directly relevant to Topic 4 (AI-Based Assessment, Selection, and High-Stakes Decision Making) and Topic 10 (Ethics, Equity, and Inclusion); offers a practice-based counterpoint to variance/statistical definitions of algorithmic fairness typically used in selection research.","contribution":"Reframes 'algorithmic fairness' as socially constructed and situated rather than a fixed technical property, contributing to organizational theory on sensemaking around AI.","uses":"Strong seminar discussion anchor for debating technical vs. socio-organizational fairness; useful for qualitative methods discussion; pairs well with quantitative fairness/bias papers.","cluster":"Algorithmic Fairness, Equity \u0026 AI Perceptions at Work","themes":["AI \u0026 Future of Work","Algorithmic Management \u0026 Surveillance","Assessment \u0026 Selection","Diversity, Equity \u0026 Inclusion"]},{"date":"2026-07-02","topic":"Algorithmic Management \u0026 Employee Perceptions","authors":"Tandon, A.; Dhir, A.; Malik, A.; Budhwar, P.; Kaur, P.","year":"2025","title":"Exploring the Duality of Perceptions: Insights into Uncertainties, Aversion and Appreciation Towards Algorithmic HRM","journal":"Human Resource Management","cite":"64(2), 583-616","doi":"https://doi.org/10.1002/hrm.22263","summary":"Qualitative study based on written responses from 58 HR professionals in the UK and US, analyzed using grounded theory. The authors identify four themes explaining why algorithmic HRM provokes simultaneous aversion and appreciation among HR practitioners, including concerns about loss of professional judgment alongside recognition of efficiency gains. The paper develops a duality framework rather than treating aversion and appreciation as mutually exclusive employee reactions.","relevance":"Speaks to Topic 5 (Algorithmic Management, Surveillance, and Worker Control) and Topic 4 (AI-Based Assessment/Selection) by centering the HR practitioner's (not just applicant's) lived experience of algorithmic systems.","contribution":"Introduces a duality (rather than binary aversion/appreciation) framework for understanding professional reactions to algorithmic HRM tools.","uses":"Good empirical qualitative example for methods discussion; useful for case-based seminar exercises on HR technology adoption.","cluster":"Algorithmic Fairness, Equity \u0026 AI Perceptions at Work","themes":["Algorithmic Management \u0026 Surveillance"]},{"date":"2026-07-02","topic":"AI-Based Assessment \u0026 Algorithmic Fairness","authors":"Lu, J. G.; Qin, X.; Chen, C.; Zhou, H.; Dong, X.; Cao, L.; Zhou, X.; Wu, D.","year":"2025","title":"AI Aversion or Appreciation? A Capability-Personalization Framework and a Meta-Analytic Review","journal":"Psychological Bulletin","cite":"151(5), 580-599","doi":"https://doi.org/10.1037/bul0000477","summary":"Large-scale meta-analysis synthesizing 442 effect sizes from 163 studies (N = 82,078) on when people prefer AI versus human judgment. The authors propose a capability-personalization framework: AI appreciation occurs when AI is seen as more capable than humans and personalization needs are low, while aversion occurs when either condition is reversed. The framework reconciles previously mixed findings across domains including hiring, medicine, and consumer choice.","relevance":"Provides a theoretically integrative, well-powered synthesis directly applicable to Topic 4 (AI-based selection/decision making) and Topic 2 (AI, Automation, and Job Transformation); a strong methods/meta-analysis exemplar.","contribution":"Resolves conflicting algorithm aversion/appreciation literatures with a single moderator-based framework and the largest meta-analytic test to date.","uses":"Excellent methods reading for teaching meta-analysis; strong theoretical anchor for a lecture on human reactions to algorithmic decisions.","cluster":"Algorithmic Fairness, Equity \u0026 AI Perceptions at Work","themes":["AI \u0026 Future of Work","Algorithmic Management \u0026 Surveillance","Assessment \u0026 Selection","Diversity, Equity \u0026 Inclusion"]},{"date":"2026-07-02","topic":"Careers \u0026 Vocational Behavior in AI Contexts","authors":"Voigt, J.; Strauss, K.","year":"2024","title":"How Future Work Self Salience Shapes the Effects of Interacting with Artificial Intelligence","journal":"Journal of Vocational Behavior","cite":"155, Article 104054","doi":"https://doi.org/10.1016/j.jvb.2024.104054","summary":"Two-study design (a longitudinal experiment with UK full-time employees, N = 174, and a replication with German business students, N = 208) testing whether future work self salience (FWSS) moderates how interacting with AI affects perceived control over one's future work self and proactive career behavior. Employees high in FWSS showed increased perceived control and proactive career behavior after AI interaction, while those low in FWSS did not. Results were consistent across both samples.","relevance":"Connects Topic 2 (AI, Automation, and Job Transformation) with vocational/career theory (Topic 6/7), showing individual differences shape how workers respond to AI exposure rather than uniform threat or opportunity effects.","contribution":"Extends future work self theory into the AI era and demonstrates a boundary condition for AI's effects on proactive career behavior.","uses":"Useful empirical example for career development modules; good for illustrating experimental + replication design in vocational psychology.","cluster":"Algorithmic Fairness, Equity \u0026 AI Perceptions at Work","themes":["AI \u0026 Future of Work","Careers \u0026 Vocational Behavior"]},{"date":"2026-07-02","topic":"Ethics, Equity \u0026 Inclusion — Disability at Work","authors":"Colella, A.; Boehm, S. A.","year":"2026","title":"Disability and Employment in Transition: Challenges, Innovations, and Opportunities","journal":"Annual Review of Organizational Psychology and Organizational Behavior","cite":"13, 277-307","doi":"https://doi.org/10.1146/annurev-orgpsych-110622-055845","summary":"Comprehensive review of the disability-and-employment literature covering hiring, accommodation, disclosure decisions, and the emerging role of AI-driven recruitment and accommodation technologies. The authors synthesize innovations (e.g., inclusive AI design, universal design principles) alongside persistent challenges such as disclosure stigma and algorithmic exclusion risks. The review proposes a research agenda for disability-inclusive I-O psychology.","relevance":"Fills a gap in current course coverage of Topic 10 (Ethics, Equity, and Inclusion) by centering disability, an underrepresented equity dimension relative to age/gender in prior digest entries; also touches Topic 4 and 5 via AI recruitment/accommodation technology.","contribution":"Authoritative, current state-of-the-field review consolidating quantitative and qualitative disability-employment research with explicit attention to AI-era risks and opportunities.","uses":"Strong required/background reading for an equity-focused seminar week; useful literature-review model for students writing their own reviews.","cluster":"Algorithmic Fairness, Equity \u0026 AI Perceptions at Work","themes":["Diversity, Equity \u0026 Inclusion"]},{"date":"2026-07-01","topic":"Human-AI Collaboration \u0026 Worker Well-Being","authors":"Klonek, F., \u0026 Parker, S. K.","year":"2025","title":"Does AI at Work Increase Stress? Text Mining Social Media About Human–AI Team Processes and AI Control","journal":"Journal of Organizational Behavior","cite":"Advance online publication","doi":"https://doi.org/10.1002/job.70000","summary":"Using a trained large language model validated against human ratings, the authors analyzed over 2,700 tweets to test whether AI control over decision-making increases workplace stress. They found high AI control was associated with increased stress, while human–AI team processes (transition, action, interpersonal) were associated with decreased stress, with action and interpersonal processes buffering the stress-enhancing effect of AI control.","relevance":"Directly tests a core I-O question — how AI autonomy/control in teams affects worker stress — using novel computational text-mining methods on real-world social media data rather than lab vignettes.","contribution":"Introduces a scalable text-mining approach to studying human-AI team dynamics 'in the wild' and extends team process theory (transition/action/interpersonal processes) to human-AI teaming contexts.","uses":"Useful for seminar discussion on algorithmic control and stress; strong methods example for teaching computational/text-mining approaches; citable in grant proposals on AI-related occupational health.","cluster":"Algorithmic Management \u0026 Human-AI Teaming","themes":["AI \u0026 Future of Work","Well-Being \u0026 Occupational Health","Teams \u0026 Collaboration","Big Data \u0026 Methods"]},{"date":"2026-07-01","topic":"Algorithmic Management — Methods","authors":"Parent-Rocheleau, X., Parker, S. K., Bujold, A., \u0026 Gaudet, M. C.","year":"2024","title":"Creation of the Algorithmic Management Questionnaire: A Six-Phase Scale Development Process","journal":"Human Resource Management","cite":"63(1), 25-44","doi":"https://doi.org/10.1002/hrm.22185","summary":"The authors develop and validate the Algorithmic Management Questionnaire (AMQ), a psychometric instrument measuring workers' subjective exposure to algorithmic management functions (e.g., monitoring, goal-setting, evaluation, discipline). Using a rigorous six-phase scale-development process across multiple samples, they establish the measure's factor structure, reliability, and validity. The AMQ enables quantitative research distinguishing specific algorithmic management functions rather than treating algorithmic management as a monolithic construct.","relevance":"Provides the field's most rigorously validated measure of algorithmic management exposure, filling a critical methodological gap for I-O/OBHR researchers studying AI at work empirically.","contribution":"Methodological contribution: a validated, multidimensional scale that operationalizes algorithmic management for quantitative organizational research, distinguishing among management functions algorithms perform.","uses":"Ideal methods reading for teaching scale development; directly usable instrument for student research projects or dissertations on algorithmic management.","cluster":"Algorithmic Management \u0026 Human-AI Teaming","themes":["Algorithmic Management \u0026 Surveillance","Big Data \u0026 Methods"]},{"date":"2026-07-01","topic":"Human-AI Teaming — Theory/Commentary","authors":"Bezrukova, K., \u0026 Griffith, T. L.","year":"2025","title":"Post-Public AI: Research in Groups and Teams","journal":"Small Group Research","cite":"56(5), 799-820","doi":"https://doi.org/10.1177/10464964251363458","summary":"This conceptual piece argues that the 2022 public release of ChatGPT marks a turning point requiring reconceptualization of group and team research, distinguishing a 'pre-public AI' era from a 'post-public AI' era in which most team members now have everyday AI experience. Building on Katzenbach and Smith's classic team definition, the authors identify how AI reshapes team composition, complementary skills, shared purpose, and accountability, and call for methodological innovation and interdisciplinary partnerships.","relevance":"Offers a timely conceptual framework for updating decades-old team theory in light of generative AI, directly relevant to I-O scholars studying teams, groups, and collaboration.","contribution":"Theoretical contribution: proposes a pre-/post-public AI historical framing for team research and identifies specific team-theory constructs (composition, accountability, shared purpose) that require revision.","uses":"Good discussion-starter for a seminar session on how classic OB/team theories need updating for the AI era; useful framing device for literature reviews.","cluster":"Algorithmic Management \u0026 Human-AI Teaming","themes":["AI \u0026 Future of Work","Teams \u0026 Collaboration"]},{"date":"2026-07-01","topic":"Algorithmic Control — Foundational Theory","authors":"Kellogg, K. C., Valentine, M. A., \u0026 Christin, A.","year":"2020","title":"Algorithms at Work: The New Contested Terrain of Control","journal":"Academy of Management Annals","cite":"14(1), 366-410","doi":"https://doi.org/10.5465/annals.2018.0174","summary":"This widely cited review synthesizes cross-disciplinary research (sociology, management, information science) on algorithmic control in organizations, identifying six mechanisms by which algorithms direct, evaluate, and discipline workers: restricting, recommending, recording, rating, replacing, and rewarding. The authors argue algorithmic control represents a genuinely new and more opaque, adaptive, and totalizing form of workplace control compared to prior bureaucratic and technical control regimes, and outline a research agenda around worker responses and resistance.","relevance":"Foundational theoretical anchor for the algorithmic management literature; essential background for any I-O/OBHR seminar unit on AI, surveillance, or worker control.","contribution":"Theoretical contribution: a widely adopted six-mechanism typology of algorithmic control that has organized subsequent empirical research across management and I-O psychology.","uses":"Core required reading for establishing shared vocabulary before diving into empirical algorithmic-management studies; strong literature-review anchor citation.","cluster":"Algorithmic Management \u0026 Human-AI Teaming","themes":["Algorithmic Management \u0026 Surveillance"]},{"date":"2026-07-01","topic":"Human-AI Teaming — Review","authors":"Schmutz, J. B., Outland, N., Kerstan, S., Georganta, E., \u0026 Ulfert, A.-S.","year":"2024","title":"AI-Teaming: Redefining Collaboration in the Digital Era","journal":"Current Opinion in Psychology","cite":"58, 101837","doi":"https://doi.org/10.1016/j.copsyc.2024.101837","summary":"This review synthesizes emerging research on 'AI-teaming,' where AI systems function as active collaborators rather than passive tools within human teams. The authors integrate team science and human factors perspectives to outline how shared mental models, coordination, and trust must be reconceptualized when AI agents are treated as team members, and propose a research agenda for studying hybrid human-AI team performance.","relevance":"Bridges mature team-science theory (shared mental models, coordination) with emerging human-AI collaboration research, useful for situating agentic AI within established I-O team frameworks.","contribution":"Synthesizes human factors and team-science literatures into a coherent 'AI-teaming' framework, extending classic team constructs (shared mental models, coordination) to human-AI contexts.","uses":"Useful recommended reading to pair with empirical human-AI teaming studies; good for grounding lit reviews in established team theory before extending to AI.","cluster":"Algorithmic Management \u0026 Human-AI Teaming","themes":["AI \u0026 Future of Work","Teams \u0026 Collaboration"]},{"date":"2026-07-01","topic":"Algorithmic Decision-Making — Classic Empirical","authors":"Logg, J. M., Minson, J. A., \u0026 Moore, D. A.","year":"2019","title":"Algorithm Appreciation: People Prefer Algorithmic to Human Judgment","journal":"Organizational Behavior and Human Decision Processes","cite":"151, 90-103","doi":"https://doi.org/10.1016/j.obhdp.2018.12.005","summary":"Across six experiments, the authors find that laypeople adhere more to advice when told it comes from an algorithm rather than a person, challenging the prevailing 'algorithm aversion' narrative in prior literature. The effect held across professional and lay populations and multiple judgment tasks, though appreciation was attenuated when people could compare their own judgment to the algorithm's.","relevance":"A foundational, highly cited counterpoint to algorithm-aversion research, essential for understanding how workers and decision-makers actually respond to AI-generated recommendations in organizational settings.","contribution":"Empirical/theoretical contribution: established 'algorithm appreciation' as a documented phenomenon, reshaping subsequent research on trust and reliance in human-AI decision-making.","uses":"Classic debate/critique reading to pair with algorithm-aversion studies; excellent for teaching experimental design in judgment-and-decision-making research.","cluster":"Algorithmic Management \u0026 Human-AI Teaming","themes":["Algorithmic Management \u0026 Surveillance"]},{"date":"2026-06-30","topic":"Technostress \u0026 Digital Demands","authors":"Xu, A. J., Sun, H., \u0026 Ma, J.","year":"2026","title":"Does After-Hours Telepressure Increase Next-Day Emotional Exhaustion or Cognitive Flexibility? The Role of Different Work-Related Rumination Processes","journal":"Human Resource Management","cite":"65(3), 799–821","doi":"https://doi.org/10.1002/hrm.70050","summary":"This daily diary study (N = 244 employees across 10 workdays) examines how after-hours telepressure operates through two distinct bedtime rumination processes. Evening affective rumination mediates the positive link from after-hours telepressure to next-day emotional exhaustion, while evening problem-solving pondering mediates a positive link to next-morning cognitive flexibility. The study reveals simultaneous harmful and beneficial downstream effects of after-hours work message pressure.","relevance":"Demonstrates dual-pathway effects of after-hours connectivity on worker well-being and performance, directly relevant to I-O research on technostress, recovery, and boundary management in digital work contexts.","contribution":"Distinguishes affective rumination from problem-solving pondering as competing mediators, explaining why the same technostress stressor (after-hours telepressure) produces both harm (exhaustion) and benefit (cognitive flexibility) depending on the type of evening rumination activated.","uses":"Teaching boundary management and recovery theories; empirical evidence for HR policies around right-to-disconnect; research on daily fluctuations in well-being; lit reviews on technostress and burnout.","cluster":"Technostress, Digital Demands \u0026 Technology-Work Boundaries","themes":["Well-Being \u0026 Occupational Health","Technostress \u0026 Digital Demands"]},{"date":"2026-06-30","topic":"Technostress \u0026 Digital Demands","authors":"Barber, L. K., Santuzzi, A. M., \u0026 Hu, X.","year":"2026","title":"Tackling the Problem of Workplace Telepressure: Are Disconnection Policies Helpful?","journal":"Group \u0026 Organization Management","cite":"51(1), 498–509","doi":"https://doi.org/10.1177/10596011231206206","summary":"Across two employee surveys, this study tests whether formal organizational disconnection policies reduce workplace telepressure—the preoccupation with rapid response to work messages. Contrary to expectations, policy existence was not associated with lower telepressure. Instead, implicit norms around after-hours availability and low family-supportive organizational culture were the key predictors. Formal policies without corresponding cultural shifts appear insufficient to reduce digital boundary violations.","relevance":"Directly informs HR practice around technology policies and right-to-disconnect legislation by showing that formal policies alone are insufficient without cultural and normative change—highly relevant to future of work and occupational health discussions.","contribution":"Demonstrates the gap between formal organizational policy and informal norms as determinants of technostress, with implications for intervention design and policy evaluation in HR management.","uses":"Seminar discussion of policy vs. culture; evidence for critical evaluation of 'right to disconnect' policies; HRM intervention design; future research on organizational climate and technostress.","cluster":"Technostress, Digital Demands \u0026 Technology-Work Boundaries","themes":["Well-Being \u0026 Occupational Health","Technostress \u0026 Digital Demands"]},{"date":"2026-06-30","topic":"Work Recovery \u0026 Detachment","authors":"Sonnentag, S., \u0026 Wiegelmann, M.","year":"2024","title":"Not detaching from work during leisure time: A control-theory perspective on job-related cognitions","journal":"Journal of Organizational Behavior","cite":"45(7), 1003–1024","doi":"https://doi.org/10.1002/job.2792","summary":"Drawing on control theory, this two-wave study (N = 305 employees) examines why workers fail to psychologically detach during leisure time by identifying specific types of job-related cognitions: discrepancy-related thoughts, instrumental work thoughts, and anticipatory thoughts. Discrepancy-related and instrumental work thoughts predicted heightened negative affect and reduced positive affect the next day, elucidating cognitive mechanisms of non-detachment. The study advances understanding of what makes workers 'stay at work' mentally even when physically absent.","relevance":"Directly relevant to I-O and occupational health psychology research on recovery, work-nonwork boundary management, and the cognitive consequences of digital connectivity that makes psychological detachment increasingly difficult.","contribution":"Applies control theory to identify specific thought-process types (not just global rumination) that mediate the link between work demands and non-detachment, offering a finer-grained model of cognitive mechanisms in work recovery.","uses":"Foundational for teaching recovery theory; empirical basis for detachment-focused interventions; literature reviews on work-nonwork boundary management; stimulus for research on boundary-blurring technology effects.","cluster":"Technostress, Digital Demands \u0026 Technology-Work Boundaries","themes":["Well-Being \u0026 Occupational Health"]},{"date":"2026-06-30","topic":"Remote Work \u0026 Hybrid Work","authors":"Gajendran, R. S., Ponnapalli, A. R., Wang, C., et al.","year":"2024","title":"A dual pathway model of remote work intensity: A meta-analysis of its simultaneous positive and negative effects","journal":"Personnel Psychology","cite":"77(4), 1351–1386","doi":"https://doi.org/10.1111/peps.12641","summary":"This meta-analysis (k = 110, N = 45,288) proposes and tests a dual pathway model in which remote work intensity simultaneously produces positive effects (via perceived autonomy) and negative effects (via perceived isolation) on job satisfaction, performance, and well-being. The model reconciles conflicting findings in the remote work literature by showing competing mediational mechanisms that operate in parallel. Moderator analyses identify contextual and individual factors that shift the balance between pathways.","relevance":"Provides the most comprehensive quantitative synthesis of remote work effects to date, relevant to understanding how design of remote and hybrid work arrangements affects worker well-being, engagement, and performance in I-O psychology and HRM.","contribution":"Resolves contradictions in the remote work literature through a dual-pathway meta-analytic framework, establishing autonomy and isolation as competing theoretical mechanisms—a model applicable across multiple future of work topics.","uses":"Anchor reading for teaching remote/hybrid work; evidence base for HR policy on flexible work arrangements; meta-analytic methods teaching; lit review foundation for future of work and well-being research.","cluster":"Technostress, Digital Demands \u0026 Technology-Work Boundaries","themes":["Remote \u0026 Hybrid Work"]},{"date":"2026-06-30","topic":"Remote Work \u0026 Hybrid Work","authors":"Thomas, J. J. C., Huyghebaert-Zouaghi, T., Fernet, C., \u0026 Berjot, S.","year":"2026","title":"Understanding remote workers' job demands and resources and their implications for well- and ill-being: Development and validation of a new measure","journal":"Applied Psychology","cite":"75(2), e70076","doi":"https://doi.org/10.1111/apps.70076","summary":"Using a mixed-methods approach across multiple samples (English and French), this study develops and validates the Remote Job Demands and Resources Questionnaire (RJDR-Q), capturing demands specific to remote work (digital overload, social isolation, boundary blurring) and corresponding resources (autonomy, flexibility, social support). JD-R theory guides tests of scale validity and predictive links to well-being and ill-being indicators. The RJDR-Q fills a measurement gap in the remote work literature.","relevance":"Provides a validated instrument for operationalizing remote-specific job demands and resources, directly enabling I-O research on remote worker well-being in post-pandemic and hybrid work contexts.","contribution":"Develops and validates a novel context-specific measure (RJDR-Q) that captures features of remote work not addressed by existing JD-R instruments, making it a methodological contribution to measurement in occupational health research.","uses":"Methods reading for scale development; empirical tool for future remote work research; teaching JD-R theory application; instrument for HR assessment of remote work conditions.","cluster":"Technostress, Digital Demands \u0026 Technology-Work Boundaries","themes":["Remote \u0026 Hybrid Work","Job Design, Crafting \u0026 Motivation"]},{"date":"2026-06-30","topic":"Technostress \u0026 Digital Demands","authors":"Cheng [first name needs verification], et al. [full list needs verification]","year":"2026","title":"The paradox of information and communication technology demands at work on creativity: The moderating effect of job autonomy","journal":"Applied Psychology","cite":"75(1), e70067","doi":"https://doi.org/10.1111/apps.70067","summary":"A three-wave, multisource field study of 368 R\u0026D employees nested in 38 high-tech firms tests a paradox model in which ICT demands exert opposing effects on employee creativity via burnout and learning behavior. Job autonomy moderates these effects: employees with low autonomy experience burnout-mediated creative harm, while those with high autonomy experience learning-mediated creative gains from the same ICT demands. Findings challenge the uniformly negative view of ICT demands in the JD-R literature.","relevance":"Relevant to I-O psychology's study of work design, creativity, and digital demands—showing that ICT demands have conditional positive effects on a key organizational outcome (creativity) depending on job design (autonomy).","contribution":"Establishes job autonomy as a critical boundary condition determining whether ICT demands function as hindrance or challenge stressors, integrating JD-R theory with creativity research and advancing understanding of digital work demands for knowledge workers.","uses":"Teaching ICT demands as challenge vs. hindrance stressors; work design interventions for knowledge workers; future research on boundary conditions of technostress; creativity and innovation research.","cluster":"Technostress, Digital Demands \u0026 Technology-Work Boundaries","themes":["Well-Being \u0026 Occupational Health","Technostress \u0026 Digital Demands"]},{"date":"2026-06-29","topic":"AI-Related Job Insecurity \u0026 Worker Anxiety","authors":"Shoss, M. K.","year":"2017","title":"Job insecurity: An integrative review and agenda for future research","journal":"Journal of Management","cite":"43(6), 1911–1939","doi":"https://doi.org/10.1177/0149206317691574","summary":"This review integrates decades of research on job insecurity by offering a unified definition, typology, and theoretical framework. Shoss distinguishes quantitative from qualitative job insecurity and categorizes antecedents, mechanisms, and outcomes. The review highlights how technological change—including automation and AI—is a key antecedent of job insecurity and maps its effects on performance, health, and organizational behavior. An influential agenda for future research is included.","relevance":"Foundational for any seminar on AI displacement, technology-related job insecurity, or worker well-being. Provides theoretical scaffolding widely cited in contemporary AI-and-work research.","contribution":"Introduces a unified definition and typology of job insecurity (quantitative vs. qualitative; cognitive vs. affective) and a comprehensive causal model. The most widely cited integrative review in this literature.","uses":"Required background reading for AI \u0026 Future of Work and Worker Well-Being seminar weeks; essential for grounding empirical proposals on technology-related job insecurity; lit review foundation.","cluster":"AI-Related Job Insecurity, Worker Anxiety \u0026 Responses","themes":["AI \u0026 Future of Work","Employment Relationships \u0026 Gig Work"]},{"date":"2026-06-29","topic":"AI-Related Job Insecurity \u0026 Worker Anxiety","authors":"Brougham, D., \u0026 Haar, J.","year":"2018","title":"Smart Technology, Artificial Intelligence, Robotics, and Algorithms (STARA): Employees' perceptions of our future workplace","journal":"Journal of Management \u0026 Organization","cite":"24(2), 239–257","doi":"https://doi.org/10.1017/jmo.2016.49","summary":"Using a mixed-methods approach with 120 New Zealand employees, this study introduces the STARA Awareness construct and scale, measuring employees' subjective perceptions of AI/automation threat to their current job. Greater STARA awareness was associated with lower organizational commitment and career satisfaction, and higher turnover intentions, cynicism, and depression. The study established the STARA Awareness measure that has become widely adopted in subsequent AI-and-work empirical research.","relevance":"Introduced the STARA Awareness scale—the most widely used measure of subjective AI displacement threat in I-O/OB research. Directly relevant to AI \u0026 Algorithmic Management and Worker Well-Being topics.","contribution":"Introduces and validates the STARA Awareness construct and measurement scale; one of the most widely cited empirical foundations for studying worker perceptions of AI and automation threat at the individual level.","uses":"Teaching foundational AI perceptions constructs; grounding empirical proposals using STARA Awareness; comparing with newer AI threat/job insecurity measures; longitudinal scale replication.","cluster":"AI-Related Job Insecurity, Worker Anxiety \u0026 Responses","themes":["AI \u0026 Future of Work","Algorithmic Management \u0026 Surveillance","Employment Relationships \u0026 Gig Work"]},{"date":"2026-06-29","topic":"AI-Related Job Insecurity \u0026 Worker Anxiety","authors":"Chung, Y. W., Im, S., Kim, J. E., \u0026 Yun, J. K.","year":"2025","title":"Artificial intelligence awareness, career resilience, job insecurity and behavioural outcomes","journal":"Australian Journal of Psychology","cite":"77(1)","doi":"https://doi.org/10.1080/00049530.2025.2559910","summary":"Using a Korean sample of full-time office employees, this study tested how AI awareness relates to task performance and deviant work behavior via the mediating role of job insecurity. Career resilience was examined as a moderator of the AI awareness–job insecurity link. Results confirmed full mediation through job insecurity, and career resilience significantly buffered the threat appraisal. The model integrates cognitive stress theory with career resilience theory to explain behavioral responses to AI threat.","relevance":"Directly addresses how AI awareness and resulting job insecurity translate into performance and deviant behavior—core I-O outcomes. Career resilience as moderator is actionable for HR practice and employee development programs.","contribution":"Tests a moderated mediation model (AI awareness → job insecurity → behavioral outcomes) with career resilience as a buffer; empirically links AI threat perceptions to behavioral consequences while identifying a protective individual-difference factor.","uses":"Seminar evidence for AI \u0026 worker behavioral outcomes; grounding proposals on career resilience interventions; comparisons across East Asian vs. Western samples; integrating with JD-R and COR literatures.","cluster":"AI-Related Job Insecurity, Worker Anxiety \u0026 Responses","themes":["AI \u0026 Future of Work","Careers \u0026 Vocational Behavior","Employment Relationships \u0026 Gig Work"]},{"date":"2026-06-29","topic":"AI-Related Job Insecurity \u0026 Worker Anxiety","authors":"Kim, B.-J., Kim, M.-J., \u0026 Lee, J.","year":"2025","title":"The dark side of artificial intelligence adoption: Linking artificial intelligence adoption to employee depression via psychological safety and ethical leadership","journal":"Humanities and Social Sciences Communications","cite":"12, Article 704","doi":"https://doi.org/10.1057/s41599-025-05040-2","summary":"Using structural equation modeling, this study found that organizational AI adoption negatively impacts employee psychological safety, which in turn is associated with higher levels of depression. Ethical leadership moderated the negative effect, such that ethical leaders buffered the loss of psychological safety associated with AI adoption. Drawing on social information processing theory, the study explains how the perceived threat of AI in the workplace undermines employees' felt safety and mental health.","relevance":"Connects organizational-level AI adoption to individual employee mental health through psychological safety—relevant to occupational health psychology, worker well-being, and leadership in AI-rich environments.","contribution":"Reveals an indirect harm pathway from organizational AI adoption to depression via reduced psychological safety; empirically establishes ethical leadership as an organizational-level moderator that can mitigate this harm.","uses":"AI \u0026 occupational health teaching; designing ethical AI implementation guidelines; leadership development in AI-heavy organizations; informing DEI + well-being intersections in AI contexts.","cluster":"AI-Related Job Insecurity, Worker Anxiety \u0026 Responses","themes":["AI \u0026 Future of Work","Well-Being \u0026 Occupational Health","Leadership","Teams \u0026 Collaboration","Employment Relationships \u0026 Gig Work"]},{"date":"2026-06-29","topic":"AI-Related Job Insecurity \u0026 Worker Anxiety","authors":"Walczok, M., \u0026 Bipp, T.","year":"2025","title":"Understanding the emergence and trajectory of job insecurity due to smart technology, artificial intelligence, robotics, and automation","journal":"Human Factors and Ergonomics in Manufacturing \u0026 Service Industries","cite":"35","doi":"https://doi.org/10.1002/hfm.70000","summary":"This study revisits and content-validates the STARA Awareness construct, examining its internal structure and differentiation from cognitive and affective job insecurity. Using longitudinal survey data, the authors trace the 1-year trajectory of STARA-related job insecurity and identify potential antecedents, including occupational exposure to automation. STARA Awareness was found to be conceptually distinct from general job insecurity, with a gradual longitudinal trajectory influenced by occupation-specific factors.","relevance":"Provides a longitudinal perspective on how STARA-related job insecurity emerges and changes over time—complementing the cross-sectional Brougham \u0026 Haar (2018) original study and directly relevant to career development and occupational health.","contribution":"Content validation and longitudinal assessment of STARA Awareness; clarifies discriminant validity from general job insecurity—important methodological contribution for researchers studying technology-related employment threat trajectories.","uses":"Methods reading on measuring technology-related insecurity; longitudinal research design; pairing with Brougham \u0026 Haar (2018) to show construct evolution; dissertation proposal scaffolding for longitudinal AI-insecurity studies.","cluster":"AI-Related Job Insecurity, Worker Anxiety \u0026 Responses","themes":["AI \u0026 Future of Work","Employment Relationships \u0026 Gig Work"]},{"date":"2026-06-29","topic":"AI-Related Job Insecurity \u0026 Worker Anxiety","authors":"Quan, X., et al. [full author list: needs verification]","year":"2025","title":"Gain or pain: The double-edged sword effect of artificial intelligence adoption on employee service performance","journal":"Journal of Organizational Behavior","cite":"Early view","doi":"https://doi.org/10.1002/job.70023","summary":"Drawing on affective events theory, this study examined the curvilinear (inverted U-shaped) effect of AI adoption on employee service performance, with vigor and anxiety as affective mediators. Both scenario-based experiments and multi-wave, multi-source surveys were used. Moderate AI adoption enhanced performance through vigor, but high levels of AI adoption triggered anxiety that undermined performance. Proactive personality and organizational AI support moderated these indirect effects.","relevance":"Relevant to AI \u0026 Work Design and Worker Well-Being; demonstrates that the AI–performance relationship is nonlinear, providing important nuance for HR decisions about AI adoption scope and pace.","contribution":"Introduces a curvilinear model for AI–performance using affective events theory; disentangles positive (vigor) and negative (anxiety) affective pathways; methodologically rigorous with experimental + multi-wave survey design.","uses":"Teaching AI \u0026 performance with nonlinear/curvilinear findings; designing multi-wave field studies; informing organizational decisions on AI rollout pacing and employee support programs; pairing with JD-R literature on demands/resources.","cluster":"AI-Related Job Insecurity, Worker Anxiety \u0026 Responses","themes":["AI \u0026 Future of Work","Employment Relationships \u0026 Gig Work"]},{"date":"2026-06-27","topic":"Generative AI \u0026 Knowledge Work Productivity","authors":"Brynjolfsson, E., Li, D., \u0026 Raymond, L. R.","year":"2025","title":"Generative AI at Work","journal":"The Quarterly Journal of Economics","cite":"140(2), 889–942","doi":"https://doi.org/10.1093/qje/qjae044","summary":"This field experiment deployed a generative AI tool among customer service workers at a large tech firm and tracked productivity outcomes over 18 months. Workers with AI access resolved 14% more issues per hour than controls, with the largest gains for novice workers. Strikingly, access to AI flattened the experience-productivity gradient—new workers rapidly approached the productivity levels of experienced peers. The tool also enabled knowledge transfer: it learned from high-performers and encoded that knowledge for distribution to lower-skilled workers.","relevance":"Directly relevant to I-O psychology and HRM: documents how generative AI reshapes skill-based performance differentials and raises questions about training, development, and performance management in AI-augmented workplaces.","contribution":"Provides rigorous causal (field experimental) evidence that generative AI acts as a knowledge transfer mechanism, reducing within-firm performance inequality and challenging assumptions about experience-based human capital accumulation.","uses":"Core empirical anchor for seminar discussions on AI and job transformation; useful for modules on training, performance, and HRM strategy in AI contexts; ideal for grant proposals on AI-enabled workforce leveling.","cluster":"Generative AI in Knowledge Work \u0026 Productivity","themes":["AI \u0026 Future of Work"]},{"date":"2026-06-27","topic":"Generative AI \u0026 Knowledge Work Productivity","authors":"Noy, S., \u0026 Zhang, W.","year":"2023","title":"Experimental evidence on the productivity effects of generative artificial intelligence","journal":"Science","cite":"381(6654), 187–192","doi":"https://doi.org/10.1126/science.adh2586","summary":"A preregistered randomized controlled experiment assigned occupation-specific writing tasks to 453 college-educated professionals, with half given access to ChatGPT. Access to the AI reduced average task completion time by 40% and raised output quality by 18% as judged by blinded evaluators. Inequality in output quality between workers decreased, with the largest gains accruing to initially lower-performing workers. The study also documented a temporary shift in workers' attitudes—both concern and excitement about AI rose after the experiment.","relevance":"A landmark causal study relevant to understanding AI's effects on knowledge worker productivity and inequality; directly informs debates about who benefits most from AI augmentation and how worker attitudes shift with AI exposure.","contribution":"One of the first preregistered RCTs on generative AI productivity at work, combining output quality and time-efficiency measures with attitudinal data, providing a foundational methodological template for future I-O research.","uses":"Foundational required reading for Future of Work seminars; benchmark citation for AI productivity research; useful for methods discussions on field experiments; relevant for grant applications studying AI, inequality, and workforce upskilling.","cluster":"Generative AI in Knowledge Work \u0026 Productivity","themes":["AI \u0026 Future of Work"]},{"date":"2026-06-27","topic":"Generative AI \u0026 Knowledge Work Productivity","authors":"Dell'Acqua, F., McFowland, E., III, Mollick, E. R., Lifshitz-Assaf, H., Kellogg, K., Rajendran, S., Krayer, L., Candelon, F., \u0026 Lakhani, K. R.","year":"2026","title":"Navigating the Jagged Technological Frontier: Field Experimental Evidence of the Effects of AI on Knowledge Worker Productivity and Quality","journal":"Organization Science","cite":"37(2), 403–423","doi":"https://doi.org/10.1287/orsc.2025.21838","summary":"A preregistered field experiment with 758 knowledge workers at Boston Consulting Group tested the performance effects of GPT-4 across a diverse set of consulting tasks. AI substantially improved quality on tasks within AI's 'jagged frontier' (tasks easily within AI capability), but workers who used AI on tasks beyond this frontier performed worse than controls—illustrating that overreliance on AI can harm performance. The study introduces the concept of a 'jagged technological frontier' to describe the uneven and context-dependent nature of AI capability. Results have significant implications for how organizations should train workers to identify when to rely on versus override AI.","relevance":"Directly relevant to I-O psychology, organizational behavior, and HRM: introduces the 'jagged frontier' concept that helps explain when human-AI collaboration enhances vs. undermines work quality, with implications for training, selection, and task design.","contribution":"Introduces the influential 'jagged technological frontier' framework as a theoretical lens for understanding task-level boundary conditions of AI effectiveness; provides a rigorous RCT template for studying context-dependence of AI augmentation.","uses":"Central required reading for AI-augmented work discussions; key theoretical contribution to human-AI collaboration literature; excellent for seminar debates on AI risks and overreliance; useful for teaching task analysis in the context of AI.","cluster":"Generative AI in Knowledge Work \u0026 Productivity","themes":["AI \u0026 Future of Work"]},{"date":"2026-06-27","topic":"Generative AI \u0026 Worker Well-Being / Dark Side","authors":"Hai, S., Long, T., Honora, A., Japutra, A., \u0026 Guo, T.","year":"2025","title":"The dark side of employee-generative AI collaboration in the workplace: An investigation on work alienation and employee expediency","journal":"International Journal of Information Management","cite":"83, 102905","doi":"https://doi.org/10.1016/j.ijinfomgt.2025.102905","summary":"Using an experience-sampling methodology with longitudinal data from 229 service-sector employees (1,050 daily observations), this study examined how daily AI collaboration affects work alienation and unethical behavior. Findings showed that higher daily AI collaboration predicted increased work alienation—a sense of disconnection from one's work—which in turn predicted employee expediency (cutting ethical corners). These negative effects were amplified under high digital job demands. The study highlights unintended negative consequences of AI adoption that are not captured by productivity metrics alone.","relevance":"Relevant to occupational health psychology, worker well-being, and ethics in AI-augmented workplaces; bridges the AI-work literature with existential dimensions of work alienation and behavioral ethics, areas underexplored in I-O psychology.","contribution":"Uses ESM methodology to capture within-person daily fluctuations in AI collaboration and their psychological costs, offering a process-oriented and methodologically rigorous look at the dark side of human-AI collaboration.","uses":"Valuable for debate/critique discussions in a Future of Work seminar; excellent pairing with productivity-focused AI studies to present a balanced picture; relevant for worker well-being modules and ethics in AI units.","cluster":"Generative AI in Knowledge Work \u0026 Productivity","themes":["AI \u0026 Future of Work","Well-Being \u0026 Occupational Health","Teams \u0026 Collaboration"]},{"date":"2026-06-27","topic":"Generative AI \u0026 Individual Creativity / Diversity","authors":"Doshi, A. R., \u0026 Hauser, O.","year":"2024","title":"Generative AI enhances individual creativity but reduces the collective diversity of novel content","journal":"Science Advances","cite":"10(28), eadn5290","doi":"https://doi.org/10.1126/sciadv.adn5290","summary":"An online experiment examined how access to AI-generated ideas affected story writing across a large sample. Access to generative AI ideas caused individual stories to be rated as more creative, better written, and more enjoyable, with the largest individual gains among less creative writers. However, at the collective level, AI access significantly reduced the diversity of stories produced: AI-assisted outputs converged on similar themes and styles. The study identifies a fundamental tension between AI-driven individual creativity enhance
