measurement and design conditions (e.g., fit indices, facet satisfaction). Clarifies a decades-old debate by showing when and how interest fit matters for affective outcomes.","relevance":"Directly relevant to person-environment fit theory and to practical claims made by career guidance tools; a model of adjudicating contested findings via careful moderator analysis.","contribution":"Resolves the 'interests predict performance but not satisfaction' paradox by identifying methodological moderators of the fit-satisfaction link.","uses":"Seminar debate reading on P-E fit; methods teaching on moderator-driven meta-analysis; lit reviews on job satisfaction antecedents.","cluster":"Vocational interests, interest fit \u0026 whole-person career assessment (new cluster)","themes":["Careers \u0026 Vocational Behavior","Job Design, Crafting \u0026 Motivation"]},{"date":"2026-07-27","topic":"Interests Predict Life Outcomes — Landmark Longitudinal","authors":"Stoll, G.; Rieger, S.; Ludtke, O.; Nagengast, B.; Trautwein, U.; Roberts, B. W.","year":"2017","title":"Vocational Interests Assessed at the End of High School Predict Life Outcomes Assessed 10 Years Later Over and Above IQ and Big Five Personality Traits","journal":"Journal of Personality and Social Psychology","cite":"113(1), 167-184","doi":"https://doi.org/10.1037/pspp0000117","summary":"Large German longitudinal study testing whether RIASEC interests measured at the end of high school predict work, relationship, and health outcomes a decade later. Interests showed incremental validity over cognitive ability and Big Five traits for outcomes including income, employment, and relationship status. Demonstrates that interests function as motivational dispositions with long-run consequences beyond the career domain.","relevance":"Strong longitudinal evidence that vocational interests matter for consequential life outcomes, elevating interests to the status of major individual-difference predictors alongside ability and personality.","contribution":"Showed incremental predictive validity of interests over IQ and personality across a 10-year span, reframing interests as broad life-outcome predictors.","uses":"Required-style empirical reading for individual differences or careers seminars; evidence base for grants on early career interventions; strong teaching example of incremental validity design.","cluster":"Vocational interests, interest fit \u0026 whole-person career assessment (new cluster)","themes":["Careers \u0026 Vocational Behavior"]},{"date":"2026-07-27","topic":"Adolescent Interests \u0026 Early Career Success — 12-Year Longitudinal","authors":"Hoff, K. A.; Chu, C.; Einarsdottir, S.; Briley, D. A.; Hanna, A.; Rounds, J.","year":"2022","title":"Adolescent Vocational Interests Predict Early Career Success: Two 12-Year Longitudinal Studies","journal":"Applied Psychology: An International Review","cite":"71(1), 49-75","doi":"https://doi.org/10.1111/apps.12311","summary":"Two 12-year longitudinal studies (US and Iceland) linking adolescents' RIASEC interest profiles to objective and subjective career success in adulthood. Interest levels and profile elevation predicted income, occupational prestige, and career satisfaction, with cross-national replication strengthening generalizability. Supports interests as early-emerging predictors of long-term career attainment.","relevance":"Extends the interest-validity literature to career success criteria with rare cross-cultural longitudinal replication; directly relevant to career development and school-to-work transition research.","contribution":"Demonstrates cross-nationally replicated predictive validity of adolescent interests for career success, including the underexamined role of profile elevation.","uses":"Empirical exemplar for careers/vocational seminars; supports longitudinal grant designs; useful for lectures on school-to-work transitions.","cluster":"Vocational interests, interest fit \u0026 whole-person career assessment (new cluster)","themes":["Careers \u0026 Vocational Behavior"]},{"date":"2026-07-27","topic":"Whole-Person Fit Assessment via O*NET — Recent (JAP Editor's Choice)","authors":"Liu, Z.; Hoff, K. A.; Chu, C.; Oswald, F. L.; Rounds, J.","year":"2025","title":"Toward Whole-Person Fit Assessment: Integrating Interests, Values, Skills, Knowledge, and Personality Using the Occupational Information Network (O*NET)","journal":"Journal of Applied Psychology","cite":"Vol. 110 (advance online 2024)","doi":"https://doi.org/10.1037/apl0001232","summary":"Develops and validates a 'whole-person' approach to person-occupation fit by integrating five individual-difference domains (interests, values, skills, knowledge, personality) with O*NET occupational profiles. Shows that fit varies meaningfully across domains within the same person-occupation pairing and that multidomain fit improves prediction of career outcomes over single-domain fit. Received the 2025 JAP Editor's Choice award.","relevance":"State-of-the-art integration of P-E fit assessment with open occupational data infrastructure (O*NET); highly relevant to computational approaches to career guidance and AI-era workforce matching.","contribution":"Methodological and conceptual advance: a unified multidomain fit framework operationalized through O*NET, bridging vocational psychology and workforce analytics.","uses":"Recent required reading for fit/assessment seminars; template for O*NET-based research designs; useful for grants on career-matching technology.","cluster":"Vocational interests, interest fit \u0026 whole-person career assessment (new cluster)","themes":["Assessment \u0026 Selection","Careers \u0026 Vocational Behavior"]},{"date":"2026-07-27","topic":"Basic Interests Beyond RIASEC — CABIN-NET (Recent Measurement)","authors":"Chu, C.; Hoff, K. A.; Liu, Z.; Heimpel, N. F.; Greco, A.; Oswald, F. L.; Rounds, J.","year":"2025","title":"Interest Fit Beyond the RIASEC: The Comprehensive Assessment of Basic Interests-O*NET (CABIN-NET)","journal":"Journal of Career Assessment","cite":"Advance online publication","doi":"https://doi.org/10.1177/10690727251322520","summary":"Adapts the Comprehensive Assessment of Basic Interests into a 60-item measure (CABIN-NET) assessing 20 basic interest scales linked to O*NET occupations, enabling fit scoring at a finer grain than the six RIASEC types. Validation results show basic-interest fit predicts career outcomes more strongly than traditional RIASEC fit. Provides an open, scalable tool for interest-fit assessment.","relevance":"Addresses a long-standing measurement critique of Holland's model by operationalizing narrow basic interests for fit assessment; directly relevant to modern computerized career guidance systems.","contribution":"Measurement contribution: demonstrates incremental validity of basic-interest fit over RIASEC fit and delivers a practical O*NET-linked instrument.","uses":"Methods reading on scale development and fit indices; tool for student research projects; complements the whole-person fit article as a paired recent reading.","cluster":"Vocational interests, interest fit \u0026 whole-person career assessment (new cluster)","themes":["Assessment \u0026 Selection","Careers \u0026 Vocational Behavior","Big Data \u0026 Methods"]},{"date":"2026-07-26","topic":"Newcomer Socialization — Foundational Meta-Analysis","authors":"Bauer, T. N.; Bodner, T.; Erdogan, B.; Truxillo, D. M.; Tucker, J. S.","year":"2007","title":"Newcomer adjustment during organizational socialization: A meta-analytic review of antecedents, outcomes, and methods","journal":"Journal of Applied Psychology","cite":"92(3), 707-721","doi":"https://doi.org/10.1037/0021-9010.92.3.707","summary":"Meta-analysis of 70 unique newcomer samples testing a model in which newcomer adjustment (role clarity, self-efficacy, social acceptance) mediates the effects of organizational socialization tactics and information seeking on outcomes. Adjustment predicted job satisfaction, organizational commitment, performance, intentions to remain, and turnover. Established the dominant antecedents-adjustment-outcomes framework for socialization research.","relevance":"The anchor citation for all subsequent onboarding/socialization work in I-O psychology; essential grounding for any study of how people enter organizations.","contribution":"Established the tripartite adjustment model (role clarity, self-efficacy, social acceptance) as the core mediating mechanism of socialization.","uses":"Foundational reading for teaching organizational entry; baseline framework for lit reviews and for studies of remote/virtual onboarding.","cluster":"Newcomer socialization, onboarding \u0026 remote/hybrid organizational entry (new cluster)","themes":["Careers \u0026 Vocational Behavior","Big Data \u0026 Methods"]},{"date":"2026-07-26","topic":"Newcomer Socialization — Updated Review \u0026 Meta-Analysis (Recent)","authors":"Bauer, T. N.; Erdogan, B.; Ellis, A. M.; Truxillo, D. M.; Brady, G. M.; Bodner, T.","year":"2025","title":"New horizons for newcomer organizational socialization: A review, meta-analysis, and future research directions","journal":"Journal of Management","cite":"51(1), 344-382","doi":"https://doi.org/10.1177/01492063241277168","summary":"Comprehensive review and updated meta-analysis of newcomer socialization research (256 studies reviewed; 183 meta-analyzed), updating the 2007 meta-analysis with two decades of new evidence. Synthesizes antecedents, adjustment indicators, and outcomes, and maps emerging topics including virtual/remote onboarding and technology-mediated socialization. Sets a future research agenda for organizational entry in the changing world of work.","relevance":"The current state-of-the-science on socialization; directly bridges classic adjustment models to future-of-work conditions such as remote entry.","contribution":"Provides updated meta-analytic effect sizes and a research agenda extending socialization theory to contemporary work arrangements.","uses":"Ideal seminar reading paired with Bauer et al. (2007); source of dissertation and grant ideas on modern onboarding.","cluster":"Newcomer socialization, onboarding \u0026 remote/hybrid organizational entry (new cluster)","themes":["Careers \u0026 Vocational Behavior"]},{"date":"2026-07-26","topic":"Newcomer Socialization \u0026 Future of Work (Recent Conceptual)","authors":"Bauer, T. N.; Erdogan, B.; Ellis, A. M.; Truxillo, D. M.; Brady, G. M.; McCarthy, J. M.","year":"2025","title":"The evolving future of work: Implications for newcomer adaptability and connectivity during organizational socialization","journal":"Human Resource Management","cite":"64(6), 1651-1668","doi":"https://doi.org/10.1002/hrm.70008","summary":"Conceptual article identifying four trends reshaping organizational socialization: technological advancement (including AI), expansion of remote work, rising societal loneliness and mental health challenges, and aging workforce demographics. Argues newcomer adaptability and connection are the emergent critical factors for onboarding in the future of work. Offers propositions and practical implications for redesigning onboarding.","relevance":"Explicitly connects socialization theory to future-of-work forces (AI, remote work, loneliness, aging) central to I-O research on organizational entry.","contribution":"Reframes onboarding around adaptability and connectivity rather than information transfer alone; agenda-setting for HRM practice.","uses":"Strong future-of-work seminar reading; framing piece for grants on remote onboarding or AI-supported socialization.","cluster":"Newcomer socialization, onboarding \u0026 remote/hybrid organizational entry (new cluster)","themes":["AI \u0026 Future of Work","Careers \u0026 Vocational Behavior"]},{"date":"2026-07-26","topic":"Newcomer Support \u0026 Undermining — Foundational Empirical","authors":"Kammeyer-Mueller, J.; Wanberg, C.; Rubenstein, A.; Song, Z.","year":"2013","title":"Support, undermining, and newcomer socialization: Fitting in during the first 90 days","journal":"Academy of Management Journal","cite":"56(4), 1104-1124","doi":"https://doi.org/10.5465/amj.2010.0791","summary":"Weekly longitudinal study tracking newcomers across their first 90 days, examining trajectories of supervisor and coworker support and undermining. Found support declines over time, and that early social experiences shape proactive behavior, commitment, and withdrawal. Demonstrates the criticality of the earliest weeks of organizational entry.","relevance":"Classic dynamic/longitudinal evidence that insider social treatment drives newcomer adjustment - the mechanism most disrupted by remote onboarding.","contribution":"Methodological exemplar of intensive longitudinal socialization research; established temporal decline of insider support.","uses":"Methods teaching example for growth modeling; theoretical baseline for studies of social connection in virtual entry.","cluster":"Newcomer socialization, onboarding \u0026 remote/hybrid organizational entry (new cluster)","themes":["Careers \u0026 Vocational Behavior"]},{"date":"2026-07-26","topic":"Prior Mobility \u0026 Newcomer Transitions — Recent Empirical","authors":"Kehoe, R. R.; Bentley, F. S.","year":"2026","title":"Movin' and groovin'! Increased prior mobility facilitates newcomers' transitions into organizations","journal":"Academy of Management Journal","cite":"In press (published online 2026)","doi":"https://doi.org/10.5465/amj.2024.0138","summary":"Empirical study theorizing that prior mobility across organizations creates learning opportunities that mitigate newcomer entry barriers. More mobile individuals showed smaller performance declines and faster recovery to peak performance after joining a new employer. Reframes job hopping as building a transferable 'mobility benefit.'","relevance":"Connects boundaryless-career mobility patterns to socialization outcomes - highly relevant as job mobility accelerates in the future of work.","contribution":"Introduces prior mobility as an individual-difference antecedent of transition success, bridging careers and socialization literatures.","uses":"Discussion piece on careers/mobility; counterpoint to negative views of job hopping in teaching and practice.","cluster":"Newcomer socialization, onboarding \u0026 remote/hybrid organizational entry (new cluster)","themes":["Careers \u0026 Vocational Behavior"]},{"date":"2026-07-26","topic":"Remote Socialization \u0026 Assimilation — Qualitative Longitudinal (Recent)","authors":"Myers, K. K.; Endacott, C. G.; Snyder, J.","year":"2025","title":"\"Your connection is unstable\": Remote socialization and effects on organizational assimilation","journal":"Management Communication Quarterly","cite":"39(2), 199-229","doi":"https://doi.org/10.1177/08933189241259163","summary":"Two-wave qualitative interview study of knowledge workers who began jobs fully remotely, interviewed shortly after entry and about a year later. Job competency and recognition were least affected by remote entry; familiarity with others and role negotiation were moderately affected; involvement and acculturation were most impaired. Reduced connection lowered organizational identification and was linked to turnover.","relevance":"Rich evidence on exactly which assimilation dimensions suffer under remote entry - directly informs hybrid onboarding design and theory.","contribution":"Differentiates remote socialization effects across assimilation dimensions rather than treating adjustment as monolithic.","uses":"Qualitative-methods exemplar; practical guidance for designing remote onboarding; seminar discussion of communication perspectives on socialization.","cluster":"Newcomer socialization, onboarding \u0026 remote/hybrid organizational entry (new cluster)","themes":["Careers \u0026 Vocational Behavior","Remote \u0026 Hybrid Work"]},{"date":"2026-07-26","topic":"Remote Onboarding \u0026 Membership Ambiguity — Qualitative (Recent)","authors":"Paik, [initial not verified]; Gilmore, [initial not verified]","year":"2025","title":"Membership ambiguity and insider support in remote socialization: A qualitative exploration of newcomers' experiences of remote onboarding","journal":"Human Resource Development Quarterly","cite":"Advance online / 2025","doi":"https://doi.org/10.1002/hrdq.21560","summary":"Thirty semi-structured interviews with employees who joined organizations remotely (June 2020-September 2021), framed by socialization resources theory. Remote newcomers achieved job proficiency but experienced membership ambiguity from weak connection with insiders and generally found insider support insufficient. Identifies resource-access barriers unique to remote entry.","relevance":"Introduces membership ambiguity as a distinct remote-onboarding phenomenon; complements Myers et al. with an HRD/resources lens.","contribution":"Extends socialization resources theory to remote contexts and names a novel construct (membership ambiguity).","uses":"Seminar contrast with quantitative socialization work; basis for scale development or intervention research on remote onboarding support. NOTE: author first initials need verification against publisher page.","cluster":"Newcomer socialization, onboarding \u0026 remote/hybrid organizational entry (new cluster)","themes":["Careers \u0026 Vocational Behavior","Remote \u0026 Hybrid Work"]},{"date":"2026-07-25","topic":"Algorithmic Management — Gig Economy (Systematic Review, Recent)","authors":"Kadolkar, I.; Kepes, S.; Subramony, M.","year":"2025","title":"Algorithmic management in the gig economy: A systematic review and research integration","journal":"Journal of Organizational Behavior","cite":"46(7), 1057-1080","doi":"https://doi.org/10.1002/job.2831","summary":"Systematically reviews the multidisciplinary literature on algorithmic management (AM) in the gig economy. Integrates findings across management, psychology, information systems, and sociology into an organizing framework linking AM functions (e.g., task allocation, monitoring, evaluation) to worker attitudes, behaviors, and well-being outcomes. Identifies major theoretical perspectives, maps mediating and moderating mechanisms, and proposes a research agenda for organizational scholars.","relevance":"Directly relevant to I-O research on algorithmic management, gig work, and technology-mediated control; consolidates a fragmented literature into a usable framework.","contribution":"Provides the field's most current integrative framework of AM in gig work and clarifies construct definitions across disciplines.","uses":"Anchor reading for a seminar week on algorithmic management; framework source for lit reviews and grant proposals; agenda-setting for dissertations.","cluster":"Gig work, platform work \u0026 algorithmic management (new cluster)","themes":["Algorithmic Management \u0026 Surveillance","Employment Relationships \u0026 Gig Work"]},{"date":"2026-07-25","topic":"Algorithmic Management — Beyond Gig Work (Annual Review, Recent)","authors":"Keegan, A.; Meijerink, J.","year":"2025","title":"Algorithmic Management in Organizations? From Edge Case to Center Stage","journal":"Annual Review of Organizational Psychology and Organizational Behavior","cite":"12, 395-422","doi":"https://doi.org/10.1146/annurev-orgpsych-110622-070928","summary":"Reviews the rapidly growing literature on algorithmic management and argues it is moving from an 'edge case' phenomenon confined to labor platforms to a central feature of conventional organizations. Synthesizes evidence on how AM reshapes managerial functions (direction, evaluation, discipline) and worker responses, and discusses implications for HRM and organizational psychology. Sets out a research agenda for studying AM inside traditional employment relationships.","relevance":"Positions algorithmic management as a mainstream I-O/OB topic rather than a niche gig-economy issue; essential framing for research on AI-enabled supervision in standard organizations.","contribution":"Reframes the boundary conditions of AM theory by extending it from platforms to traditional organizations and integrating HRM and OB perspectives.","uses":"Framing reading for teaching AI and management; citation anchor for grants on AM in conventional workplaces; agenda source for new studies.","cluster":"Gig work, platform work \u0026 algorithmic management (new cluster)","themes":["Algorithmic Management \u0026 Surveillance","Employment Relationships \u0026 Gig Work"]},{"date":"2026-07-25","topic":"Algorithmic Reliability \u0026 Trust — Empirical (Recent)","authors":"Lu (first-author initial needs verification); Yang, M. M.; Mitchell, R.; Boyle, B.; Gu, J.","year":"2026","title":"Algorithmic Reliability at the Helm: Investigating the Relationship Between Experienced Algorithmic Reliability, Trust, and Work Engagement in the Gig Economy","journal":"Human Resource Management","cite":"65(2), 493-509","doi":"https://doi.org/10.1002/hrm.70033","summary":"Empirical study of gig workers grounded in the transactional model of stress and coping. Examines how workers' experienced reliability of algorithmic functions (e.g., task allocation, performance management) shapes trust in the platform and, in turn, work engagement. Also tests occupational stigma consciousness as a moderator of the mediated relationship, finding that reliability perceptions are consequential for engagement via trust.","relevance":"Recent empirical evidence in a top HRM journal on when algorithmic management supports rather than undermines gig worker motivation; connects AM to trust and engagement literatures.","contribution":"Introduces experienced algorithmic reliability as a construct and links it to trust and engagement through a stress-and-coping lens.","uses":"Empirical exemplar for seminars on AM; useful for research on trust in AI systems; supports hypothesis development on AM boundary conditions.","cluster":"Gig work, platform work \u0026 algorithmic management (new cluster)","themes":["Algorithmic Management \u0026 Surveillance","Employment Relationships \u0026 Gig Work","Job Design, Crafting \u0026 Motivation"]},{"date":"2026-07-25","topic":"Gig Work — Integrative Review (Foundational)","authors":"Cropanzano, R.; Keplinger, K.; Lambert, B. K.; Caza, B.; Ashford, S. J.","year":"2023","title":"The organizational psychology of gig work: An integrative conceptual review","journal":"Journal of Applied Psychology","cite":"108(3), 492-519","doi":"https://doi.org/10.1037/apl0001029","summary":"Integrative conceptual review of the organizational psychology of gig work. Uses the emerging psychological contract between gig workers and platforms/organizations as an organizing lens to review what is known about gig workers' motivation, identity, well-being, and working conditions. Identifies how gig arrangements alter classic I-O assumptions about the employment relationship and lays out a research agenda for psychologists.","relevance":"The flagship I-O statement on gig work; establishes gig work as a core topic for applied psychology rather than only labor economics or sociology.","contribution":"Reconceptualizes the psychological contract for platform-mediated work and integrates dispersed findings into an I-O-centered framework.","uses":"Required-style reading for any gig work seminar week; framework for lit reviews; foundation for psychological-contract-based research designs.","cluster":"Gig work, platform work \u0026 algorithmic management (new cluster)","themes":["Employment Relationships \u0026 Gig Work"]},{"date":"2026-07-25","topic":"Algorithmic Control — Foundational Theory","authors":"Kellogg, K. C.; Valentine, M. A.; Christin, A.","year":"2020","title":"Algorithms at work: The new contested terrain of control","journal":"Academy of Management Annals","cite":"14(1), 366-410","doi":"https://doi.org/10.5465/annals.2018.0174","summary":"Foundational theoretical review that applies Edwards' (1979) 'contested terrain' perspective to algorithmic control at work. Proposes the influential '6 Rs' typology of algorithmic control mechanisms (restricting, recommending, recording, rating, replacing, rewarding) and analyzes how workers respond through 'algoactivism' and resistance. Synthesizes management and sociology literatures on rational control and worker agency.","relevance":"The most-cited theoretical foundation for algorithmic control research; nearly all subsequent AM work in I-O/OB builds on this typology.","contribution":"Provides the canonical typology of algorithmic control mechanisms and frames worker resistance as a central dynamic of AI-managed work.","uses":"Essential theory reading for teaching algorithmic management; typology widely reused in empirical coding schemes and grant framing.","cluster":"Gig work, platform work \u0026 algorithmic management (new cluster)","themes":["Algorithmic Management \u0026 Surveillance"]},{"date":"2026-07-25","topic":"Gig Work Identity \u0026 Precarity — Qualitative (Foundational)","authors":"Petriglieri, G.; Ashford, S. J.; Wrzesniewski, A.","year":"2019","title":"Agony and ecstasy in the gig economy: Cultivating holding environments for precarious and personalized work identities","journal":"Administrative Science Quarterly","cite":"64(1), 124-170","doi":"https://doi.org/10.1177/0001839218759646","summary":"Inductive qualitative study of independent workers without organizational employment. Finds that gig workers experience both anxiety from precarity and vitality from autonomy, and theorizes that they manage these tensions by cultivating 'holding environments' built on connections to routines, places, people, and a broader purpose. Develops theory on how work identities are sustained outside traditional organizational structures.","relevance":"Landmark study of the emotional and identity experience of independent work; complements control-focused AM research with a worker-centered identity lens.","contribution":"Introduces the holding-environment construct to work identity theory and explains identity maintenance absent organizational membership.","uses":"Rich qualitative exemplar for seminars; counterpoint reading to algorithmic-control papers; useful for research on identity and precarity.","cluster":"Gig work, platform work \u0026 algorithmic management (new cluster)","themes":["Employment Relationships \u0026 Gig Work"]},{"date":"2026-07-25","topic":"Algorithmic Management \u0026 HRM — Research Agenda (Foundational)","authors":"Duggan, J.; Sherman, U.; Carbery, R.; McDonnell, A.","year":"2020","title":"Algorithmic management and app-work in the gig economy: A research agenda for employment relations and HRM","journal":"Human Resource Management Journal","cite":"30(1), 114-132","doi":"https://doi.org/10.1111/1748-8583.12258","summary":"Conceptual article that clarifies the terminology of gig work by distinguishing app-work, crowdwork, and capital platform work. Analyzes how algorithmic management functions as a control system in app-work and what this means for the employment relationship, worker classification, and HRM practice. Proposes a research agenda at the intersection of employment relations and HRM.","relevance":"Widely cited definitional anchor for gig work types; clarifies constructs that are often conflated in I-O and HRM research on platform work.","contribution":"Provides the app-work/crowdwork/capital-platform typology and links algorithmic management to HRM and employment-relations theory.","uses":"Definitional reading for early seminar weeks; helps students and reviewers distinguish gig work subtypes; agenda source for HRM-oriented studies.","cluster":"Gig work, platform work \u0026 algorithmic management (new cluster)","themes":["Algorithmic Management \u0026 Surveillance","Employment Relationships \u0026 Gig Work"]},{"date":"2026-07-24","topic":"Multiple Jobholding — Foundational Review","authors":"Campion, E. D.; Caza, B. B.; Moss, S. E.","year":"2020","title":"Multiple Jobholding: An Integrative Systematic Review and Future Research Agenda","journal":"Journal of Management","cite":"46(1), 165–191","doi":"https://doi.org/10.1177/0149206319882756","summary":"Systematic review integrating decades of multiple jobholding research across management, economics, sociology, and health disciplines. Organizes inconsistent findings on whether holding more than one job is depleting or enriching by identifying mechanisms and boundary conditions. Articulates dual pathways of depletion and enrichment and shows how push- versus pull-based motivations predict which pathway unfolds. Sets a future research agenda for this understudied form of work.","relevance":"The anchor review for the multiple jobholding literature — essential framing for any I-O research on side hustles, polywork, or nonstandard employment portfolios.","contribution":"Provides the field's organizing depletion-enrichment framework and motivational (push/pull) taxonomy for multiple jobholding.","uses":"Ideal seminar anchor reading; lit review foundation; source of research questions for studies on portfolio careers.","cluster":"Side hustles, multiple jobholding \u0026 polywork (new cluster)","themes":["Employment Relationships \u0026 Gig Work"]},{"date":"2026-07-24","topic":"Plural Careers \u0026 Work Identity — Qualitative (Foundational)","authors":"Caza, B. B.; Moss, S.; Vough, H.","year":"2018","title":"From Synchronizing to Harmonizing: The Process of Authenticating Multiple Work Identities","journal":"Administrative Science Quarterly","cite":"63(4), 703–745","doi":"https://doi.org/10.1177/0001839217733972","summary":"Five-year qualitative study of 48 'plural careerists' who simultaneously hold and identify with multiple jobs. Finds these workers struggle to be, feel, and seem authentic across work roles, and develop coping practices that evolve over time. Identifies a two-phase authentication process: first synchronizing individual work-role identities, then harmonizing a broader work self. Challenges the assumption that consistency is the core of authenticity.","relevance":"Rich process theory on identity in portfolio/plural careers — highly relevant to careers research as employment relationships fragment.","contribution":"Reconceptualizes authenticity for people with multiple valued work identities and models identity authentication as an emergent temporal process.","uses":"Teaching qualitative process methods; theory building on identity and careers; grad seminar discussion of nonstandard work.","cluster":"Side hustles, multiple jobholding \u0026 polywork (new cluster)","themes":["Careers \u0026 Vocational Behavior"]},{"date":"2026-07-24","topic":"Side Hustles \u0026 Full-Time Performance — Empirical (Foundational)","authors":"Sessions, H.; Nahrgang, J. D.; Vaulont, M. J.; Williams, R.; Bartels, A. L.","year":"2021","title":"Do the Hustle! Empowerment from Side-Hustles and Its Effects on Full-Time Work Performance","journal":"Academy of Management Journal","cite":"64(1), 235–264","doi":"https://doi.org/10.5465/amj.2018.0164","summary":"Tests whether side hustles conflict with or enrich full-time work performance. A survey of 337 employees plus a 10-day experience-sampling study of 80 employee-coworker dyads show that psychological empowerment from side hustles enriches full-time performance via side-hustle engagement and positive affect at work. Enrichment effects outweighed conflict effects, though side hustlers showed somewhat greater distraction.","relevance":"The landmark empirical study legitimizing side hustles as an I-O research topic; directly relevant to work design, motivation, and boundaryless careers.","contribution":"Demonstrates positive spillover (empowerment) from secondary to primary work, countering the assumption that side hustles necessarily deplete performance; exemplary ESM dyadic design.","uses":"Required reading for future-of-work or motivation seminars; methods exemplar for experience sampling; basis for spillover research.","cluster":"Side hustles, multiple jobholding \u0026 polywork (new cluster)","themes":["Employment Relationships \u0026 Gig Work"]},{"date":"2026-07-24","topic":"Multiple Jobholding Motivations — Typology \u0026 LPA","authors":"Campion, E. D.; Csillag, B.","year":"2022","title":"Multiple Jobholding Motivations and Experiences: A Typology and Latent Profile Analysis","journal":"Journal of Applied Psychology","cite":"107(8), 1261–1287","doi":"https://doi.org/10.1037/apl0000920","summary":"Mixed-methods, three-study investigation of 1,487 multiple jobholders. Study 1 content-analyzed qualitative responses (N = 801) to derive eight motivational categories; Study 2 (N = 260) identified four latent motivational profiles; Study 3 tested how work experiences differ across profiles. Shows multiple jobholders are motivated by far more than economic necessity, including identity building and value optimization.","relevance":"Moves the field past the 'economically deprived moonlighter' stereotype with rigorous person-centered evidence; directly relevant to vocational and career motivation research.","contribution":"First comprehensive motivational typology of multiple jobholding; showcases latent profile analysis as a person-centered method for careers research.","uses":"Methods teaching (LPA, mixed methods); lit reviews on work motivation; designing profile-based future research.","cluster":"Side hustles, multiple jobholding \u0026 polywork (new cluster)","themes":["Employment Relationships \u0026 Gig Work","Job Design, Crafting \u0026 Motivation"]},{"date":"2026-07-24","topic":"Side-Hustle Autonomy \u0026 Reactance — Within-Person Empirical","authors":"Sessions, H.; Baer, M. D.; Nahrgang, J. D.; Pychlau, S.","year":"2023","title":"From Free Pastures to Penned In: The Within-Person Effects of Psychological Reactance on Side-Hustlers' Hostility and Initiative in Full-Time Work","journal":"Journal of Applied Psychology","cite":"108(12), 1979–1997","doi":"https://doi.org/10.1037/apl0001115","summary":"Within-person study of employees holding autonomous gig-economy side hustles alongside full-time jobs. Drawing on psychological reactance theory, finds that elevated side-hustle autonomy sensitizes employees to control threats in their full-time work, producing feelings of being 'boxed in,' hostility, and counterproductive behavior, alongside effects on initiative.","relevance":"Shows the dark side of side-hustle autonomy spilling into full-time employment — a counterpoint to the enrichment findings in the same team's 2021 AMJ paper.","contribution":"Extends psychological reactance theory to multiple jobholding and identifies autonomy contrast across jobs as a within-person mechanism.","uses":"Pairing with Sessions et al. (2021) for seminar debate; theory on autonomy and work design; ESM methods illustration.","cluster":"Side hustles, multiple jobholding \u0026 polywork (new cluster)","themes":["Employment Relationships \u0026 Gig Work"]},{"date":"2026-07-24","topic":"Side-Hustle Thriving — COR Perspective (Recent)","authors":"Liu, W.; Yu, W.; Liu, X.; Liu, T.","year":"2025","title":"The Effect of Side-Hustle Thriving on Full-Time Work Performance: A Conservation of Resources Perspective","journal":"Journal of Management Studies","cite":"Early view (2025)","doi":"https://doi.org/10.1111/joms.13221","summary":"Draws on conservation of resources theory to model competing pathways from side-hustle thriving to full-time job performance. Finds side-hustle thriving enhances full-time performance through psychological detachment and affective well-being (resource gain), while simultaneously impairing it via side-hustle attention residue and resource depletion. Frames side hustles as a defining feature of platform-era work.","relevance":"Recent evidence adjudicating the enrichment-versus-depletion debate with a dual-pathway COR model; relevant to occupational health and work design research.","contribution":"Integrates resource gain and loss pathways in one model, explaining mixed prior findings on side-hustle spillover.","uses":"Contemporary reading for well-being or future-of-work seminars; model for dual-pathway hypothesis development.","cluster":"Side hustles, multiple jobholding \u0026 polywork (new cluster)","themes":["Employment Relationships \u0026 Gig Work"]},{"date":"2026-07-24","topic":"Task Conflict \u0026 Side-Hustle Creativity — Recent Empirical","authors":"Li, X. [author needs verification]","year":"2026","title":"Full-Time Work Task Conflicts and Side-Hustle Creativity: The Role of Engagement and Performance-Avoidance Goal Orientation","journal":"Journal of Personnel Psychology","cite":"25(2)","doi":"https://doi.org/10.1027/1866-5888/a000379","summary":"Uses an experiment (N = 188) and a survey (N = 271) to examine when full-time work experiences fuel creativity in employees' side hustles. Finds that full-time work task conflicts stimulate side-hustle engagement, which in turn fosters side-hustle creativity; performance-avoidance goal orientation weakens the conflict-to-engagement link. Published online February 2026.","relevance":"Very recent evidence on reverse spillover — from full-time work into side-hustle outcomes — extending a literature that has mostly examined the opposite direction.","contribution":"Introduces creativity as a side-hustle outcome and goal orientation as an individual-difference moderator; complements the performance-focused spillover literature.","uses":"Current-events reading for seminars; future research on bidirectional spillover; note: author list flagged for verification against the publisher page.","cluster":"Side hustles, multiple jobholding \u0026 polywork (new cluster)","themes":["Employment Relationships \u0026 Gig Work","Job Design, Crafting \u0026 Motivation"]},{"date":"2026-07-23","topic":"Job Crafting - Foundational Theory","authors":"Wrzesniewski, A.; Dutton, J. E.","year":"2001","title":"Crafting a Job: Revisioning Employees as Active Crafters of Their Work","journal":"Academy of Management Review","cite":"26(2), 179-201","doi":"https://doi.org/10.5465/amr.2001.4378011","summary":"This seminal theory paper introduced the construct of job crafting, proposing that employees actively alter the task, relational, and cognitive boundaries of their work rather than passively enacting prescribed jobs. The authors specify the motivations that spark crafting, the moderating roles of crafting opportunity and work orientation, and how crafting reshapes work meaning and work identity. The model reframes job design as a bottom-up, employee-driven process.","relevance":"The origin point of the entire job crafting literature and a cornerstone for research on proactive work behavior, work meaning, and bottom-up work design.","contribution":"Redefined job design theory by shifting agency from managers to employees; introduced task, relational, and cognitive crafting as distinct forms.","uses":"Essential foundational reading for seminars on work design or proactivity; anchor citation for any lit review or grant involving job crafting or meaningful work.","cluster":"Job crafting \u0026 meaningful work: how employees proactively reshape their jobs and sustain meaning in a changing workplace","themes":["Job Design, Crafting \u0026 Motivation"]},{"date":"2026-07-23","topic":"Meaningful Work - Theoretical Review","authors":"Rosso, B. D.; Dekas, K. H.; Wrzesniewski, A.","year":"2010","title":"On the Meaning of Work: A Theoretical Integration and Review","journal":"Research in Organizational Behavior","cite":"30, 91-127","doi":"https://doi.org/10.1016/j.riob.2010.09.001","summary":"This integrative review synthesizes the fragmented literature on the meaning of work across psychology, sociology, and management. The authors organize sources of meaning into four categories (the self, others, the work context, and spiritual life) and identify mechanisms through which work becomes meaningful, including authenticity, self-efficacy, self-esteem, purpose, belongingness, and transcendence. They propose an organizing framework mapping pathways to meaningfulness.","relevance":"The definitive theoretical map of the meaningful work literature; nearly every subsequent meaningful work study builds on its framework.","contribution":"Provided the first comprehensive integration of meaning-of-work research and a mechanism-based framework that structured the field's subsequent development.","uses":"Core theory reading for teaching meaningful work; framework for organizing lit reviews; useful scaffold for theorizing in grants on meaning and well-being.","cluster":"Job crafting \u0026 meaningful work: how employees proactively reshape their jobs and sustain meaning in a changing workplace","themes":["Careers \u0026 Vocational Behavior"]},{"date":"2026-07-23","topic":"Job Crafting - Meta-Analysis","authors":"Rudolph, C. W.; Katz, I. M.; Lavigne, K. N.; Zacher, H.","year":"2017","title":"Job Crafting: A Meta-Analysis of Relationships with Individual Differences, Job Characteristics, and Work Outcomes","journal":"Journal of Vocational Behavior","cite":"102, 112-138","doi":"https://doi.org/10.1016/j.jvb.2017.05.008","summary":"This meta-analysis (122 independent samples) quantitatively synthesizes relationships between job crafting (in the JD-R expansion tradition) and individual differences, job characteristics, and work outcomes. Job crafting related positively to proactive personality, promotion focus, work engagement, job satisfaction, and performance, with notable differences across crafting dimensions; decreasing hindering demands showed divergent, often null or negative, relations. Results clarify the nomological network of job crafting.","relevance":"The benchmark quantitative synthesis of job crafting evidence and a model example of construct-level meta-analysis in vocational/I-O research.","contribution":"Established the empirical nomological network of job crafting and documented that crafting dimensions are not interchangeable, shaping later approach/avoidance distinctions.","uses":"Meta-analytic evidence base for teaching; effect-size benchmarks for power analyses and grant proposals; methods exemplar for meta-analysis courses.","cluster":"Job crafting \u0026 meaningful work: how employees proactively reshape their jobs and sustain meaning in a changing workplace","themes":["Job Design, Crafting \u0026 Motivation"]},{"date":"2026-07-23","topic":"Meaningful Work - Meta-Analysis","authors":"Allan, B. A.; Batz-Barbarich, C.; Sterling, H. M.; Tay, L.","year":"2019","title":"Outcomes of Meaningful Work: A Meta-Analysis","journal":"Journal of Management Studies","cite":"56(3), 500-528","doi":"https://doi.org/10.1111/joms.12406","summary":"This meta-analysis synthesizes 44 studies (N = 23,144) on the outcomes of meaningful work. Meaningful work showed large corrected correlations with work engagement, organizational commitment, and job satisfaction, moderate-to-large relations with life satisfaction and life meaning, and negative relations with turnover intentions. The authors position meaningful work as a central mechanism linking job experiences to both work and general well-being outcomes.","relevance":"Provides the quantitative case that meaningful work matters for both organizational and personal well-being outcomes - directly relevant to occupational health and vocational psychology.","contribution":"First comprehensive meta-analysis of meaningful work outcomes; empirically justified meaningful work as a focal construct rather than a proxy for satisfaction.","uses":"Evidence base for lectures and grants on well-being interventions; benchmark effect sizes; pairs well with Rosso et al. for a theory-plus-evidence seminar week.","cluster":"Job crafting \u0026 meaningful work: how employees proactively reshape their jobs and sustain meaning in a changing workplace","themes":["Careers \u0026 Vocational Behavior"]},{"date":"2026-07-23","topic":"Job Crafting - Person-Centered Empirical","authors":"Zhang, F.; Tims, M.; Parker, S. K.","year":"2025","title":"Combinations of Approach and Avoidance Crafting Matter: Linking Job Crafting Profiles with Proactive Personality, Autonomy, Work Engagement, and Performance","journal":"Journal of Organizational Behavior","cite":"46(3), 385-400","doi":"https://doi.org/10.1002/job.2836","summary":"Using latent profile analysis across samples, this study identifies recurring job crafting profiles - proactive crafters (high approach with moderate avoidance crafting), active crafters, and reactive crafters (low approach, relatively high avoidance). Proactive personality and autonomy predicted profile membership, and profiles differed in work engagement and performance, with proactive crafters faring best and predominantly avoidance-oriented crafters worst. Findings show combinations of crafting strategies matter beyond individual dimensions.","relevance":"Demonstrates the value of person-centered methods for work design questions and refines the approach/avoidance crafting debate central to current I-O research.","contribution":"Shifts job crafting research from variable-centered to person-centered evidence, showing avoidance crafting is not uniformly harmful when combined with approach crafting.","uses":"Good empirical exemplar for teaching latent profile analysis; supports research on crafting interventions; useful in lit reviews on approach/avoidance distinctions.","cluster":"Job crafting \u0026 meaningful work: how employees proactively reshape their jobs and sustain meaning in a changing workplace","themes":["Job Design, Crafting \u0026 Motivation"]},{"date":"2026-07-23","topic":"Job Crafting - State-of-the-Science Review (Recent)","authors":"Demerouti, E.","year":"2026","title":"Job Crafting Revisited: Current Insights, Emerging Challenges, and Future Directions","journal":"Annual Review of Organizational Psychology and Organizational Behavior","cite":"13, 195-220","doi":"https://doi.org/10.1146/annurev-orgpsych-020924-064242","summary":"This 2026 Annual Review synthesizes two decades of job crafting research, covering its nomological network, predictors, positive and negative outcomes, cultural variation, and temporal dynamics. It reviews the effectiveness of job crafting interventions and identifies emerging challenges, including crafting in response to technological change and hybrid work. The review closes with a forward-looking research agenda.","relevance":"The most current authoritative synthesis of job crafting, written by a leading JD-R theorist - ideal for orienting research or teaching to the state of the field in 2026.","contribution":"Consolidates fragmented crafting literatures, integrates intervention evidence, and sets the agenda for crafting research in technologically changing workplaces.","uses":"Ideal seminar overview reading; roadmap for dissertation topics and grant framing; source for intervention design in applied projects.","cluster":"Job crafting \u0026 meaningful work: how employees proactively reshape their jobs and sustain meaning in a changing workplace","themes":["Job Design, Crafting \u0026 Motivation"]},{"date":"2026-07-23","topic":"Job Crafting - Measurement/Methods (Recent)","authors":"Vanbelle, E.; Griep, Y.; Van den Broeck, A.; De Witte, H.","year":"2026","title":"Development and Validation of a Short Broad Job Crafting Scale","journal":"Group \u0026 Organization Management","cite":"51(2), 1069-1103","doi":"https://doi.org/10.1177/10596011231208924","summary":"This measurement paper develops and validates the Broad Job Crafting Scale (BJCS), a short instrument capturing job crafting as self-initiated changes employees make to optimize their overall functioning, rather than as specific task or relational behaviors. Across validation samples, the scale shows sound psychometric properties and predictive validity for engagement and well-being outcomes. The brief format suits diary and longitudinal designs.","relevance":"Addresses a persistent measurement debate in the crafting literature (broad vs. dimensional operationalizations) and offers a practical tool for intensive longitudinal I-O research.","contribution":"Provides a validated parsimonious alternative to long multidimensional crafting scales, enabling experience-sampling and repeated-measures crafting research.","uses":"Methods reading for scale development seminars; instrument choice for daily diary studies; citation for measurement sections of grants.","cluster":"Job crafting \u0026 meaningful work: how employees proactively reshape their jobs and sustain meaning in a changing workplace","themes":["Job Design, Crafting \u0026 Motivation","Big Data \u0026 Methods"]},{"date":"2026-07-21","topic":"Four-Day Workweek — Large-Scale Trial (Recent)","authors":"Fan, W.; Schor, J. B.; Kelly, O.; Gu, G.","year":"2025","title":"Work time reduction via a 4-day workweek finds improvements in workers' well-being","journal":"Nature Human Behaviour","cite":"9, 2153-2168","doi":"https://doi.org/10.1038/s41562-025-02259-6","summary":"Analyzed pre/post six-month trial data from 2,896 employees in 141 organizations across six countries (Australia, Canada, Ireland, New Zealand, UK, USA) that adopted a 4-day workweek with no pay reduction, compared with control companies. Employees reduced work by about five hours per week on average. Burnout declined and job satisfaction, mental health, and physical health improved; gains were largely explained by improved sleep, reduced fatigue, and greater perceived work ability. About 90% of trial companies retained the arrangement after the trial.","relevance":"The strongest quasi-experimental evidence to date on work-time reduction, directly relevant to occupational health psychology and future-of-work debates about redesigning working time.","contribution":"Provides multi-country, multi-organization causal-adjacent evidence and identifies mediating mechanisms (sleep, fatigue, work ability) linking work-time reduction to well-being.","uses":"Teaching (future of work, occupational health), lit review anchor for working-time interventions, grant writing on work redesign trials, springboard for I-O replication studies.","cluster":"Work-nonwork interface, flexible work arrangements \u0026 the four-day workweek (new cluster)","themes":["Well-Being \u0026 Occupational Health","Remote \u0026 Hybrid Work"]},{"date":"2026-07-21","topic":"Flexible Work Arrangements — Meta-Analysis (Recent)","authors":"Harrop, N.; Jiang, L.; Overall, N.","year":"2026","title":"A Meta-Analysis of Antecedents and Outcomes of Flexible Working Arrangements","journal":"Journal of Organizational Behavior","cite":"47(2), 208-236","doi":"https://doi.org/10.1002/job.2896","summary":"Meta-analysis synthesizing antecedents and outcomes of flexible working arrangements (FWAs), distinguishing flextime, flexplace, and overall FWA use/availability. Flextime related significantly to 10 outcomes, including higher job satisfaction, commitment, engagement, and work-life balance and lower burnout, strain, and work-family conflict. Overall FWA use related positively to work-life balance and work-to-family enrichment and negatively to work-to-family conflict.","relevance":"Updates the FWA evidence base for the post-pandemic era and gives I-O researchers effect-size benchmarks across well-being, attitudinal, and work-family outcomes.","contribution":"First comprehensive meta-analysis to jointly model antecedents and outcomes of FWAs while separating flexibility types, clarifying which forms of flexibility drive which outcomes.","uses":"Lit review cornerstone for flexibility research, teaching (work design, work-family), meta-analytic input for theory testing and future moderator studies.","cluster":"Work-nonwork interface, flexible work arrangements \u0026 the four-day workweek (new cluster)","themes":["Remote \u0026 Hybrid Work"]},{"date":"2026-07-21","topic":"Flexibility \u0026 Work-Family Conflict — Foundational Meta-Analysis","authors":"Allen, T. D.; Johnson, R. C.; Kiburz, K. M.; Shockley, K. M.","year":"2013","title":"Work-Family Conflict and Flexible Work Arrangements: Deconstructing Flexibility","journal":"Personnel Psychology","cite":"66(2), 345-376","doi":"https://doi.org/10.1111/peps.12012","summary":"Meta-analysis deconstructing the flexibility construct by separating flextime from flexplace and availability from use, and distinguishing work-interference-with-family (WIF) from family-interference-with-work (FIW). FWAs related negatively but weakly to WIF (r = -.11) and were largely unrelated to FIW; effects varied by flexibility form. Concludes that blanket claims about flexibility reducing work-family conflict are oversimplified.","relevance":"A foundational, heavily cited demonstration that construct precision matters in work-family and flexibility research — essential background for any current FWA study.","contribution":"Established the availability-versus-use and flextime-versus-flexplace distinctions that structure virtually all subsequent flexibility research.","uses":"Required background reading for flexibility/work-family seminars, methods discussion of construct deconstruction, baseline for comparing newer meta-analyses.","cluster":"Work-nonwork interface, flexible work arrangements \u0026 the four-day workweek (new cluster)","themes":["Remote \u0026 Hybrid Work"]},{"date":"2026-07-21","topic":"Work-Life Flexibility Policies — Review \u0026 Framework","authors":"Kossek, E. E.; Perrigino, M. B.; Lautsch, B. A.","year":"2023","title":"Work-Life Flexibility Policies From a Boundary Control and Implementation Perspective: A Review and Research Framework","journal":"Journal of Management","cite":"49(6), 2062-2108","doi":"https://doi.org/10.1177/01492063221140354","summary":"Comprehensive review of work-life flexibility policies (flextime, flexplace, reduced load, leaves) organized around a boundary control and implementation perspective. Argues that policy effects depend on who controls boundary enactment (employee vs. employer) and how policies are implemented in context. Develops a research framework linking policy design, implementation, and control to individual and organizational outcomes.","relevance":"Integrates fragmented flexibility literatures into one framework and reframes flexibility as a control issue, connecting work-family research to power, equity, and implementation science.","contribution":"Theoretical contribution: boundary control as the organizing mechanism for understanding when flexibility helps or harms workers; agenda-setting for implementation research.","uses":"Seminar anchor reading on flexibility theory, framework for dissertation/grant conceptual models, source of research questions on policy implementation.","cluster":"Work-nonwork interface, flexible work arrangements \u0026 the four-day workweek (new cluster)","themes":["Remote \u0026 Hybrid Work"]},{"date":"2026-07-21","topic":"Work-Nonwork Balance — Construct Meta-Analysis (Foundational)","authors":"Casper, W. J.; Vaziri, H.; Wayne, J. H.; DeHauw, S.; Greenhaus, J.","year":"2018","title":"The Jingle-Jangle of Work-Nonwork Balance: A Comprehensive and Meta-Analytic Review of Its Meaning and Measurement","journal":"Journal of Applied Psychology","cite":"103(2), 182-214","doi":"https://doi.org/10.1037/apl0000259","summary":"Comprehensive content analysis and meta-analytic review of how work-nonwork balance has been defined and measured, documenting jingle-jangle fallacies (same label, different constructs; different labels, same construct). Meta-analytically distinguishes balance from conflict and enrichment, showing balance predicts outcomes beyond both. Proposes a unifying definition of balance as employees' evaluation of the favorability of their combination of work and nonwork roles.","relevance":"The definitive construct-validity treatment of 'balance' — indispensable for anyone measuring work-life outcomes in flexibility, remote work, or working-time research.","contribution":"Resolves construct proliferation in the balance literature and provides an integrative definition and measurement guidance now widely adopted.","uses":"Methods/construct-validity teaching, measure selection for empirical studies, lit review foundation for balance research.","cluster":"Work-nonwork interface, flexible work arrangements \u0026 the four-day workweek (new cluster)","themes":["Remote \u0026 Hybrid Work","Big Data \u0026 Methods"]},{"date":"2026-07-21","topic":"Flexibility, I-Deals \u0026 Work-Life Equality — Theory","authors":"Kossek, E. E.; Kelliher, C.","year":"2023","title":"Making Flexibility More I-Deal: Advancing Work-Life Equality Collectively","journal":"Group \u0026 Organization Management","cite":"48(1), 317-349","doi":"https://doi.org/10.1177/10596011221098823","summary":"Conceptual article examining flexibility idiosyncratic deals (i-deals) and their unintended consequences for work-life equality. Argues that individually negotiated flexibility can create haves and have-nots, reinforcing inequality across gender, occupation, and status lines. Proposes moving from individual deals toward collectively available flexibility to advance work-life equality.","relevance":"Connects flexibility research to equity and inclusion concerns, highlighting distributional questions I-O psychology often overlooks in work redesign debates.","contribution":"Bridges i-deals theory and work-family scholarship; introduces work-life equality as a collective-level outcome of flexibility practices.","uses":"Debate/critique reading on who benefits from flexibility, DEI-oriented discussions of work redesign, framing for policy-relevant research.","cluster":"Work-nonwork interface, flexible work arrangements \u0026 the four-day workweek (new cluster)","themes":["Remote \u0026 Hybrid Work","Employment Relationships \u0026 Gig Work"]},{"date":"2026-07-17","topic":"Workplace Loneliness — Integrative Review (Recent)","authors":"McCarthy, J. M.; Erdogan, B.; Bauer, T. N.; Kudret, S.; Campion, E.","year":"2026","title":"All the Lonely People: An Integrated Review and Research Agenda on Work and Loneliness","journal":"Journal of Management","cite":"Advance online / 2026 issue","doi":"https://doi.org/10.1177/01492063241313320","summary":"Integrative review of 213 articles (233 empirical studies) spanning management, organizational psychology, sociology, and medicine on work and loneliness. Develops a conceptual model integrating cognitive discrepancy theory, the affect theory of social exchange, and evolutionary theory to explain why people feel lonely at work, how features of work contribute to loneliness, and its organizational consequences. Also reviews intervention strategies for managers and practitioners and lays out a detailed research agenda.","relevance":"The definitive state-of-the-science review on workplace loneliness — a rapidly growing occupational health and remote-work concern in I-O psychology.","contribution":"Integrates three theoretical traditions into one framework and organizes a fragmented, multi-disciplinary literature; sets the agenda for future loneliness research.","uses":"Anchor reading for lit reviews or seminar weeks on well-being/remote work; strong grant-framing citation; intervention section useful for practice-oriented teaching.","cluster":"Workplace loneliness, social connection \u0026 belonging in remote/hybrid work (new cluster)","themes":["Well-Being \u0026 Occupational Health"]},{"date":"2026-07-17","topic":"Workplace Loneliness \u0026 Job Performance (Foundational)","authors":"Ozcelik, H.; Barsade, S. G.","year":"2018","title":"No Employee an Island: Workplace Loneliness and Job Performance","journal":"Academy of Management Journal","cite":"61(6), 2343–2366","doi":"https://doi.org/10.5465/amj.2015.1066","summary":"Time-lagged field study of 672 employees and 114 supervisors in two organizations, integrating the regulatory loop model of loneliness with the affect theory of social exchange. Greater workplace loneliness predicted lower supervisor-rated job performance. The relationship was mediated by lonelier employees' lower approachability and weaker affective organizational commitment.","relevance":"Foundational empirical demonstration that loneliness is a performance issue, not just a well-being issue — legitimized loneliness as an organizational research topic.","contribution":"First rigorous field evidence linking workplace loneliness to performance via relational and attitudinal mechanisms.","uses":"Core teaching article on workplace loneliness; exemplar of time-lagged multi-source field design; foundational citation for lit reviews and grants.","cluster":"Workplace loneliness, social connection \u0026 belonging in remote/hybrid work (new cluster)","themes":["Well-Being \u0026 Occupational Health"]},{"date":"2026-07-17","topic":"Antecedents of Workplace Loneliness (Theory/Qualitative)","authors":"Wright, S.; Silard, A.","year":"2021","title":"Unravelling the antecedents of loneliness in the workplace","journal":"Human Relations","cite":"74(7), 1060–1081","doi":"https://doi.org/10.1177/0018726720906013","summary":"Examines why loneliness emerges at work, moving beyond individual dispositions to organizational and relational antecedents. Theorizes how workplace characteristics — organizational climates, relational norms, and the quality of workplace relationships — create discrepancies between desired and actual social connection that generate loneliness. Offers a framework distinguishing loneliness from related constructs such as isolation and solitude.","relevance":"Shifts attention from person-centered to work-environment explanations of loneliness, which is essential for occupational health interventions and work design research.","contribution":"Clarifies construct boundaries and builds an antecedent-focused theoretical account that most subsequent empirical work draws on.","uses":"Theory reading to pair with empirical loneliness studies; useful for framing dissertations or grants on work design and social connection.","cluster":"Workplace loneliness, social connection \u0026 belonging in remote/hybrid work (new cluster)","themes":["Well-Being \u0026 Occupational Health"]},{"date":"2026-07-17","topic":"Remote Work, Loneliness \u0026 Well-Being (Empirical)","authors":"Becker, W. J.; Belkin, L. Y.; Tuskey, S. E.; Conroy, S. A.","year":"2022","title":"Surviving remotely: How job control and loneliness during a forced shift to remote work impacted employee work behaviors and well-being","journal":"Human Resource Management","cite":"61(4), 449–464","doi":"https://doi.org/10.1002/hrm.22102","summary":"Draws on job demands-control theory and social baseline theory to examine the forced shift to remote work during COVID-19. Perceived job control and work-related loneliness predicted emotional exhaustion and work-life balance, with downstream effects on counterproductive work behaviors, depression, and insomnia. Highlights loneliness as a central demand of remote work arrangements.","relevance":"Directly connects the loneliness literature to remote/hybrid work design — the context where loneliness concerns are most acute for contemporary organizations.","contribution":"Applies social baseline theory (rare in HRM research) to explain why lost social connection at work is depleting; links loneliness to both behavioral and health outcomes.","uses":"Teaching case for remote-work well-being; citation for hybrid-work policy discussions; model for pandemic-era natural-experiment framing.","cluster":"Workplace loneliness, social connection \u0026 belonging in remote/hybrid work (new cluster)","themes":["Well-Being \u0026 Occupational Health","Remote \u0026 Hybrid Work"]},{"date":"2026-07-17","topic":"Workplace Friendship — Dark Sides (Theory)","authors":"Pillemer, J.; Rothbard, N. P.","year":"2018","title":"Friends Without Benefits: Understanding the Dark Sides of Workplace Friendship","journal":"Academy of Management Review","cite":"43(4), 635–660","doi":"https://doi.org/10.5465/amr.2016.0309","summary":"Theoretical analysis of workplace friendship drawing on close-relationships, social exchange, and boundary management theories. Argues four defining features of friendship (informality, voluntariness, communal norms, socioemotional goals) are in tension with four elements of organizational life (formal roles, involuntary constraints, exchange norms, instrumental goals), producing costs alongside benefits for individuals, groups, and organizations.","relevance":"Provides the counterweight to the social-connection literature: workplace relationships are not uniformly beneficial, which sharpens theorizing about what kinds of connection reduce loneliness.","contribution":"Landmark AMR theory piece that reframed workplace friendship research around tensions and boundary conditions rather than simple positive effects.","uses":"Debate/critique reading opposite loneliness articles; strong for seminar discussion on relationships at work; framework for future research on connection interventions.","cluster":"Workplace loneliness, social connection \u0026 belonging in remote/hybrid work (new cluster)","themes":["Teams \u0026 Collaboration"]},{"date":"2026-07-17","topic":"Daily Transient Loneliness \u0026 Performance (Recent Empirical)","authors":"Zheng, G.; Guo, L.; Mao, J.-Y.; Cui, M.","year":"2026","title":"Working on a lonely day: A dual-path model examining the effect of transient workplace loneliness on perceived performance and the cross-level moderator of self-identity orientations","journal":"European Journal of Work and Organizational Psychology","cite":"35(3)","doi":"https://doi.org/10.1080/1359432X.2025.2596976","summary":"Daily diary study modeling loneliness as a transient, within-person state rather than a stable trait. Feeling lonely on a given workday reduced that day's perceived task performance through two paths: an affective path (increased daily work frustration) and a cognitive path (decreased daily work engagement), with self-identity orientations moderating these effects cross-level.","relevance":"Represents the newest wave of loneliness research treating it as a dynamic daily experience — methodologically aligned with experience-sampling approaches central to occupational health psychology.","contribution":"Shifts loneliness research to the within-person level and identifies dual affective/cognitive mechanisms plus individual-difference boundary conditions.","uses":"Exemplar of multilevel daily-diary design for methods teaching; recent citation for within-person well-being research; complements Ozcelik \u0026 Barsade's between-person findings.","cluster":"Workplace loneliness, social connection \u0026 belonging in remote/hybrid work (new cluster)","themes":["Well-Being \u0026 Occupational Health"]},{"date":"2026-07-16","topic":"Job Search — Meta-Analysis (Foundational)","authors":"van Hooft, E. A. J.; Kammeyer-Mueller, J. D.; Wanberg, C. R.; Kanfer, R.; Basbug, G.","year":"2021","title":"Job Search and Employment Success: A Quantitative Review and Future Research Agenda","journal":"Journal of Applied Psychology","cite":"106(5), 674-713","doi":"https://doi.org/10.1037/apl0000675","summary":"Presents a self-regulatory framework organizing the job search literature and meta-analytically tests relationships among job-search self-regulation, job-search behavior, and employment success. Synthesizes hundreds of studies across student, unemployed, and employed job-seeker samples. Finds that self-regulatory variables (goal clarity, self-efficacy, effort) predict search behavior, which in turn predicts employment outcomes, though effects on employment quality are weaker than on speed of job finding. Sets a detailed future research agenda.","relevance":"The definitive quantitative review of job search in I-O psychology; anchors any research or teaching on job seeking, unemployment, and reemployment.","contribution":"Provides an integrative motivational/self-regulatory framework plus meta-analytic effect sizes distinguishing employment success from reemployment quality.","uses":"Core reading for seminars on careers and job search; effect-size benchmarks for lit reviews, grant proposals, and power analyses; agenda-setting for dissertations.","cluster":"Job search, unemployment \u0026 career transitions (new cluster)","themes":["Careers \u0026 Vocational Behavior"]},{"date":"2026-07-16","topic":"Job Seeking — Narrative Review","authors":"Wanberg, C. R.; Ali, A. A.; Csillag, B.","year":"2020","title":"Job Seeking: The Process and Experience of Looking for a Job","journal":"Annual Review of Organizational Psychology and Organizational Behavior","cite":"7, 315-337","doi":"https://doi.org/10.1146/annurev-orgpsych-012119-044939","summary":"Distills empirical research on the process and experience of job seeking, organizing the literature around search intensity, content, and temporality/persistence. Reviews in depth the two most-studied search methods — networking and interviewing — and covers context effects, bias in the job search, and job search interventions. Concludes with pressing open questions for future research.","relevance":"Accessible state-of-the-science review connecting job search to careers, unemployment, and well-being research streams in I-O psychology.","contribution":"Organizes a sprawling literature into three search dimensions and links the process view of search to job finding and job quality outcomes.","uses":"Ideal orienting/background reading for students new to the area; framework source for lit reviews; intervention section useful for applied/practice-oriented work.","cluster":"Job search, unemployment \u0026 career transitions (new cluster)","themes":["Careers \u0026 Vocational Behavior"]},{"date":"2026-07-16","topic":"Job Search — Networking (Empirical)","authors":"Wanberg, C. R.; van Hooft, E. A. J.; Liu, S.; Csillag, B.","year":"2020","title":"Can Job Seekers Achieve More Through Networking? The Role of Networking Intensity, Self-Efficacy, and Proximal Benefits","journal":"Personnel Psychology","cite":"73(4), 559-585","doi":"https://doi.org/10.1111/peps.12380","summary":"Longitudinal study of unemployed job seekers examining whether networking intensity pays off in reemployment outcomes. Finds networking intensity relates to proximal benefits (job leads, referrals, information) and that networking self-efficacy shapes networking behavior over time. Networking's payoff for reemployment speed and quality is more modest and indirect than popular career advice suggests.","relevance":"Directly relevant to vocational and unemployment research; tests a ubiquitous but under-examined career self-management behavior with rigorous longitudinal data.","contribution":"Unpacks the mechanism chain from networking behavior to proximal search benefits to reemployment outcomes, tempering strong practitioner claims about networking.","uses":"Empirical exemplar for teaching longitudinal design in vocational research; evidence base for career counseling and job search intervention design.","cluster":"Job search, unemployment \u0026 career transitions (new cluster)","themes":["Careers \u0026 Vocational Behavior"]},{"date":"2026-07-16","topic":"Involuntary Career Change — Qualitative Longitudinal","authors":"Brazier, C. É.; Masdonati, J.; Parmentier, M.","year":"2025","title":"Chronicles of Involuntary Career Changes: A Qualitative Longitudinal Analysis","journal":"Journal of Career Assessment","cite":"33(3), 592-613","doi":"https://doi.org/10.1177/10690727241289126","summary":"Qualitative longitudinal study following adults through involuntary career changes (e.g., after health problems or layoffs), mapping how transition experiences unfold over time. Identifies distinct trajectory patterns in how people process identity loss, rebuild direction, and re-enter work. Highlights the temporal, nonlinear nature of involuntary transitions and the resources that shape more adaptive trajectories.","relevance":"Speaks to the future-of-work reality of more frequent forced transitions (automation, restructuring); complements variable-centered job search research with rich process data.","contribution":"One of the few qualitative longitudinal designs in career transition research; contributes trajectory typologies of involuntary career change.","uses":"Methods exemplar for qualitative longitudinal analysis in vocational psychology; discussion reading on involuntary transitions; counseling practice implications.","cluster":"Job search, unemployment \u0026 career transitions (new cluster)","themes":["Careers \u0026 Vocational Behavior"]},{"date":"2026-07-16","topic":"Desired Career Change — Temporal Focus (Empirical)","authors":"Jing, X.; Verbruggen, M.; D'Huyvetter, P.","year":"2025","title":"Reaching for the Stars While Staying Grounded: Examining Career Transition Outcomes Across Different Temporal Focus Profiles","journal":"Journal of Occupational and Organizational Psychology","cite":"98, e70064","doi":"https://doi.org/10.1111/joop.70064","summary":"Draws on mental contrasting theory to examine why many workers who long for a career change never realize it. Two-wave study of 306 Belgian workers with a clear desire for career change, using latent profile analysis of temporal focus (past/present/future). Workers with a balanced temporal focus profile were most likely to actually achieve a job change, suggesting that future dreaming works best when grounded in present realities.","relevance":"Recent empirical advance on voluntary career transitions and career inaction — a growing vocational psychology topic highly relevant to career adaptability research.","contribution":"Imports mental contrasting theory into career transition research and demonstrates person-centered (profile) analysis of temporal focus as a transition predictor.","uses":"Teaching example for latent profile analysis; theory-building for research on career inaction and desired-but-unrealized transitions; career coaching implications.","cluster":"Job search, unemployment \u0026 career transitions (new cluster)","themes":["Careers \u0026 Vocational Behavior"]},{"date":"2026-07-16","topic":"Career Sustainability — Latent Transition Analysis (Recent)","authors":"Wu, Z.; Lu, C.-Q.; Akkermans, J.","year":"2026","title":"The Dynamics of Employees' Career Sustainability: A Latent Transition Analysis","journal":"Journal of Occupational and Organizational Psychology","cite":"99, e70101","doi":"https://doi.org/10.1111/joop.70101","summary":"Takes a person-centered approach to career sustainability (health, happiness, productivity), identifying four career sustainability profiles among employees (Study 1, N = 460) and examining transitions between profiles over time. Tests proactivity and person-environment fit change as drivers of movement toward more sustainable career profiles. Shows career sustainability is dynamic, with employees shifting between profiles as fit and proactive behavior change.","relevance":"Connects the sustainable careers framework — central to future-of-work career theory — to within-person dynamics, complementing transition research on job changers.","contribution":"First latent transition analysis of career sustainability profiles; positions proactivity and P-E fit change as levers for sustaining careers over time.","uses":"Methods reading on latent transition analysis; theory reading on sustainable careers; useful for grant framing around career sustainability interventions.","cluster":"Job search, unemployment \u0026 career transitions (new cluster)","themes":["Careers \u0026 Vocational Behavior","Job Design, Crafting \u0026 Motivation"]},{"date":"2026-07-14","topic":"Workforce Aging — State-of-the-Science Review","authors":"Beier, M. E.; Fisher, G. G.","year":"2026","title":"Aging, Work, and Retirement: Twenty-First-Century Issues in an Interdisciplinary Context","journal":"Annual Review of Organizational Psychology and Organizational Behavior","cite":"13, 221-249","doi":"https://doi.org/10.1146/annurev-orgpsych-020924-071358","summary":"Forward-looking interdisciplinary review of workplace aging amid demographic shifts and technological disruption. Organizes the literature around workplace learning and development, the age-diverse workforce, and retirement, using a macro (societal), meso (job design/HR practices), and micro (individual) multilevel framework. Applies lifespan development theories, especially socio-emotional selectivity theory and process models of successful aging at work, and closes with multilevel future research questions.","relevance":"Directly connects workforce aging to future-of-work concerns (automation, learning demands, retirement timing) - a core I-O and occupational health topic.","contribution":"Integrates lifespan development theory with I-O research on aging in a single multilevel framework and sets a 21st-century research agenda.","uses":"Anchor reading for a seminar week on workforce aging; framework for lit reviews and grant proposals on age and technology.","cluster":"Workforce aging, age diversity \u0026 the multigenerational workplace (new cluster)","themes":["Aging \u0026 Generations"]},{"date":"2026-07-14","topic":"Age Diversity — Multilevel Review","authors":"Suh, Y. J.; Kim, K.-J.","year":"2026","title":"A Multilevel Integrated Review on Age Diversity in the Workplace: A Focus on Age Differences in Dyads, Groups, and Organizations","journal":"Work, Aging and Retirement","cite":"12(3), 248-271","doi":"https://doi.org/10.1093/workar/waaf021","summary":"Systematic review of age diversity research organized around three themes: conceptualizations and operationalizations, theoretical mechanisms and outcomes, and contextual moderators/boundary conditions. Synthesizes findings into an integrative framework spanning dyads, groups, and organizations. Argues for multilevel, multidimensional, process-oriented approaches and maps specific future research opportunities per theme.","relevance":"The most current comprehensive map of age diversity research - foundational for anyone studying age-diverse teams and organizations.","contribution":"First integrative multilevel framework spanning dyadic, group, and organizational age-difference research; published online December 2025.","uses":"Literature review scaffold; seminar reading on age diversity; source of dissertation-ready research questions.","cluster":"Workforce aging, age diversity \u0026 the multigenerational workplace (new cluster)","themes":["Aging \u0026 Generations","Diversity, Equity \u0026 Inclusion"]},{"date":"2026-07-14","topic":"Generational Differences — Meta-Analysis \u0026 Critique","authors":"Ravid, D. M.; Costanza, D. P.; Romero, M. R.","year":"2025","title":"Generational Differences at Work? A Meta-Analysis and Qualitative Investigation","journal":"Journal of Organizational Behavior","cite":"46(1), 43-65","doi":"https://doi.org/10.1002/job.2827","summary":"Combines a meta-analysis of generational differences in job satisfaction, organizational commitment, and turnover intent (20 studies, 18 pairwise generational comparisons, N of about 19,961) with a qualitative investigation of how academic literature perpetuates generational stereotypes. Finds little evidence for meaningful generational differences and shows how uncritical academic use of generational labels sustains popular stereotypes.","relevance":"Provides the evidence-based counterweight to popular multigenerational-workforce claims - essential for scientifically grounded practice and teaching.","contribution":"Pairs meta-analytic null findings with an analysis of the literature itself as a stereotype-perpetuation mechanism; strong debate/critique reading.","uses":"Debate reading against generational-differences narratives; teaching critical evaluation of pop-management claims; evidence-based practice discu
