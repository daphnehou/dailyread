ment and the homogenization of creative output at scale.","relevance":"Highly relevant to creativity research in organizations and the sociology of knowledge work; raises critical questions about innovation, originality, and the organizational-level consequences of widespread AI adoption—important for I-O psychology and strategic HRM.","contribution":"Introduces the theoretical paradox of AI as simultaneously an individual creativity enhancer and a collective diversity reducer; provides experimental evidence for population-level homogenization effects that have major implications for innovation management and organizational creativity theory.","uses":"Excellent debate/critique reading for seminar sessions on AI and creativity or innovation; pairs well with articles on AI augmentation; useful for grant applications on AI, diversity of thought, and organizational learning.","cluster":"Generative AI in Knowledge Work \u0026 Productivity","themes":["AI \u0026 Future of Work","Diversity, Equity \u0026 Inclusion"]},{"date":"2026-06-27","topic":"Generative AI Literacy \u0026 Job Performance","authors":"Liu, X., Zhang, L., \u0026 Wei, X.","year":"2025","title":"Generative Artificial Intelligence Literacy: Scale Development and Its Effect on Job Performance","journal":"Behavioral Sciences","cite":"15(6), 811","doi":"https://doi.org/10.3390/bs15060811","summary":"Drawing on Ability-Motivation-Opportunity (AMO) theory, this study developed and validated a multidimensional Generative AI Literacy scale encompassing technical competence, prompt optimization, content evaluation, innovative application, and ethical/compliance awareness. Survey data from employees showed that GenAI Literacy had a significant positive effect on job performance (β = 0.68, p \u003c .001), partially mediated by creative self-efficacy. The scale fills a psychometric gap in the AI literacy literature and demonstrates the incremental predictive validity of GenAI-specific literacy beyond general digital literacy.","relevance":"Relevant to I-O psychology and HRM: offers a psychometrically validated instrument for assessing a new form of job-relevant competency (GenAI literacy) with demonstrated links to job performance through creative self-efficacy.","contribution":"Develops and validates the first multidimensional scale for Generative AI Literacy with relevance to organizational contexts; provides an empirically grounded AMO-based framework linking AI literacy to performance outcomes.","uses":"Methods reading for seminar discussions on AI competency assessment and psychometric scale development; practical resource for HR practitioners designing AI literacy training programs; useful for selection and performance management research in AI-augmented workplaces.","cluster":"Generative AI in Knowledge Work \u0026 Productivity","themes":["AI \u0026 Future of Work","Big Data \u0026 Methods"]},{"date":"2026-06-26","topic":"Aging at Work / Interdisciplinary Review","authors":"Beier, M. E.; Fisher, G. G.","year":"2026","title":"Aging, Work, and Retirement: Twenty-First-Century Issues in an Interdisciplinary Context","journal":"Annual Review of Organizational Psychology and Organizational Behavior","cite":"13, 221–249","doi":"https://doi.org/10.1146/annurev-orgpsych-020924-071358","summary":"Beier and Fisher provide a comprehensive interdisciplinary review of aging, work, and retirement, organized around macro (societal/cultural), meso (job design, organizational climate, HR practices), and micro (individual health, wealth, traits, motivation) levels. They focus on three themes: workplace learning and development for aging workers, managing an age-diverse workforce, and retirement transitions. The review synthesizes decades of research while offering a forward-looking agenda addressing how technological disruption and demographic shifts are reshaping the landscape of work across the globe.","relevance":"This review is essential for a Future of Work seminar; it frames aging and retirement as a multilevel phenomenon with clear links to I-O psychology, HRM, career development, and technology-driven workforce change.","contribution":"Provides a coherent multilevel theoretical framework for studying aging at work, integrating macro societal factors with micro individual-level processes; sets a comprehensive future research agenda for the field.","uses":"Required reading for workforce aging week; excellent for orienting graduate students to the breadth of the aging-at-work literature; useful for grant writing on older worker populations.","cluster":"Workforce Aging, Multigenerational Workplace \u0026 Late-Career Development","themes":["Aging \u0026 Generations"]},{"date":"2026-06-26","topic":"Multigenerational Workplace / Generational Differences","authors":"Ravid, D. M.; Costanza, D. P.; Romero, M. R.","year":"2025","title":"Generational Differences at Work? A Meta-Analysis and Qualitative Investigation","journal":"Journal of Organizational Behavior","cite":"46(1), 43–65","doi":"https://doi.org/10.1002/job.2827","summary":"In Study 1, Ravid and colleagues conducted a meta-analysis of the generations literature, finding few systematic or meaningful differences among generations on a variety of workplace outcomes, contradicting popular claims about generational divides. In Study 2, they qualitatively examined why research and practice using generations persist despite weak empirical support, identifying social, cultural, and confirmatory bias explanations. Together, the studies challenge the scientific basis of generational taxonomies and call for alternative frameworks grounded in developmental or cohort-effects perspectives.","relevance":"Directly relevant to discussions of multigenerational workplaces and age diversity; provides empirical grounding to critically evaluate popular managerial narratives about millennials, Gen Z, and boomers at work.","contribution":"Offers rare mixed-methods evidence that the generational differences framework lacks empirical validity; advances the argument for replacing generational labels with age-related developmental or contextual explanations.","uses":"Ideal as a debate/critique reading in a workforce aging or diversity seminar; challenges students to distinguish popular narratives from scientific evidence; useful for teaching critical appraisal of organizational research.","cluster":"Workforce Aging, Multigenerational Workplace \u0026 Late-Career Development","themes":["Aging \u0026 Generations"]},{"date":"2026-06-26","topic":"Aging Workforce / Technology Adaptation","authors":"Chang, C.-H.; Xu, H.; Xie, B.","year":"2023","title":"Aging Workforce in the Context of Technological Advancements: Toward a Socio-Ecological Model","journal":"Work, Aging and Retirement","cite":"9(4), 323–340","doi":"https://doi.org/10.1093/workar/waad025","summary":"Chang, Xu, and Xie propose the SEASAW-Tech model (Socio-Ecological Approach to Successful Aging at Work in the context of Technology), a multilevel theoretical framework addressing how older workers navigate technological change. The model integrates individual, organizational, and societal factors to explain variation in older workers' technology adoption and adaptation. It highlights the interplay between cognitive aging, motivational orientations, organizational support, and societal norms in shaping successful aging at work amid digital transformation.","relevance":"Directly addresses how the future of work intersects with workforce aging; the model provides a theoretically grounded framework for understanding older workers' responses to AI, automation, and digital tools.","contribution":"Introduces a novel socio-ecological multilevel framework specifically designed for the aging-technology intersection; bridges lifespan developmental theory with organizational contexts of technological change.","uses":"Required or recommended reading for aging + technology topics; excellent for framing seminar discussion on digital upskilling for older workers; applicable to grant proposals on AI readiness across the lifespan.","cluster":"Workforce Aging, Multigenerational Workplace \u0026 Late-Career Development","themes":["Aging \u0026 Generations"]},{"date":"2026-06-26","topic":"Aging at Work / Telework \u0026 Boundary Management","authors":"Scheibe, S.","year":"2024","title":"Age-Related Differences in the Use of Boundary Management Tactics When Teleworking: Implications for Productivity and Work-Life Balance","journal":"Journal of Occupational and Organizational Psychology","cite":"97(4), 1330–1352","doi":"https://doi.org/10.1111/joop.12512","summary":"Scheibe examined how employee age relates to telework outcomes—work-life balance and unfinished tasks—mediated by boundary management tactics aimed at segmenting work and nonwork roles. Results indicated that older workers tended to use more segmentation tactics during telework, which partially accounted for their different productivity and work-life balance outcomes compared to younger workers. The study draws on lifespan developmental theory to explain why age-related differences in boundary management preferences and capabilities emerge in remote work contexts.","relevance":"Connects workforce aging with contemporary remote/hybrid work design questions; illustrates how lifespan development theory applies to boundary management, a key mechanism in well-being and work-life balance research.","contribution":"Empirically tests age as a moderator of telework outcomes through boundary management tactics, extending boundary theory into age-diverse workforce contexts; highlights practical implications for HR policy on hybrid work arrangements.","uses":"Recommended reading for aging + work design or well-being topics; pairs well with boundary theory readings; useful for discussing how remote work policies differentially affect workers across the age spectrum.","cluster":"Workforce Aging, Multigenerational Workplace \u0026 Late-Career Development","themes":["Remote \u0026 Hybrid Work","Aging \u0026 Generations"]},{"date":"2026-06-26","topic":"Late Career / Person-Environment Fit","authors":"Harris, A.; Davenport, M. K.; Fasbender, U.","year":"2025","title":"Exploring the Role of Uncertainty Regulation Strategies to Demystify the Link Between Person–Environment Misfit and Late-Career Outcomes","journal":"Work, Aging and Retirement","cite":"11(4), 358–376","doi":"https://doi.org/10.1093/workar/waae008","summary":"Harris and colleagues investigated how uncertainty regulation strategies explain the association between person-environment (PE) misfit and late-career outcomes among older workers. They found that PE misfit was linked to adverse late-career outcomes (e.g., reduced engagement, higher retirement intentions), but that uncertainty regulation strategies—such as problem-focused coping or acceptance-based approaches—buffered these effects. The study advances understanding of how older workers actively manage career-related uncertainty when facing misfit with their work environment.","relevance":"Highly relevant to career development and vocational behavior literatures; bridges PE fit theory, lifespan development, and occupational health perspectives as applied to late-career challenges faced by aging workers.","contribution":"Identifies uncertainty regulation as a novel mediating mechanism linking PE misfit to late-career outcomes, extending both PE fit theory and career self-management frameworks into late-career developmental contexts.","uses":"Recommended reading for aging, career development, or occupational health topics; useful for seminar discussions on late-career interventions and well-being; applicable to practitioner-focused work on retirement readiness.","cluster":"Workforce Aging, Multigenerational Workplace \u0026 Late-Career Development","themes":["Careers \u0026 Vocational Behavior"]},{"date":"2026-06-26","topic":"Age-Inclusive HRM / Retirement Intentions","authors":"Fasbender, U.; Froidevaux, A.; Klehe, U.-C.","year":"2025","title":"Age-Inclusive HR Practices as Resource Passageways: Explaining Retirement Intentions Through Employability and Job Insecurity","journal":"Human Resource Management","cite":"Advance online publication","doi":"https://doi.org/10.1002/hrm.70036","summary":"Fasbender and colleagues examined how age-inclusive HR practices relate to older workers' retirement intentions through the dual pathways of perceived employability and job insecurity. Drawing on conservation of resources theory, they found that age-inclusive HR practices increased perceived employability, which reduced retirement intentions, but these same practices did not consistently reduce job insecurity, attenuating the overall buffering effect. The study highlights both the promise and limitations of organizational HR interventions for retaining older workers.","relevance":"Directly relevant to HRM, aging, and career development literatures; provides empirical evidence about the organizational mechanisms through which HR policies either retain or lose older workers, a critical future-of-work issue.","contribution":"Tests a dual-pathway conservation of resources model linking HR practices to retirement intentions; advances understanding of why HR interventions sometimes fail to retain older workers despite good intentions.","uses":"Recommended reading for aging + HRM or career transitions topics; useful for practitioners designing age-inclusive retention programs; applicable to discussions of late-career HR strategy in the context of workforce aging.","cluster":"Workforce Aging, Multigenerational Workplace \u0026 Late-Career Development","themes":["Careers \u0026 Vocational Behavior","Aging \u0026 Generations","Employment Relationships \u0026 Gig Work"]},{"date":"2026-06-25","topic":"Vocational Calling \u0026 Work Meaning","authors":"Dobrow, S. R.; Weisman, H.; Heller, D.; Tosti-Kharas, J.","year":"2023","title":"Calling and the Good Life: A Meta-Analysis and Theoretical Extension","journal":"Administrative Science Quarterly","cite":"68(2), 508–550","doi":"https://doi.org/10.1177/00018392231159641","summary":"This meta-analysis of 201 studies examines the relationship between two types of calling (internally focused vs. externally focused) and outcomes indicative of 'the good life,' including hedonic well-being, eudaimonic well-being, and engagement. Results show that both calling types are positively linked to well-being, but with important differences: neoclassical calling (sense of destiny) and modern calling (prosocial purpose) have differential effects on outcomes. The authors also identify moderators and propose a theoretical extension clarifying mechanisms.","relevance":"Directly addresses calling as a central construct in vocational and I-O psychology, offering the most comprehensive quantitative synthesis to date on when and why calling benefits workers.","contribution":"Provides the first meta-analytic comparison of two major theoretical traditions in calling research and extends theory by distinguishing pathways to well-being outcomes—a critical advance for seminar discussion.","uses":"Required reading for calling/meaning module; ideal anchor for debate on whether calling is uniformly beneficial; useful for lit review on well-being and career development.","cluster":"Vocational Interests, Calling, Meaning \u0026 Career Self-Management","themes":["Careers \u0026 Vocational Behavior"]},{"date":"2026-06-25","topic":"Vocational Calling \u0026 Work Orientations","authors":"Schabram, K.; Nielsen, J.; Thompson, J.","year":"2023","title":"The Dynamics of Work Orientations: An Updated Typology and Agenda for the Study of Jobs, Careers, and Callings","journal":"Academy of Management Annals","cite":"17(2), 405–438","doi":"https://doi.org/10.5465/annals.2021.0153","summary":"This integrative review revisits and updates Wrzesniewski et al.'s (1997) foundational tripartite taxonomy of job, career, and calling orientations. Drawing on extensive empirical evidence accumulated since 1997, the authors challenge the assumption of three mutually exclusive orientations and propose a reconceptualization around two orthogonal dimensions—job/calling and career—yielding four profiles. The article also synthesizes antecedents, outcomes, and development of orientations across the lifespan.","relevance":"Provides graduate students with a theoretically grounded, up-to-date framework for understanding how individuals relate to work—a core issue in vocational psychology, career counseling, and organizational behavior.","contribution":"Challenges a classic and widely cited typology with new evidence, demonstrating how career science evolves; the proposed two-dimensional framework opens new measurement and research directions.","uses":"Required foundational reading for calling/work orientations week; pairs well with Dobrow et al. (2023); useful for stimulating seminar debate about taxonomy vs. dimensional approaches.","cluster":"Vocational Interests, Calling, Meaning \u0026 Career Self-Management","themes":["Careers \u0026 Vocational Behavior"]},{"date":"2026-06-25","topic":"Career Development / Future Work Self","authors":"Talluri, S. B.; Strauss, K.","year":"2025","title":"Future Work Self Salience: A Systematic Review and Future Research Agenda","journal":"Applied Psychology","cite":"74(3), e70018","doi":"https://doi.org/10.1111/apps.70018","summary":"This systematic review synthesizes research on future work self-salience (FWSS)—the degree to which individuals can clearly envision who they want to become professionally. Covering antecedents, outcomes, and moderators across studies, the authors map the construct's nomological network and identify gaps in understanding. The review highlights FWSS as a key motivational driver of proactive career behaviors such as networking, skill development, and job search.","relevance":"FWSS is an increasingly studied individual-difference construct at the intersection of vocational psychology, career development, and motivation; this review offers a comprehensive map of its theoretical landscape.","contribution":"Integrates disparate FWSS studies into a coherent framework and proposes a research agenda—a methodological and theoretical contribution suitable for introducing graduate students to systematic review as a method.","uses":"Recommended reading for career development and future of work modules; useful for dissertation students studying identity, self-regulation, and career proactivity.","cluster":"Vocational Interests, Calling, Meaning \u0026 Career Self-Management","themes":["Careers \u0026 Vocational Behavior"]},{"date":"2026-06-25","topic":"Vocational Interests \u0026 Person-Environment Fit","authors":"Kandler, C.; Kühn, S.; Mönkediek, B.; Forstner, A. J.; Bleidorn, W.","year":"2024","title":"A Multidisciplinary Perspective on Person-Environment Fit: Relevance, Measurement, and Future Directions","journal":"Current Directions in Psychological Science","cite":"33(3), 198–205","doi":"https://doi.org/10.1177/09637214241242451","summary":"This concise review synthesizes research on person-environment (PE) fit from psychology, sociology, and behavioral genetics. The authors address how fit is conceptualized across disciplines, key measurement challenges (including polynomial regression and response surface analysis), and how genetic and environmental factors jointly shape fit. They argue for integrating gene-environment interaction perspectives and longitudinal designs into future PE fit research.","relevance":"PE fit is a cornerstone construct linking vocational interests, personality, and career success; this cross-disciplinary review introduces students to methodological debates (e.g., fit assessment methods) and opens discussion of biological and social determinants of fit.","contribution":"Uniquely bridges behavioral genetics and vocational psychology, questioning the assumption that fit is purely environmentally determined—providing a provocative and novel angle for seminar discussion.","uses":"Methods and debate reading for vocational interests/PE fit topic; pairs well with Holland's RIASEC tradition; relevant to measurement discussions in ORM courses.","cluster":"Vocational Interests, Calling, Meaning \u0026 Career Self-Management","themes":["Careers \u0026 Vocational Behavior","Big Data \u0026 Methods"]},{"date":"2026-06-25","topic":"Vocational Passion \u0026 Career Motivation","authors":"Bailey, E. R.; Krautter, K.; Wu, W.; Galinsky, A. D.; Jachimowicz, J. M.","year":"2024","title":"A Potential Pitfall of Passion: Passion Is Associated With Performance Overconfidence","journal":"Social Psychological and Personality Science","cite":"15(7), 769–779","doi":"https://doi.org/10.1177/19485506241252461","summary":"Across multiple studies, the authors demonstrate that individuals with greater passion for their work tend to be overconfident about their performance—they overestimate how well they did relative to objective outcomes. This overconfidence effect is driven by passion's positive affect, and it occurs across diverse tasks and domains. The article identifies passion as a double-edged sword: motivating, but also distorting self-assessment.","relevance":"Provides a critical perspective on the passion-at-work narrative dominant in popular culture and emerging scholarly literature, with direct implications for selection, performance management, and career counseling in I-O psychology.","contribution":"Shifts the field's understanding of passion from uniformly positive to nuanced, using rigorous experimental and multi-study designs to isolate a specific mechanism (positive affect → overconfidence).","uses":"Excellent debate/critique reading for passion and calling modules; pairs with 'dark side of calling' literature; useful for selection and performance appraisal discussions.","cluster":"Vocational Interests, Calling, Meaning \u0026 Career Self-Management","themes":["Careers \u0026 Vocational Behavior","Job Design, Crafting \u0026 Motivation"]},{"date":"2026-06-25","topic":"Career Development / Career Self-Management","authors":"Hirschi, A.; Wilhelm, F.","year":"2025","title":"Career Self-Management Competencies: Conceptualization and Measurement Based on a Career Self-Regulation Framework","journal":"Journal of Career Assessment","cite":"Advance online publication","doi":"https://doi.org/10.1177/10690727251391209","summary":"The authors develop and validate a new 8-item Career Self-Management Competencies Scale (CSM-C) grounded in a self-regulation framework covering goal setting, resource/barrier mapping, action planning, and monitoring/revision. Across two independent German samples, the scale demonstrates strong psychometric properties and incremental validity for career behaviors, employability, workplace status, and career satisfaction above established predictors. The work provides both a theoretical model and a practical measurement tool for assessing career agency.","relevance":"Career self-management is central to contemporary boundaryless and protean career models; this article addresses the construct validity and measurement of CSM—critical for I-O practitioners interested in assessing and developing career competencies.","contribution":"Advances career psychology by formalizing a self-regulation model of CSM and providing a validated short scale—a dual theoretical and psychometric contribution useful for applied assessment and research.","uses":"Methods and recommended reading for career development week; useful for students interested in scale development; applicable in training, coaching, and HRD contexts.","cluster":"Vocational Interests, Calling, Meaning \u0026 Career Self-Management","themes":["Careers \u0026 Vocational Behavior","Big Data \u0026 Methods"]},{"date":"2026-06-25","topic":"Vocational Calling \u0026 Work Behavior","authors":"Tosti-Kharas, J.; Dobrow, S. R.; Kappes, H. B.","year":"2024","title":"Do What You Love and You'll Never Work a Day in Your Life? Testing Fundamental Assumptions About Calling, Effort, and Enjoyment","journal":"Journal of Management Scientific Reports","cite":"2(1)","doi":"https://doi.org/10.1177/27550311241233673","summary":"Using a large MTurk sample of 2,839 workers, the authors experimentally test whether calling predicts greater effort and enjoyment on work tasks. Results confirm that stronger calling is associated with more effort invested and higher task enjoyment, even on relatively mundane tasks. Crucially, the calling–effort link was especially strong when no additional financial incentive was provided, suggesting calling may substitute for extrinsic motivation—and expose strong-calling employees to potential exploitation.","relevance":"Empirically tests a foundational but long-assumed claim in calling research, with implications for how organizations recruit, reward, and retain employees who feel called to their work.","contribution":"Moves calling research from correlation to experimental methodology, isolating the mechanism of intrinsic motivation and surfacing an underexplored dark side—exploitation risk—that challenges straightforward positive accounts of calling.","uses":"Debate/critique reading for calling module; pairs with Dobrow et al. (2023) meta-analysis; excellent for seminar discussion on ethics of calling rhetoric in organizations.","cluster":"Vocational Interests, Calling, Meaning \u0026 Career Self-Management","themes":["Careers \u0026 Vocational Behavior"]},{"date":"2026-06-24","topic":"Recovery from Work / Off-Job Recovery","authors":"Headrick, L., Newman, D. A., Park, Y. A., \u0026 Liang, Y.","year":"2023","title":"Recovery Experiences for Work and Health Outcomes: A Meta-Analysis and Recovery-Engagement-Exhaustion Model","journal":"Journal of Business and Psychology","cite":"38(4), 821–864","doi":"https://doi.org/10.1007/s10869-022-09821-3","summary":"This meta-analysis synthesizes k=316 independent samples (N=99,329) examining four recovery experiences (psychological detachment, relaxation, mastery, control) in relation to job and health outcomes. Results show relaxation and mastery positively predict both job outcomes (e.g., engagement, performance) and personal outcomes (e.g., well-being), while psychological detachment primarily reduces negative personal outcomes such as exhaustion and work-family conflict but does not strongly benefit job outcomes. The authors propose a Recovery-Engagement-Exhaustion Model integrating recovery into JD-R theory.","relevance":"Essential for understanding how off-job recovery mechanisms differentially impact worker well-being and job performance — a core occupational health topic relevant to both I-O psychology and workforce sustainability.","contribution":"Provides one of the largest meta-analytic tests of recovery experiences theory, differentiating between job outcomes and personal health outcomes and building a theoretical model that extends JD-R.","uses":"Teaching recovery and well-being modules; literature review on occupational health; grant proposals on work-life balance interventions; study design for diary studies.","cluster":"Burnout, Recovery \u0026 Work Engagement","themes":["Well-Being \u0026 Occupational Health","Job Design, Crafting \u0026 Motivation"]},{"date":"2026-06-24","topic":"Burnout / Recovery — Psychological Detachment","authors":"Blake, H., Hassard, J., Thomson, L., Choo, W. H., Dulal-Arthur, T., Karanika-Murray, M., Delic, L., Pickford, R., \u0026 Rudkin, L.","year":"2025","title":"Psychological Detachment From Work Predicts Mental Wellbeing of Working-Age Adults: Findings From the 'Wellbeing of the Workforce' (WoW) Prospective Longitudinal Cohort Study","journal":"PLOS ONE","cite":"20(1), e0312673","doi":"https://doi.org/10.1371/journal.pone.0312673","summary":"This prospective longitudinal cohort study (T1 n=337; T2 n=169) examined psychological detachment from work across two COVID-19 lockdown waves in the UK. Psychological detachment at T1 predicted psychological wellbeing and life satisfaction at T2, one year later, irrespective of work status. Changes in detachment over time also predicted wellbeing trajectories, underscoring the importance of recovery during sustained stressful conditions.","relevance":"Provides rare longitudinal evidence that psychological detachment from work causally predicts mental wellbeing over time — directly applicable to occupational health psychology and worker recovery research.","contribution":"Uses a prospective longitudinal design to move beyond cross-sectional limitations in the recovery literature, showing detachment as a predictor (not just correlate) of wellbeing.","uses":"Teaching evidence-based recovery strategies; occupational health intervention design; discussion of COVID-era work intensification and its health consequences.","cluster":"Burnout, Recovery \u0026 Work Engagement","themes":["Well-Being \u0026 Occupational Health"]},{"date":"2026-06-24","topic":"Burnout — Conceptual / Theory","authors":"Demerouti, E., \u0026 Bakker, A. B.","year":"2025","title":"Revitalising Burnout Research","journal":"Work \u0026 Stress","cite":"39(2), 153–161","doi":"https://doi.org/10.1080/02678373.2025.2473385","summary":"This invited commentary critically examines the state of burnout research after five decades, identifying theoretical and methodological pitfalls including over-reliance on cross-sectional self-report designs and measurement conflation with depression. The authors argue that burnout is a fundamentally work-driven syndrome distinct from depression and call for theoretical innovation, causal designs, and intervention research. They propose priorities including diary studies, intervention trials, and bio-physiological measures.","relevance":"Offers a timely recalibration of burnout research priorities from two leading scholars — ideal for framing seminar discussions on where the field is headed and what methodological rigor looks like in occupational health.","contribution":"Identifies key gaps in the burnout literature (causal inference, biological markers, intervention science) and provides a forward-looking research agenda from the creators of JD-R theory.","uses":"Debate readings for burnout seminars; framing future research directions; discussing construct validity and methodological rigor in occupational health research.","cluster":"Burnout, Recovery \u0026 Work Engagement","themes":["Well-Being \u0026 Occupational Health"]},{"date":"2026-06-24","topic":"Burnout — Critique / Debate","authors":"Bianchi, R., \u0026 Schonfeld, I. S.","year":"2025","title":"Beliefs About Burnout","journal":"Work \u0026 Stress","cite":"39(2), 116–134","doi":"https://doi.org/10.1080/02678373.2024.2364590","summary":"This debate article challenges three widely held but empirically questionable beliefs about burnout: (a) that work-related factors are its primary predictors, (b) that burnout is at epidemic levels in society, and (c) that burnout is clearly distinct from depression. The authors review evidence showing that non-work factors also strongly predict burnout, that burnout prevalence is often overstated due to measurement variation, and that burnout and depression share extensive symptom overlap and common predictors.","relevance":"Provides a critical counterpoint to mainstream burnout discourse, directly engaging with measurement and conceptual debates that are central to I-O and occupational health psychology.","contribution":"Challenges the field's foundational assumptions with systematic empirical critique, prompting reconsideration of construct validity, prevalence estimates, and the burnout-depression boundary.","uses":"Debate/critique reading for burnout and well-being seminars; methodological discussions of construct validity; paired with pro-JD-R readings for balanced discussion.","cluster":"Burnout, Recovery \u0026 Work Engagement","themes":["Well-Being \u0026 Occupational Health"]},{"date":"2026-06-24","topic":"Recovery from Work / Leader Behavior","authors":"Sonnentag, S., Kark, R., \u0026 Venz, L.","year":"2024","title":"Leader Support for Recovery: A Multi-Level Approach to Employee Psychological Detachment From Work","journal":"Journal of Occupational and Organizational Psychology","cite":"97(4), 1762–1788","doi":"https://doi.org/10.1111/joop.12538","summary":"This multi-level field study examined how leader support for recovery — operationalized as leader empathy for employees' recovery needs, respect for work-nonwork boundaries, and leader role-modelling of detachment — relates to employee psychological detachment from work. Using leader-member exchange (LMX) as a moderator, findings showed that leader recovery support predicted employee detachment during non-work hours, which in turn predicted employee well-being. Effects were stronger for employees with higher LMX quality.","relevance":"Connects leadership research to occupational health by demonstrating that supervisor behavior directly shapes employees' ability to psychologically recover from work — relevant to both leadership and worker well-being literatures.","contribution":"Extends recovery theory by incorporating the social/organizational context, showing leaders as important agents in enabling or inhibiting employee recovery, and using a multi-level design.","uses":"Teaching leadership and worker well-being connections; designing organizational recovery interventions; lit review for supervisor influence on employee health outcomes.","cluster":"Burnout, Recovery \u0026 Work Engagement","themes":["Well-Being \u0026 Occupational Health","Leadership"]},{"date":"2026-06-24","topic":"Recovery from Work / Psychological Detachment","authors":"Sonnentag, S., \u0026 Wiegelmann, M.","year":"2024","title":"Not Detaching From Work During Leisure Time: A Control-Theory Perspective on Job-Related Cognitions","journal":"Journal of Organizational Behavior","cite":"45(7), 1003–1024","doi":"https://doi.org/10.1002/job.2792","summary":"This article develops a control-theory framework to explain why employees fail to psychologically detach from work during leisure time, focusing on the role of work goal salience and interrupted or incomplete work goals. The authors propose that activated work goals that remain unresolved keep employees cognitively engaged with work during off-time, impairing recovery. Drawing on control theory and goal-systems theory, the paper generates novel testable propositions about antecedents of failed detachment.","relevance":"Addresses a practical puzzle — why workers cannot 'switch off' — using a theoretically grounded framework, contributing to both recovery theory and organizational behavior literatures.","contribution":"Proposes a new control-theory lens for understanding psychological detachment failure, complementing existing resource-based explanations and generating novel hypotheses.","uses":"Theory development in recovery research; discussions of goal regulation and well-being; future empirical study designs; workplace technology and off-hours communication policies.","cluster":"Burnout, Recovery \u0026 Work Engagement","themes":["Well-Being \u0026 Occupational Health"]},{"date":"2026-06-24","topic":"Worker Well-Being / Positive Work Experiences","authors":"Ilies, R., Bono, J. E., \u0026 Bakker, A. B.","year":"2024","title":"Crafting Well-Being: Employees Can Enhance Their Own Well-Being by Savoring, Reflecting Upon, and Capitalizing on Positive Work Experiences","journal":"Annual Review of Organizational Psychology and Organizational Behavior","cite":"11, 63–91","doi":"https://doi.org/10.1146/annurev-orgpsych-110721-045931","summary":"This review synthesizes research on how positive work events and experiences shape employee well-being, focusing on agentic strategies employees use to amplify these effects. The authors review evidence on savoring (enhancing enjoyment of positive experiences in the moment), reflecting (mentally revisiting positive experiences afterward), and capitalizing (sharing positive experiences with others) as mechanisms for well-being enhancement. They present a model integrating these strategies and call for more intervention research.","relevance":"Offers a proactive, positive-psychology perspective on worker well-being that complements deficit-focused burnout and stress literatures — broadens the scope of I-O well-being research to include flourishing.","contribution":"Introduces well-being crafting as a novel construct and proposes a theoretical model integrating savoring, reflecting, and capitalizing mechanisms that extend positive psychology into the work domain.","uses":"Teaching positive organizational psychology and worker flourishing; intervention design for well-being programs; broadening literature reviews beyond burnout to include thriving; motivation for experience-sampling and diary studies.","cluster":"Burnout, Recovery \u0026 Work Engagement","themes":["Well-Being \u0026 Occupational Health"]},{"date":"2026-06-22","topic":"AI \u0026 Work / Psychological Contract","authors":"Saurombe, M. D.","year":"2026","title":"Algorithmic anxiety: AI, work, and the evolving psychological contract in digital discourse","journal":"Frontiers in Psychology","cite":"17, 1745164","doi":"https://doi.org/10.3389/fpsyg.2026.1745164","summary":"This mixed-methods study analyzed 1,454 Reddit narratives about AI-driven job displacement using sentiment analysis (VADER and BERT) and thematic content analysis. Results revealed surface-level optimism (52% positive via VADER) but deeper negative sentiment (51% via BERT), capturing what the author terms 'algorithmic anxiety.' Seven themes emerged: shattered trust, eroded identities, technostress, devalued expertise, anxiety about the future, cynicism about adapting, and affirming human values. Network analysis identified three interconnected discourse clusters around employment disruption, ethical concerns, and technical systems.","relevance":"Highly relevant to I-O and OHP: captures employee psychological responses to AI adoption, including technostress and psychological contract breach. Useful for courses on AI and worker well-being, and for understanding worker sense-making about automation.","contribution":"Extends psychological contract theory to algorithmic/AI work contexts and introduces 'algorithmic anxiety' as a distinct construct. Applies self-determination theory and conservation of resources theory to AI-transformed workplaces. Novel use of computational text analysis (digital trace data) in organizational psychology.","uses":"Teaching module on AI, technostress, and psychological contracts; discussion starter on worker voice and AI; lit review grounding for digital trace methods in I-O contexts; future research on algorithmic anxiety measurement.","cluster":"AI \u0026 Assessment, Human-AI Collaboration, and Career Development","themes":["AI \u0026 Future of Work","Algorithmic Management \u0026 Surveillance","Employment Relationships \u0026 Gig Work"]},{"date":"2026-06-22","topic":"Human-AI Collaboration / Knowledge Management","authors":"Li, Y.-B., Liao, T.-H., Tsai, C.-H., \u0026 Wu, T.-J.","year":"2025","title":"From Synergy to Strain: Exploring the Psychological Mechanisms Linking Employee–AI Collaboration and Knowledge Hiding","journal":"Behavioral Sciences","cite":"16(1), 13","doi":"https://doi.org/10.3390/bs16010013","summary":"Three-wave time-lagged survey of 348 knowledge workers in China examined how employee-AI collaboration relates to knowledge-hiding behavior via job insecurity perceptions. Results showed AI collaboration elevated perceived job insecurity, which in turn promoted knowledge hiding toward colleagues. AI trust moderated this chain: higher AI trust reduced insecurity and subsequently reduced knowledge hiding. Findings highlight paradoxical effects of AI collaboration — efficiency gains alongside defensive interpersonal behaviors.","relevance":"Relevant to I-O research on the unintended social and behavioral consequences of AI adoption; addresses how AI collaboration affects interpersonal dynamics, trust, and organizational citizenship. Important for courses on AI at work and organizational behavior.","contribution":"Identifies job insecurity as a key psychological mechanism in the AI collaboration-to-knowledge-hiding pathway; introduces AI trust as a moderating variable; uses longitudinal three-wave design, strengthening causal inference. Contributes to emerging literature on dark sides of human-AI collaboration.","uses":"Theoretical grounding for future research on AI collaboration and counterproductive work behavior; teaching case on paradoxes of AI adoption; lit review on job insecurity and technology; grant writing on knowledge management in AI-augmented workplaces.","cluster":"AI \u0026 Assessment, Human-AI Collaboration, and Career Development","themes":["AI \u0026 Future of Work","Well-Being \u0026 Occupational Health","Teams \u0026 Collaboration"]},{"date":"2026-06-22","topic":"AI-Based Assessment \u0026 Selection","authors":"Goergen, J., de Bellis, E., \u0026 Klesse, A.-K.","year":"2025","title":"AI assessment changes human behavior","journal":"Proceedings of the National Academy of Sciences","cite":"122(25), e2425439122","doi":"https://doi.org/10.1073/pnas.2425439122","summary":"Empirical study demonstrating that when people know they are being assessed by AI, they systematically alter their self-presentation. Applicants presented themselves as more analytical when assessed by AI compared to human assessors, reflecting lay beliefs that AI particularly values analytical characteristics. The study provides experimental evidence for this impression management response to AI assessors, with important implications for measurement validity in AI-based hiring.","relevance":"Directly relevant to AI-based employee selection and assessment validity: shows that AI assessment tools may elicit different behavioral responses than human raters, complicating construct validity and fairness claims. Essential reading for I-O psychologists involved in selection system design.","contribution":"First experimental evidence that AI assessment systematically changes applicant behavior via perceived AI preferences; raises critical validity questions for AI-based hiring tools; challenges assumption that AI assessment is more objective than human assessment due to reduced human biases.","uses":"Core reading for seminars on AI in selection and assessment; grant writing on measurement validity in AI hiring; future research on AI perception and impression management; informing ethical design of AI assessment tools.","cluster":"AI \u0026 Assessment, Human-AI Collaboration, and Career Development","themes":["AI \u0026 Future of Work","Assessment \u0026 Selection"]},{"date":"2026-06-22","topic":"AI-Based Assessment \u0026 Selection","authors":"Arnestad, M. N., Bigman, Y. E., Solberg, E., \u0026 Gray, K. J.","year":"2025","title":"Knowing How Personnel Selection Algorithms Compare With Human Recruiters Influences Their Perceived Trustworthiness","journal":"International Journal of Selection and Assessment","cite":"33(4), e70028","doi":"https://doi.org/10.1111/ijsa.70028","summary":"Drawing on organizational justice and trust theories, this study examined how comparative performance information (how an AI algorithm compares to human recruiters regarding fairness toward historically discriminated groups) influences perceived algorithm trustworthiness. When algorithms were shown to outperform human recruiters on fairness, perceived trustworthiness increased. Findings suggest that transparency about relative performance serves as a fairness heuristic shaping algorithmic trust. Study was conducted in November 2025 and published in IJSA Volume 33, Issue 4.","relevance":"Relevant to research on algorithm aversion/appreciation and acceptance of AI in HR decisions; addresses practitioner concern that public distrust in AI may prevent beneficial AI adoption in personnel selection contexts. Useful for I-O courses on selection and technology acceptance.","contribution":"Introduces comparative performance framing as a novel determinant of algorithm trust in selection; integrates organizational justice theory with AI trust literature; advances understanding of conditions under which employees and applicants accept AI-based HRM tools.","uses":"Reading for selection courses covering AI acceptability; research agenda on algorithm trust and HRM; policy discussions on AI transparency requirements in hiring; future research on fairness perceptions of AI selection tools.","cluster":"AI \u0026 Assessment, Human-AI Collaboration, and Career Development","themes":["AI \u0026 Future of Work","Algorithmic Management \u0026 Surveillance","Assessment \u0026 Selection"]},{"date":"2026-06-22","topic":"Career Development / Decent Work","authors":"Yilmaz, H., \u0026 Civitci, A.","year":"2026","title":"The Effect of Career Adaptability and Work Volition on Future Decent Work: An Experimental Study","journal":"Career Development Quarterly","cite":"74(1), 73–83","doi":"https://doi.org/10.1002/cdq.70014","summary":"Randomized controlled trial (N=81) testing an eight-session psychoeducation program targeting career adaptability and work volition among economically disadvantaged Turkish undergraduates. Results showed the intervention significantly improved both career adaptability and work volition, and that these gains predicted greater future decent work expectations. The experimental design provides rare causal evidence for intervention effectiveness in vocational development.","relevance":"Relevant to career counseling and vocational psychology; demonstrates that career adaptability and work volition can be developed through brief structured intervention, with downstream effects on access to decent work. Addresses equity in career development.","contribution":"Provides experimental (causal) evidence for the malleability of career adaptability and work volition; bridges psychology of working theory with intervention science; examines decent work as an outcome, extending the application of these constructs to marginalized populations.","uses":"Core reading for career development and counseling intervention courses; grant writing for equity-focused career programs; future research on scalable career adaptability interventions; vocational psychology seminars.","cluster":"AI \u0026 Assessment, Human-AI Collaboration, and Career Development","themes":["Careers \u0026 Vocational Behavior"]},{"date":"2026-06-22","topic":"Career Development / Decent Work","authors":"Allan, B. A.","year":"2026","title":"Work Volition and Decent Work: A Meta-Analysis","journal":"Career Development Quarterly","cite":"74(2), 86–99","doi":"https://doi.org/10.1002/cdq.70023","summary":"Meta-analysis synthesizing 43 effect sizes from 42 publications (N=18,659) to quantify the relationship between work volition and decent work. Found a strong positive summary effect (r=0.48, p\u003c.001), indicating that sense of choice in one's work is robustly related to accessing decent work conditions. Results held across diverse samples and operationalizations of decent work.","relevance":"Provides strong quantitative synthesis demonstrating work volition as a key antecedent of decent work; essential for vocational and counseling psychology courses and for researchers building on psychology of working theory.","contribution":"First meta-analytic estimate of the work volition-decent work relationship; validates work volition as a central construct in decent work science; identifies this relationship as large and robust across study contexts, establishing a foundation for future research and practice.","uses":"Foundational lit review reference for decent work research; graduate seminar reading on vocational psychology; grant writing anchor for career intervention studies; teaching psychology of working theory.","cluster":"AI \u0026 Assessment, Human-AI Collaboration, and Career Development","themes":["Careers \u0026 Vocational Behavior"]},{"date":"2026-06-21","topic":"Workforce Aging \u0026 Multigenerational Workplace","authors":"Chang, C.-H.; Xu, H.; Xie, B.","year":"2023","title":"Aging Workforce in the Context of Technological Advancements: Toward a Socio-Ecological Model","journal":"Work, Aging and Retirement","cite":"9(4), 323–328","doi":"https://doi.org/10.1093/workar/waad025","summary":"This guest editorial for a special issue proposes the SEASAW-Tech model—a socio-ecological approach to successful aging at work in the context of technological change. The authors synthesize six empirical articles addressing automation, digitization, and ICT use among older workers. The framework identifies individual, work-unit, organizational, industry, macro, and chronosystem levels that jointly shape aging workers' adaptation to technological change. It calls for future research to consider the nested, reciprocal nature of these contexts.","relevance":"Directly relevant to the multigenerational workplace topic by providing a theoretical framework for understanding how older workers adapt to technology-driven changes across multiple contextual levels.","contribution":"Proposes the SEASAW-Tech model, extending prior successful aging frameworks by integrating a socio-ecological, multi-level perspective specific to technological change in the workplace.","uses":"Framework for seminar discussion on aging and technology; anchor reading for multigenerational/technology topic; useful for structuring empirical research proposals on older worker adaptation.","cluster":"Ethics, Equity \u0026 Inclusion — AI, Ageism \u0026 Workforce Inequality","themes":["Aging \u0026 Generations"]},{"date":"2026-06-21","topic":"Workforce Aging \u0026 AI Automation","authors":"Lee, Z.","year":"2024","title":"The Skill-Specific Automatability of Aging Workers and Its Impact on Retirement Decisions","journal":"Work, Aging and Retirement","cite":"10(3), 267–284","doi":"https://doi.org/10.1093/workar/waad008","summary":"Using U.S. occupational data linked to worker-level survey data, this study examines how skill-specific automatability predicts retirement decisions among older workers. Results show that workers in more automatable jobs—especially those with mid-level skills—face elevated pressure to retire early, and the effect is moderated by skill level. Higher-skilled older workers, whose jobs are less automatable, are more likely to prolong their working lives. The study also documents psychological effects including perceived skill obsolescence and lower job satisfaction among highly automatable workers.","relevance":"Provides empirical evidence linking AI/automation exposure to retirement timing decisions among older workers, directly relevant to the workforce aging and future of work topics.","contribution":"Distinguishes skill-specific from general automatability and links it to retirement outcomes and psychological mechanisms, offering both methodological nuance and practical implications for workforce planning.","uses":"Empirical anchor for sessions on aging workers and automation; useful in lit reviews on retirement timing; relevant to policy discussions on extending working lives in the AI era.","cluster":"Ethics, Equity \u0026 Inclusion — AI, Ageism \u0026 Workforce Inequality","themes":["AI \u0026 Future of Work","Aging \u0026 Generations"]},{"date":"2026-06-21","topic":"Workforce Aging \u0026 Multigenerational Workplace","authors":"Patient, D.; Marques, T.; Ramos, S.; Bobocel, R.","year":"2024","title":"Harnessing the Potential of Older Workers Through Relationships at Work: Social Support, Feedback, and Performance","journal":"Work, Aging and Retirement","cite":"10(3), 241–256","doi":"https://doi.org/10.1093/workar/waad016","summary":"Using a three-week longitudinal diary design with over 450 participants across age groups, this study examines how social support and feedback exchanged between older and younger workers influence performance outcomes. Older workers were found to benefit more from workplace feedback than younger workers, and reciprocal support relationships with colleagues were associated with higher performance. The findings challenge stereotypes of older workers as recipients only and highlight their role as active contributors in workplace social networks.","relevance":"Directly relevant to multigenerational workplace dynamics by documenting age-differentiated benefits of social relationships and feedback at work, with implications for HRM practices and team composition.","contribution":"Documents age moderation in how feedback and social support translate to performance, contributing to the aging and work literature by identifying relational mechanisms that unlock older worker potential.","uses":"Discussion anchor for multigenerational workplace seminar; useful in designing age-inclusive HRM practices; informs peer mentoring and feedback program design.","cluster":"Ethics, Equity \u0026 Inclusion — AI, Ageism \u0026 Workforce Inequality","themes":["Aging \u0026 Generations","Job Design, Crafting \u0026 Motivation"]},{"date":"2026-06-21","topic":"Ethics, Equity \u0026 Inclusion — AI Ageism","authors":"Stypinska, J.","year":"2023","title":"AI ageism: a critical roadmap for studying age discrimination and exclusion in digitalized societies","journal":"AI \u0026 SOCIETY","cite":"38(2), 665–677","doi":"https://doi.org/10.1007/s00146-022-01553-5","summary":"This theoretical paper introduces the concept of 'AI ageism'—practices and ideologies within AI systems that exclude, discriminate against, or neglect older people. The author identifies five interconnected forms: (1) age biases in algorithms and datasets, (2) age stereotypes embedded in AI actors, (3) invisibility of old age in AI discourse, (4) discriminatory effects of AI on older age groups, and (5) exclusion of older people as AI users and consumers. Empirical illustrations across hiring, facial recognition, and digital services are provided. The framework serves as a research roadmap for studying ageism in algorithmic and digital contexts.","relevance":"Directly relevant to the ethics, equity, and inclusion topic by providing a systematic framework for studying how AI systems can perpetuate age-based discrimination, complementing existing work on racial and gender bias.","contribution":"Coins and defines the concept of 'AI ageism,' providing a novel multi-level theoretical framework that fills a significant gap in fairness/AI literature which has focused almost exclusively on gender and race.","uses":"Theoretical grounding for discussions of AI equity and inclusion; debate/critique reading on what counts as fairness in AI systems; pairs well with articles on AI bias in selection and algorithmic management.","cluster":"Ethics, Equity \u0026 Inclusion — AI, Ageism \u0026 Workforce Inequality","themes":["AI \u0026 Future of Work","Aging \u0026 Generations","Diversity, Equity \u0026 Inclusion"]},{"date":"2026-06-21","topic":"Workforce Aging \u0026 Technology Vulnerability","authors":"Alcover, C.-M.; Guglielmi, D.; Depolo, M.; Mazzetti, G.","year":"2021","title":"\"Aging-and-Tech Job Vulnerability\": A proposed framework on the dual impact of aging and AI, robotics, and automation among older workers","journal":"Organizational Psychology Review","cite":"11(2), 175–201","doi":"https://doi.org/10.1177/2041386621992105","summary":"This theoretical article proposes the Aging-and-Tech Job Vulnerability (ATJV) framework, which identifies the dual threat facing older workers: heightened exposure to job displacement due to automation and AI, combined with age-related vulnerabilities in adapting to new technological demands. The authors draw on career development, aging, and automation literatures to map antecedents, processes, and outcomes of vulnerability. The framework predicts differential effects based on skill level, industry, and individual resources such as adaptability and self-efficacy. Practical implications for HRM, occupational health, and policy are discussed.","relevance":"Central to the multigenerational workplace and ethics/equity topics by framing how older workers face a distinctive, compounded form of risk from technological change—relevant to discussions of fair AI deployment and workforce policy.","contribution":"Proposes the original ATJV framework integrating aging psychology with automation research, providing a theoretical foundation for empirical work on older worker vulnerability in the digital economy.","uses":"Foundational theory reading for seminar sessions on aging and technology; basis for research proposals examining older worker resilience; informs policy discussions on just transitions in automation-affected industries.","cluster":"Ethics, Equity \u0026 Inclusion — AI, Ageism \u0026 Workforce Inequality","themes":["AI \u0026 Future of Work","Aging \u0026 Generations"]},{"date":"2026-06-21","topic":"Ethics, Equity \u0026 AI Workplace Inequality","authors":"Karunakaran, A.; Lebovitz, S.; Narayanan, D.; Rahman, H.","year":"2025","title":"Artificial Intelligence at Work: An Integrative Perspective on the Impact of AI on Workplace Inequality","journal":"Academy of Management Annals","cite":"Advance online publication","doi":"https://doi.org/10.5465/annals.2023.0230","summary":"This Annual Review-style article synthesizes research on AI and workplace inequality by organizing literature around four theoretical perspectives: normative (what AI should do), cognitive (how AI shapes judgments and decisions), structural (how AI reconfigures task, power, and status structures), and relational (how AI alters workplace relationships and networks). The authors examine how each perspective speaks to different types of inequality—encoded, evaluative, wage, and relational—and call for integrative research that considers how these dynamics interact. The article identifies critical gaps and proposes a future research agenda.","relevance":"A landmark synthesis article for the ethics, equity, and future of work seminar topics; provides students with a comprehensive map of how AI produces, reproduces, or potentially reduces workplace inequality across multiple dimensions.","contribution":"Provides the most comprehensive integrative framework to date for understanding AI-driven workplace inequality, distinguishing between four types of inequality and four theoretical perspectives—advancing beyond prior work that addressed these in isolation.","uses":"Ideal as a required reading anchor for the ethics/equity/inclusion week; useful for structuring literature reviews and grant proposals on AI and inequality; informs debates about regulation and responsible AI deployment.","cluster":"Ethics, Equity \u0026 Inclusion — AI, Ageism \u0026 Workforce Inequality","themes":["AI \u0026 Future of Work","Diversity, Equity \u0026 Inclusion"]},{"date":"2026-06-19","topic":"Workplace Learning \u0026 Future of Work","authors":"Beier, M. E., Saxena, M., Kraiger, K., Costanza, D. P., Rudolph, C. W., Cadiz, D. M., Petery, G. A., \u0026 Fisher, G. G.","year":"2025","title":"Workplace learning and the future of work","journal":"Industrial and Organizational Psychology","cite":"18(1), 84–109","doi":"https://doi.org/10.1017/iop.2024.57","summary":"This focal article argues that global disruption, technological change, and demographic shifts require a fundamental rethinking of workplace learning. The authors call for a shift from organization-centered to person-centered learning frameworks emphasizing lifelong skill development. They review evidence on formal, informal, and self-regulated learning, and identify research gaps critical for I-O practice in the future of work.","relevance":"Directly relevant to FoW seminar themes on upskilling, workforce development, and person-centered career management in an era of technological disruption.","contribution":"Integrates multiple learning paradigms (formal, informal, self-regulated) and reframes them for a future-of-work context, providing a comprehensive theoretical and practical roadmap for I-O research on lifelong learning.","uses":"Required reading for a FoW seminar unit on lifelong learning; excellent framework article for grant writing on workforce development; pairs well with Kraiger \u0026 Ford (2021) for a training science unit.","cluster":"Upskilling, Lifelong Learning \u0026 Workforce Development","themes":["AI \u0026 Future of Work","Training \u0026 Development"]},{"date":"2026-06-19","topic":"Training Science \u0026 Workplace Instruction","authors":"Kraiger, K., \u0026 Ford, J. K.","year":"2021","title":"The science of workplace instruction: Learning and development applied to work","journal":"Annual Review of Organizational Psychology and Organizational Behavior","cite":"8, 45–72","doi":"https://doi.org/10.1146/annurev-orgpsych-012420-060109","summary":"This comprehensive review integrates cognitive and learning science with the organizational training literature to propose 15 empirically supported instructional principles for effective workplace learning. The authors bridge the gap between learning science (how people learn) and instructional design (how to teach), synthesizing decades of training research. Implications for technology-enhanced training, adaptive instruction, and training evaluation are addressed.","relevance":"Provides the scientific foundation for evidence-based training design that graduate students in I-O need to understand before evaluating new AI-driven or technology-based training interventions.","contribution":"Offers an integrative theoretical model linking instructional events → learner events → learning outcomes → transfer, providing a replicable framework for designing and evaluating workforce development programs.","uses":"Foundational reading for any training and development unit; essential for literature reviews on training effectiveness; applicable to curriculum design for workforce upskilling initiatives.","cluster":"Upskilling, Lifelong Learning \u0026 Workforce Development","themes":["Training \u0026 Development"]},{"date":"2026-06-19","topic":"Training Transfer","authors":"Blume, B. D., Ford, J. K., Baldwin, T. T., \u0026 Huang, J. L.","year":"2010","title":"Transfer of training: A meta-analytic review","journal":"Journal of Management","cite":"36(4), 1065–1105","doi":"https://doi.org/10.1177/0149206309352880","summary":"This meta-analysis of 89 empirical studies examines predictors of training transfer—the degree to which training translates into improved job performance. Results confirm positive relationships between transfer and trainee characteristics (cognitive ability, conscientiousness, motivation), work environment factors (supervisor support, climate for transfer), and training design features. The study underscores that transfer is determined by multiple interacting factors rather than training design alone.","relevance":"A foundational article for workforce development: understanding why training often fails to transfer to on-the-job behavior is essential for designing effective upskilling programs in organizational contexts.","contribution":"Provides the most comprehensive quantitative synthesis of training transfer predictors available, establishing the field's empirical benchmarks and identifying critical leverage points for intervention (e.g., pre-training environment, learner motivation).","uses":"Required background reading for training and development courses; essential for meta-analytic literature reviews; useful for practitioners designing upskilling programs who need to address transfer conditions.","cluster":"Upskilling, Lifelong Learning \u0026 Workforce Development","themes":["Training \u0026 Development"]},{"date":"2026-06-19","topic":"AI \u0026 Skill Development at Work","authors":"Bankins, S., Ocampo, A. C., Marrone, M., Restubog, S. L. D., \u0026 Woo, S. E.","year":"2024","title":"A multilevel review of artificial intelligence in organizations: Implications for organizational behavior research and practice","journal":"Journal of Organizational Behavior","cite":"45(2), 159–182","doi":"https://doi.org/10.1002/job.2735","summary":"This systematic review synthesizes empirical research on AI in organizations across individual, group, and organizational levels. The authors identify five themes including human-AI collaboration, skill demands, and worker adaptation, and propose a multilevel framework to guide future OB research on AI at work. Implications for training, skill development, and human-AI teaming are discussed throughout.","relevance":"Directly relevant to FoW themes on AI and workforce development; provides a multilevel framework for understanding how AI adoption reshapes skill requirements, learning demands, and development needs across the organizational hierarchy.","contribution":"Advances theoretical understanding by systematically mapping the AI-work interface across levels of analysis, filling a gap in the fragmented literature and identifying understudied pathways linking AI adoption to human skill and development outcomes.","uses":"Strong review article for seminars on AI and future of work; useful for framing grant proposals on AI-era upskilling; suitable for debating implications of AI for training needs analysis.","cluster":"Upskilling, Lifelong Learning \u0026 Workforce Development","themes":["AI \u0026 Future of Work","Training \u0026 Development"]},{"date":"2026-06-19","topic":"Upskilling, Careers \u0026 Digital Competence","authors":"Peiró, J. M.","year":"2025","title":"Applied psychology and careers in the 21st century: Challenges and opportunities","journal":"Australian Journal of Career Development","cite":"34(2), 114–123","doi":"https://doi.org/10.1177/10384162251350691","summary":"This commentary presents two research programs addressing sustainable careers in the 21st century: one examines reciprocal influences between well-being and performance at work, and the other investigates digital and digitalized competences and the effects of reskilling and upskilling on career sustainability. The author draws on applied psychology to articulate both the challenges and opportunities presented by technological transformation for career development.","relevance":"Bridges applied psychology, career science, and workforce development, making it ideal for graduate seminars that seek to integrate career theory with practical upskilling and reskilling challenges in digitalized workplaces.","contribution":"Highlights the dual role of digital competence as both a target for upskilling and a moderator of well-being and performance outcomes, offering a novel perspective that connects workforce development with sustainable careers.","uses":"Useful for seminars on careers and lifelong learning; good discussion starter for the intersection of career sustainability and digital skills; relevant to grant writing on workforce preparation for digital transformation.","cluster":"Upskilling, Lifelong Learning \u0026 Workforce Development","themes":["Careers \u0026 Vocational Behavior","Training \u0026 Development"]},{"date":"2026-06-19","topic":"Learning \u0026 Transfer in Organizations","authors":"Kauffeld, S., et al.","year":"2025","title":"Learning and transfer in organisations: How it works and can be supported","journal":"European Journal of Work and Organizational Psychology","cite":"34(2), 161–174","doi":"https://doi.org/10.1080/1359432X.2025.2463799","summary":"This introductory article to a special issue describes three forms of organizational learning—formal, informal, and self-regulated—and analyzes their interplay, social embeddedness, and integration within individual learning paths. The authors examine how learning processes foster innovation, discuss barriers to transfer, and introduce the nine empirical contributions in the special issue. Practical implications for supporting learning-to-performance linkages are highlighted.","relevance":"Provides a current European work and organizational psychology perspective on learning and transfer, enriching the seminar with cross-cultural and interdisciplinary viewpoints on how organizations can scaffold effective workforce development.","contribution":"Synthesizes current understanding of the formal/informal/self-regulated learning triad within a transfer-supporting framework, offering a concise entry point to a rich empirical special issue on organizational learning.","uses":"Excellent gateway article to a 2025 special issue for course reading lists; pairs well with Kraiger \u0026 Ford (2021) and Blume et al. (2010) for a comprehensive training and development unit; useful for literature reviews on informal learning.","cluster":"Upskilling, Lifelong Learning \u0026 Workforce Development","themes":["Training \u0026 Development"]},{"date":"2026-06-18","topic":"AI \u0026 Algorithmic Management","authors":"Kadolkar, I.; Kepes, S.; Subramony, M.","year":"2025","title":"Algorithmic management in the gig economy: A systematic review and research integration","journal":"Journal of Organizational Behavior","cite":"46(7), 1057–1080","doi":"https://doi.org/10.1002/job.2831","summary":"This systematic review synthesizes research on algorithmic management (AM) in the gig economy, examining how platforms use algorithms to direct, monitor, evaluate, and reward gig workers. The authors integrate findings across 80+ studies to map outcomes for workers (autonomy, well-being, turnover) and platforms (efficiency, quality). The review reveals significant tensions between algorithmic efficiency and worker agency, and proposes a research integration framework for future work.","relevance":"Central to I-O psychology's emerging interest in platform work and algorithmic control; directly addresses key constructs like job autonomy, performance monitoring, and worker well-being in novel work arrangements.","contribution":"Provides a comprehensive theoretical integration of AM's mechanisms and outcomes in the gig context, offering a research agenda that bridges industrial-organizational psychology, management, and platform labor studies.","uses":"Seminar: required reading for algorithmic management week; Literature review: platform and gig work; Grant writing: future of work and worker well-being; Teaching: work design and autonomy.","cluster":"AI in Assessment, Selection, Algorithmic Management \u0026 Worker Well-Being","themes":["AI \u0026 Future of Work","Algorithmic Management \u0026 Surveillance","Employment Relationships \u0026 Gig Work"]},{"date":"2026-06-18","topic":"AI-Based Assessment \u0026 Selection","authors":"Campion, M. A., et al.","year":"2025","title":"Personnel Psychology's 40 Questions Series: Artificial Intelligence","journal":"Personnel Psychology","cite":"Online first","doi":"https://doi.org/10.1111/peps.70031","summary":"This forum article presents 40 critical research questions on artificial intelligence in I-O psychology and HR, organized across topics including AI-based prediction, selection, performance management, fairness, and ethics. Multiple I-O scholars contribute perspectives on what questions most need answers as AI reshapes personnel practice. The piece functions as a research agenda for the field, identifying where theory and evidence are most urgently needed.","relevance":"Directly maps the AI research landscape for I-O psychology; ideal for orienting doctoral students to open questions in AI-based assessment, selection, and organizational decision-making.","contribution":"Establishes a structured, crowd-sourced research agenda from leading I-O scholars — a rare genre contribution that synthesizes the field's priorities regarding AI; highly useful for framing seminars or literature reviews.","uses":"Seminar: excellent discussion starter for AI in I-O psychology; Grant writing: identifying research gaps; Teaching: course overview of AI in personnel psychology; Future research: identifying dissertation topics.","cluster":"AI in Assessment, Selection, Algorithmic Management \u0026 Worker Well-Being","themes":["AI \u0026 Future of Work","Assessment \u0026 Selection"]},{"date":"2026-06-18","topic":"AI-Based Assessment \u0026 Selection","authors":"Robie, C.; Wingate, T.; Baytalskaya, N.; Butera, H.","year":"2026","title":"Candidate Generative AI Use in Pre-Hire Employment Assessments: Self-Reported Incidence and the Impact of Warnings","journal":"International Journal of Selection and Assessment","cite":"34(2), e70056","doi":"https://doi.org/10.1111/ijsa.70056","summary":"Two studies with large applicant samples (N = 5,675 and N = 8,248) examined self-reported use of generative AI (GenAI) during pre-hire assessments across cognitive and non-cognitive components. Study 1 found that fewer than 3% of applicants used GenAI alone, though up to 19% used it with other digital tools. Study 2 tested whether warning statements reduced GenAI use, finding that warnings significantly reduced self-reported incidence without altering applicant reactions or perceived effectiveness of GenAI.","relevance":"Directly addresses a pressing practical and psychometric concern in personnel selection — the threat that GenAI poses to assessment validity and integrity — with applied, large-sample data.","contribution":"First empirical paper to examine GenAI use in real employment assessments with large samples, and one of the first to experimentally test countermeasures (warnings), providing actionable evidence for practitioners and a foundation for future validity research.","uses":"Seminar: debate piece on AI cheating and assessment integrity; Teaching: validity threats in high-stakes testing; Practitioner: assessment design and anti-AI policies; Future research: detection, consequences, and countermeasures.","cluster":"AI in Assessment, Selection, Algorithmic Management \u0026 Worker Well-Being","themes":["AI \u0026 Future of Work","Assessment \u0026 Selection"]},{"date":"2026-06-18","topic":"Worker Well-Being \u0026 Technostress","authors":"Mansuroğlu, E.; Smith, A. P.","year":"2026","title":"Technostress and employee well-being: A systematic review of empirical evidence","journal":"Computers in Human Behavior Reports","cite":"100941","doi":"https://doi.org/10.1016/j.chbr.2026.100941","summary":"This systematic review synthesizes empirical studies from 2015 to 2025 on the relationship between technostress and employee well-being. The authors examine technostress creators (overload, invasion, complexity, insecurity, uncertainty) and their associations with psychological outcomes including anxiety, burnout, and depression. Results confirm robust negative effects of technostress on well-being and identify moderators and mediators including social support and coping resources.","relevance":"Provides a comprehensive empirical foundation for understanding technostress in the workplace, directly relevant to I-O and occupational health psychology seminars on technology and worker well-being.","contribution":"Delivers the most current synthesis (2015–2025) of the technostress-well-being relationship, organizing a fragmented literature around specific technostress creators and well-being outcomes; useful for both theory building and applied intervention design.","uses":"Seminar: required reading for technostress and digital work week; Literature review: background for AI/technology and well-being studies; Teaching: JD-R and technostress frameworks; Grant writing: occupational health and digital technology.","cluster":"AI in Assessment, Selection, Algorithmic Management \u0026 Worker Well-Being","themes":["Well-Being \u0026 Occupational Health","Technostress \u0026 Digital Demands"]},{"date":"2026-06-18","topic":"AI-Based Assessment \u0026 Selection","authors":"Dutta, D.; Naveen, P. M.","year":"2026","title":"Transforming Recruitment and Selection Practices in Organizations Through Discriminative and Generative AI Adoption: A Structuration Lens","journal":"Human Resource Management","cite":"65(1), 77–115","doi":"https://doi.org/10.1002/hrm.70018","summary":"Using structuration theory and an exploratory qualitative design with 43 HR and talent acquisition leaders, this study examines how discriminative and generative AI are transforming recruitment and selection in organizations operating in an emerging market context. Findings reveal that AI reshapes HRM practice through three structuration mechanisms: interpretive schemes (how HR professionals frame AI), norms (legitimacy and governance of AI use), and power/resources (access to AI tools). The authors identify tensions between efficiency gains and ethical concerns.","relevance":"Bridges organizational theory (structuration) with applied HRM practice in AI-based selection, offering a qualitative counterpoint to quantitative validity studies; relevant for discussions on AI adoption, fairness, and organizational change in selection.","contribution":"One of the first studies to apply structuration theory to AI-enabled HRM, providing a processual lens on how AI adoption reshapes human agency and organizational practices in recruitment; extends AI selection research beyond psychometric validity to organizational dynamics.","uses":"Seminar: theory discussion on AI and HRM transformation; Debate: AI efficiency vs. ethics in selection; Literature review: qualitative HRM and AI adoption; Teaching: structuration theory in organizational psychology.","cluster":"AI in Assessment, Selection, Algorithmic Management \u0026 Worker Well-Being","themes":["AI \u0026 Future of Work","Assessment \u0026 Selection"]},{"date":"2026-06-16","topic":"Algorithmic Management \u0026 Worker Outcomes","authors":"Zhou et al.","year":"2025","title":"The Dual Effects of Algorithmic Management on Platform Workers: An Attribution Perspective","journal":"Human Resource Management","cite":"64(6), 1687–1707","doi":"https://doi.org/10.1002/hrm.70009","summary":"This empirical study examines how four core dimensions of algorithmic management—recommending, restricting, evaluating, and rewarding—affect platform workers' work overload and customer-oriented service behavior via attribution processes. Surveying 213 Chinese platform workers, the authors find that commitment attributions link AM recommending and rewarding to positive outcomes, while control attributions link restricting and evaluating (at low transparency) to work overload. Algorithmic transparency moderates these dual pathways.","relevance":"Relevant to I-O psychology and HRM research on platform work, algorithmic management, and worker well-being; the attribution framework bridges social psychology and management to explain nuanced worker responses to algorithmic systems.","contribution":"Introduces attribution theory as a novel mechanism explaining dual (positive and negative) effects of AM dimensions; demonstrates algorithmic transparency as a boundary condition with practical implications for platform design and worker welfare.","uses":"Useful for seminars on algorithmic management and worker psychology; relevant for grants on platform labor and well-being; good teaching case on dual-effect models and boundary conditions.","cluster":"Algorithmic Management, Surveillance, Work Design \u0026 Vocational Interests","themes":["Algorithmic Management \u0026 Surveillance","Employment Relationships \u0026 Gig Work"]},{"date":"2026-06-16","topic":"Algorithmic Surveillance \u0026 Worker Compliance","authors":"Ward van Zoonen; von Bonsdorff, M. E.; van der Heijden, B. I. J. M.","year":"2025","title":"Algorithmic surveillance and workers' compliance: The role of trust, privacy concerns, and fairness in online crowdwork","journal":"Human Relations","cite":"Advance online publication","doi":"https://doi.org/10.1177/00187267251379698","summary":"This empirical study of online crowdworkers investigates how algorithmic surveillance shapes compliance, resistance, and adaptation. T
