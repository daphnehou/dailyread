s":"Burch, K. A.; Bryant, R.; Doppalapudi, D.; Hurt, C.","year":"2025","title":"From Work Screens to Home Scenes: Investigating the Association of Daily Email Incivility With Aggression and Withdrawal at Home Using a Daily Diary Approach","journal":"Stress and Health","cite":"41(5), e70107","doi":"https://doi.org/10.1002/smi.70107","summary":"A recent daily diary study integrating affective events theory with the perseverative cognition model of stress to examine how daily active email incivility spills over into the home domain. Daily work-related affective rumination transmits the effect of email incivility onto aggression and withdrawal behaviors at home, with trait cognitive reappraisal examined as a moderator. Extends cyber incivility research from within-work outcomes to family-domain behavioral consequences.","relevance":"One of the newest empirical contributions on technology-mediated mistreatment, connecting digital communication stressors to the work-nonwork interface and recovery literatures.","contribution":"Identifies affective rumination as the mechanism carrying email incivility across the work-home boundary, integrating perseverative cognition theory with the cyber incivility literature.","uses":"Timely empirical reading to pair with Park et al. (2018); useful for teaching mediation in diary designs and for research on after-hours connectivity norms.","cluster":"Workplace incivility, mistreatment \u0026 cyberincivility — victims, observers, customers \u0026 digital spillover (new cluster)","themes":["Turnover \u0026 Retention","Well-Being \u0026 Occupational Health","Technostress \u0026 Digital Demands"]},{"date":"2026-08-05","topic":"Customer Mistreatment","authors":"Tan, H.; Zhang, Y.; Zhao, X.; Mattila, A. S.; Yang, H.","year":"2026","title":"A Meta-Analytic Model of the Influence of Customer Mistreatment on Employees' Work Outcomes","journal":"Journal of Business Research","cite":"206 (Vol. 206, 2026)","doi":"https://pure.psu.edu/en/publications/a-meta-analytic-model-of-the-influence-of-customer-mistreatment-o/ (DOI needs verification)","summary":"A 2026 meta-analysis synthesizing the customer mistreatment literature (reported as 232 independent samples from 202 primary studies; N = 76,957) to model how mistreatment from customers — the most frequently occurring form of workplace aggression for service workers — affects employees' work outcomes. Tests three mechanisms (cognition, affect, and resource depletion) through which customer mistreatment undermines performance and other outcomes.","relevance":"Rounds out the mistreatment picture with the customer-facing source, central to frontline service work and emotional labor research in occupational health psychology. Publisher DOI could not be confirmed at search time; entry verified via Penn State Pure and RePEc records (marked needs verification).","contribution":"Provides an integrative mechanism-based meta-analytic model (cognitive, affective, resource pathways) for customer mistreatment effects, updating and extending earlier service-sector meta-analyses.","uses":"Useful for lit reviews and grant framing on frontline/service worker well-being; pairs with emotional labor readings from the 2026-08-04 run.","cluster":"Workplace incivility, mistreatment \u0026 cyberincivility — victims, observers, customers \u0026 digital spillover (new cluster)","themes":["Well-Being \u0026 Occupational Health"]},{"date":"2026-08-04","topic":"Worker Well-Being \u0026 Occupational Health","authors":"Grandey, A. A.","year":"2000","title":"Emotion Regulation in the Workplace: A New Way to Conceptualize Emotional Labor","journal":"Journal of Occupational Health Psychology","cite":"5(1), 95–110","doi":"https://doi.org/10.1037/1076-8998.5.1.95","summary":"Foundational theoretical article that reframed Hochschild's sociological concept of emotional labor through the psychological lens of emotion regulation. Integrates surface acting (response-focused regulation) and deep acting (antecedent-focused regulation) into Gross's emotion regulation framework. Proposes a model linking situational cues, regulation strategies, and long-term outcomes such as burnout and job satisfaction. This conceptualization became the dominant paradigm for three decades of emotional labor research.","relevance":"The founding I-O/OHP treatment of emotional labor; nearly all subsequent workplace emotion regulation research builds on this model.","contribution":"Established emotional labor as emotion regulation, giving the field a testable psychological mechanism and the surface/deep acting distinction that anchors the literature.","uses":"Essential foundational reading for teaching; theoretical anchor for any lit review, grant, or study on emotional demands at work.","cluster":"Emotional labor \u0026 emotion regulation at work — foundations, meta-analytic evidence, dynamics, and AI/automation of emotional labor (new cluster)","themes":["Well-Being \u0026 Occupational Health"]},{"date":"2026-08-04","topic":"Worker Well-Being \u0026 Occupational Health","authors":"Hülsheger, U. R.; Schewe, A. F.","year":"2011","title":"On the Costs and Benefits of Emotional Labor: A Meta-Analysis of Three Decades of Research","journal":"Journal of Occupational Health Psychology","cite":"16(3), 361–389","doi":"https://doi.org/10.1037/a0022876","summary":"Meta-analysis of 95 independent studies (494 correlations) quantifying relationships between emotional labor strategies and well-being and performance outcomes. Surface acting and emotional dissonance showed robust negative relationships with well-being (burnout, job satisfaction) and modest negative links with performance. Deep acting was largely unrelated to well-being but positively related to emotional performance and customer satisfaction. Confirms the asymmetric costs of faking versus reappraising emotions at work.","relevance":"The definitive quantitative summary of emotional labor's consequences for occupational health and service performance.","contribution":"Meta-analytic evidence establishing surface acting as a harmful strategy and deep acting as comparatively benign — a cornerstone effect-size reference for the field.","uses":"Meta-analytic evidence base for lit reviews and grants; excellent for teaching effect-size interpretation and the costs of emotional dissonance.","cluster":"Emotional labor \u0026 emotion regulation at work — foundations, meta-analytic evidence, dynamics, and AI/automation of emotional labor (new cluster)","themes":["Well-Being \u0026 Occupational Health"]},{"date":"2026-08-04","topic":"Worker Well-Being \u0026 Occupational Health","authors":"Grandey, A. A.; Gabriel, A. S.","year":"2015","title":"Emotional Labor at a Crossroads: Where Do We Go from Here?","journal":"Annual Review of Organizational Psychology and Organizational Behavior","cite":"2, 323–349","doi":"https://doi.org/10.1146/annurev-orgpsych-032414-111400","summary":"Authoritative review taking stock of three decades of emotional labor research, organized around five discussion points: conceptualization, emotional requirements, intrapsychic processes, outcomes, and moderators. Identifies roadblocks including fuzzy construct definitions, assumed but untested processes, and methodological stagnation. Charts a future agenda emphasizing dynamic within-person designs, physiological measures, and contextual moderators such as culture, occupation, and financial incentives.","relevance":"The field's agenda-setting review; frames current debates on how emotional labor should be defined, measured, and studied.","contribution":"Clarifies construct boundaries and lays out the research agenda that shaped the subsequent decade of within-person and multilevel emotional labor work.","uses":"Ideal orienting review for syllabi and comprehensive exams; roadmap for identifying open questions for dissertations and grants.","cluster":"Emotional labor \u0026 emotion regulation at work — foundations, meta-analytic evidence, dynamics, and AI/automation of emotional labor (new cluster)","themes":["Well-Being \u0026 Occupational Health"]},{"date":"2026-08-04","topic":"Worker Well-Being \u0026 Occupational Health","authors":"Diefendorff, J. M.; Gabriel, A. S.; Nolan, M. T.; Yang, J.","year":"2019","title":"Emotion Regulation in the Context of Customer Mistreatment and Felt Affect: An Event-Based Profile Approach","journal":"Journal of Applied Psychology","cite":"104(7), 965–983","doi":"https://doi.org/10.1037/apl0000389","summary":"Empirical study using an event-based, person-centered (latent profile) approach to examine how call center employees combine multiple emotion regulation strategies within specific customer mistreatment episodes. Identifies distinct regulation profiles (e.g., high regulators, deep actors, low regulators) that shift depending on mistreatment severity and felt affect. Profiles differentially predicted felt inauthenticity and emotional exhaustion. Demonstrates that employees use strategies in combination rather than in isolation.","relevance":"Methodologically exemplary JAP study connecting customer mistreatment — a growing concern in frontline work — to dynamic, episode-level emotion regulation.","contribution":"Advances the field beyond variable-centered, between-person designs by showing that regulation strategies co-occur in event-level profiles with distinct well-being costs.","uses":"Model article for teaching person-centered and event-sampling methods; template for future episodic studies of emotional labor.","cluster":"Emotional labor \u0026 emotion regulation at work — foundations, meta-analytic evidence, dynamics, and AI/automation of emotional labor (new cluster)","themes":["Well-Being \u0026 Occupational Health"]},{"date":"2026-08-04","topic":"Worker Well-Being \u0026 Occupational Health","authors":"Gabriel, A. S.; Diefendorff, J. M.; Grandey, A. A.","year":"2023","title":"The Acceleration of Emotional Labor Research: Navigating the Past and Steering Toward the Future","journal":"Personnel Psychology","cite":"76(2), 511–545","doi":"https://doi.org/10.1111/peps.12576","summary":"Comprehensive review of the rapidly accelerating emotional labor literature by three of its leading scholars. Synthesizes research across levels of analysis — occupational requirements, between-person differences, and within-person dynamics — and across theoretical perspectives. Identifies tensions in how emotional labor is conceptualized (occupational demand vs. regulation strategy vs. dynamic process) and proposes an integrative agenda, including attention to changing service contexts and technology.","relevance":"The most current authoritative review in a top I-O journal; positions emotional labor research relative to future-of-work changes in service contexts.","contribution":"Integrates fragmented streams (demands, strategies, dynamics) into a multilevel organizing framework and sets the contemporary research agenda.","uses":"Up-to-date review for syllabi and comps; framing citation for grants on emotional demands in changing service work.","cluster":"Emotional labor \u0026 emotion regulation at work — foundations, meta-analytic evidence, dynamics, and AI/automation of emotional labor (new cluster)","themes":["Well-Being \u0026 Occupational Health"]},{"date":"2026-08-04","topic":"AI \u0026 Future of Work","authors":"Lee, F. C.; Diefendorff, J. M.; Thornton-Lugo, M. A.; Ong, X. W.","year":"2025","title":"From Effortful to Effortless: Conceptualizing Emotional Labor Automaticity","journal":"Organizational Psychology Review","cite":"15(4), 397–419","doi":"https://doi.org/10.1177/20413866251370353","summary":"Recent theory article (published online August 2025) challenging the assumption that emotional labor is always effortful and controlled. Conceptualizes emotional labor automaticity — the process by which surface and deep acting become automatized through repetition and skill acquisition — and theorizes how automatic regulation alters the resource-depletion pathway linking emotional labor to strain. Develops propositions about antecedents of automatization and its consequences for authenticity, performance, and well-being.","relevance":"Cutting-edge theoretical development directly relevant to expertise, skill acquisition, and the changing nature of service work.","contribution":"Introduces automaticity as a new theoretical lens that may explain inconsistent depletion findings in emotional labor research.","uses":"Theory-building exemplar for seminars; generates testable propositions for future within-person and experience-sampling research.","cluster":"Emotional labor \u0026 emotion regulation at work — foundations, meta-analytic evidence, dynamics, and AI/automation of emotional labor (new cluster)","themes":["AI \u0026 Future of Work","Well-Being \u0026 Occupational Health"]},{"date":"2026-08-04","topic":"AI \u0026 Future of Work","authors":"Fang, Z.; Chang, Y.; Luo, X.; Wu, Q.; Aspara, J.","year":"2026","title":"Artificial Intelligence, Emotional Labor, and Service Operations","journal":"Manufacturing \u0026 Service Operations Management","cite":"Articles in Advance","doi":"https://doi.org/10.1287/msom.2024.1459","summary":"Field study examining whether AI service bots can take over emotional labor in service operations (loan collection calls), where emotional demands strain human employees and limit scalability. Finds that undisclosed AI agents display required emotions — both positive and negative — more accurately than human employees, with consequences for economic performance. Examines how and when AI engagement in emotional labor enhances service outcomes.","relevance":"Bridges emotional labor theory with AI substitution in frontline service work — a core future-of-work question about which emotional demands can and should be automated.","contribution":"First large-scale field evidence that AI can perform display-rule-consistent emotional labor, raising theoretical questions about authenticity, disclosure, and the boundaries of human emotional work.","uses":"Debate/discussion piece for seminars on AI and service work; empirical springboard for I-O research on human-AI division of emotional labor. Note: operations management journal (adjacent field); volume/issue pending final pagination.","cluster":"Emotional labor \u0026 emotion regulation at work — foundations, meta-analytic evidence, dynamics, and AI/automation of emotional labor (new cluster)","themes":["AI \u0026 Future of Work","Well-Being \u0026 Occupational Health"]},{"date":"2026-08-03","topic":"Organizational Change — Employee Responses","authors":"Oreg, S.; Sverdlik, N.","year":"2026","title":"Responses to Organizational Change: Evolution of the Concept, Established Findings, and Future Directions","journal":"Annual Review of Organizational Psychology and Organizational Behavior","cite":"13, 387–413","doi":"https://doi.org/10.1146/annurev-orgpsych-020924-064623","summary":"Comprehensive review tracing how the study of employee responses to organizational change has evolved, from early resistance-focused work to multidimensional conceptualizations spanning affective, cognitive, and behavioral responses. Synthesizes established findings on antecedents (change content, process, context, and recipient characteristics) and consequences of change responses. Charts future directions including dynamic/temporal designs and responses to continuous and technology-driven change. Published as Review in Advance August 2025.","relevance":"The authoritative current review of change-recipient research, a core I-O/OB literature underpinning how workers respond to AI- and technology-driven transformation.","contribution":"Consolidates a fragmented 60+ year literature into an integrative framework and sets a research agenda emphasizing temporal dynamics of change responses.","uses":"Anchor reading for teaching organizational change; framing citation for lit reviews and grants on workforce adaptation to AI-driven change.","cluster":"Organizational change: employee responses, readiness \u0026 adaptation to technological/digital change (new cluster)","themes":["Job Design, Crafting \u0026 Motivation"]},{"date":"2026-08-03","topic":"Organizational Change — Theory Integration","authors":"Kanitz, R.; Gonzalez, K.; Fugate, M.; Venkatesh, V.","year":"2026","title":"Making Sense of Employee Responses to Organizational Change: Integrating the Theoretical Landscape Across Research Communities","journal":"Journal of Organizational Behavior","cite":"Advance online publication","doi":"https://doi.org/10.1002/job.70080","summary":"Systematic review of 215 empirical articles (1998–2024) on employee responses to change published across management, applied psychology, and information systems research communities. Maps the theoretical landscape, showing how different communities (e.g., OB change research vs. technology acceptance research) study overlapping phenomena with little cross-fertilization. Offers an integrative organizing framework connecting these traditions. Volume/pages pending (early view).","relevance":"Directly bridges organizational change and technology adoption literatures — exactly the integration needed to study employee responses to digital/AI transformation.","contribution":"First systematic integration of change-response theory across research communities, including technology acceptance models (e.g., UTAUT) alongside OB change theories.","uses":"Theory-mapping resource for dissertations and lit reviews; helps students see connections between change management and technology acceptance research.","cluster":"Organizational change: employee responses, readiness \u0026 adaptation to technological/digital change (new cluster)","themes":["Job Design, Crafting \u0026 Motivation"]},{"date":"2026-08-03","topic":"Organizational Change — Dynamics of Change Support","authors":"Kanitz, R.; De Schutter, L.; Backmann, J.; Kiefer, T.; Fugate, M.; Hoegl, M.","year":"2026","title":"Shift Happens During Change: Appraisal Shifts and Employee Proactive Support for Organizational Change","journal":"Journal of Management","cite":"Advance online publication","doi":"https://doi.org/10.1177/01492063261449752","summary":"Builds on appraisal theory to examine how within-person shifts (increases vs. decreases) and stability in employees' appraisals of the work-related benefits of a change relate to proactive change support over time. Uses longitudinal data collected during ongoing organizational changes. Finds that appraisal trajectories, not just static levels, drive whether employees actively work to improve change design and implementation. Volume/pages pending (online first).","relevance":"Models the temporal dynamics of change reactions — a key methodological and theoretical frontier for studying continuous technological change at work.","contribution":"Shifts the field from static snapshots of change attitudes to within-person appraisal trajectories predicting proactive (not just compliant) change support.","uses":"Exemplar for teaching longitudinal/within-person designs; useful for research on employee support during AI implementation.","cluster":"Organizational change: employee responses, readiness \u0026 adaptation to technological/digital change (new cluster)","themes":["Job Design, Crafting \u0026 Motivation"]},{"date":"2026-08-03","topic":"Organizational Change — Behavior Change Mechanisms","authors":"Kamarova, S.; Gagné, M.; Holtrop, D.; Dunlop, P. D.","year":"2025","title":"Integrating Behavior and Organizational Change Literatures to Uncover Crucial Psychological Mechanisms Underlying the Adoption and Maintenance of Organizational Change","journal":"Journal of Organizational Behavior","cite":"46(2), 263–287","doi":"https://doi.org/10.1002/job.2832","summary":"Conceptual integration of health/behavior-change theories (e.g., self-determination theory, habit formation) with organizational change management. Argues that individual behavior change is the core of organizational change yet behavior-change science is rarely applied to it. Identifies psychological mechanisms (motivation, capability, habit) underlying both initial adoption and longer-term maintenance of changed work behaviors.","relevance":"Brings motivation science (SDT) into change management — highly relevant to sustaining new work behaviors during digital transformation and reskilling.","contribution":"Novel cross-literature integration distinguishing adoption from maintenance of change, an underdeveloped distinction in OB change research.","uses":"Strong seminar reading pairing motivation theory with change; framework for interventions in workforce development and technology adoption research.","cluster":"Organizational change: employee responses, readiness \u0026 adaptation to technological/digital change (new cluster)","themes":["Job Design, Crafting \u0026 Motivation"]},{"date":"2026-08-03","topic":"Digital Transformation — Automation vs. Augmentation","authors":"Ren, S.; Chowdhury, S.","year":"2025","title":"Employee Digital Transformation Experience Towards Automation Versus Augmentation: Implications for Job Attitudes","journal":"Human Resource Management","cite":"64(5), 1359–1379","doi":"https://doi.org/10.1002/hrm.22313","summary":"Empirical study examining how employees' experience of digital transformation as automation-oriented versus augmentation-oriented shapes job attitudes. Automation-driven transformation elicits psychological reactance, which in turn lowers job satisfaction and perceived employment security and raises turnover intention. Employee voice mechanisms moderate this mediated relationship, buffering negative reactions.","relevance":"Directly tests the automation-vs-augmentation distinction central to future-of-work debates, with employee voice as an actionable HR lever.","contribution":"Connects psychological reactance theory to digital transformation and shows voice as a boundary condition — practical and theoretical contribution to HRM.","uses":"Empirical exemplar for teaching AI/automation effects on attitudes; supports research and practice on participatory technology implementation.","cluster":"Organizational change: employee responses, readiness \u0026 adaptation to technological/digital change (new cluster)","themes":["AI \u0026 Future of Work"]},{"date":"2026-08-03","topic":"Change Management — Intervention Evidence","authors":"Hagl, C.; Kanitz, R.; Gonzalez, K.; Hoegl, M.","year":"2024","title":"Change Management Interventions: Taking Stock and Moving Forward","journal":"Human Resource Management Review","cite":"34(1), 101000","doi":"https://doi.org/10.1016/j.hrmr.2023.101000","summary":"Systematic review of intervention studies in change management, taking stock of what experimental and quasi-experimental evidence exists for the effectiveness of change management practices (e.g., communication, participation, training). Identifies which interventions have causal support, where evidence is thin, and proposes a roadmap for intervention research in organizational change.","relevance":"Moves change management toward evidence-based practice — relevant for I-O psychologists designing and evaluating change interventions during technological transitions.","contribution":"One of the few reviews focused specifically on causal intervention evidence in change management rather than correlational attitude research.","uses":"Methods/evidence-based-practice reading; foundation for designing intervention studies and for practitioner-oriented teaching on managing change.","cluster":"Organizational change: employee responses, readiness \u0026 adaptation to technological/digital change (new cluster)","themes":["Job Design, Crafting \u0026 Motivation"]},{"date":"2026-08-03","topic":"Organizational Change — Meta-Review \u0026 Taxonomy","authors":"Brazzale, P.; Cooper-Thomas, H. D.; Smollan, R. K.; Haar, J.","year":"2026","title":"Employee Change Orientation (EChO) Framework: A Meta-Review and Taxonomy","journal":"Journal of Management \u0026 Organization","cite":"32, 111–138","doi":"https://doi.org/10.1017/jmo.2025.10051","summary":"Meta-review of 50 scholarly reviews (2001–June 2025) drawing on 1,606 primary studies of employee responses to organizational change. Introduces the employee change orientation (EChO) meta-construct aggregating attitudes, behaviors, and psychological mechanisms related to change, and provides a taxonomy organizing the sprawling construct space (readiness, resistance, commitment to change, etc.).","relevance":"Useful construct-clarification resource for a literature plagued by proliferation — helps researchers and students navigate overlapping change-response constructs.","contribution":"Meta-review methodology and a unifying taxonomy that addresses construct proliferation in change research.","uses":"Reference/taxonomy reading for comps and lit reviews; good discussion piece on construct proliferation in I-O/OB.","cluster":"Organizational change: employee responses, readiness \u0026 adaptation to technological/digital change (new cluster)","themes":["Job Design, Crafting \u0026 Motivation"]},{"date":"2026-08-02","topic":"Voice \u0026 Psychological Safety — Foundational","authors":"Edmondson, A.","year":"1999","title":"Psychological Safety and Learning Behavior in Work Teams","journal":"Administrative Science Quarterly","cite":"44(2), 350–383","doi":"https://doi.org/10.2307/2666999","summary":"Field study of 51 manufacturing work teams introducing the construct of team psychological safety — a shared belief that the team is safe for interpersonal risk taking. Using survey and observational data, Edmondson showed psychological safety facilitates team learning behavior (seeking feedback, discussing errors), which in turn predicts team performance. The paper established the measurement scale and nomological network still used today.","relevance":"The foundational citation for psychological safety, a construct central to voice, error reporting, and learning — all increasingly salient as teams adopt new technologies and hybrid work.","contribution":"Defined and validated the team psychological safety construct and positioned it as the key enabler of learning behavior in teams; one of the most cited papers in organizational behavior.","uses":"Anchor reading for any seminar week on voice/safety; foundational citation for lit reviews and grant framing on speaking up in tech-mediated work.","cluster":"Employee voice, silence \u0026 psychological safety in the changing workplace (new cluster)","themes":["Well-Being \u0026 Occupational Health","Training \u0026 Development","Teams \u0026 Collaboration","Job Design, Crafting \u0026 Motivation"]},{"date":"2026-08-02","topic":"Psychological Safety — Meta-Analysis","authors":"Frazier, M. L.; Fainshmidt, S.; Klinger, R. L.; Pezeshkan, A.; Vracheva, V.","year":"2017","title":"Psychological Safety: A Meta-Analytic Review and Extension","journal":"Personnel Psychology","cite":"70(1), 113–165","doi":"https://doi.org/10.1111/peps.12183","summary":"Meta-analysis of 136 samples (individual and group levels) testing antecedents and outcomes of psychological safety. Positive leader relations, work design characteristics, and supportive context predicted psychological safety, which in turn related to information sharing, voice, engagement, satisfaction, and task performance. Also tested moderators and incremental validity beyond related constructs.","relevance":"The definitive quantitative summary of the psychological safety literature; essential grounding for research on when employees speak up amid organizational and technological change.","contribution":"Provides meta-analytic effect-size estimates and a nomological network for psychological safety at two levels of analysis, clarifying its distinctiveness from trust and related constructs.","uses":"Evidence base for lit reviews, meta-analytic comparisons, and teaching the antecedents/outcomes structure of psychological safety.","cluster":"Employee voice, silence \u0026 psychological safety in the changing workplace (new cluster)","themes":["Well-Being \u0026 Occupational Health","Teams \u0026 Collaboration"]},{"date":"2026-08-02","topic":"Employee Voice — Meta-Analysis","authors":"Chamberlin, M.; Newton, D. W.; LePine, J. A.","year":"2017","title":"A Meta-Analysis of Voice and Its Promotive and Prohibitive Forms: Identification of Key Associations, Distinctions, and Future Research Directions","journal":"Personnel Psychology","cite":"70(1), 11–71","doi":"https://doi.org/10.1111/peps.12185","summary":"Meta-analysis distinguishing promotive voice (suggestions for improvement) from prohibitive voice (warnings about problems) across dozens of studies. Both forms shared antecedents (e.g., psychological safety, felt obligation) but showed distinct relationships with performance evaluations and other outcomes, supporting the two-dimensional conceptualization. The paper maps the voice nomological network and sets a research agenda.","relevance":"Core quantitative synthesis of the voice literature; the promotive/prohibitive distinction matters for how workers raise concerns about new technologies, algorithmic systems, and change.","contribution":"Established meta-analytic support for treating promotive and prohibitive voice as related but distinct constructs with different consequences for employees.","uses":"Required reading for a voice seminar week; framework for hypothesis development in studies of speaking up about AI or workplace change.","cluster":"Employee voice, silence \u0026 psychological safety in the changing workplace (new cluster)","themes":["Job Design, Crafting \u0026 Motivation"]},{"date":"2026-08-02","topic":"Voice \u0026 Silence — Review","authors":"Morrison, E. W.","year":"2023","title":"Employee Voice and Silence: Taking Stock a Decade Later","journal":"Annual Review of Organizational Psychology and Organizational Behavior","cite":"10, 79–107","doi":"https://doi.org/10.1146/annurev-orgpsych-120920-054654","summary":"Narrative review updating Morrison's influential 2014 review of voice and silence. Synthesizes a decade of research on antecedents (individual, relational, contextual), outcomes, and the conceptual relationship between voice and silence, and highlights emerging directions including voice in new work arrangements and digital contexts. Offers an integrative framework and agenda for the field.","relevance":"The authoritative current review of voice/silence; explicitly flags how changing work arrangements and technology reshape opportunities and risks of speaking up.","contribution":"Integrates and organizes ten years of voice/silence research, clarifying construct boundaries and identifying where the literature has and has not progressed.","uses":"Ideal orienting reading for students entering the voice literature; roadmap for identifying dissertation and grant topics.","cluster":"Employee voice, silence \u0026 psychological safety in the changing workplace (new cluster)","themes":["Job Design, Crafting \u0026 Motivation"]},{"date":"2026-08-02","topic":"Voice vs. Silence — Empirical","authors":"Sherf, E. N.; Parke, M. R.; Isaakyan, S.","year":"2021","title":"Distinguishing Voice and Silence at Work: Unique Relationships with Perceived Impact, Psychological Safety, and Burnout","journal":"Academy of Management Journal","cite":"64(1), 114–148","doi":"https://doi.org/10.5465/amj.2018.1428","summary":"Multi-study package (including experience sampling and field surveys) testing whether voice and silence are opposites or distinct constructs. Found they are only moderately negatively related and have unique antecedents: perceived impact primarily drives voice, whereas psychological safety primarily (negatively) predicts silence; silence, not voice, predicts burnout. Results argue for studying silence in its own right.","relevance":"Directly relevant to occupational health: shows silence, not lack of voice, carries the well-being cost (burnout), linking the voice literature to worker well-being research.","contribution":"Theoretically and empirically separates voice from silence, showing each has a distinct motivational engine and distinct consequences — a significant construct-validity contribution.","uses":"Excellent seminar paper for debating construct distinctiveness; methods exemplar combining ESM with field surveys.","cluster":"Employee voice, silence \u0026 psychological safety in the changing workplace (new cluster)","themes":["Well-Being \u0026 Occupational Health","Teams \u0026 Collaboration","Job Design, Crafting \u0026 Motivation"]},{"date":"2026-08-02","topic":"Voice \u0026 Silence Dynamics — Recent Empirical","authors":"Parker, S. L.; Li, Y.; Moore, D.; Zyphur, M.; Barsky, A.","year":"2025","title":"A 10-Week Longitudinal Study of Voice and Silence: Revealing the Energy and Social Dynamics of Speaking Up and Staying Silent","journal":"Journal of Occupational and Organizational Psychology","cite":"98(4), e70059","doi":"https://doi.org/10.1111/joop.70059","summary":"Ten-week weekly experience sampling study (193 employees; 1,479 observations) drawing on Conservation of Resources theory to model within-person dynamics of voice and silence. Voice climate (a social resource) increased voice and reduced silence across weeks, with a positive reciprocal voice–climate spiral; emotional exhaustion related positively to staying silent. Demonstrates that voice and silence follow different temporal dynamics.","relevance":"Recent (2025) evidence connecting voice/silence to energy depletion and recovery processes — bridging voice research with occupational health psychology.","contribution":"First long-run repeated-measures test of reciprocal voice–climate dynamics; shows resources, not just motives, govern week-to-week speaking up.","uses":"Methods exemplar for intensive longitudinal designs (DSEM/cross-lagged); useful for teaching within-person dynamics and for well-being grant proposals.","cluster":"Employee voice, silence \u0026 psychological safety in the changing workplace (new cluster)","themes":["Job Design, Crafting \u0026 Motivation"]},{"date":"2026-08-02","topic":"Digital Voice \u0026 Remote Work — Recent Conceptual","authors":"Kalfa, S.; Kwon, B.; Prouska, R.; Wilkinson, A.","year":"2026","title":"Disconnected Workers: Can Digital Voice Fill the Gap?","journal":"Human Resource Management Journal","cite":"Early View (2026)","doi":"https://doi.org/10.1111/1748-8583.70006","summary":"Conceptual paper arguing that voice research has assumed co-located, synchronous work and theorizing how psychological, temporal, structural, and technological distance in remote/hybrid arrangements create new voice barriers. Examines whether digital voice platforms — via affordances like visibility, connectivity, persistence, and anonymity — can bridge these gaps, concluding digital voice helps but is not a full substitute for traditional voice channels.","relevance":"Squarely at the intersection of future-of-work and voice research: theorizes how remote/hybrid work and digital platforms transform whether and how employees speak up.","contribution":"Develops a distance-based framework for voice barriers in remote work and an affordance-based analysis of digital voice channels, opening a new research agenda.","uses":"Seminar reading for weeks on remote/hybrid work or technology and work design; source of testable propositions for future research.","cluster":"Employee voice, silence \u0026 psychological safety in the changing workplace (new cluster)","themes":["Remote \u0026 Hybrid Work","Job Design, Crafting \u0026 Motivation"]},{"date":"2026-07-31","topic":"Sustainability \u0026 I-O Psychology (Review/Agenda)","authors":"Kühner, C.; Hüffmeier, J.; Zacher, H.","year":"2025","title":"Environmental sustainability at work: It's time to unleash the full potential of industrial and organizational psychology","journal":"Industrial and Organizational Psychology","cite":"18(4), 466–506","doi":"https://www.cambridge.org/core/journals/industrial-and-organizational-psychology/article/environmental-sustainability-at-work-its-time-to-unleash-the-full-potential-of-industrial-and-organizational-psychology/B7A1EB9480DB44EC6D4D5D720507CB48","summary":"Focal article arguing that I-O psychology has engaged only a fraction of its potential to address the climate crisis. Reviews prior research on environmental sustainability at work and proposes an integrative conceptual framework spanning micro (employee), meso (team/organization), macro (societal), and magno (planetary) levels. Outlines a research and practice agenda for the field, including how core I-O domains (selection, motivation, leadership, work design) can support organizational decarbonization.","relevance":"Positions environmental sustainability as a core I-O topic rather than a niche interest; directly relevant to future-of-work debates about how work must change under climate pressure.","contribution":"Provides the field's most current integrative multilevel framework for sustainability at work and a forward research agenda, with peer commentaries in the same issue.","uses":"Anchor reading for a seminar week on climate and work; framing piece for grants or reviews on green work; source of dissertation-ready research questions.","cluster":"Climate change, environmental sustainability \u0026 employee green behavior (new cluster)","themes":["Job Design, Crafting \u0026 Motivation"]},{"date":"2026-07-31","topic":"Employee Green Behavior (Annual Review)","authors":"Zacher, H.; Rudolph, C. W.; Katz, I. M.","year":"2023","title":"Employee green behavior as the core of environmentally sustainable organizations","journal":"Annual Review of Organizational Psychology and Organizational Behavior","cite":"10, 465–494","doi":"https://doi.org/10.1146/annurev-orgpsych-120920-050421","summary":"Annual Review synthesis positioning employee green behavior (EGB) as the behavioral foundation of environmentally sustainable organizations. Defines and differentiates required vs. voluntary EGB, reviews measurement approaches, and summarizes evidence on individual, leader, team, and organizational antecedents and outcomes. Identifies theoretical and methodological limitations of the literature and sets an agenda emphasizing within-person dynamics and objective behavioral criteria.","relevance":"The authoritative state-of-the-science review of the construct most central to psychology's contribution to organizational sustainability.","contribution":"Consolidates a fragmented literature into a coherent construct definition and nomological network; widely cited entry point for new researchers.","uses":"Ideal required reading to orient students; scaffolding for lit reviews and measure selection in EGB studies.","cluster":"Climate change, environmental sustainability \u0026 employee green behavior (new cluster)","themes":["Job Design, Crafting \u0026 Motivation"]},{"date":"2026-07-31","topic":"Employee Green Behavior (Meta-Analysis)","authors":"Katz, I. M.; Rauvola, R. S.; Rudolph, C. W.; Zacher, H.","year":"2022","title":"Employee green behavior: A meta-analysis","journal":"Corporate Social Responsibility and Environmental Management","cite":"29(5), 1146–1157","doi":"https://doi.org/10.1002/csr.2260","summary":"Meta-analysis of 135 independent samples (N = 47,442) quantifying relationships between EGB and its correlates. Finds positive associations between EGB and pro-environmental attitudes, corporate social responsibility perceptions, green psychological climate, and green HRM practices, among others. Also examines moderators including required vs. voluntary EGB and measurement characteristics.","relevance":"Supplies the quantitative evidence base for claims about what predicts green behavior at work, complementing the narrative reviews in this cluster.","contribution":"First comprehensive meta-analytic integration of the EGB literature; benchmarks effect sizes for future primary studies and power analyses.","uses":"Methods/evidence reading paired with the Annual Review; useful for grant power analyses and hypothesis benchmarking.","cluster":"Climate change, environmental sustainability \u0026 employee green behavior (new cluster)","themes":["Job Design, Crafting \u0026 Motivation"]},{"date":"2026-07-31","topic":"Employee Green Behavior (Foundational Framework)","authors":"Norton, T. A.; Parker, S. L.; Zacher, H.; Ashkanasy, N. M.","year":"2015","title":"Employee green behavior: A theoretical framework, multilevel review, and future research agenda","journal":"Organization \u0026 Environment","cite":"28(1), 103–125","doi":"https://doi.org/10.1177/1086026615575773","summary":"Foundational multilevel review that proposed the now-standard distinction between required (in-role) and voluntary (extra-role) employee green behavior. Builds a conceptual model from person-environment interaction, job performance, and motivation theories, and reviews institutional-, organizational-, leader-, team-, and employee-level antecedents, outcomes, mediators, and moderators. Sets the research agenda that much of the subsequent decade of EGB research followed.","relevance":"The field-defining theoretical paper for green behavior at work; essential historical grounding for the newer reviews and meta-analyses.","contribution":"Established EGB as a form of job performance and introduced the required/voluntary taxonomy that organizes the literature.","uses":"Foundational/theory reading for teaching; citation anchor for any EGB manuscript or proposal.","cluster":"Climate change, environmental sustainability \u0026 employee green behavior (new cluster)","themes":["Job Design, Crafting \u0026 Motivation"]},{"date":"2026-07-31","topic":"Green Behavior \u0026 Well-Being (Longitudinal)","authors":"Stein, M.; Kühner, C.; Zacher, H.","year":"2025","title":"Exploring reciprocal within-person relations between proactive employee green behavior and subjective well-being: A four-wave longitudinal study","journal":"Applied Psychology: Health and Well-Being","cite":"17(6), e70084","doi":"https://doi.org/10.1111/aphw.70084","summary":"Four-wave longitudinal study of 1,354 German employees with 3-month lags examining whether proactive EGB and work-related subjective well-being (job satisfaction, positive and negative affect) influence each other over time. Uses within-person modeling to separate stable between-person differences from dynamic within-person change. Findings speak to whether acting green at work is a source of, or drain on, employee well-being.","relevance":"Connects the sustainability cluster to occupational health psychology by testing whether green behavior and well-being form gain cycles.","contribution":"One of the first rigorous within-person tests of EGB–well-being directionality, moving past cross-sectional correlations.","uses":"Strong methods exemplar for longitudinal panel designs; bridges well-being and sustainability literatures for future research.","cluster":"Climate change, environmental sustainability \u0026 employee green behavior (new cluster)","themes":["Well-Being \u0026 Occupational Health","Job Design, Crafting \u0026 Motivation"]},{"date":"2026-07-31","topic":"Affect \u0026 Green Behavior (Within-Person Dynamics)","authors":"Stein, M.; Kühner, C.; Zacher, H.","year":"2025","title":"Positive and Negative Affect and Employee Green Behavior: A Five-Wave Study of Reciprocal Within-Person Relations","journal":"Organization \u0026 Environment","cite":"Advance online publication","doi":"https://doi.org/10.1177/10860266251376758","summary":"Five-wave panel study examining reciprocal within-person relations between positive and negative affect and employee green behavior. Tests whether affective states energize subsequent green behavior and whether engaging in green behavior feeds back into employees' affect over time. Extends the affect-performance literature to the environmental sustainability domain.","relevance":"Complements the well-being study above with an affect-focused test of the same dynamic questions, published in the field's flagship sustainability journal.","contribution":"Adds affective mechanisms to EGB theory using intensive longitudinal data; clarifies temporal ordering that cross-sectional work cannot.","uses":"Pair with the four-wave study for a methods discussion on panel designs; useful for lit reviews on affect and proactive behavior.","cluster":"Climate change, environmental sustainability \u0026 employee green behavior (new cluster)","themes":["Job Design, Crafting \u0026 Motivation"]},{"date":"2026-07-31","topic":"Green Careers \u0026 Vocational Psychology","authors":"Hopner, V.; Carr, S. C.; Matuschek, I.","year":"2025","title":"Green Collar Work: Implications for Career Development","journal":"Australian Journal of Career Development","cite":"Advance online publication","doi":"https://doi.org/10.1177/10384162251351150","summary":"Conceptual analysis of 'green collar work' and what greening economies mean for career development. Reviews projections that net-zero transitions will generate large net job gains (e.g., ~18 million globally by 2030) and considers how career practitioners and researchers should respond to emerging green pathways, skill demands, and just-transition concerns. Links macro labor-market change to individual career choice and guidance.","relevance":"Brings the careers/vocational lens to the sustainability cluster — how climate transition reshapes occupational structures and career decision making.","contribution":"Frames green jobs as a career development issue rather than only a labor-economics one; agenda-setting for vocational psychology.","uses":"Teaching reading for careers courses; springboard for research on green career interests, adaptability, and decent work in transition sectors.","cluster":"Climate change, environmental sustainability \u0026 employee green behavior (new cluster)","themes":["Careers \u0026 Vocational Behavior"]},{"date":"2026-07-30","topic":"Retirement — Foundational Review","authors":"Wang, M.; Shultz, K. S.","year":"2010","title":"Employee Retirement: A Review and Recommendations for Future Investigation","journal":"Journal of Management","cite":"36(1), 172–206","doi":"https://doi.org/10.1177/0149206309347957","summary":"Landmark integrative review organizing the retirement literature into three phases: retirement planning, retirement decision making, and retirement transition/adjustment. Synthesizes conceptualizations of retirement as decision making, adjustment process, and career development stage. Proposes a temporal process model that has structured most subsequent I-O research on retirement, and identifies methodological limitations of cross-sectional retirement studies.","relevance":"The anchor citation for retirement research in I-O psychology and management; nearly all subsequent bridge employment and retirement adjustment work builds on this framework.","contribution":"Established the multi-phase temporal process model of retirement that reframed retirement from a discrete event to a longitudinal adjustment process.","uses":"Required background reading for any retirement/aging seminar week; ideal framework paper for lit reviews and grant proposals on late-career transitions.","cluster":"Retirement transitions, bridge employment \u0026 unretirement (new cluster)","themes":["Aging \u0026 Generations"]},{"date":"2026-07-30","topic":"Retirement Adjustment — Foundational Empirical","authors":"Wang, M.","year":"2007","title":"Profiling Retirees in the Retirement Transition and Adjustment Process: Examining the Longitudinal Change Patterns of Retirees' Psychological Well-Being","journal":"Journal of Applied Psychology","cite":"92(2), 455–474","doi":"https://doi.org/10.1037/0021-9010.92.2.455","summary":"Used growth mixture modeling on two national longitudinal HRS samples to identify three distinct trajectories of retirees' psychological well-being: maintaining, recovering, and U-shaped patterns. Showed that retirement does not uniformly harm or help well-being; outcomes depend on individual attributes, pre-retirement job conditions, family context, and transition characteristics such as bridge employment and retirement planning. Bridge employment and voluntary retirement predicted more favorable trajectories.","relevance":"Classic empirical demonstration of heterogeneity in retirement adjustment; directly relevant to occupational health and lifespan career research.","contribution":"Methodologically influential application of growth mixture modeling to career transitions; established the resource-based, person-centered view of retirement adjustment.","uses":"Excellent teaching example of person-centered longitudinal methods; foundational citation for research on well-being trajectories across work transitions.","cluster":"Retirement transitions, bridge employment \u0026 unretirement (new cluster)","themes":["Well-Being \u0026 Occupational Health","Aging \u0026 Generations"]},{"date":"2026-07-30","topic":"Bridge Employment — Review \u0026 Research Agenda","authors":"Beehr, T. A.; Bennett, M. M.","year":"2015","title":"Working After Retirement: Features of Bridge Employment and Research Directions","journal":"Work, Aging and Retirement","cite":"1(1), 112–128","doi":"https://doi.org/10.1093/workar/wau007","summary":"Inaugural-issue review mapping the construct space of bridge employment: its forms (career vs. non-career field, self-employment, part-time), antecedents (health, finances, work attitudes, family), and consequences for well-being and organizations. Distinguishes bridge employment from unretirement and phased retirement, and lays out a research agenda on measurement inconsistencies and theoretical grounding. Argues bridge employment is becoming the modal retirement pathway rather than the exception.","relevance":"The standard review of bridge employment in the flagship aging-and-work journal; defines constructs used throughout this literature.","contribution":"Clarified construct definitions and typology of post-retirement work forms, addressing measurement inconsistency that had hampered cumulative research.","uses":"Ideal seminar overview reading to open a bridge-employment discussion; useful for framing dissertations and lit reviews on late-career work.","cluster":"Retirement transitions, bridge employment \u0026 unretirement (new cluster)","themes":["Aging \u0026 Generations"]},{"date":"2026-07-30","topic":"Retirement Adjustment — Meta-Analysis","authors":"La Rue, C. J.; Haslam, C.; Steffens, N. K.","year":"2022","title":"A Meta-Analysis of Retirement Adjustment Predictors","journal":"Journal of Vocational Behavior","cite":"136, 103723","doi":"https://doi.org/10.1016/j.jvb.2022.103723","summary":"Meta-analysis (k = 121 studies) quantifying predictors of adjustment to retirement. Physical health, finances, psychological health, and social factors (partnership status, social engagement and support) emerged as the strongest correlates of successful adjustment, while demographic variables were weaker predictors. Findings support resource-based dynamic perspectives: adjustment depends on the resources retirees carry into and build during the transition.","relevance":"Provides the quantitative evidence base for retirement adjustment theory; directly relevant to occupational health psychology and vocational behavior.","contribution":"First comprehensive meta-analytic integration of the retirement adjustment literature, testing the resource-based dynamic model against accumulated evidence.","uses":"Strong methods/evidence reading to pair with Wang (2007); useful for grant writing and evidence-based pre-retirement intervention design.","cluster":"Retirement transitions, bridge employment \u0026 unretirement (new cluster)","themes":["Aging \u0026 Generations"]},{"date":"2026-07-30","topic":"Unretirement — Cross-National Empirical (Recent)","authors":"Platts, L. G.; Glaser, K.","year":"2025","title":"Returns to Work Following Retirement in Germany, Russia, and the United Kingdom","journal":"Work, Aging and Retirement","cite":"11(2), 197–211","doi":"https://doi.org/10.1093/workar/waae005","summary":"Cross-national longitudinal study of unretirement — returning to paid work after retiring — using panel data from Germany, Russia, and the UK. Documents cross-country variation in unretirement rates and shows that financial worries predicted unretirement only weakly and inconsistently; unretirement was more common among younger, healthier, better-educated retirees. Suggests unretirement functions more as continued labor-force attachment among advantaged retirees than as a financial-distress response.","relevance":"Recent evidence that challenges the popular 'forced back to work' narrative; adds needed institutional/country context to a largely U.S.-based literature.","contribution":"One of the first directly comparable cross-national analyses of unretirement predictors, showing institutional context shapes late-career pathways.","uses":"Good seminar debate reading on push vs. pull explanations of post-retirement work; model for comparative panel-data designs.","cluster":"Retirement transitions, bridge employment \u0026 unretirement (new cluster)","themes":["Aging \u0026 Generations"]},{"date":"2026-07-30","topic":"Retirement \u0026 Gender — Systematic Review (Recent)","authors":"Harris, A.; Fasbender, U.","year":"2025","title":"Gender Differences in Retirement Decisions and Outcomes: A Systematic Literature Review and Recommendations for Future Research","journal":"Work, Aging and Retirement","cite":"Advance online publication","doi":"https://doi.org/10.1093/workar/waaf011","summary":"Systematic review of three decades (1995–2025) of research on how gender shapes retirement decisions and outcomes, covering labor market exit, unretirement, and extended working lives. Shows gender operates through interactions with marital status, pension access, caregiving demands, work history, and gender norms rather than as a simple main effect, with women often facing constrained retirement choices and less favorable financial outcomes. Sets out a research agenda for gender-sensitive retirement theory.","relevance":"Brings an equity lens to retirement research; highly relevant to I-O work on gendered career trajectories and to policy debates on pension gaps.","contribution":"First comprehensive synthesis of gender in retirement decision making and outcomes; reframes gender as intersectional and contextual rather than a control variable.","uses":"Strong DEI-angle seminar reading for an aging/retirement week; agenda-setting source for future research and grant proposals.","cluster":"Retirement transitions, bridge employment \u0026 unretirement (new cluster)","themes":["Aging \u0026 Generations","Diversity, Equity \u0026 Inclusion"]},{"date":"2026-07-30","topic":"Post-Retirement Work Engagement — Scoping Review (Recent)","authors":"Premji, R.; Long, B.-Z. S.; Balakrishnar, K.; Sathananthan, A.; Choi, C.; Haritos, A. M.; Yuen, B.; Mazur, M.; Nowrouzi-Kia, B.","year":"2025","title":"Approaches to Enhancing and Sustaining Engagement in Post-Retirement Work: A Scoping Review","journal":"Journal of Aging and Health","cite":"Online first (Sept 26, 2025)","doi":"https://doi.org/10.1177/08982643251378213","summary":"Scoping review of 52 peer-reviewed studies (2000–2025) on what sustains engagement in post-retirement work among adults aged 50–80. Identifies four theme clusters: social factors (purpose, connection), health-related factors, workplace factors (flexibility, age-inclusive design), and financial factors. Concludes that organizations wanting to retain or re-engage retirees must redesign work around flexibility and meaning, not just compensation.","relevance":"Practical, current synthesis connecting occupational health and organizational practice; complements the more decision-focused unretirement literature.","contribution":"Maps the intervention-relevant levers for sustaining older workers' engagement after retirement, bridging occupational health and HRM perspectives.","uses":"Useful applied reading for translating retirement research to practice; source of intervention ideas for workplace-design and healthy-aging grants.","cluster":"Retirement transitions, bridge employment \u0026 unretirement (new cluster)","themes":["Aging \u0026 Generations","Job Design, Crafting \u0026 Motivation"]},{"date":"2026-07-29","topic":"Performance Feedback — Systematic Review (Recent)","authors":"Heine, E. C. E.; Stouten, J.; Liden, R. C.","year":"2026","title":"Performance Feedback: A Critical Systematic Review","journal":"Journal of Organizational Behavior","cite":"47(2), 312-361","doi":"https://doi.org/10.1002/job.70033","summary":"First comprehensive synthesis of workplace performance feedback research in nearly 30 years, critically reviewing 173 studies across organizational psychology, leadership, and management. Clarifies longstanding inconsistencies in when feedback improves versus harms performance. Finds positive feedback consistently enhances performance, while negative feedback is effective only under specific moderating conditions such as a high-quality supervisor-subordinate relationship. Offers an integrative framework and research agenda.","relevance":"Directly updates the feedback literature at the core of I-O psychology's performance management research; essential context for studying feedback in AI-mediated workplaces.","contribution":"Provides the first major integrative synthesis since Kluger and DeNisi (1996), organizing moderators and mechanisms of feedback effectiveness into a contemporary framework.","uses":"Anchor reading for a performance management seminar week; lit-review backbone for any feedback study; source of moderator hypotheses for future research.","cluster":"Performance management, appraisal, and feedback in the digital/AI era (first run on this cluster)","themes":["Job Design, Crafting \u0026 Motivation"]},{"date":"2026-07-29","topic":"Performance Management — Critique (Recent)","authors":"Murphy, K. R.","year":"2026","title":"The Illusion of Performance Management","journal":"Human Resource Management","cite":"65(1), 63-75","doi":"https://doi.org/10.1002/hrm.70016","summary":"Conceptual critique arguing that despite near-universal adoption, there is little evidence performance management actually improves performance. Murphy critiques both the methods (goal alignment, frequent informal feedback) and the underlying goals of performance management, contending its top-down logic robs workers of autonomy and responsibility. Recommends organizations draw instead on supportive-leadership research and shift from managing to facilitating performance.","relevance":"A provocative, current statement in the long-running I-O debate over whether performance management works; highly relevant as organizations redesign PM systems around continuous feedback and AI tools.","contribution":"Extends Murphy's earlier critique into a broader indictment of PM's goals, not just its psychometrics, and proposes supportive leadership as the alternative paradigm.","uses":"Excellent debate/discussion reading for graduate seminars; framing piece for research questioning PM effectiveness; useful counterpoint in practitioner-facing writing.","cluster":"Performance management, appraisal, and feedback in the digital/AI era (first run on this cluster)","themes":["Job Design, Crafting \u0026 Motivation"]},{"date":"2026-07-29","topic":"AI in Performance Appraisal — Mixed-Method Empirical (Recent)","authors":"Pan, Y.; et al. (full author list needs verification)","year":"2026","title":"The Role of AI in Performance Appraisal: A Mixed-Method Study of Employee Experience Through a Relational Lens","journal":"Human Resource Management","cite":"Early View (online Dec 2025)","doi":"https://doi.org/10.1002/hrm.70049","summary":"Uses sociomateriality and attribution theory to examine how AI raters' characteristics and the distribution of decision-making power between AI and humans shape employee satisfaction with performance appraisals. Combines three scenario-based experiments (N = 1,002) with a field survey (N = 321). Shows both the material features of AI and its social embedding in appraisal procedures influence employee reactions.","relevance":"One of the first rigorous mixed-method studies of employee experience with AI-based appraisal in a top HRM journal; central to research on AI-augmented HR decision making.","contribution":"Introduces the sociomateriality paradigm to AI-based HRM research, distinguishing material versus social aspects of AI in shaping appraisal satisfaction.","uses":"Empirical exemplar for studies of AI in HR systems; seminar reading on AI-based assessment; design guidance for organizations allocating human vs. AI roles in appraisal.","cluster":"Performance management, appraisal, and feedback in the digital/AI era (first run on this cluster)","themes":["AI \u0026 Future of Work","Job Design, Crafting \u0026 Motivation"]},{"date":"2026-07-29","topic":"Performance Appraisal — Foundational Review","authors":"DeNisi, A. S.; Murphy, K. R.","year":"2017","title":"Performance appraisal and performance management: 100 years of progress?","journal":"Journal of Applied Psychology","cite":"102(3), 421-433","doi":"https://doi.org/10.1037/apl0000085","summary":"Centennial review of 100 years of performance appraisal and performance management research in JAP, covering eight areas: scale formats, criteria for evaluating ratings, rater training, reactions to appraisal, purpose of rating, rating sources, demographic differences, and cognitive processes. Concludes that despite methodological progress, the link between appraisal research and improved organizational performance remains weak. Sets the agenda for shifting from measurement accuracy to performance improvement.","relevance":"The canonical starting point for any I-O treatment of performance appraisal; frames the historical arc against which AI-era PM innovations should be judged.","contribution":"Authoritative periodization of the appraisal literature and an influential call to refocus research on performance management rather than rating psychometrics.","uses":"Required foundational reading for PM seminar weeks; historical framing for dissertations and grant proposals on assessment and appraisal.","cluster":"Performance management, appraisal, and feedback in the digital/AI era (first run on this cluster)","themes":["Job Design, Crafting \u0026 Motivation"]},{"date":"2026-07-29","topic":"Performance Evaluation — Critique/Debate (Foundational)","authors":"Murphy, K. R.","year":"2020","title":"Performance evaluation will not die, but it should","journal":"Human Resource Management Journal","cite":"30(1), 13-31","doi":"https://doi.org/10.1111/1748-8583.12259","summary":"Widely cited critique arguing that formal performance evaluation systems almost always fail to achieve their goals and persist mainly for institutional reasons. Reviews evidence on rating validity, rater motivation, and feedback reactions, and argues incremental fixes to traditional systems are unlikely to succeed. Recommends restricting evaluation and feedback to the limited situations where they demonstrably help.","relevance":"A touchstone in the 'abolish ratings' debate that reshaped both scholarship and corporate practice (e.g., firms dropping annual reviews); pairs naturally with defenses of structured evaluation.","contribution":"Crystallizes the evidence-based case against traditional performance evaluation and specifies boundary conditions under which evaluation can still be useful.","uses":"Debate reading opposite DeNisi \u0026 Murphy (2017); framing for studies of PM reform, ratingless systems, and continuous feedback.","cluster":"Performance management, appraisal, and feedback in the digital/AI era (first run on this cluster)","themes":["Job Design, Crafting \u0026 Motivation"]},{"date":"2026-07-29","topic":"Feedback Interventions — Landmark Meta-Analysis (Foundational)","authors":"Kluger, A. N.; DeNisi, A.","year":"1996","title":"The effects of feedback interventions on performance: A historical review, a meta-analysis, and a preliminary feedback intervention theory","journal":"Psychological Bulletin","cite":"119(2), 254-284","doi":"https://doi.org/10.1037/0033-2909.119.2.254","summary":"Landmark meta-analysis of 607 effect sizes (23,663 observations) showing feedback interventions improve performance on average (d = .41) but that over one-third of interventions actually decrease performance. Proposes Feedback Intervention Theory (FIT): feedback that directs attention to the self rather than the task undermines performance. Explains why feedback effects cannot be accounted for by feedback sign or sampling error alone.","relevance":"The single most influential paper in the feedback literature and the theoretical foundation for virtually all subsequent I-O feedback research, including AI-generated feedback studies.","contribution":"Established FIT and the counterintuitive finding that feedback frequently backfires — a result with enduring implications for PM system design and coaching.","uses":"Required theoretical grounding for any feedback or PM research; classic teaching article on meta-analysis and theory building.","cluster":"Performance management, appraisal, and feedback in the digital/AI era (first run on this cluster)","themes":["Job Design, Crafting \u0026 Motivation"]},{"date":"2026-07-29","topic":"Feedback Orientation — Meta-Analysis","authors":"Katz, I. M.; Moughan, C. M.; Rudolph, C. W.","year":"2023","title":"Feedback orientation: A meta-analysis","journal":"Human Resource Management Review","cite":"33, Article 100986","doi":"https://doi.org/10.1016/j.hrmr.2023.100986","summary":"Meta-analysis of feedback orientation — individual receptivity to feedback — across k = 46 samples (N = 12,478 workers). Feedback orientation relates positively to learning goal orientation (rho = .39), job satisfaction (.33), work performance (.35), and feedback seeking (.43), and predicts job performance incrementally beyond other established predictors. Synthesizes the nomological network of a construct central to informal feedback processes.","relevance":"Quantifies who benefits from feedback-rich environments — increasingly relevant as continuous and AI-mediated feedback expands the volume of feedback employees receive.","contribution":"First comprehensive meta-analytic test of feedback orientation's nomological network, establishing it as an incrementally valid predictor of performance.","uses":"Methods/meta-analysis reading; individual-differences module in PM or feedback seminars; measurement guidance for selection and development research.","cluster":"Performance management, appraisal, and feedback in the digital/AI era (first run on this cluster)","themes":["Job Design, Crafting \u0026 Motivation"]},{"date":"2026-07-28","topic":"AI Coaching / Career Development","authors":"Ebner, K.; Hofer, A.; Soucek, R.; Spurk, D.","year":"2026","title":"Putting AI into career coaching: The effectiveness of a career coaching intervention conducted by a chatbot","journal":"Journal of Vocational Behavior","cite":"2026 (in press/online first)","doi":"https://www.sciencedirect.com/science/article/pii/S0001879126000588","summary":"Randomized study testing whether a single career-coaching conversation with an AI chatbot improves career-related outcomes. Participants who interacted with the chatbot showed significantly reduced negative affect about their career situation relative to controls. One of the first tests of generative-AI career coaching in a top vocational psychology journal.","relevance":"Directly bridges vocational psychology and AI-based interventions; publishes chatbot coaching evidence in a flagship careers journal.","contribution":"First rigorous JVB evidence that scalable chatbot career coaching can shift affective career outcomes.","uses":"Teaching (careers/tech seminars), lit reviews on AI interventions, grant proposals on scalable career support.","cluster":"Mentoring, coaching \u0026 AI coaching — developmental relationships at work (new cluster)","themes":["AI \u0026 Future of Work","Careers \u0026 Vocational Behavior","Training \u0026 Development"]},{"date":"2026-07-28","topic":"AI Coaching / Human-AI Comparison","authors":"de Haan, E.; Terblanche, N.; Nowack, K.","year":"2026","title":"A randomised controlled comparison of the effectiveness of human and AI chatbot coaching with goal attainment, wellbeing and self-efficacy","journal":"Human Resource Development International","cite":"2026 (online first)","doi":"https://doi.org/10.1080/13678868.2026.2633990","summary":"RCT with 114 coachees providing the first direct head-to-head comparison of accredited human coaches and automated AI chatbot coaches. Human coaching produced medium-to-high effects on goal attainment and self-efficacy; the AI chatbot did not differ significantly from control on most outcomes. Suggests current LLM-era chatbot coaches underperform trained humans.","relevance":"Tempers enthusiasm from earlier AI-coaching studies; central to debates on augmentation vs. substitution in developmental HR practices.","contribution":"First randomized human-vs-AI coaching comparison with validated psychometrics; a key boundary condition for AI coaching claims.","uses":"Debate/critique reading; evidence base for practice recommendations; future research on when AI coaching works.","cluster":"Mentoring, coaching \u0026 AI coaching — developmental relationships at work (new cluster)","themes":["AI \u0026 Future of Work","Well-Being \u0026 Occupational Health","Training \u0026 Development"]},{"date":"2026-07-28","topic":"AI Coaching / Goal Attainment","authors":"Terblanche, N.; Molyn, J.; de Haan, E.; Nilsson, V. O.","year":"2022","title":"Comparing artificial intelligence and human coaching goal attainment efficacy","journal":"PLOS ONE","cite":"17(6), e0270255","doi":"https://doi.org/10.1371/journal.pone.0270255","summary":"Two equivalent 10-month longitudinal RCTs measured clients' goal attainment: one with human coaches, one with an AI chatbot coach. Both formats significantly increased goal attainment versus controls, and the chatbot was as effective as human coaches by trial end. Widely cited as early evidence that narrow, goal-focused AI coaching can work.","relevance":"Foundational empirical anchor for AI coaching research; pairs instructively with the 2026 de Haan et al. RCT that found the opposite pattern.","contribution":"Longitudinal RCT design; established goal-attainment efficacy of rule-based chatbot coaching.","uses":"Lit review anchor; teaching contrast case with newer null findings; methods example for coaching RCTs.","cluster":"Mentoring, coaching \u0026 AI coaching — developmental relationships at work (new cluster)","themes":["AI \u0026 Future of Work","Training \u0026 Development"]},{"date":"2026-07-28","topic":"Coaching Effectiveness","authors":"de Haan, E.; Nilsson, V. O.","year":"2023","title":"What can we know about the effectiveness of coaching? A meta-analysis based only on randomized controlled trials","journal":"Academy of Management Learning \u0026 Education","cite":"22(4)","doi":"https://doi.org/10.5465/amle.2022.0107","summary":"Meta-analysis restricted to 37 RCTs (39 samples, N = 2,528) of workplace and executive coaching from 1994–2021. Found a significant overall coaching effect of g = .59 (moderate) across leadership and personal outcomes, with indications of publication bias. Sets the current rigorous benchmark for coaching effectiveness claims.","relevance":"Gold-standard causal evidence for coaching as an organizational development intervention; baseline against which AI coaching must be judged.","contribution":"RCT-only inclusion criteria markedly strengthen causal inference relative to prior coaching meta-analyses.","uses":"Required reading on coaching evidence; grant justification for coaching interventions; methods discussion of RCT-only meta-analysis.","cluster":"Mentoring, coaching \u0026 AI coaching — developmental relationships at work (new cluster)","themes":["Training \u0026 Development"]},{"date":"2026-07-28","topic":"Coaching Effectiveness","authors":"Jones, R. J.; Woods, S. A.; Guillaume, Y. R. F.","year":"2016","title":"The effectiveness of workplace coaching: A meta-analysis of learning and performance outcomes from coaching","journal":"Journal of Occupational and Organizational Psychology","cite":"89(2), 249–277","doi":"https://doi.org/10.1111/joop.12119","summary":"Meta-analysis of workplace coaching effects on learning and performance outcomes. Coaching produced positive effects on organizational outcomes, and was effective whether delivered face-to-face or via blended e-coaching formats. Internal coaches and formats without multisource feedback showed stronger effects.","relevance":"The most-cited workplace coaching meta-analysis in organizational psychology; establishes delivery format (including e-coaching) as a moderator.","contribution":"Established the criterion framework (affective, cognitive, skill-based, results) for coaching outcomes.","uses":"Foundational reading for coaching/L\u0026D; moderator evidence useful for designing digital coaching studies.","cluster":"Mentoring, coaching \u0026 AI coaching — developmental relationships at work (new cluster)","themes":["Training \u0026 Development"]},{"date":"2026-07-28","topic":"Mentoring / Career Outcomes","authors":"Allen, T. D.; Eby, L. T.; Poteet, M. L.; Lentz, E.; Lima, L.","year":"2004","title":"Career benefits associated with mentoring for protégés: A meta-analysis","journal":"Journal of Applied Psychology","cite":"89(1), 127–136","doi":"https://doi.org/10.1037/0021-9010.89.1.127","summary":"Classic meta-analysis of career outcomes associated with protégé mentoring. Mentoring related to objective outcomes (compensation, promotions) and subjective outcomes (career satisfaction, expectations of advancement), with generally larger effects for subjective outcomes. Distinguished career-related from psychosocial mentoring functions.","relevance":"The foundational quantitative synthesis of mentoring benefits in I-O psychology; the baseline any digital or AI-mediated mentoring model must engage.","contribution":"Established the career vs. psychosocial function distinction in quantitative form.","uses":"Foundational teaching reading; effect-size benchmarks for mentoring interventions and grant proposals.","cluster":"Mentoring, coaching \u0026 AI coaching — developmental relationships at work (new cluster)","themes":["Careers \u0026 Vocational Behavior"]},{"date":"2026-07-28","topic":"Mentoring / Interdisciplinary Synthesis","authors":"Eby, L. T. de T.; Allen, T. D.; Hoffman, B. J.; Baranik, L. E.; Sauer, J. B.; Baldwin, S.; Morrison, M. A.; Kinkade, K. M.; Maher, C. P.; Curtis, S.; Evans, S. C.","year":"2013","title":"An interdisciplinary meta-analysis of the potential antecedents, correlates, and consequences of protégé perceptions of mentoring","journal":"Psychological Bulletin","cite":"139(2), 441–476","doi":"https://doi.org/10.1037/a0029279","summary":"Large interdisciplinary meta-analysis spanning youth, academic, and workplace mentoring. Examined antecedents, correlates, and consequences of protégé-perceived mentoring quality across hundreds of samples. Relationship quality and psychosocial support showed the strongest links to attitudinal outcomes; effects varied meaningfully by mentoring context.","relevance":"Broadest quantitative map of the mentoring literature; essential scaffolding for asking what digital/AI mentoring can and cannot replicate.","contribution":"Cross-context synthesis distinguishing where mentoring effects generalize versus depend on setting.","uses":"Comprehensive lit review anchor; theory building on relational mechanisms; comparison base for e-mentoring research.","cluster":"Mentoring, coaching \u0026 AI coaching — developmental relationships at work (new cluster)","themes":["Careers \u0026 Vocational Behavior"]},{"date":"2026-07-27","topic":"Vocational Interests \u0026 Performance — Foundational Meta-Analysis","authors":"Nye, C. D.; Su, R.; Rounds, J.; Drasgow, F.","year":"2012","title":"Vocational Interests and Performance: A Quantitative Summary of Over 60 Years of Research","journal":"Perspectives on Psychological Science","cite":"7(4), 384-403","doi":"https://doi.org/10.1177/1745691612449021","summary":"Meta-analysis synthesizing 60+ years of research on vocational interests and work outcomes. Aggregated correlations between interests/interest congruence and job and academic performance across dozens of samples. Found that interests meaningfully predict performance and persistence, especially when measured as person-environment fit (congruence), countering the long-held view that interests have weak criterion validity.","relevance":"Rehabilitated interests as a serious predictor in I-O selection and career research after decades of neglect; the anchor citation for the modern interest-research revival.","contribution":"Established interest congruence as a valid predictor of performance and persistence, shifting the field's view of interests from 'satisfaction-only' variables to performance-relevant individual differences.","uses":"Foundational reading for vocational psychology or individual differences seminars; anchor for lit reviews on interest validity; supports grant arguments for interest-based assessment.","cluster":"Vocational interests, interest fit \u0026 whole-person career assessment (new cluster)","themes":["Careers \u0026 Vocational Behavior"]},{"date":"2026-07-27","topic":"Interest Development — Meta-Analysis of Longitudinal Studies","authors":"Hoff, K. A.; Briley, D. A.; Wee, C. J. M.; Rounds, J.","year":"2018","title":"Normative Changes in Interests From Adolescence to Adulthood: A Meta-Analysis of Longitudinal Studies","journal":"Psychological Bulletin","cite":"144(4), 426-451","doi":"https://doi.org/10.1037/bul0000140","summary":"Meta-analysis of 49 longitudinal studies (98 samples, N = 20,639) charting mean-level change in RIASEC interests from adolescence to adulthood. Interests are largely stable but show meaningful normative shifts: declines during early adolescence followed by increases in most domains during the college years and stabilization in adulthood, with notable gender differences in trajectories. Positions interest development within a lifespan developmental framework.","relevance":"Core developmental evidence base for career counseling and vocational-choice theory; informs when interest assessment is most (and least) diagnostic across the lifespan.","contribution":"First quantitative synthesis of interest development, importing lifespan developmental methods (akin to personality maturation research) into vocational psychology.","uses":"Teaching career development across the lifespan; lit reviews on interest stability/change; framing longitudinal grant proposals on career trajectories.","cluster":"Vocational interests, interest fit \u0026 whole-person career assessment (new cluster)","themes":["Careers \u0026 Vocational Behavior"]},{"date":"2026-07-27","topic":"Interest Fit \u0026 Job Satisfaction — Meta-Analysis","authors":"Hoff, K. A.; Song, Q. C.; Wee, C. J. M.; Phan, W. M. J.; Rounds, J.","year":"2020","title":"Interest Fit and Job Satisfaction: A Systematic Review and Meta-Analysis","journal":"Journal of Vocational Behavior","cite":"123, 103503","doi":"https://doi.org/10.1016/j.jvb.2020.103503","summary":"Systematic review and meta-analysis re-examining the classic assumption that interest fit drives job satisfaction. Across 105 studies, overall interest congruence-satisfaction correlations were modest, but fit predicted satisfaction more strongly under specific
