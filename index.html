ssions.","cluster":"Workforce aging, age diversity \u0026 the multigenerational workplace (new cluster)","themes":["Aging \u0026 Generations"]},{"date":"2026-07-14","topic":"Older Worker Stereotypes — Meta-Analysis (Foundational)","authors":"Ng, T. W. H.; Feldman, D. C.","year":"2012","title":"Evaluating Six Common Stereotypes About Older Workers With Meta-Analytical Data","journal":"Personnel Psychology","cite":"65(4), 821-858","doi":"https://doi.org/10.1111/peps.12003","summary":"Meta-analysis (418 studies, N = 208,204) testing six stereotypes of older workers: less motivated, less willing to train, more resistant to change, less trusting, less healthy, and more vulnerable to work-family imbalance. Only one stereotype - lower willingness to participate in training and career development - was supported by the data; the remaining five were unsupported.","relevance":"The definitive empirical test of older-worker stereotypes; underpins research on age discrimination, hiring, and training investment decisions.","contribution":"Foundational meta-analytic evidence that most age stereotypes lack empirical support, while identifying training participation as a real gap to address.","uses":"Foundational citation for aging research; teaching stereotype vs. evidence distinctions; framing training/development interventions for older workers.","cluster":"Workforce aging, age diversity \u0026 the multigenerational workplace (new cluster)","themes":["Aging \u0026 Generations"]},{"date":"2026-07-14","topic":"Successful Aging at Work — Theory","authors":"Kooij, D. T. A. M.; Zacher, H.; Wang, M.; Heckhausen, J.","year":"2020","title":"Successful Aging at Work: A Process Model to Guide Future Research and Practice","journal":"Industrial and Organizational Psychology","cite":"13(3), 345-365","doi":"https://doi.org/10.1017/iop.2020.1","summary":"Focal theory article defining successful aging at work and proposing a process model grounded in the motivational theory of life-span development. Specifies how workers proactively regulate goals and resources (goal engagement/disengagement strategies) to maintain person-environment fit as they age, and identifies antecedents, mechanisms, and intervention points for organizations.","relevance":"The dominant contemporary theoretical model of successful aging at work; frames aging as an active self-regulatory process rather than decline.","contribution":"Provides a unifying process definition and model of successful aging at work that has organized much of the subsequent literature.","uses":"Theory foundation for empirical studies on aging and work; seminar theory reading; basis for intervention design in aging workforces.","cluster":"Workforce aging, age diversity \u0026 the multigenerational workplace (new cluster)","themes":["Aging \u0026 Generations"]},{"date":"2026-07-14","topic":"Age-Differentiated Leadership — Empirical","authors":"Zellman, E.; Andrei, D.; Chong, J.; Parker, S. K.","year":"2025","title":"Investigating the Impact of Age-Differentiated Leadership on Retention and Performance-Related Outcomes: A Moderated Dual Pathway Model","journal":"Work, Aging and Retirement","cite":"Advance online publication","doi":"https://doi.org/10.1093/workar/waaf022","summary":"Proposes and tests a moderated dual pathway model of age-differentiated leadership (ADL) - leadership that adapts to age-related needs of employees. Finds ADL relates to retention-related outcomes via reduced age bias and to self-rated performance-related outcomes via enhanced information exchange, identifying two distinct mechanisms through which leaders shape outcomes in age-diverse workforces.","relevance":"Connects leadership research to workforce aging - practical relevance for retaining older workers amid labor shortages.","contribution":"Introduces and tests a dual-mechanism (age bias reduction vs. information exchange) account of how age-adapted leadership works.","uses":"Empirical exemplar for seminar; leadership development programs for age-diverse teams; future research on leadership and aging.","cluster":"Workforce aging, age diversity \u0026 the multigenerational workplace (new cluster)","themes":["Turnover \u0026 Retention","Aging \u0026 Generations","Leadership"]},{"date":"2026-07-14","topic":"Aging, Job Complexity \u0026 Learning — Experiment","authors":"Zhang, F.; Li, G.; Parker, S. K.","year":"2026","title":"Job Complexity and the Aging Workforce: Causal Effects on Learning Performance and Change Self-Efficacy","journal":"Work, Aging and Retirement","cite":"Advance online publication","doi":"https://doi.org/10.1093/workar/waag008","summary":"Randomized experiment (N = 312, younger and older workers) manipulating job complexity to test causal effects on learning. Medium complexity produced superior objective learning performance (higher success rates, shorter completion times) and higher change self-efficacy, and these benefits held equally for older and younger workers - challenging deficit-based assumptions about older workers' learning capacity.","relevance":"Causal evidence at the intersection of work design, aging, and learning - directly relevant to reskilling debates in the future of work.","contribution":"Rare experimental (causal) test of work design effects on learning across age groups; counters age-deficit narratives with design-based solutions.","uses":"Methods exemplar (experimental design in aging research); evidence for age-inclusive work design and reskilling programs; teaching work design theory.","cluster":"Workforce aging, age diversity \u0026 the multigenerational workplace (new cluster)","themes":["Training \u0026 Development","Aging \u0026 Generations"]},{"date":"2026-07-13","topic":"Technostress \u0026 Hybrid Work Burnout","authors":"Whelan, E.; O'Brien, A.; McCarthy, A.","year":"2026","title":"Burnout in Hybrid Work Arrangements: Unpacking the Role of Technostress, Psychological Detachment, and Organisational Supports","journal":"Internet Research","cite":"36(7), 63–81","doi":"https://doi.org/10.1108/INTR-01-2025-0041","summary":"Integrates technostress with the stressor-detachment model to examine how remote vs. onsite ICT stressors affect hybrid workers' burnout. Survey-based study of hybrid workers finds technostress experienced in both locations inhibits psychological detachment, which in turn predicts burnout. Hybrid work location autonomy buffers the negative link between remote technostress and detachment. Organisational supports emerge as key protective resources.","relevance":"Directly addresses how post-pandemic hybrid arrangements shape occupational health via technology-specific stressors; bridges IS and OHP literatures.","contribution":"Extends the stressor-detachment model by distinguishing remote vs. onsite technostress and identifying location autonomy as a boundary condition.","uses":"Lit review on hybrid work well-being; teaching example for JD-R/stressor-detachment integration; grant framing for digital-work interventions.","cluster":"Digital connectivity, technostress \u0026 recovery from work","themes":["Well-Being \u0026 Occupational Health","Technostress \u0026 Digital Demands","Remote \u0026 Hybrid Work"]},{"date":"2026-07-13","topic":"Constant Connectivity \u0026 Leadership","authors":"Hesse, ...; et al. (full author list needs verification)","year":"2025","title":"Always On-line? An Organizational Model of Leaders' After-Hours Smartphone Use and Climate of Constant Connectivity","journal":"Journal of Occupational and Organizational Psychology","cite":"98, e70067","doi":"https://doi.org/10.1111/joop.70067","summary":"Proposes and tests an organizational model in which leaders' after-hours smartphone use shapes shared norms - a climate of constant connectivity - regarding employees' availability and responsiveness to work communication during non-work time. Positions leader behavior as a top-down driver of always-on culture rather than treating connectivity as a purely individual choice.","relevance":"Shifts the connectivity/well-being conversation from individual boundary management to organizational climate and leader modeling - highly relevant to occupational health and leadership research.","contribution":"Introduces climate of constant connectivity as an organizational-level construct with leader behavior as its antecedent.","uses":"Seminar debate on right-to-disconnect policies; leadership development teaching; multilevel climate research designs.","cluster":"Digital connectivity, technostress \u0026 recovery from work","themes":["Leadership"]},{"date":"2026-07-13","topic":"Technology-Assisted Supplemental Work","authors":"Kühner, C.; Rudolph, C. W.; Derks, D.; Posch, M.; Zacher, H.","year":"2023","title":"Technology-Assisted Supplemental Work: A Meta-Analysis","journal":"Journal of Vocational Behavior","cite":"142, 103861","doi":"https://doi.org/10.1016/j.jvb.2023.103861","summary":"Meta-analysis of 89 independent samples (N = 39,085) on antecedents and outcomes of technology-assisted supplemental work (TASW) - performing work tasks after hours via technology. Job demands, job control, and work identity predict TASW. TASW relates positively to job strain and work-nonwork conflict and negatively to detachment and balance, yet also positively to job satisfaction, engagement, and performance.","relevance":"The quantitative anchor for the after-hours connectivity literature; documents the double-edged nature of boundary-crossing technology use.","contribution":"Provides meta-analytic effect-size estimates that reconcile the resource-gain and resource-drain perspectives on after-hours work.","uses":"Required reading for a technostress/recovery seminar week; effect-size benchmarks for power analyses; lit review cornerstone.","cluster":"Digital connectivity, technostress \u0026 recovery from work","themes":["Technostress \u0026 Digital Demands"]},{"date":"2026-07-13","topic":"Human-AI Interaction \u0026 After-Work Well-Being","authors":"Tang, P. M.; Koopman, J.; Mai, K. M.; De Cremer, D.; Zhang, J. H.; Reynders, P.; Ng, C. T. S.; Chen, I.-H.","year":"2023","title":"No Person Is an Island: Unpacking the Work and After-Work Consequences of Interacting With Artificial Intelligence","journal":"Journal of Applied Psychology","cite":"108(11), 1766–1789","doi":"https://doi.org/10.1037/apl0001103","summary":"Four studies (experience sampling and experiments; N = 794 across Taiwan, Indonesia, US, Malaysia) show that frequent interaction with AI systems heightens employees' need for social affiliation - increasing helping behavior - but also loneliness, which spills over into insomnia and after-work alcohol consumption. Attachment anxiety amplifies the maladaptive pathway.","relevance":"One of the first rigorous JAP studies linking AI-infused work design to occupational health outcomes; connects human-AI collaboration and well-being literatures.","contribution":"Applies social affiliation theory to AI interaction, showing simultaneous adaptive and maladaptive consequences across cultures.","uses":"Teaching centerpiece for AI-and-well-being week; model for cross-cultural ESM designs; grant motivation for AI work-design interventions.","cluster":"Digital connectivity, technostress \u0026 recovery from work","themes":["AI \u0026 Future of Work","Well-Being \u0026 Occupational Health"]},{"date":"2026-07-13","topic":"Email Monitoring Expectations \u0026 Family Well-Being","authors":"Becker, W. J.; Belkin, L. Y.; Conroy, S. A.; Tuskey, S.","year":"2021","title":"Killing Me Softly: Organizational E-mail Monitoring Expectations' Impact on Employee and Significant Other Well-Being","journal":"Journal of Management","cite":"47(4), 1024–1052","doi":"https://doi.org/10.1177/0149206319890655","summary":"Positions organizational expectations for email monitoring (OEEM) during nonwork time as a psychological stressor. Experience-sampling and multi-source studies show OEEM elicits anxiety via attention-allocation conflict, harming employees' health and relationship quality - with effects extending to significant others' well-being. Notably, the mere expectation of availability, not actual email time, drives the harm.","relevance":"Demonstrates crossover of connectivity stressors into the family domain, broadening occupational health beyond the individual worker.","contribution":"Distinguishes availability expectations from actual technology use as the active stressor ingredient; documents crossover effects to partners.","uses":"Work-family and recovery lit reviews; policy discussion on availability norms; example of crossover/spillover designs.","cluster":"Digital connectivity, technostress \u0026 recovery from work","themes":["Algorithmic Management \u0026 Surveillance","Well-Being \u0026 Occupational Health","Technostress \u0026 Digital Demands"]},{"date":"2026-07-13","topic":"Recovery From Work — State of the Science","authors":"Sonnentag, S.; Cheng, B. H.; Parker, S. L.","year":"2022","title":"Recovery From Work: Advancing the Field Toward the Future","journal":"Annual Review of Organizational Psychology and Organizational Behavior","cite":"9, 33–60","doi":"https://doi.org/10.1146/annurev-orgpsych-012420-091355","summary":"Authoritative review of the recovery-from-work literature: summarizes evidence on recovery processes (psychological detachment, relaxation, mastery, control), their antecedents and outcomes, and micro-breaks during the workday. Charts a future agenda including technology use, boundaryless work, and recovery interventions.","relevance":"The go-to integrative review anchoring any research or teaching on recovery, detachment, and off-job well-being in an always-on work context.","contribution":"Consolidates two decades of recovery research into a unified framework and sets the field's agenda, including digital-age challenges.","uses":"Required background reading; framing citation for grants on recovery interventions; structure for a seminar week on recovery.","cluster":"Digital connectivity, technostress \u0026 recovery from work","themes":["Well-Being \u0026 Occupational Health"]},{"date":"2026-07-13","topic":"Workplace Telepressure — Foundational","authors":"Barber, L. K.; Santuzzi, A. M.","year":"2015","title":"Please Respond ASAP: Workplace Telepressure and Employee Recovery","journal":"Journal of Occupational Health Psychology","cite":"20(2), 172–189","doi":"https://doi.org/10.1037/a0038278","summary":"Introduces and validates the construct of workplace telepressure - the preoccupation with and urge to respond quickly to message-based work communication. Across two studies, telepressure predicted burnout, absenteeism, sleep quality problems, and poorer recovery experiences, over and above general job demands and personality.","relevance":"The foundational construct paper for a now-large literature on message-based connectivity strain; essential grounding for current right-to-disconnect debates.","contribution":"Establishes telepressure as a distinct psychological state (not just behavior or demand) with validated measurement and incremental predictive validity.","uses":"Foundational/required reading; scale source for empirical projects; contrast point for newer telepressure meta-analyses.","cluster":"Digital connectivity, technostress \u0026 recovery from work","themes":["Well-Being \u0026 Occupational Health","Technostress \u0026 Digital Demands"]},{"date":"2026-07-12","topic":"DEI — Foundational Theory/Review","authors":"Shore, L. M.; Randel, A. E.; Chung, B. G.; Dean, M. A.; Ehrhart, K. H.; Singh, G.","year":"2011","title":"Inclusion and Diversity in Work Groups: A Review and Model for Future Research","journal":"Journal of Management","cite":"37(4), 1262–1289","doi":"https://doi.org/10.1177/0149206310385943","summary":"Reviews the diversity and inclusion literatures and uses Brewer's optimal distinctiveness theory to define work-group inclusion as the joint satisfaction of belongingness and uniqueness needs. Develops a 2x2 framework (exclusion, assimilation, differentiation, inclusion) and a model of inclusion antecedents (inclusive climate, leadership, practices) and outcomes. Sets a research agenda distinguishing inclusion from diversity per se.","relevance":"The definitional anchor for inclusion research in I-O/OB; nearly all subsequent inclusion measures and climate work build on this framework.","contribution":"Provides the field's dominant conceptualization of inclusion (belongingness + uniqueness) and a testable antecedent-outcome model.","uses":"Core theory reading for a DEI or future-of-work seminar week; framework for lit reviews and scale selection; grant framing for inclusion interventions.","cluster":"Diversity, equity, and inclusion in the changing workplace: foundational models, meta-analytic evidence, and the DEI backlash","themes":["Diversity, Equity \u0026 Inclusion","Teams \u0026 Collaboration"]},{"date":"2026-07-12","topic":"DEI — Climate for Inclusion (Empirical)","authors":"Nishii, L. H.","year":"2013","title":"The Benefits of Climate for Inclusion for Gender-Diverse Groups","journal":"Academy of Management Journal","cite":"56(6), 1754–1774","doi":"https://doi.org/10.5465/amj.2009.0823","summary":"Conceptualizes and measures climate for inclusion along three dimensions: fair employment practices, integration of differences, and inclusion in decision making. In a sample of 1,324 employees in 100 departments, gender diversity was associated with higher conflict only in units low in inclusion climate; in inclusive climates the diversity-conflict link disappeared and turnover intentions were lower. Demonstrates that inclusion climate moderates whether demographic diversity helps or hurts.","relevance":"Landmark empirical demonstration that context determines diversity's effects; central to research on inclusive climates and gender diversity in units and teams.","contribution":"First rigorous multidimensional operationalization of climate for inclusion; establishes it as a unit-level moderator of diversity effects.","uses":"Required empirical reading for diversity climate; measurement model for survey research; exemplar of multilevel moderation design for methods teaching.","cluster":"Diversity, equity, and inclusion in the changing workplace: foundational models, meta-analytic evidence, and the DEI backlash","themes":["Diversity, Equity \u0026 Inclusion"]},{"date":"2026-07-12","topic":"DEI — Diversity Initiatives (Theory)","authors":"Leslie, L. M.","year":"2019","title":"Diversity Initiative Effectiveness: A Typological Theory of Unintended Consequences","journal":"Academy of Management Review","cite":"44(3), 538–563","doi":"https://doi.org/10.5465/amr.2017.0087","summary":"Develops a typological theory of the unintended consequences of diversity initiatives. Proposes four types: backfire (harm to diversity goals), negative spillover (harm to other outcomes), positive spillover (unexpected benefits), and false progress (improved metrics without real change), along with signaling- and practice-based mechanisms. Explains why well-intentioned initiatives often fail or produce perverse effects.","relevance":"Directly relevant to current debates about DEI program effectiveness and backlash; gives researchers a precise vocabulary for initiative failure modes.","contribution":"Supplies a generalizable typology and mechanism-based theory for evaluating any organizational diversity intervention.","uses":"Debate/critique reading paired with backlash papers; framework for intervention research design and program evaluation; strong seminar discussion piece.","cluster":"Diversity, equity, and inclusion in the changing workplace: foundational models, meta-analytic evidence, and the DEI backlash","themes":["Diversity, Equity \u0026 Inclusion"]},{"date":"2026-07-12","topic":"DEI — Diversity Climate (Meta-Analysis)","authors":"Holmes, O., IV; Jiang, K.; Avery, D. R.; McKay, P. F.; Oh, I.-S.; Tillman, C. J.","year":"2021","title":"A Meta-Analysis Integrating 25 Years of Diversity Climate Research","journal":"Journal of Management","cite":"47(6), 1357–1382","doi":"https://doi.org/10.1177/0149206320934547","summary":"Meta-analyzes 109 independent samples from 94 studies on diversity climate. Finds diversity climate relates positively to job attitudes, performance, and retention-relevant outcomes, with relationships moderated by climate measure type, outcome type, demographic diversity, climate strength, and measurement source. Consolidates a fragmented literature and identifies measurement inconsistency as a key problem.","relevance":"The quantitative anchor for diversity climate research in I-O; establishes effect-size benchmarks and measurement moderators for future studies.","contribution":"First comprehensive meta-analytic integration of the diversity climate literature; clarifies construct measurement issues.","uses":"Meta-analytic evidence base for lit reviews and grant proposals; pairs with Nishii (2013) for a theory-plus-evidence seminar week.","cluster":"Diversity, equity, and inclusion in the changing workplace: foundational models, meta-analytic evidence, and the DEI backlash","themes":["Diversity, Equity \u0026 Inclusion"]},{"date":"2026-07-12","topic":"DEI — Remote Work \u0026 Gender Discrimination (Empirical)","authors":"Doering, L.; Tilcsik, A.","year":"2025","title":"Location Matters: Everyday Gender Discrimination in Remote and On-site Work","journal":"Organization Science","cite":"36(2), 547–571","doi":"https://doi.org/10.1287/orsc.2022.16949","summary":"Surveys 1,091 professional women who work the same job both remotely and on-site to compare everyday gender discrimination across locations. Women consistently report less everyday discrimination when working remotely than on-site, with effects concentrated among those most exposed to interpersonal bias. Highlights an overlooked equity dimension of the remote/hybrid work debate.","relevance":"Connects the future-of-work literature on remote/hybrid arrangements to workplace discrimination research; complicates return-to-office debates with an equity lens.","contribution":"Novel within-person design comparing discrimination across work locations; identifies remote work as a buffer against everyday bias.","uses":"Recent empirical reading linking flexible work and DEI; discussion piece on hybrid work policy trade-offs; design exemplar for survey methods.","cluster":"Diversity, equity, and inclusion in the changing workplace: foundational models, meta-analytic evidence, and the DEI backlash","themes":["Remote \u0026 Hybrid Work","Diversity, Equity \u0026 Inclusion"]},{"date":"2026-07-12","topic":"DEI — Backlash (Review/Commentary)","authors":"Folberg, A. M.; Corrington, A.; Hebl, M.; Nguyen, L. T.; Thomas, H. A.; Kim, H. J.","year":"2026","title":"Understanding and Remediating Backlash to DEI in Organizations","journal":"Organizational Psychology Review","cite":"Advance online publication","doi":"https://doi.org/10.1177/20413866261450981","summary":"Reviews the factors driving the current, unprecedented wave of backlash against organizational DEI initiatives in the United States and globally. Synthesizes psychological and organizational mechanisms underlying resistance and proposes evidence-based strategies for remediating backlash while preserving core DEI functions. Published online May 2026.","relevance":"Directly addresses the most consequential current development in organizational DEI practice; authored by a leading discrimination research team (Hebl and colleagues).","contribution":"Provides an integrative psychological account of DEI backlash and a remediation agenda at a moment of major institutional retrenchment.","uses":"Timely required/debate reading on the politics of DEI; framing for research on initiative sustainability; strong seminar discussion anchor for 2026.","cluster":"Diversity, equity, and inclusion in the changing workplace: foundational models, meta-analytic evidence, and the DEI backlash","themes":["Diversity, Equity \u0026 Inclusion"]},{"date":"2026-07-12","topic":"DEI — Diversity Climate Antecedents (Meta-Analysis)","authors":"Sabat, I. E.; He, Y.; Nault, E.; Nguyen, D.; Liu, S.-N.","year":"2026","title":"The Antecedents, Outcomes, and Moderators of Diversity Climate in the Workplace: A Meta-Analytic Review","journal":"Human Resource Management Review","cite":"Advance online publication (2026)","doi":"https://www.sciencedirect.com/science/article/abs/pii/S1053482226000021","summary":"Meta-analyzes 161 primary studies to test previously unexamined antecedents and outcomes of diversity climate. Situational factors such as positive leadership and HR practices predict diversity climate perceptions, which in turn relate to workplace health and job attitudes. Effects on several outcomes are stronger in more demographically diverse organizations.","relevance":"Updates and extends Holmes et al. (2021) by adding antecedents, giving I-O researchers levers (leadership, HR practices) for building inclusive climates.","contribution":"First meta-analytic test of diversity climate antecedents; shows organizational diversity amplifies climate-outcome relations. DOI not yet indexed; stable publisher link provided.","uses":"Recent meta-analytic complement for lit reviews; evidence base for HR-practice interventions; pairs with Holmes et al. for a cumulative-evidence discussion.","cluster":"Diversity, equity, and inclusion in the changing workplace: foundational models, meta-analytic evidence, and the DEI backlash","themes":["Diversity, Equity \u0026 Inclusion"]},{"date":"2026-07-11","topic":"Computational Methods — Text Mining","authors":"Kobayashi, V. B.; Mol, S. T.; Berkers, H. A.; Kismihók, G.; Den Hartog, D. N.","year":"2018","title":"Text mining in organizational research","journal":"Organizational Research Methods","cite":"21(3), 733–765","doi":"https://doi.org/10.1177/1094428117722619","summary":"Comprehensive review introducing text mining to organizational researchers. Explains the full workflow — preprocessing, feature extraction, classification, clustering, and topic modeling — and reviews applications across organizational research domains. Provides guidance on validity concerns unique to text-based measures and identifies opportunities for using unstructured text (emails, reviews, open-ended responses) as data.","relevance":"Foundational methods reading for any I-O researcher using digital trace or text data; directly relevant to big data and computational I-O psychology.","contribution":"One of the most-cited methodological primers on text mining in ORM; established shared vocabulary and workflow standards for text-based organizational research.","uses":"Core methods reading for seminars on big data/digital traces; template for lit reviews and grant methods sections using NLP.","cluster":"Computational text analysis, NLP \u0026 LLM methods for organizational research (methods thread — new cluster)","themes":["Big Data \u0026 Methods"]},{"date":"2026-07-11","topic":"Computational Methods — Text Analysis Tools","authors":"Banks, G. C.; Woznyj, H. M.; Wesslen, R. S.; Ross, R. L.","year":"2018","title":"A review of best practice recommendations for text analysis in R (and a user-friendly app)","journal":"Journal of Business and Psychology","cite":"33(4), 445–459","doi":"https://doi.org/10.1007/s10869-017-9528-3","summary":"Reviews best practices for conducting text analysis in organizational research, walking through data collection, cleaning, dictionary-based and machine-learning approaches, and reporting standards. Accompanies recommendations with a user-friendly R-based application to lower the barrier to entry. Emphasizes construct validity and transparency in text-analytic research.","relevance":"Practical, accessible entry point for graduate students and applied researchers adopting text analysis; complements more technical ORM treatments.","contribution":"Translates text-analytic best practices into an actionable checklist plus tooling, making computational text methods accessible to non-programmers in I-O.","uses":"Excellent teaching resource for methods courses; onboarding reading for research assistants starting text-analysis projects.","cluster":"Computational text analysis, NLP \u0026 LLM methods for organizational research (methods thread — new cluster)","themes":["Big Data \u0026 Methods"]},{"date":"2026-07-11","topic":"Big Data Methods \u0026 Data Science","authors":"Tonidandel, S.; King, E. B.; Cortina, J. M.","year":"2018","title":"Big data methods: Leveraging modern data analytic techniques to build organizational science","journal":"Organizational Research Methods","cite":"21(3), 525–547","doi":"https://doi.org/10.1177/1094428116677299","summary":"Editorial overview framing the ORM special issue on big data. Argues that data science techniques (machine learning, text mining, network analysis) can advance rather than threaten organizational science if integrated with strong theory. Maps big data opportunities and pitfalls — construct validity, overfitting, interpretability — onto organizational research questions.","relevance":"Sets the agenda for how I-O psychology should engage data science; frames debates about theory-driven vs. data-driven research that remain live in the LLM era.","contribution":"Agenda-setting framework that legitimized data science methods within organizational research and articulated the theory-data balance question.","uses":"Framing reading for seminar discussions on computational methods; useful citation for positioning ML/NLP work within I-O journals.","cluster":"Computational text analysis, NLP \u0026 LLM methods for organizational research (methods thread — new cluster)","themes":["Aging \u0026 Generations","Big Data \u0026 Methods"]},{"date":"2026-07-11","topic":"NLP in Personnel Selection","authors":"Campion, M. C.; Campion, M. A.; Campion, E. D.; Reider, M. H.","year":"2016","title":"Initial investigation into computer scoring of candidate essays for personnel selection","journal":"Journal of Applied Psychology","cite":"101(7), 958–975","doi":"https://doi.org/10.1037/apl0000108","summary":"Early empirical demonstration that text-mining algorithms can score accomplishment-record essays in high-stakes promotion contexts. Using ~46,000 essays, the authors show computer-generated scores converge with human rater scores, predict performance, and dramatically reduce scoring costs. Discusses legal and practical considerations of automated scoring in selection.","relevance":"Classic bridge between computational text methods and personnel selection practice; a precursor to today's LLM-based assessment debates.","contribution":"First major JAP demonstration of NLP-based scoring in operational selection, establishing feasibility and validity evidence for automated text scoring.","uses":"Empirical anchor for discussions of AI-based assessment; historical contrast case for evaluating what LLMs add beyond earlier NLP.","cluster":"Computational text analysis, NLP \u0026 LLM methods for organizational research (methods thread — new cluster)","themes":["Assessment \u0026 Selection"]},{"date":"2026-07-11","topic":"LLMs in Qualitative Research — Methods","authors":"Garcia Quevedo, D.; Glaser, A.; Verzat, C.","year":"2026","title":"Enhancing theorization using artificial intelligence: Leveraging large language models for qualitative analysis of online data","journal":"Organizational Research Methods","cite":"29(1), 92–112","doi":"https://doi.org/10.1177/10944281251339144","summary":"Develops a structured method integrating LLM-based sentiment analysis, topic modeling, and information retrieval to explore and select relevant online data for manual qualitative analysis. Addresses limitations of random sampling in large online corpora and shows how AI-assisted exploration can strengthen (not replace) researcher-driven theorization. Published online May 2025.","relevance":"Directly relevant to how I-O and OB researchers can responsibly fold LLMs into qualitative workflows — a rapidly emerging methods question.","contribution":"One of the first ORM articles offering a concrete, validated workflow for LLM-assisted qualitative analysis that preserves interpretive rigor.","uses":"Methods reading for computational workflows in research; model paper for students designing AI-assisted qualitative studies.","cluster":"Computational text analysis, NLP \u0026 LLM methods for organizational research (methods thread — new cluster)","themes":["AI \u0026 Future of Work","Aging \u0026 Generations","Big Data \u0026 Methods"]},{"date":"2026-07-11","topic":"LLMs as Research Tools — Methodological Guide","authors":"Lin, Z.","year":"2026","title":"Large language models as psychological simulators: A methodological guide","journal":"Advances in Methods and Practices in Psychological Science","cite":"Advance online publication","doi":"https://doi.org/10.1177/25152459251410153","summary":"Methodological guide to using LLMs as simulators of human participants and psychological processes. Covers when simulation is defensible, prompt and persona design, validity threats (training-data contamination, sycophancy, distributional mismatch with human populations), and evaluation strategies. Offers decision guidance for researchers considering silicon sampling and pilot simulation.","relevance":"Highly relevant as I-O researchers begin using LLMs to pilot items, simulate respondents, and pretest manipulations; sets guardrails before the practice spreads.","contribution":"Among the first systematic methodological treatments of LLM simulation in a top psychology methods journal (AMPPS), with a usable validity framework.","uses":"Methods seminar reading on generative AI in research workflows; checklist source for reviewing or designing LLM-simulation studies.","cluster":"Computational text analysis, NLP \u0026 LLM methods for organizational research (methods thread — new cluster)","themes":["AI \u0026 Future of Work","Big Data \u0026 Methods"]},{"date":"2026-07-11","topic":"LLMs \u0026 Organizational Theory — Commentary","authors":"Cornelissen, J.; Höllerer, M. A.; Boxenbaum, E.; Faraj, S.; Gehman, J.","year":"2024","title":"Large language models and the future of organization theory","journal":"Organization Theory","cite":"5(1)","doi":"https://doi.org/10.1177/26317877241239056","summary":"Editor-authored commentary examining what LLMs mean for theorizing in organization studies. Weighs uses of LLMs in literature synthesis, hypothesis generation, and writing against risks of homogenized, derivative theory and erosion of scholarly craft. Calls for norms governing AI use in theory development.","relevance":"Provokes discussion about the epistemic role of generative AI in knowledge work — the researcher's own work included; strong debate/critique reading.","contribution":"Agenda-setting commentary from senior organization theorists on AI's implications for theory building itself, not just as a data tool.","uses":"Debate reading for seminars on generative AI and knowledge work; framing piece for discussions of AI research ethics and authorship.","cluster":"Computational text analysis, NLP \u0026 LLM methods for organizational research (methods thread — new cluster)","themes":["AI \u0026 Future of Work"]},{"date":"2026-07-10","topic":"Automation, Robotics \u0026 Job Insecurity","authors":"Yam, K. C., Tang, P. M., Jackson, J. C., Su, R., \u0026 Gray, K.","year":"2023","title":"The Rise of Robots Increases Job Insecurity and Maladaptive Workplace Behaviors: Multimethod Evidence","journal":"Journal of Applied Psychology","cite":"108(5), 850–870","doi":"https://doi.org/10.1037/apl0001045","summary":"Drawing on cognitive appraisal theory of stress, this six-study multimethod paper (archival data across 185 U.S. metro areas, a Singapore experiment, an experience-sampling study of Indian engineers, and online experiments) tests whether robot exposure increases job insecurity. Both physical and psychological exposure to robots heightened job insecurity, which predicted burnout and workplace incivility. A self-affirmation intervention buffered these effects in one study. Findings held across industries, including those not directly threatened by robots.","relevance":"Provides rigorous, multimethod causal evidence linking automation/robotics exposure to core I-O outcomes (stress, burnout, incivility); directly relevant to the AI/automation/job-transformation seminar week.","contribution":"Extends job insecurity theory to non-human/technological threat sources and identifies a testable psychological buffer (self-affirmation).","uses":"Strong anchor reading for automation/job-transformation week; also a methods exemplar for multimethod triangulation designs.","cluster":"Automation/robotics exposure and pay transparency/compensation — two understudied future-of-work threads not yet covered in the digest","themes":["AI \u0026 Future of Work","Employment Relationships \u0026 Gig Work"]},{"date":"2026-07-10","topic":"Automation, Robotics \u0026 Job Insecurity","authors":"Ren, S., \u0026 Chowdhury, S.","year":"2025","title":"Employee Digital Transformation Experience Towards Automation Versus Augmentation: Implications for Job Attitudes","journal":"Human Resource Management","cite":"64(5), 1359–1379","doi":"https://doi.org/10.1002/hrm.22313","summary":"Examines how employees' subjective experience of digital transformation as automating (replacing) versus augmenting (enhancing) their work shapes job attitudes such as engagement and voice. Survey data show perceived automation-oriented transformation undermines attitudes while augmentation-oriented framing supports them, with employee voice moderating the effects. Foregrounds employee sensemaking of top-down digital transformation rather than treating automation as monolithic.","relevance":"Complements algorithmic-management and AI literatures already in the digest by isolating the automation-vs-augmentation framing distinction as a lever for shaping employee reactions to technological change.","contribution":"Introduces an employee-experience framework distinguishing automation from augmentation framings of digital transformation, with voice as a moderator.","uses":"Pairs with Fügener et al. (2025, automation/augmentation roles) already in the digest; useful for discussing change-management framing in AI adoption.","cluster":"Automation/robotics exposure and pay transparency/compensation — two understudied future-of-work threads not yet covered in the digest","themes":["AI \u0026 Future of Work","Employment Relationships \u0026 Gig Work"]},{"date":"2026-07-10","topic":"Skills-Based Talent Management","authors":"Jooss, S., Collings, D. G., McMackin, J., \u0026 Dickmann, M.","year":"2024","title":"A Skills-Matching Perspective on Talent Management: Developing Strategic Agility","journal":"Human Resource Management","cite":"63(1), 141–157","doi":"https://doi.org/10.1002/hrm.22192","summary":"Based on 34 interviews across 15 organizations, this qualitative study develops a skills-matching perspective on talent management, distinguishing initial and dynamic skills-matching in internal and external labor markets. The authors argue talent-management scholarship has under-engaged with the practitioner-driven 'skills agenda' and propose a framework linking skills-matching to strategic organizational agility, with propositions for future quantitative testing.","relevance":"Grounds the practitioner-driven 'skills-based hiring' trend in established talent-management theory, giving seminar participants an academic anchor for a topic otherwise dominated by consulting reports.","contribution":"Theoretical framework connecting skills-matching processes to organizational strategic agility, bridging talent management and workforce development literatures.","uses":"Theory/required reading for upskilling and workforce development week; useful for critiquing popular-press claims about skills-based hiring.","cluster":"Automation/robotics exposure and pay transparency/compensation — two understudied future-of-work threads not yet covered in the digest","themes":["Employment Relationships \u0026 Gig Work"]},{"date":"2026-07-10","topic":"Skills-Based Hiring \u0026 Workforce Development","authors":"Bone, M., González Ehlinger, E., \u0026 Stephany, F.","year":"2025","title":"Skills or Degree? The Rise of Skill-Based Hiring for AI and Green Jobs","journal":"Technological Forecasting and Social Change","cite":"214, Article 124042","doi":"https://doi.org/10.1016/j.techfore.2025.124042","summary":"Analyzing roughly 11 million UK online job vacancies (2018–2024), the authors document rising skill-based hiring language and declining university-degree requirements specifically for AI and green-economy roles, and quantify wage premiums for AI skills relative to degree credentials. Uses large-scale computational text analysis of job postings rather than survey or experimental methods.","relevance":"Not an I-O psychology journal, but supplies large-scale labor-market evidence substantiating the skills-based hiring trend discussed qualitatively in Jooss et al.; useful as a computational/economics counterpoint. Peer-reviewed management/forecasting journal; verified via ScienceDirect and repec listing.","contribution":"Large-scale computational text analysis of job postings tracking real-time shifts in credentialing versus skills language.","uses":"Debate/critique reading pairing quantitative labor-economics evidence against I-O theory papers; example of computational social science methods for a methods-focused week.","cluster":"Automation/robotics exposure and pay transparency/compensation — two understudied future-of-work threads not yet covered in the digest","themes":["AI \u0026 Future of Work","Assessment \u0026 Selection","Training \u0026 Development"]},{"date":"2026-07-10","topic":"Pay Transparency \u0026 Compensation","authors":"Snider, J. B., Scott, K. L., \u0026 Mulvey, P. W.","year":"2025","title":"The Hidden Costs of Pay Transparency: The Development of a Model","journal":"Compensation \u0026 Benefits Review","cite":"Advance online publication (vol./issue not yet assigned)","doi":"https://doi.org/10.1177/08863687251399485","summary":"A conceptual paper developing a theoretical model of the 'hidden costs' of pay transparency policies, addressing negative organizational and employee consequences (e.g., social comparison, morale effects, retention risk) that have received less attention than transparency's benefits. Integrates compensation, justice, and social-comparison theories to propose boundary conditions under which transparency backfires; no new data reported.","relevance":"Balances the mostly pro-transparency practitioner narrative with a theory-driven treatment of downside risk — directly relevant to I-O fairness/justice and compensation topics.","contribution":"Theoretical model specifying mechanisms and boundary conditions for negative consequences of pay transparency.","uses":"Debate/critique reading; pairs with Fulmer et al. (2023) review and Henn et al. (2025) measure below. Note: publication year listed as 2025 (OnlineFirst) by some sources and 2026 by others — verify final print year before citing.","cluster":"Automation/robotics exposure and pay transparency/compensation — two understudied future-of-work threads not yet covered in the digest","themes":["Employment Relationships \u0026 Gig Work"]},{"date":"2026-07-10","topic":"Pay Transparency \u0026 Compensation — Methods","authors":"Henn, C. M., Neck, C. B., \u0026 Houghton, J. D.","year":"2025","title":"The Pay Information Awareness Questionnaire (PIAQ): A Comprehensive Measure of Pay Transparency","journal":"Compensation \u0026 Benefits Review","cite":"Advance online publication (vol./issue not yet assigned)","doi":"https://doi.org/10.1177/08863687241304017","summary":"Develops and validates the Pay Information Awareness Questionnaire (PIAQ), a multidimensional self-report measure of employees' awareness of pay-related information (own pay determination, others' pay, pay processes). Scale-development procedures across multiple samples establish factor structure and nomological network with related constructs, positioning PIAQ as a more precise operationalization of 'pay transparency' than prior single-item measures.","relevance":"Fills a methods gap for I-O/HR researchers studying pay transparency empirically; complements the conceptual Snider et al. model with an instrument for testing it.","contribution":"New validated multidimensional measure (PIAQ) of pay transparency awareness.","uses":"Methods reading; useful for students designing compensation-related thesis or dissertation measures.","cluster":"Automation/robotics exposure and pay transparency/compensation — two understudied future-of-work threads not yet covered in the digest","themes":["Employment Relationships \u0026 Gig Work","Big Data \u0026 Methods"]},{"date":"2026-07-10","topic":"Pay Transparency \u0026 Compensation — Review","authors":"Fulmer, I. S., Gerhart, B., \u0026 Kim, J. H.","year":"2023","title":"Compensation and Performance: A Review and Recommendations for the Future","journal":"Personnel Psychology","cite":"76(2), 687–718","doi":"https://doi.org/10.1111/peps.12583","summary":"Synthesizes three decades of compensation research published in Personnel Psychology, Journal of Applied Psychology, and Academy of Management Journal, focusing on pay-for-performance and pay communication/transparency. Identifies where empirical consensus exists (e.g., incentive effects on individual performance) and where findings remain mixed or under-theorized (e.g., pay transparency, team-based pay), closing with a forward research agenda.","relevance":"Provides the foundational, citation-anchoring review needed to contextualize the newer pay-transparency papers above within the broader compensation literature central to HRM and I-O psychology.","contribution":"Comprehensive, journal-scoped review identifying gaps and setting a forward research agenda for compensation science.","uses":"Required background/review reading to open a compensation or pay-transparency discussion; strong lit-review citation source.","cluster":"Automation/robotics exposure and pay transparency/compensation — two understudied future-of-work threads not yet covered in the digest","themes":["Employment Relationships \u0026 Gig Work"]},{"date":"2026-07-09","topic":"Leadership in the Digital \u0026 AI Era","authors":"Avolio, B. J., Kahai, S., \u0026 Dodge, G. E.","year":"2000","title":"E-leadership: Implications for theory, research, and practice","journal":"The Leadership Quarterly","cite":"11(4), 615–668","doi":"https://doi.org/10.1016/S1048-9843(00)00062-X","summary":"Foundational theory paper proposing e-leadership as a construct describing leadership processes mediated by advanced information technology (AIT). Uses Adaptive Structuration Theory to argue leadership and technology mutually shape one another in virtual contexts. Proposes a typology distinguishing leadership of, through, and for AIT and lays out a research agenda for technology-mediated leadership that anticipated much of today's digital/AI leadership literature.","relevance":"Establishes the theoretical vocabulary (e-leadership) that underlies nearly all subsequent research on leadership in remote, virtual, and now AI-augmented work contexts — essential grounding for the seminar's leadership thread.","contribution":"Introduced e-leadership as a distinct theoretical construct and a structuration-based framework linking leadership and technology.","uses":"Required/foundational reading; lit-review anchor for any unit on virtual, digital, or technology-mediated leadership.","cluster":"Leadership in the Digital \u0026 AI Era (new topic thread — Leadership Quarterly + adjacent journals)","themes":["AI \u0026 Future of Work","Leadership"]},{"date":"2026-07-09","topic":"Leadership in the Digital \u0026 AI Era","authors":"Larson, L. E., \u0026 DeChurch, L. A.","year":"2020","title":"Leading teams in the digital age: Four perspectives on technology and what they mean for leading teams","journal":"The Leadership Quarterly","cite":"31(1), 101377","doi":"https://doi.org/10.1016/j.leaqua.2019.101377","summary":"Integrative review proposing four perspectives on technology's role in team leadership: technology as context, as sociomaterial, as creation medium, and as teammate. Synthesizes research spanning online communities, crowds, flash teams, and human–AI/robot teams to reconceptualize what 'leading a team' means once technology is deeply embedded in team processes. Closes with a forward-looking agenda anticipating AI teammates as a distinct leadership challenge.","relevance":"Bridges classic team-leadership theory with emerging human-AI teaming research, making it a natural pivot point between the seminar's leadership content and its human-AI collaboration content.","contribution":"Novel four-perspective typology reframing technology's role in leadership research from mere tool to potential teammate.","uses":"Recommended reading; strong discussion anchor for debating the 'AI-as-teammate' framing.","cluster":"Leadership in the Digital \u0026 AI Era (new topic thread — Leadership Quarterly + adjacent journals)","themes":["AI \u0026 Future of Work","Leadership","Teams \u0026 Collaboration"]},{"date":"2026-07-09","topic":"Leadership in the Digital \u0026 AI Era","authors":"Ernst, B. A., Banks, G. C., Loignon, A. C., Frear, K. A., Williams, C. E., Arciniega, L. M., Gupta, R. K., Kodydek, G., \u0026 Subramanian, D.","year":"2021","title":"Virtual charismatic leadership and signaling theory: A prospective meta-analysis in five countries","journal":"The Leadership Quarterly","cite":"33(5), 101541","doi":"https://doi.org/10.1016/j.leaqua.2021.101541","summary":"Preregistered, multi-study, multi-country investigation (US, Austria, France, India, Mexico) testing whether charismatic leadership tactics translate into virtual communication channels using signaling theory. Charismatic tactics showed a much smaller performance effect in virtual (d ≈ 0.01–0.21) versus face-to-face settings (d = 0.52), though effects on extra-role engagement persisted across contexts. One of the largest open-science, prospective (pre-registered) meta-analyses in leadership research to date.","relevance":"Provides rigorous, cross-cultural empirical evidence on whether traditional leadership behaviors 'translate' into virtual/technology-mediated work — directly relevant to remote and hybrid work debates in the seminar.","contribution":"Methodological exemplar of prospective (pre-registered) meta-analysis design; first large-scale cross-cultural test of virtual charismatic signaling.","uses":"Methods reading (prospective meta-analysis design) and empirical reading for a remote/virtual leadership discussion.","cluster":"Leadership in the Digital \u0026 AI Era (new topic thread — Leadership Quarterly + adjacent journals)","themes":["AI \u0026 Future of Work","Leadership"]},{"date":"2026-07-09","topic":"Leadership in the Digital \u0026 AI Era","authors":"Liu, Y., et al. [full author byline needs verification]","year":"2025","title":"AI-Augmented Leadership: How, Why, and When Leaders' Collaboration With AI Enhances Team Performance","journal":"Journal of Organizational Behavior","cite":"Advance online publication, pp. 1–27","doi":"https://doi.org/10.1002/job.70070","summary":"Uses two multi-source, multi-wave field surveys to test how leaders' collaboration with AI tools affects team performance. Team reflexivity and team role-breadth self-efficacy mediate the relationship between leader–AI collaboration and team performance, and the studies identify boundary conditions under which AI augmentation helps versus fails to help teams. One of the first empirically grounded models of 'AI-augmented leadership' as distinct from purely human or purely algorithmic leadership.","relevance":"Direct empirical test of AI-augmented leadership that connects classic leadership/team mediators to novel AI-collaboration constructs — core, current future-of-work content.","contribution":"New empirical construct and mediating mechanisms (team reflexivity, role-breadth self-efficacy) explaining leader–AI collaboration effects on team performance.","uses":"Recommended reading; strong example of a contemporary empirical design combining leadership and AI-collaboration variables.","cluster":"Leadership in the Digital \u0026 AI Era (new topic thread — Leadership Quarterly + adjacent journals)","themes":["AI \u0026 Future of Work","Leadership","Teams \u0026 Collaboration"]},{"date":"2026-07-09","topic":"Leadership in the Digital \u0026 AI Era","authors":"D'Innocenzo, L., Mathieu, J. E., \u0026 Kukenberger, M. R.","year":"2016","title":"A meta-analysis of different forms of shared leadership–team performance relations","journal":"Journal of Management","cite":"42(7), 1964–1991","doi":"https://doi.org/10.1177/0149206314525205","summary":"Meta-analysis of 42 independent samples testing how different forms of shared leadership (traditional vs. new-genre) relate to team performance, and how team-level moderators (task interdependence, team tenure) and measurement type shape effect sizes. Shared new-genre leadership (e.g., transformational/charismatic) shows a stronger performance relationship (ρ = .34) than shared traditional leadership (ρ = .18). A foundational quantitative synthesis for distributed/shared-leadership models increasingly relevant to flatter, technology-enabled team structures.","relevance":"Distributed and shared-leadership models are central to understanding how leadership is reorganized in flatter, tech-enabled, virtual, and hybrid team structures discussed in the future-of-work seminar.","contribution":"Quantitative synthesis establishing boundary conditions (task interdependence, leadership type, measurement type) for shared-leadership effectiveness.","uses":"Methods/meta-analysis exemplar; foundational reading for a shared/distributed leadership discussion.","cluster":"Leadership in the Digital \u0026 AI Era (new topic thread — Leadership Quarterly + adjacent journals)","themes":["AI \u0026 Future of Work","Leadership","Teams \u0026 Collaboration"]},{"date":"2026-07-09","topic":"Leadership in the Digital \u0026 AI Era","authors":"Hoch, J. E., \u0026 Kozlowski, S. W. J.","year":"2014","title":"Leading virtual teams: Hierarchical leadership, structural supports, and shared team leadership","journal":"Journal of Applied Psychology","cite":"99(3), 390–403","doi":"https://doi.org/10.1037/a0030264","summary":"Field study of 101 virtual teams comparing the relative influence of traditional hierarchical leadership, structural supports (e.g., defined roles, standardized procedures), and shared team leadership on team performance. As virtuality increases, the effect of hierarchical leadership on performance weakens while shared leadership and structural supports become relatively more important. A widely cited empirical anchor establishing boundary conditions for effective leadership under high virtuality.","relevance":"Core empirical evidence for how leadership effectiveness levers shift as teams move toward remote/virtual/technology-mediated configurations — a central future-of-work theme.","contribution":"Empirically demonstrates virtuality as a boundary condition that shifts the relative value of hierarchical versus shared/structural leadership levers.","uses":"Required/foundational reading; strong empirical example for teaching virtual team leadership.","cluster":"Leadership in the Digital \u0026 AI Era (new topic thread — Leadership Quarterly + adjacent journals)","themes":["AI \u0026 Future of Work","Remote \u0026 Hybrid Work","Leadership","Teams \u0026 Collaboration"]},{"date":"2026-07-09","topic":"Leadership in the Digital \u0026 AI Era","authors":"Glikson, E., \u0026 Woolley, A. W.","year":"2020","title":"Human trust in artificial intelligence: Review of empirical research","journal":"Academy of Management Annals","cite":"14(2), 627–660","doi":"https://doi.org/10.5465/annals.2018.0057","summary":"Comprehensive review synthesizing two decades of empirical research across disciplines on the antecedents of human trust in AI, organized around AI's form of representation (robotic, virtual, embedded) and level of perceived machine intelligence. Proposes an integrative framework distinguishing cognitive and emotional trust processes and shows how transparency, reliability, and anthropomorphism shape trust formation. Widely cited entry point into the trust-in-AI literature relevant to leadership, teaming, and technology adoption.","relevance":"Trust in AI systems is a prerequisite for effective AI-augmented leadership and human-AI teaming, making this a conceptual bridge between the seminar's leadership content and its broader human-AI collaboration content.","contribution":"Integrative, multi-disciplinary framework of trust antecedents organized by AI representation type and perceived machine intelligence level.","uses":"Review/background reading; strong lit-review anchor connecting leadership, teaming, and trust literatures.","cluster":"Leadership in the Digital \u0026 AI Era (new topic thread — Leadership Quarterly + adjacent journals)","themes":["AI \u0026 Future of Work","Leadership"]},{"date":"2026-07-08","topic":"Big Data \u0026 Digital Traces at Work","authors":"Guzzo, R. A., Fink, A. A., King, E., Tonidandel, S., \u0026 Landis, R. S.","year":"2015","title":"Big Data Recommendations for Industrial–Organizational Psychology","journal":"Industrial and Organizational Psychology: Perspectives on Science and Practice","cite":"8(4), 491–508","doi":"https://doi.org/10.1017/iop.2015.76","summary":"This focal article evaluates the promise and pitfalls of big data for I-O psychology, arguing that data volume, velocity, and variety challenge traditional psychometric and sampling assumptions. The authors offer 'stepping stones' rather than fixed standards, addressing measurement validity, privacy, and the risk of atheoretical data mining. They call for I-O psychologists to actively shape big-data practice rather than cede the space to other disciplines. The piece anchors an extensive set of peer commentaries in the same issue.","relevance":"Sets the foundational agenda for how I-O psychology should engage with organizational big data, directly framing debates about validity, theory-building, and disciplinary boundaries.","contribution":"Articulates core tensions between traditional psychometric rigor and exploratory big-data analytics in organizational research.","uses":"Opening seminar discussion piece; framing debate on big data vs. traditional I-O methods; lit review anchor.","cluster":"Big Data, Digital Traces \u0026 Social Media at Work + Vocational Interests / Person-Environment Fit","themes":["Big Data \u0026 Methods"]},{"date":"2026-07-08","topic":"Big Data \u0026 Digital Traces at Work","authors":"McFarland, L. A., \u0026 Ployhart, R. E.","year":"2015","title":"Social Media: A Contextual Framework to Guide Research and Practice","journal":"Journal of Applied Psychology","cite":"100(6), 1653–1677","doi":"https://doi.org/10.1037/a0039244","summary":"This theoretical article argues that social media should be understood as a distinct organizational context—characterized by unique discrete and ambient stimuli—rather than merely a new communication technology. The authors build a contextual framework showing how social media alters person-centered theories of behavior, cognition, and affect at work. They derive testable propositions about how social media contexts shape recruitment, socialization, performance, and misconduct. The framework has become a standard citation for organizing social-media-at-work research.","relevance":"Provides the core theoretical scaffolding I-O researchers use to study social media's effects on organizational behavior, directly relevant to digital traces and social platforms at work.","contribution":"Introduces a context-based theoretical framework distinguishing social media from other digital and face-to-face contexts.","uses":"Required theoretical reading; framework for student research proposals; lit review citation.","cluster":"Big Data, Digital Traces \u0026 Social Media at Work + Vocational Interests / Person-Environment Fit","themes":["Big Data \u0026 Methods"]},{"date":"2026-07-08","topic":"Big Data \u0026 Digital Traces at Work","authors":"Behrend, T. S., Ravid, D. M., \u0026 Thapa, S.","year":"2024","title":"Implications of Social Media for a Changing Work Landscape","journal":"Annual Review of Organizational Psychology and Organizational Behavior","cite":"11, 337–361","doi":"https://doi.org/10.1146/annurev-orgpsych-110721-041023","summary":"This review synthesizes a decade of research on how social media has reshaped organizational behavior and HRM practices, covering recruitment, selection, socialization, performance, and employee well-being. The authors organize findings around social media's dual role as both a data source (digital traces) and a work context that shapes employee experience. They highlight methodological advances and persistent ethical concerns, including privacy, consent, and algorithmic bias in social-media-based assessment. The review closes with an agenda for integrating social media research into mainstream I-O theory.","relevance":"Offers an up-to-date, integrative overview connecting digital traces, social media, and organizational outcomes—an ideal recent complement to older foundational pieces on this topic.","contribution":"Synthesizes and updates a decade of dispersed literature into a single organizing review with a forward-looking research agenda.","uses":"Recommended reading for current state-of-the-field overview; grant/lit review background; teaching updated framework alongside McFarland \u0026 Ployhart (2015).","cluster":"Big Data, Digital Traces \u0026 Social Media at Work + Vocational Interests / Person-Environment Fit","themes":["Big Data \u0026 Methods"]},{"date":"2026-07-08","topic":"Big Data \u0026 Digital Traces at Work","authors":"Van Iddekinge, C. H., Lanivich, S. E., Roth, P. L., \u0026 Junco, E.","year":"2016","title":"Social Media for Selection? Validity and Adverse Impact Potential of a Facebook-Based Assessment","journal":"Journal of Management","cite":"42(7), 1811–1835","doi":"https://doi.org/10.1177/0149206313515524","summary":"In this empirical study, recruiters rated the Facebook profiles of college students who were simultaneously applying for full-time jobs, and these ratings were examined as predictors of job performance, turnover, and other criteria one year later. Results showed Facebook-based ratings had little criterion-related validity and showed evidence of potential adverse impact against racial minorities and older applicants. The study is among the first to test actual predictive validity of social media screening rather than relying on perceptions or intentions. It raises significant legal and ethical concerns about using unstructured social media review in hiring.","relevance":"Provides rigorous empirical evidence directly bearing on the validity and fairness of using digital trace data (social media profiles) in personnel decisions.","contribution":"First large-sample predictive-validity test of Facebook-based hiring assessments against actual job outcomes.","uses":"Empirical/methods reading; debate/critique reading on digital traces in selection; supports discussion of legal risk and adverse impact.","cluster":"Big Data, Digital Traces \u0026 Social Media at Work + Vocational Interests / Person-Environment Fit","themes":["Assessment \u0026 Selection","Diversity, Equity \u0026 Inclusion","Big Data \u0026 Methods"]},{"date":"2026-07-08","topic":"Big Data \u0026 Digital Traces at Work","authors":"Oswald, F. L., Behrend, T. S., Putka, D. J., \u0026 Sinar, E.","year":"2020","title":"Big Data in Industrial-Organizational Psychology and Human Resource Management: Forward Progress for Organizational Research and Practice","journal":"Annual Review of Organizational Psychology and Organizational Behavior","cite":"7, 505–533","doi":"https://doi.org/10.1146/annurev-orgpsych-032117-104553","summary":"This review takes stock of five years of progress since Guzzo et al.'s (2015) foundational big-data agenda, examining new data sources (e.g., wearables, digital traces, text data), analytic techniques (machine learning), and validity/ethics challenges facing I-O psychology. The authors discuss how big data intersects with traditional psychometrics, highlighting both opportunities for richer measurement and risks of reduced construct validity and privacy violations. They provide concrete recommendations for integrating big-data methods into rigorous organizational science. The review serves as an update and expansion of the 2015 'Big Data Recommendations' debate.","relevance":"Directly extends and updates the Guzzo et al. (2015) foundational piece, giving students a before-and-after view of big data debates in I-O psychology.","contribution":"Synthesizes methodological advances in big data analytics (e.g., machine learning, natural language processing) with critical evaluation of validity and ethics.","uses":"Pairs with Guzzo et al. (2015) for a compare/contrast discussion; methods reading; lit review anchor for big-data methodology.","cluster":"Big Data, Digital Traces \u0026 Social Media at Work + Vocational Interests / Person-Environment Fit","themes":["Big Data \u0026 Methods"]},{"date":"2026-07-08","topic":"Big Data \u0026 Digital Traces at Work","authors":"Russell, E., Jackson, T. W., \u0026 Fullman, M.","year":"2024","title":"Getting on Top of Work-Email: A Systematic Review of 25 Years of Research to Understand Effective Work-Email Activity","journal":"Journal of Occupational and Organizational Psychology","cite":"97(1), 74–103","doi":"https://doi.org/10.1111/joop.12462","summary":"This systematic review synthesizes 25 years of research (62 empirical papers) on work-email as a digital-trace behavior, examining how patterns of email use relate to well-being and performance. The authors find that existing research is fragmented across disciplines and lacks a unifying framework linking email activity to outcomes. They propose an integrative model distinguishing effective versus problematic email habits and identify email metadata (timing, volume, response latency) as an underused behavioral trace. The review highlights email as a naturally occurring digital trace with strong potential for organizational research.","relevance":"Demonstrates how a ubiquitous digital communication trace (email) has been studied as behavioral data in occupational psychology, extending the digital-traces theme beyond social media.","contribution":"First cross-disciplinary systematic review unifying email research and proposing a framework linking email activity metadata to well-being/performance outcomes.","uses":"Recommended reading connecting communication metadata to digital-trace methods; useful for methods discussion and future research ideas.","cluster":"Big Data, Digital Traces \u0026 Social Media at Work + Vocational Interests / Person-Environment Fit","themes":["Technostress \u0026 Digital Demands","Big Data \u0026 Methods"]},{"date":"2026-07-08","topic":"Vocational Interests \u0026 Person-Environment Fit","authors":"Van Iddekinge, C. H., Roth, P. L., Putka, D. J., \u0026 Lanivich, S. E.","year":"2011","title":"Are You Interested? A Meta-Analysis of Relations Between Vocational Interests and Employee Performance and Turnover","journal":"Journal of Applied Psychology","cite":"96(6), 1167–1194","doi":"https://doi.org/10.1037/a0024343","summary":"This meta-analysis synthesizes decades of research on vocational interests as predictors of job performance and turnover, correcting for methodological artifacts across primary studies. Results show that interest-outcome validity is substantially larger when interest measures are tailored to the specific job or vocation rather than generic RIASEC scales. The study challenges the historical dismissal of interests as weak predictors, showing they add incremental validity over cognitive ability and personality for certain criteria. It reshaped how organizational researchers and practitioners think about interest measurement in selection and career contexts.","relevance":"Foundational meta-analytic evidence establishing vocational interests as practically useful predictors of work outcomes, central to vocational psychology within the I-O tradition.","contribution":"Demonstrates that interest-criterion validity depends heavily on the specificity/job-relevance of the interest measure used.","uses":"Required meta-analysis reading; grounds discussion of interest measurement in selection and career counseling; lit review citation.","cluster":"Big Data, Digital Traces \u0026 Social Media at Work + Vocational Interests / Person-Environment Fit","themes":["Careers \u0026 Vocational Behavior","Turnover \u0026 Retention"]},{"date":"2026-07-08","topic":"Vocational Interests \u0026 Person-Environment Fit","authors":"Chu, C., Hoff, K. A., Liu, Z., Heimpel, N. F., Greco, A., Oswald, F. L., \u0026 Rounds, J.","year":"2025","title":"Interest Fit Beyond the RIASEC: The Comprehensive Assessment of Basic Interests—O*NET (CABIN-NET)","journal":"Journal of Career Assessment","cite":"Advance online publication (Vol. 34, 2026)","doi":"https://doi.org/10.1177/10690727251322520","summary":"This methods article extends vocational interest assessment beyond the six broad RIASEC domains by validating a hierarchical, 20-basic-interest measure (CABIN-NET) mapped onto O*NET occupational data. The authors demonstrate that basic interest scales offer more precise person-vocation fit information than broad RIASEC scores alone, particularly for distinguishing among occupations within the same RIASEC type. Using large validation samples, they show improved incremental prediction of occupational fit and career outcomes. The measure is designed for integration with O*NET's public occupational database, enhancing practical applicability for career counseling and research.","relevance":"Extends classic vocational interest theory with a modern, more granular measurement approach, directly relevant to person-vocation fit and career assessment in I-O and vocational psychology.","contribution":"Introduces and validates a 20-dimension basic-interest measure that improves on broad RIASEC-only approaches to person-vocation fit.","uses":"Recent methods reading; complements Liu et al. (2026, already in the digest) on whole-person fit; useful for teaching contemporary interest assessment tools.","cluster":"Big Data, Digital Traces \u0026 Social Media at Work + Vocational Interests / Person-Environment Fit","themes":["Assessment \u0026 Selection","Careers \u0026 Vocational Behavior"]},{"date":"2026-07-07","topic":"AI-Based Assessment / Vocational \u0026 Career Fit","authors":"Liu, Z., Hoff, K. A., Chu, C., Oswald, F. L., \u0026 Rounds, J.","year":"2024","title":"Toward Whole-Person Fit Assessment: Integrating Interests, Values, Skills, Knowledge, and Personality Using the Occupational Information Network (O*NET)","journal":"Journal of Applied Psychology","cite":"Advance online publication (2024); print 2025","doi":"https://doi.org/10.1037/apl0001232","summary":"This methodological/empirical paper develops and validates a 'whole-person' approach to person-occupation fit assessment that simultaneously integrates interests, values, skills, knowledge, and personality using O*NET occupational data, rather than relying on single individual-difference domains as prior fit measures have done. The authors demonstrate how combining these domains yields more comprehensive and predictive fit indices for career exploration and selection contexts. Results show incremental validity of the multidimensional approach over single-domain fit measures for predicting career-relevant outcomes.","relevance":"Central to I-O and vocational psychology's assessment and career-counseling literatures; offers a data-rich, multidimensional alternative to traditional single-domain (e.g., interest-only) fit models increasingly relevant as AI-driven matching tools proliferate in hiring and career platforms.","contribution":"Advances person-environment fit theory by operationalizing 'whole-person' fit computationally via O*NET, bridging vocational psychology measurement traditions with large-scale occupational databases usable in AI-assisted career tools.","uses":"Strong methods reading for courses on assessment/selection; useful in lit reviews on person-job/person-occupation fit; illustrates how O*NET data can underpin AI-based career-matching algorithms for future research or system design.","cluster":"Career Development, Skill Formation \u0026 Human-AI Collaboration in Management","themes":["AI \u0026 Future of Work","Assessment \u0026 Selection","Careers \u0026 Vocational Behavior"]},{"date":"2026-07-07","topic":"Workforce Reskilling \u0026 Lifelong Learning","authors":"Lyndgaard, S. F., Storey, R. A., \u0026 Kanfer, R.","year":"2024","title":"Technological Support for Lifelong Learning: The Application of a Multilevel, Person-Centric Framework","journal":"Journal of Vocational Behavior","cite":"153, 104027","doi":"https://doi.org/10.1016/j.jvb.2024.104027","summary":"This theoretical article proposes an integrated, multilevel person-centric framework describing how technology (including AI-enabled tools) can support lifelong learning processes—spanning skill acquisition, maintenance, and renewal—across a worker's career. The authors argue that prior integration of learning technologies into workplace lifelong-learning contexts has been largely atheoretical and unsystematic, and they offer a structured model linking individual, contextual, and temporal factors. The framework is intended to guide both future empirical research and organizational design of technology-supported learning systems.","relevance":"Directly relevant to vocational psychology and workforce development scholarship on how organizations and individuals can leverage technology for continuous skill development amid rapid technological change, including AI.","contribution":"Provides one of the first theory-driven, multilevel frameworks explicitly linking learning technology, self-regulation, and lifelong learning processes—filling a conceptual gap between adult learning theory and workplace technology adoption research.","uses":"Strong theoretical/foundational reading for seminar discussion on reskilling and lifelong learning; useful for framing dissertation or grant proposals on technology-enabled training; complements empirical training-transfer literature.","cluster":"Career Development, Skill Formation \u0026 Human-AI Collaboration in Management","themes":["Training \u0026 Development"]},{"date":"2026-07-07","topic":"Career Development / Sustainable Careers","authors":"Van der Heijden, B. I. J. M., De Vos, A., Akkermans, J., Spurk, D., Semeijn, J., Van der Velde, M., \u0026 Fugate, M.","year":"2020","title":"Sustainable Careers Across the Lifespan: Moving the Field Forward","journal":"Journal of Vocational Behavior","cite":"117, 103344","doi":"https://doi.org/10.1016/j.jvb.2019.103344","summary":"This foundational theoretical article introduces and synthesizes a special issue on sustainable careers, articulating a conceptual model of career sustainability built around health, happiness, and productivity dimensions across the working lifespan. The authors review contextual (organizational, societal) and individual antecedents of sustainable careers and outline an agenda for future research addressing how careers can remain adaptive and meaningful amid disruption, including technological change. It has become a widely cited anchor for the sustainable-careers literature within vocational and career psychology.","relevance":"Foundational to the careers and vocational behavior literature; provides the conceptual scaffolding against which newer questions about AI-driven disruption, career sustainability, and lifelong employability can be examined.","contribution":"Establishes the tripartite (health, happiness, productivity) model of career sustainability and consolidates a fragmented literature into a coherent research agenda, now widely used as a theoretical anchor in career-development scholarship.","uses":"Excellent foundational/background reading to open a unit on future careers; useful for theory-building in proposals on career sustainability; pairs well with newer AI-and-careers empirical work for a historical-to-current arc.","cluster":"Career Development, Skill Formation \u0026 Human-AI Collaboration in Management","themes":["Careers \u0026 Vocational Behavior","Aging \u0026 Generations","Job Design, Crafting \u0026 Motivation"]},{"date":"2026-07-07","topic":"Career Development / AI Skills \u0026 Career Sustainability","authors":"Ahmad, B., \u0026 Bilal, S.","year":"2025","title":"Knowledge of AI as a Future Work Skill for Career Sustainability","journal":"Journal of Career Development","cite":"52(2), 134-152","doi":"https://doi.org/10.1177/08948453241307384","summary":"This empirical study examines whether employees' knowledge of AI functions as a future work skill that contributes to career sustainability, testing person-job fit as a mediating mechanism. Using survey data, the authors find that AI knowledge is positively associated with career sustainability both directly and indirectly through improved person-job fit. The study frames AI literacy as an increasingly essential competency for maintaining a sustainable, adaptable career trajectory in a technology-disrupted labor market.","relevance":"Directly relevant to vocational psychology and career-development research on how emerging technology-specific competencies (AI knowledge) relate to established career-sustainability and person-job fit constructs.","contribution":"Empirically links a novel construct (AI knowledge/literacy) to the established career-sustainability framework via person-job fit, extending sustainable-careers theory into the AI era.","uses":"Useful empirical companion to the Van der Heijden et al. (2020) foundational piece; supports lit reviews connecting AI literacy to career outcomes; relevant for discussion of AI-skill development in career counseling contexts.","cluster":"Career Development, Skill Formation \u0026 Human-AI Collaboration in Management","themes":["AI \u0026 Future of Work","Careers \u0026 Vocational Behavior","Job Design, Crafting \u0026 Motivation"]},{"date":"2026-07-07","topic":"Human-AI Collaboration \u0026 Algorithmic Management","authors":"Hillebrand, L., Raisch, S., \u0026 Schad, J.","year":"2025","title":"Managing With Artificial Intelligence: An Integrative Framework","journal":"Academy of Management Annals","cite":"19(1), 343-375","doi":"https://doi.org/10.5465/annals.2022.0072","summary":"This review article integrates two largely separate literatures on managing with AI—human-AI collaboration (focused on executive/strategic decision-making) and algorithmic management (focused on managerial control of workers)—into a unified conceptual framework. The authors map how AI is used across different managerial tasks and levels, identify points of overlap and divergence between the two literatures, and propose an agenda for integrating research on AI's dual role as both a decision-support tool and a control mechanism. The framework helps clarify terminology and scope conditions across a fragmented body of management research on AI.","relevance":"Highly relevant to I-O/OBHR scholarship bridging human-AI collaboration and algorithmic management—two subfields central to understanding both AI-augmented knowled
