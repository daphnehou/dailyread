he authors identify decontextualization—the failure of algorithms to capture qualitative aspects of work—as a key mechanism affecting perceptions of fairness and privacy. Trust and fairness perceptions mediate the relationship between algorithmic surveillance and compliance behavior, while privacy concerns moderate these effects, pointing to differential worker responses based on perceived system legitimacy.","relevance":"Directly relevant to I-O psychology topics on surveillance, worker control, privacy, and fairness in digital and platform-based work; ties algorithmic surveillance to established constructs of organizational justice and trust.","contribution":"Extends algorithmic management theory by introducing decontextualization as a novel mechanism; bridges organizational justice and privacy literatures to explain how workers differentiate legitimate oversight from invasive surveillance.","uses":"Core reading for seminar sessions on algorithmic management and surveillance; excellent for discussions of privacy and ethics in digital workplaces; relevant for research on crowdwork and non-standard employment.","cluster":"Algorithmic Management, Surveillance, Work Design \u0026 Vocational Interests","themes":["Algorithmic Management \u0026 Surveillance","Diversity, Equity \u0026 Inclusion"]},{"date":"2026-06-16","topic":"Work Design \u0026 Technology","authors":"Fraccaroli, F., Zaniboni, S., \u0026 Truxillo, D. M.","year":"2024","title":"Challenges in the New Economy: A New Era for Work Design","journal":"Annual Review of Organizational Psychology and Organizational Behavior","cite":"11, 307–335","doi":"https://doi.org/10.1146/annurev-orgpsych-081722-053704","summary":"This comprehensive review examines how technological, demographic, and environmental changes are transforming the nature of work in a 'new economy,' with implications for work design theory and practice. The authors review foundational work design models and then address emerging issues including algorithmic management, gig work, lone work, and increasing workforce diversity. The article concludes with a research agenda and practical guidance for work design interventions in contemporary organizational contexts.","relevance":"Essential reading for I-O psychology seminars on technology and work; provides a theoretically grounded synthesis of how macro-level changes (AI, platform work, globalization) intersect with classic work design frameworks (JCM, WDQ).","contribution":"Updates and extends foundational work design theory to address the new economy; provides a critical bridge between classic I-O models and emerging phenomena like algorithmic management, gig work, and remote work.","uses":"Required background reading for future-of-work seminars; suitable as a foundational reference for literature reviews on work design and technology; valuable for course preparation on job redesign in the AI era.","cluster":"Algorithmic Management, Surveillance, Work Design \u0026 Vocational Interests","themes":["Job Design, Crafting \u0026 Motivation"]},{"date":"2026-06-16","topic":"Electronic Monitoring \u0026 Worker Well-Being","authors":"König, C. J.","year":"2025","title":"Electronic Monitoring at Work","journal":"Annual Review of Organizational Psychology and Organizational Behavior","cite":"12, 321–342","doi":"https://doi.org/10.1146/annurev-orgpsych-110622-060758","summary":"This comprehensive review synthesizes the literature on electronic monitoring (EM) of employees, covering performance, strain, and attitudinal outcomes. The overall effect of EM on performance is near-zero, while small positive correlations with strain and small negative correlations with job attitudes emerge. The author identifies suppression effects—where monitoring's positive and negative mechanisms counterbalance each other—and emphasizes moderating factors including individual traits, job characteristics, and national legal regulations. Future directions include longitudinal designs and open science practices.","relevance":"Directly relevant to I-O psychology and occupational health topics on workplace surveillance, worker well-being, and technology; provides a rigorous, up-to-date synthesis of EM research bridging organizational psychology and labor law perspectives.","contribution":"Introduces a suppression-effect framework to explain why null average EM effects mask meaningful differential processes; synthesizes cross-national legal variation as a key contextual moderator and sets a methodologically rigorous research agenda.","uses":"Essential reading for seminar modules on surveillance and worker monitoring; highly useful for research proposals on digital work environments; valuable for practitioners designing or evaluating monitoring policies.","cluster":"Algorithmic Management, Surveillance, Work Design \u0026 Vocational Interests","themes":["Algorithmic Management \u0026 Surveillance","Well-Being \u0026 Occupational Health"]},{"date":"2026-06-16","topic":"Vocational Interests \u0026 Gender Across Cultures","authors":"Du, Y. Y. L., Wee, S., \u0026 Rounds, J.","year":"2025","title":"Gender Differences in Vocational Interests Across 57 Countries: A Test of the Interest–Gender-Equality Paradox","journal":"Social Psychological and Personality Science","cite":"16(1), 27–44","doi":"https://doi.org/10.1177/19485506241280321","summary":"This large-scale cross-national study (N = 109,460 across 57 countries) tests the 'Interest–Gender-Equality Paradox'—the counterintuitive finding that gender differences in some vocational interests are larger in more gender-equal countries. Using multilevel analyses and Holland's RIASEC model, the authors find that gender differences in Realistic, Investigative, and Social interests increase with national gender equality, while differences in Artistic, Enterprising, and Conventional interests decrease. Biosocial and sociocultural mechanisms are discussed.","relevance":"Directly relevant to vocational psychology and career development research; addresses foundational questions about cross-cultural universality of interest gender differences, with implications for career counseling, assessment equity, and STEM workforce diversity.","contribution":"Offers the largest and most geographically diverse test of the gender-equality paradox in vocational interests to date; clarifies differential patterns across RIASEC dimensions that prior work conflated; advances cross-cultural vocational psychology methodology.","uses":"Core reading for seminars on vocational interests and career choice; valuable for discussions of cross-cultural I-O psychology and assessment fairness; useful background for grant writing on diversity in STEM and career equity.","cluster":"Algorithmic Management, Surveillance, Work Design \u0026 Vocational Interests","themes":["Careers \u0026 Vocational Behavior","Diversity, Equity \u0026 Inclusion"]},{"date":"2026-06-12","topic":"Future of Work \u0026 Employment Relationships","authors":"Dries, N.; Luyckx, J.; Stephan, U.; Collings, D. G.","year":"2025","title":"The Future of Work: A Research Agenda","journal":"Journal of Management","cite":"51(5), 1689–1706","doi":"https://doi.org/10.1177/01492063251320025","summary":"This editorial introduces a special issue on the future of work (FoW), defining FoW as a phenomenon and research area within management and organization studies. The authors review five streams of FoW research and organize avenues for further inquiry around five questions: what, when, who, how, and why. The piece argues for more integrative, longitudinal, and multilevel research to capture the complex forces reshaping work. It charts a forward-looking agenda while acknowledging that FoW is simultaneously a descriptive trend and a normative vision.","relevance":"Provides a conceptual map of the FoW literature directly usable as a framing piece for a graduate seminar on the Future of Work. Engages I-O/OB scholars on what is known and what needs investigation in the changing world of work.","contribution":"Offers a five-question organizing framework (what/when/who/how/why) that synthesizes disparate FoW literatures and provides a tractable research agenda. Published in Journal of Management, it bridges strategic management and I-O/OB perspectives on work transformation.","uses":"Seminar framing piece; syllabus introduction; grant writing context; discussion prompt for Week 1 or overarching themes","cluster":"Careers, Employment Relationships, \u0026 Worker Well-Being","themes":["AI \u0026 Future of Work","Employment Relationships \u0026 Gig Work"]},{"date":"2026-06-12","topic":"Careers \u0026 Career Transitions","authors":"Ibarra, H.; Wittman, S.; Smith, K.","year":"2025","title":"Career Transition and Professional Identity: Dynamic Processes, Multiple Selves, and Nonlinear Trajectories","journal":"Annual Review of Organizational Psychology and Organizational Behavior","cite":"13, 137–163","doi":"https://doi.org/10.1146/annurev-orgpsych-020924-071546","summary":"This review integrates research on career transitions and how professional identity evolves through nonlinear, dynamic processes. The authors identify recurring themes around the role of multiple selves, temporal dynamics, and contextual enablers or constraints during transitions. They review antecedents, processes, and outcomes of identity change during work role changes, proposing a process model. The piece highlights gaps between normative linear career models and the realities of discontinuous contemporary careers.","relevance":"Directly relevant to seminar topics on future of careers, employment relationships, and career development across the lifespan. Connects I-O and vocational psychology literatures on identity, agency, and career change.","contribution":"Proposes a dynamic, multi-selves framework for understanding career transitions that advances beyond trait-based approaches. Bridges career development theory with organizational identity research, useful for both theory and practice.","uses":"Required reading for careers topic; lit review foundational piece; discussion of non-linear career trajectories; teaching case anchor","cluster":"Careers, Employment Relationships, \u0026 Worker Well-Being","themes":["Careers \u0026 Vocational Behavior"]},{"date":"2026-06-12","topic":"Gig Economy \u0026 Employment Relationships","authors":"Wu, D.; Huang, J. L.","year":"2024","title":"Gig work and gig workers: An integrative review and agenda for future research","journal":"Journal of Organizational Behavior","cite":"45(2), 183–208","doi":"https://doi.org/10.1002/job.2775","summary":"This integrative review synthesizes the growing literature on gig workers using four theoretical approaches: resource-based, identity-based, relational, and contextual perspectives. It reviews drivers of gig work entry, psychological and behavioral processes, and individual outcomes. The authors identify key moderators and propose a research agenda for understanding gig worker experience across diverse platform types.","relevance":"Gig work represents a major shift in employment relationships and career structures central to the future of work. This review provides the theoretical vocabulary and empirical map needed for seminar discussions on non-standard work arrangements.","contribution":"Advances understanding of gig work by applying and integrating multiple theoretical lenses rather than treating gig work as a monolithic category. Sets a clear, structured research agenda published in a top I-O/OB outlet.","uses":"Required reading for employment relationships topic; literature review anchor; theoretical synthesis example; useful for teaching platform labor","cluster":"Careers, Employment Relationships, \u0026 Worker Well-Being","themes":["Employment Relationships \u0026 Gig Work"]},{"date":"2026-06-12","topic":"Gig Economy \u0026 Employment Relationships","authors":"Huang, J. L.; Bowling, N. A.; Wu, D.","year":"2025","title":"Organizational Behavior in the Gig Economy: Contributions, Challenges, and New Directions","journal":"Journal of Organizational Behavior","cite":"46, 973–979","doi":"https://doi.org/10.1002/job.70001","summary":"This editorial introduces a special issue on organizational behavior in the gig economy, summarizing five empirical articles investigating gig work through OB lenses. Covered processes include identity regulation, flow experience, psychological detachment, safety assessments, and algorithmic management. The authors highlight contributions, theoretical tensions, and open questions that remain unresolved in gig OB research.","relevance":"Provides an accessible overview of the current state of OB research on gig workers, useful as a seminar entry point. Connects to broader FoW themes around algorithmic management, worker identity, and nonstandard employment.","contribution":"Synthesizes five recent empirical contributions and outlines critical unresolved questions, serving as a curated guide to the gig OB literature. Pairs well with Wu \u0026 Huang (2024) as a complementary framing piece.","uses":"Seminar introduction to gig work; pairing with Wu \u0026 Huang (2024); teaching discussion anchor; lit review orientation","cluster":"Careers, Employment Relationships, \u0026 Worker Well-Being","themes":["Employment Relationships \u0026 Gig Work"]},{"date":"2026-06-12","topic":"Worker Well-Being \u0026 Work Demands","authors":"Bakker, A. B.; Demerouti, E.; Sanz-Vergel, A.","year":"2023","title":"Job Demands–Resources Theory: Ten Years Later","journal":"Annual Review of Organizational Psychology and Organizational Behavior","cite":"10, 25–53","doi":"https://doi.org/10.1146/annurev-orgpsych-120920-053933","summary":"This review revisits Job Demands–Resources (JD-R) theory ten years after its formalization, synthesizing new empirical findings and theoretical innovations. Four major developments are highlighted: the person × situation approach, multilevel JD-R, proactive JD-R approaches, and the work–home resources model. The authors also address burnout and work engagement as the dual outcome variables of JD-R. Updated meta-analytic evidence supports the theory's core propositions across sectors and cultures.","relevance":"JD-R theory is a cornerstone framework in occupational health psychology and worker well-being research. This review is essential for grounding seminar discussions of burnout, engagement, and work design in the contemporary evidence base.","contribution":"Integrates a decade of empirical and theoretical advances into a cohesive update of JD-R, including multilevel and proactive process extensions. Foundational reading for any course on worker well-being, occupational health, or work design.","uses":"Required background reading for well-being and burnout topic; theoretical anchor; teaching of JD-R model; meta-analytic benchmark","cluster":"Careers, Employment Relationships, \u0026 Worker Well-Being","themes":["Well-Being \u0026 Occupational Health","Job Design, Crafting \u0026 Motivation"]},{"date":"2026-06-12","topic":"Career Development Theory","authors":"Rudolph, C. W.; Zacher, H.; Hirschi, A.","year":"2019","title":"Empirical developments in career construction theory","journal":"Journal of Vocational Behavior","cite":"111, 1–6","doi":"https://doi.org/10.1016/j.jvb.2018.12.003","summary":"This editorial introduces a special issue on empirical developments in career construction theory (CCT), summarizing the state of research on career adaptability, career narratives, and the life theme in Savickas's framework. The authors note that most empirical work has focused narrowly on career adaptability while other CCT propositions remain understudied. They call for more rigorous tests of the full theory, including longitudinal and cross-cultural designs.","relevance":"Career construction theory is a foundational framework in contemporary vocational psychology and is highly relevant to seminar discussions of career development across the lifespan. This piece provides a critical assessment of where the empirical literature stands relative to the theory's propositions.","contribution":"Identifies a critical imbalance in the CCT literature—heavy focus on career adaptability, neglect of narrative and life theme constructs—framing a productive research agenda. Published in JVB as a special issue editorial, it is an efficient entry point for the CCT literature.","uses":"Foundational theory reading for vocational psychology; teaching CCT; identifying gaps for future research proposals; seminar discussion of career adaptability","cluster":"Careers, Employment Relationships, \u0026 Worker Well-Being","themes":["Careers \u0026 Vocational Behavior"]},{"date":"2026-06-10","topic":"Worker Well-Being \u0026 Occupational Health Psychology","authors":"Probst, T., Shoss, M., Bankins, S., Behrend, T., Dragano, N., Jetha, A., Koopman, J., Selenko, E., Tang, P. M., Tay, L., van den Broek, A., \u0026 Vietas, J.","year":"2026","title":"Aligning artificial intelligence with worker health, wellbeing, and safety: An occupational health psychology agenda","journal":"Occupational Health Science","cite":"10(2), 1–36, Article 15","doi":"https://doi.org/10.1007/s41542-026-00262-5","summary":"This compiled set of commentaries argues that AI technologies have profound implications for worker health, safety, and well-being that go beyond capability questions. The commentaries address technostress, job insecurity, algorithmic management, ethics, and OSH training needs. Together, they conclude that AI's impacts are neither inherent nor inevitable — OHP frameworks and values can shape a future of work that prioritizes workers.","relevance":"Directly relevant to I-O and occupational health psychology; frames an OHP research agenda for AI at work, covering key constructs including technostress, job insecurity, and algorithmic management.","contribution":"Establishes a multi-author OHP agenda for AI and work, positioning the field to respond to rapid technological change with empirically grounded frameworks; published in a leading OHP journal in 2026.","uses":"Foundational reading for seminars on AI and worker well-being; useful for framing dissertation proposals and grant applications in OHP; excellent for synthesizing the intersection of AI, health, and work design.","cluster":"AI at Work — well-being, algorithmic management, recruitment, creativity \u0026 human-AI teaming","themes":["AI \u0026 Future of Work","Well-Being \u0026 Occupational Health"]},{"date":"2026-06-10","topic":"Algorithmic Management \u0026 Worker Well-Being","authors":"Bowdler, M., Lahti, H., Jelenko, M., Buresti, G., \u0026 Valtonen, T.","year":"2026","title":"Algorithmic management and psychosocial risks at work: An emerging occupational safety and health challenge","journal":"Scandinavian Journal of Work, Environment \u0026 Health","cite":"52(1), 1–5","doi":"https://doi.org/10.5271/sjweh.4270","summary":"This editorial synthesizes findings from a structured review of 39 studies (2022–2024) on the OSH implications of algorithmic management (ALMA) in platform and traditional workplaces. It shows that ALMA frequently intensifies job demands while depleting key job resources, generating psychosocial risks. Worker participation and transparency are identified as key mitigating strategies, and the authors call for validated assessment tools and longitudinal research.","relevance":"Highly relevant to I-O/OHP research on algorithmic management, surveillance, and worker control; applies JD-R and JD-C-S models to ALMA, bridging classic OHP theory with emerging technology contexts.","contribution":"Grounds an emerging topic (algorithmic management) in established psychosocial risk frameworks; calls for new measurement tools (e.g., AMQ validation) and longitudinal designs — directly actionable for researchers.","uses":"Ideal for teaching on algorithmic management and worker well-being; excellent starting point for literature reviews; useful for policy-relevant grant proposals and OSH research design.","cluster":"AI at Work — well-being, algorithmic management, recruitment, creativity \u0026 human-AI teaming","themes":["Algorithmic Management \u0026 Surveillance","Well-Being \u0026 Occupational Health"]},{"date":"2026-06-10","topic":"AI \u0026 Work — Human-AI Collaboration","authors":"Jia, N., Luo, X., Fang, Z., \u0026 Liao, C.","year":"2024","title":"When and how artificial intelligence augments employee creativity","journal":"Academy of Management Journal","cite":"67(1), 5–32","doi":"https://doi.org/10.5465/amj.2022.0426","summary":"Using a multi-study design including field surveys and experiments, this paper examines when and through what mechanisms AI tools augment employee creativity. Results show that AI augments creativity by providing information breadth and analytical support, but this relationship is moderated by employees' creative self-efficacy and the nature of creative tasks. The paper advances a contingency theory of human-AI creative collaboration.","relevance":"Highly relevant to research on human-AI collaboration, knowledge work, and job design; speaks to I-O questions about how AI changes the nature of creative and knowledge work and the conditions under which it adds value.","contribution":"Publishes the first theoretically grounded empirical model of AI-augmented creativity in AMJ; introduces key moderating conditions (self-efficacy, task type) that advance both theory and practical guidance for AI tool deployment.","uses":"Ideal for seminars on AI and job performance, knowledge work, and human-AI collaboration; useful for framing research on AI in professional and creative roles; good empirical model for dissertation students.","cluster":"AI at Work — well-being, algorithmic management, recruitment, creativity \u0026 human-AI teaming","themes":["AI \u0026 Future of Work","Teams \u0026 Collaboration"]},{"date":"2026-06-10","topic":"Human-AI Collaboration \u0026 Decision Making","authors":"Gonzalez, C., Donahue, K., Goldstein, D. G., Heidari, H., Jalali, M. S., Schelble, B., Singh, A., \u0026 Williams Woolley, A.","year":"2026","title":"Toward a science of human–AI teaming for decision making: A complementarity framework","journal":"PNAS Nexus","cite":"5(3), pgag030","doi":"https://doi.org/10.1093/pnasnexus/pgag030","summary":"This interdisciplinary paper proposes a complementarity framework for human-AI teaming in decision making, integrating insights from cognitive science, AI, human factors, organizational behavior, and ethics. It defines human-AI complementarity as conditions under which teams outperform either humans or AI alone. The framework specifies five design principles: defining goals/constraints, partitioning roles, orchestrating attention, building knowledge infrastructures, and continuous training/evaluation.","relevance":"Relevant to I-O psychology through its organizational behavior and team science components; the complementarity framework is directly applicable to research on human-AI collaboration, team performance, and job design in knowledge work.","contribution":"Offers the most integrative cross-disciplinary framework for human-AI teaming to date; anchors the concept of complementarity and provides actionable design principles — a valuable theoretical foundation for I-O research on AI-augmented teams.","uses":"Excellent for seminars on human-AI collaboration and future of knowledge work; useful as theoretical scaffolding for research on AI-augmented decision-making in organizations; relevant to work design and assessment research.","cluster":"AI at Work — well-being, algorithmic management, recruitment, creativity \u0026 human-AI teaming","themes":["AI \u0026 Future of Work","Teams \u0026 Collaboration"]},{"date":"2026-05-28","topic":"AI \u0026 Occupational Health Psychology","authors":"Vietas, J., Probst, T. M., Shoss, M., Bankins, S., et al.","year":"2026","title":"Aligning Artificial Intelligence with Worker Health, Well-Being, and Safety: An Occupational Health Psychology Agenda","journal":"Occupational Health Science","cite":"10(2), 15","doi":"https://doi.org/10.1007/s41542-026-00262-5","summary":"This compiled commentary article examines the implications of rapidly advancing AI technologies for workers' health, safety, and well-being. Authors explore AI's impacts across topics including technostress, job and occupational insecurity, algorithmic management, ethics, and training needs for future OHP professionals. The commentaries argue that AI's potential effects on workers are neither inherent nor inevitable—they are shaped by human decisions. Together, they make the case that OHP frameworks and values hold promise for shaping a future of work where worker health is paramount.","relevance":"Directly relevant to I-O and occupational health psychology; provides an agenda for how the field should engage AI-related challenges facing workers. Valuable for scholars studying technology, work stress, and employee well-being.","contribution":"Offers a field-defining OHP research agenda for AI, synthesizing multiple expert perspectives on technostress, algorithmic management, ethics, and professional training—filling a notable gap in disciplinary guidance.","uses":"Ideal for course readings on future of work and OHP; foundational for grant proposals on AI and worker health; provides a research roadmap for literature reviews on AI-related job demands.","cluster":"AI, Work Design \u0026 Career Development Across the Lifespan","themes":["AI \u0026 Future of Work","Well-Being \u0026 Occupational Health"]},{"date":"2026-05-28","topic":"AI \u0026 Work Design / Job Crafting","authors":"Xu, F., Qin, J., \u0026 Zhang, D.","year":"2026","title":"Promoting or Preventing? The Influence of Artificial Intelligence Awareness on Employee Job Crafting","journal":"Journal of Applied Behavioral Science","cite":"Advance online publication","doi":"https://doi.org/10.1177/00218863251360852","summary":"This study applies Job Demands-Resources (JD-R) theory to examine how AI awareness in the workplace influences both promotion- and prevention-focused job crafting behaviors. The authors investigate job insecurity and creative process engagement as mediating mechanisms. Results indicate AI awareness has a dual effect—stimulating expansive, seeking-oriented crafting through creative engagement while also triggering protective crafting through job insecurity concerns. The findings clarify when AI awareness promotes versus constrains employee-initiated work redesign.","relevance":"Directly relevant to I-O psychology research on work design, job crafting, and AI adoption. Addresses how employees actively reshape their roles in response to AI-driven change, with implications for career self-management and organizational interventions.","contribution":"Extends JD-R theory to the AI context, demonstrating the dual (approach/avoidance) pathways linking AI awareness to job crafting. Provides empirical grounding for distinguishing promotion-focused from prevention-focused crafting under technological change.","uses":"Useful for teaching on work design and proactive work behavior; relevant for HR practitioners designing AI change communications; informs future research on AI-related job insecurity and employee agency.","cluster":"AI, Work Design \u0026 Career Development Across the Lifespan","themes":["AI \u0026 Future of Work","Job Design, Crafting \u0026 Motivation"]},{"date":"2026-05-28","topic":"Algorithmic Management \u0026 Worker Well-Being","authors":"Zayid, H., Alzubi, A., Berberoğlu, A., \u0026 Khadem, A.","year":"2024","title":"How Do Algorithmic Management Practices Affect Workforce Well-Being? A Parallel Moderated Mediation Model","journal":"Behavioral Sciences","cite":"14(12), 1123","doi":"https://doi.org/10.3390/bs14121123","summary":"Drawing on self-determination theory (SDT) and conservation of resources theory (COR), this cross-sectional survey study (N = 666, manufacturing SMEs in Istanbul) examines how algorithmic management practices (AMPs) affect workforce well-being, with job burnout and perceived threat as parallel mediators and person-job fit as a moderator. AMPs significantly increased job burnout and perceived threat, both of which negatively impacted well-being; the direct effect of AMPs on well-being was non-significant. Person-job fit moderated these relationships, buffering some negative effects. Findings underscore the importance of balancing algorithmic efficiency with human-centric, transparent management practices.","relevance":"Highly relevant to research on technology and work, algorithmic management, and occupational well-being. Addresses a gap in empirical literature by testing the mediating role of burnout and perceived threat under AMP conditions.","contribution":"Integrates SDT and COR theories in a single model to explain how AMPs affect well-being through psychological mechanisms; identifies person-job fit as a key boundary condition with practical implications for HR design.","uses":"Teaching case on algorithmic management and employee outcomes; supports lit reviews on AI-driven HR practices; useful for proposals examining technology, control, and well-being in non-Western manufacturing contexts.","cluster":"AI, Work Design \u0026 Career Development Across the Lifespan","themes":["Algorithmic Management \u0026 Surveillance","Well-Being \u0026 Occupational Health"]},{"date":"2026-05-28","topic":"Career Development / Future Work Self","authors":"Talluri, S. B., Strauss, K., Newman, A., \u0026 Voigt, J.","year":"2025","title":"Future Work Self Salience: A Systematic Review and Future Research Agenda","journal":"Applied Psychology: An International Review","cite":"74(3), e70018","doi":"https://doi.org/10.1111/apps.70018","summary":"This systematic review synthesizes the growing body of research on future work self salience (FWSS)—the extent to which individuals can clearly envision their desired future work identity. The authors review antecedents (e.g., life meaning, role models) and outcomes (e.g., proactive career behaviors, career calling, adaptability) of FWSS and propose a structured research agenda. The review also addresses methodological gaps and boundary conditions such as cultural context, career stage, and temporal dynamics. Findings highlight FWSS as a motivational resource linking self-concept to purposive career action.","relevance":"Core relevance to vocational psychology, career development, and proactive career behavior research. Provides a comprehensive conceptual map of FWSS and situates it within broader theories of career self-regulation and identity.","contribution":"First systematic review of FWSS; establishes a structured research agenda and identifies gaps around measurement, longitudinal dynamics, and cross-cultural validity—enabling next-generation research on career identity and proactivity.","uses":"Ideal foundational reading for courses on career psychology; supports theoretical framing for proposals on career motivation and identity; informs lit reviews connecting future orientation, calling, and career adaptability.","cluster":"AI, Work Design \u0026 Career Development Across the Lifespan","themes":["Careers \u0026 Vocational Behavior"]},{"date":"2026-05-28","topic":"Human-AI Collaboration / Future of Work","authors":"Fügener, A., Walzner, D., \u0026 Gupta, A.","year":"2025","title":"Roles of Artificial Intelligence in Collaboration with Humans: Automation, Augmentation, and the Future of Work","journal":"Management Science","cite":"72(1), 538–557","doi":"https://doi.org/10.1287/mnsc.2024.05684","summary":"This theoretical and empirical paper develops a task-allocation framework for understanding when AI should automate tasks, augment human performance, or leave tasks entirely to humans. The model shows that when both between-task and within-task complementarity exist, AI automates easier tasks, augments humans on tasks with comparable human-AI performance, and humans work alone on difficult tasks. Simulation results demonstrate that this allocation strategy increases average accuracy across tasks while holding human resources constant. Findings have direct implications for job redesign and human resource reallocation in the age of AI.","relevance":"Central to I-O psychology research on human-AI teaming, work design, and the future of work. The task complementarity framework provides a theoretically grounded basis for predicting which jobs and task components are most susceptible to automation versus augmentation.","contribution":"Provides a formal, falsifiable framework for the automation-augmentation distinction, moving beyond qualitative typologies. The model incorporates human resource reallocation—often ignored in prior work—as a critical variable in organizational performance optimization.","uses":"Highly teachable for courses on AI and work; directly applicable to strategic HRM and workforce planning; useful for framing proposals on human-AI teaming and job redesign; supports lit reviews on automation and the future of labor.","cluster":"AI, Work Design \u0026 Career Development Across the Lifespan","themes":["AI \u0026 Future of Work","Teams \u0026 Collaboration"]},{"date":"2026-05-28","topic":"Career Adaptability \u0026 Work Environments","authors":"Herdt, M. E., \u0026 Autin, K. L.","year":"2025","title":"Work Volition and Work Environments: Impacts on Career Adaptability","journal":"Journal of Career Development","cite":"Advance online publication","doi":"https://doi.org/10.1177/08948453251351590","summary":"This study investigates the relationships among work volition, perceived autonomy support from supervisors, cognitive job demands, social support from colleagues, and career adaptability. Results showed that work volition directly predicted autonomy support, and autonomy support partially mediated the relationship between work volition and career adaptability. The study integrates the Psychology of Working Theory (PWT) with career construction theory to explain how constrained agency at work shapes adaptive career resources. Findings suggest that supporting employee autonomy is a key lever for building career adaptability.","relevance":"Relevant to career development, vocational psychology, and occupational health research. Bridges Psychology of Working Theory and career adaptability constructs, which is particularly valuable for scholars studying marginalized workers and contextual constraints on career agency.","contribution":"Novel integration of PWT and career construction theory; demonstrates empirically how structural work conditions (autonomy support, social support) translate into individual career adaptability resources, extending both theoretical frameworks.","uses":"Valuable for courses on career counseling and vocational psychology; supports research proposals on work constraints and career equity; informs interventions targeting supervisor behavior to support adaptive career development.","cluster":"AI, Work Design \u0026 Career Development Across the Lifespan","themes":["Careers \u0026 Vocational Behavior"]}]</script>
<script>
(function(){
"use strict";
var DATA  = JSON.parse(document.getElementById("data").textContent);
var BUILT = "05 Sep 2026, 08:03";
document.getElementById("built").textContent = BUILT;

var $ = function(id){ return document.getElementById(id); };
var feed = $("feed"), qEl = $("q"), topicEl = $("topic"), yrEl = $("yr"), jrEl = $("jr");
var countEl = $("count"), resetEl = $("reset");

/* ---------- searchable blob, built once ---------- */
DATA.forEach(function(a, i){
  a._i = i;
  a._s = [a.title,a.authors,a.journal,a.topic,a.summary,a.relevance,
          a.contribution,a.uses,a.year,a.cite,(a.themes||[]).join(" ")]
          .join(" ").toLowerCase();
});

/* ---------- header stats ---------- */
var days = {}, topics = {}, years = {}, journals = {};
DATA.forEach(function(a){
  if(a.date)  days[a.date]  = 1;
  if(a.year)  years[a.year] = 1;
  if(a.journal) journals[a.journal] = (journals[a.journal] || 0) + 1;
  (a.themes || []).forEach(function(t){ topics[t] = 1; });
});
var dayKeys = Object.keys(days).sort().reverse();
$("s-art").textContent = DATA.length;
$("s-day").textContent = dayKeys.length;
$("s-top").textContent = Object.keys(topics).length;
$("s-upd").textContent = dayKeys.length ? fmtShort(dayKeys[0]) : "—";

Object.keys(topics).sort().forEach(function(t){
  var o = document.createElement("option"); o.value = t; o.textContent = t; topicEl.appendChild(o);
});
Object.keys(years).sort().reverse().forEach(function(y){
  var o = document.createElement("option"); o.value = y; o.textContent = y; yrEl.appendChild(o);
});
/* Journals are ordered by how often they appear, so the outlets that actually
   carry this literature sit at the top of the picker instead of being buried
   alphabetically among 90 entries. */
Object.keys(journals).sort(function(a, b){
  return (journals[b] - journals[a]) || a.localeCompare(b);
}).forEach(function(j){
  var o = document.createElement("option");
  o.value = j; o.textContent = j + "  (" + journals[j] + ")";
  jrEl.appendChild(o);
});

/* ---------- helpers ---------- */
function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function fmtShort(iso){
  var p = String(iso).split("-");
  if(p.length !== 3) return iso;
  var M = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return M[(+p[1]) - 1] + " " + (+p[2]);
}
function fmtLong(iso){
  var p = String(iso).split("-");
  if(p.length !== 3) return iso;
  var d = new Date(+p[0], +p[1] - 1, +p[2]);
  if(isNaN(d)) return iso;
  return d.toLocaleDateString(undefined,{weekday:"short",month:"long",day:"numeric",year:"numeric"});
}
/* Authors are stored "Last, F.; Last, F." — shorten for the collapsed card. */
function shortAuthors(s){
  if(!s) return "";
  var parts = s.split(";").map(function(x){ return x.trim(); }).filter(Boolean);
  if(parts.length === 0) return s;
  var first = parts[0].split(",")[0].trim();
  if(parts.length === 1) return first;
  if(parts.length === 2) return first + " & " + parts[1].split(",")[0].trim();
  return first + " et al.";
}
function rx(term){
  return new RegExp("(" + term.replace(/[.*+?^${}()|[\]\\]/g,"\\$&") + ")","gi");
}
function hl(text, term){
  var e = esc(text);
  if(!term) return e;
  return e.replace(rx(term), "<mark>$1</mark>");
}

/* ---------- rendering (batched so long lists stay snappy) ---------- */
var visible = [], drawn = 0, term = "", BATCH = 40, lastDay = null, curGroup = null;

function cardHTML(a){
  var meta = [shortAuthors(a.authors), a.year].filter(Boolean).join(" · ");
  return '<div class="head" data-i="' + a._i + '">' +
           (a.topic ? '<span class="chip">' + esc(a.topic) + "</span>" : "") +
           '<p class="t">' + hl(a.title, term) + "</p>" +
           '<div class="m">' + hl(meta, term) +
             (a.journal ? ' · <span class="j">' + hl(a.journal, term) + "</span>" : "") +
             (a.cite ? ", " + esc(a.cite) : "") +
           "</div>" +
           '<div class="more">Details</div>' +
         "</div>" +
         '<div class="body" data-loaded="0"></div>';
}

function bodyHTML(a){
  var out = "";
  if(a.summary)      out += "<h3>Summary</h3><p>"       + hl(a.summary, term)      + "</p>";
  if(a.relevance)    out += "<h3>Relevance</h3><p>"     + hl(a.relevance, term)    + "</p>";
  if(a.contribution) out += "<h3>Contribution</h3><p>"  + hl(a.contribution, term) + "</p>";
  if(a.uses)         out += "<h3>Use cases</h3><p>"     + hl(a.uses, term)         + "</p>";
  if(a.doi){
    var href = /^https?:/i.test(a.doi) ? a.doi : "https://doi.org/" + String(a.doi).replace(/^doi:\s*/i,"");
    out += '<a class="doi" href="' + esc(href) + '" target="_blank" rel="noopener noreferrer">Open article ↗</a>';
  }
  return out || "<p>No further detail recorded.</p>";
}

function drawBatch(){
  var slice = visible.slice(drawn, drawn + BATCH);
  if(!slice.length) return;
  var frag = document.createDocumentFragment();

  slice.forEach(function(a){
    /* curGroup persists across batches: a day's articles can straddle a
       batch boundary, in which case we keep filling the existing section. */
    if(a.date !== lastDay || !curGroup){
      lastDay = a.date;
      curGroup = document.createElement("section");
      curGroup.className = "daygroup";
      var h = '<div class="dayhead"><h2>' + esc(fmtLong(a.date)) + "</h2>" +
              "<span>" + countForDay(a.date) + "</span></div>";
      if(a.cluster) h += '<p class="cluster">' + esc(a.cluster) + "</p>";
      curGroup.innerHTML = h;
      frag.appendChild(curGroup);
    }
    var art = document.createElement("article");
    art.innerHTML = cardHTML(a);
    curGroup.appendChild(art);
  });

  feed.appendChild(frag);
  drawn += slice.length;
}

function countForDay(d){
  var n = visible.filter(function(a){ return a.date === d; }).length;
  return n + (n === 1 ? " entry" : " entries");
}

function render(){
  var t  = qEl.value.trim().toLowerCase();
  var tp = topicEl.value, y = yrEl.value, j = jrEl.value;
  term = t;

  visible = DATA.filter(function(a){
    if(tp && (a.themes || []).indexOf(tp) === -1) return false;
    if(y  && String(a.year) !== y) return false;
    if(j  && a.journal !== j) return false;
    if(t  && a._s.indexOf(t) === -1) return false;
    return true;
  });

  feed.innerHTML = ""; drawn = 0; lastDay = null; curGroup = null;

  var filtered = !!(t || tp || y || j);
  countEl.textContent = filtered
    ? visible.length + " of " + DATA.length + " articles"
    : DATA.length + " articles";
  resetEl.hidden = !filtered;

  if(!visible.length){
    feed.innerHTML = '<p class="empty">Nothing matches that.<br>Try a shorter search term.</p>';
    return;
  }
  drawBatch();
  fill();
}

/* Keep drawing until the sentinel is pushed off-screen. */
function fill(){
  var guard = 0;
  while(drawn < visible.length && guard++ < 30 &&
        $("sentinel").getBoundingClientRect().top < window.innerHeight * 2){
    drawBatch();
  }
}

/* ---------- events ---------- */
feed.addEventListener("click", function(e){
  var head = e.target.closest(".head");
  if(!head) return;
  var art  = head.parentNode;
  var body = head.nextElementSibling;
  if(body.dataset.loaded === "0"){
    body.innerHTML = bodyHTML(DATA[+head.dataset.i]);
    body.dataset.loaded = "1";
  }
  art.classList.toggle("open");
});

var timer;
qEl.addEventListener("input", function(){
  clearTimeout(timer);
  timer = setTimeout(render, 140);
});
topicEl.addEventListener("change", render);
yrEl.addEventListener("change", render);
jrEl.addEventListener("change", render);
resetEl.addEventListener("click", function(){
  qEl.value = ""; topicEl.value = ""; yrEl.value = ""; jrEl.value = "";
  render(); window.scrollTo(0, 0);
});

/* The control bar wraps to a different number of rows depending on screen
   width, so the sticky day headings measure it rather than assuming a height. */
function syncStick(){
  document.documentElement.style.setProperty("--ctrl-h", $("controls").offsetHeight + "px");
}
syncStick();
window.addEventListener("resize", syncStick);
window.addEventListener("orientationchange", syncStick);

if("IntersectionObserver" in window){
  new IntersectionObserver(function(entries){
    if(entries[0].isIntersecting) fill();
  }, {rootMargin:"600px"}).observe($("sentinel"));
}else{
  window.addEventListener("scroll", fill, {passive:true});
}

render();
})();
</script>
</body>
</html>
